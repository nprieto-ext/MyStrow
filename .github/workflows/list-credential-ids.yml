name: List eSigner Credential IDs (throwaway)

# Workflow jetable : liste les credential IDs eSigner du compte SSL.com
# via CodeSignTool (get_credential_ids ne demande que username + password).
# A SUPPRIMER une fois le bon ES_CREDENTIAL_ID identifie.
on:
  workflow_dispatch:

jobs:
  list-credential-ids:
    runs-on: windows-latest
    steps:
      - name: Download & run CodeSignTool get_credential_ids
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile CodeSignTool.zip
          Expand-Archive -Path CodeSignTool.zip -DestinationPath CodeSignTool -Force
          $bat = Get-ChildItem -Path CodeSignTool -Filter CodeSignTool.bat -Recurse | Select-Object -First 1
          Set-Location $bat.DirectoryName
          Write-Host "=== Liste des Credential IDs eSigner ==="
          & cmd.exe /c "CodeSignTool.bat get_credential_ids -username=`"$env:ES_USERNAME`" -password=`"$env:ES_PASSWORD`""
