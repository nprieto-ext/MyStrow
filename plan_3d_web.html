// ⚠ Teintes volontairement SOMBRES et saturées (sauf la cabine, blanche à la
// demande) : l'ambiance de salle monte jusqu'à ×20 et brûle en blanc tout ce
// qui est clair. Ce qui doit se lire de loin ÉMET sa propre lumière : néon
// (sur plaque noire, sinon noyé dans le blanc), tubes LED, pads du contrôleur.

// Néon manuscrit : texte dessiné sur un canvas, halo compris. Deux passes, un
// halo bleu large puis un cœur presque blanc — un tube néon est plus clair au
// centre que sa lueur. La taille s'ajuste pour que le texte tienne en largeur.
function _neonTexture(texte) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 360;
  const ctx = cv.getContext('2d');
  const police = (px) => "italic " + px + "px 'Segoe Script', 'Snell Roundhand', 'Brush Script MT', cursive";
  let px = 150;
  ctx.font = police(px);
  const w = ctx.measureText(texte).width;
  if (w > 940) { px = Math.floor(px * 940 / w); ctx.font = police(px); }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#2aa8ff';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#39b4ff';
  ctx.fillText(texte, 512, 180);
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#d8f1ff';
  ctx.fillText(texte, 512, 180);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function _makeDJMobile() {
  const g = new THREE.Group();
  const mat = (c, r, m, extra = {}) =>
    new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, ...extra });
  const box = (w, h, d, mt, x, y, z) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mt);
    o.position.set(x, y, z); g.add(o); return o;
  };

  // Gabarit. ⚠ Repris par `_SCENE_PRESETS['dj_mobile']` (rig_height 2,05 =
  // plateau des totems) et par sa vignette : retoucher ensemble.
  const CZ = 3.2, CW = 1.9, CH = 1.1, CD = 0.7;    // cabine : centre, largeur, hauteur, profondeur
  const TX = 1.55, TZ = 3.35, TH = 2.0;            // totems
  const PX = 2.75;                                 // colonnes PA
  const FY = 0.08;                                 // épaisseur du tapis sous la cabine

  const lycra     = mat(0xeeeeec, 0.9,  0.0);   // chaussettes des totems
  const laque     = mat(0xf0f0ee, 0.6,  0.0);   // cabine blanche
  const laqueJoint = mat(0x3a3a3e, 0.8, 0.0);   // rainures : gardent le relief des planches

  // ── Tapis bleu sous la cabine ──
  box(3.6, FY, 1.7, mat(0x0b1430, 0.55, 0.2), 0, FY / 2, CZ + 0.05);
  box(3.7, 0.05, 0.08, noir, 0, 0.025, CZ + 0.05 - 0.89);

  // ── Cabine blanche en planches ──
  box(CW, CH, CD, laque, 0, FY + CH / 2, CZ);
  box(CW + 0.1, 0.07, CD + 0.1, laque, 0, FY + CH + 0.035, CZ);      // plateau débordant
  const zf = CZ - CD / 2 - 0.004;
  for (let x = -CW / 2 + 0.13; x < CW / 2 - 0.05; x += 0.13)            // rainures des planches
    box(0.012, CH - 0.02, 0.01, laqueJoint, x, FY + CH / 2, zf);
  box(CW, 0.1, 0.02, laque, 0, FY + CH - 0.08, zf - 0.006);             // ceinture haute
  box(CW, 0.01, 0.022, laqueJoint, 0, FY + CH - 0.135, zf - 0.006);     // son joint bas
  const neon = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 0.47),
    new THREE.MeshBasicMaterial({ map:_neonTexture('MyStrow'), transparent:true, depthWrite:false }));
  // Plaque sombre derrière le néon : posé à même le bois, que l'ambiance de
  // salle éclaircit, le néon n'avait plus aucun contraste et disparaissait.
  // Néon et plaque ne s'affichent que retour vidéo COUPÉ : sinon l'écran de la
  // cabine (preset `screen`, `siVideo`) prend leur place.

    .userData.siPasVideo = true;

  // ── Dessus de la cabine : contrôleur DJ + portable sur support ──

  const TY = FY + CH + 0.07;

  };
  const lueur = (c) => new THREE.MeshBasicMaterial({ color:c });

  // Contrôleur : deux jogs, pads 2 × 4 par deck, mixeur 2 voies, crossfader

  sous(ctl, new THREE.BoxGeometry(0.19, 0.004, 0.33), mat0, 0, 0.047, 0);        // plaque du mixeur
  const padGeo = new THREE.BoxGeometry(0.032, 0.006, 0.032);

  for (const s of [-1, 1]) {

    sous(ctl, new THREE.CylinderGeometry(0.082, 0.082, 0.016, 40), mat0, jx, 0.054, -0.03);  // plateau
    sous(ctl, new THREE.CylinderGeometry(0.026, 0.026, 0.018, 24), lueur(0x3aa0ff), jx, 0.056, -0.03);
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++)

    sous(ctl, new THREE.CylinderGeometry(0.012, 0.012, 0.008, 16), lueur(0x33dd77), jx - s * 0.13, 0.049, 0.15); // play
    sous(ctl, new THREE.CylinderGeometry(0.012, 0.012, 0.008, 16), lueur(0xffaa22), jx - s * 0.13, 0.049, 0.115); // cue
  }
  const potGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.014, 12);
  for (const dx of [-0.04, 0.04]) {
    for (const z of [-0.13, -0.095, -0.06]) sous(ctl, potGeo, metal, dx, 0.055, z);         // potards
    sous(ctl, new THREE.BoxGeometry(0.005, 0.002, 0.09), lueur(0x000000), dx, 0.0495, 0.04); // fente du fader
    sous(ctl, new THREE.BoxGeometry(0.022, 0.014, 0.012), metal, dx, 0.056, 0.03);           // bouton du fader
    for (let i = 0; i < 5; i++)                                                              // VU-mètre
      sous(ctl, new THREE.BoxGeometry(0.008, 0.003, 0.008), lueur(i < 3 ? 0x33dd77 : i < 4 ? 0xffcc22 : 0xff3344),

  sous(ctl, new THREE.BoxGeometry(0.08, 0.002, 0.005), lueur(0x000000), 0, 0.0495, 0.15);     // fente du crossfader
  sous(ctl, new THREE.BoxGeometry(0.012, 0.014, 0.022), metal, 0, 0.056, 0.15);               // crossfader

  // Portable sur son support, pivoté vers le DJ
  const pcGrp = new THREE.Group();
  pcGrp.position.set(-0.62, TY, CZ + 0.02);
  pcGrp.rotation.y = 0.35;                         // tourné vers le centre, où se tient le DJ
  g.add(pcGrp);
  const HS = 0.16, INCL = 0.25;                    // hauteur du support, inclinaison du plateau
  for (const dx of [-0.13, 0.13]) sous(pcGrp, new THREE.BoxGeometry(0.015, HS, 0.22), noir, dx, HS / 2, 0);
  const plat = sous(pcGrp, new THREE.BoxGeometry(0.3, 0.012, 0.27), noir, 0, HS + 0.006, 0);
  plat.rotation.x = INCL;                          // bord côté public plus haut : clavier vers le DJ
  const lap = new THREE.Group();
  lap.position.set(0, HS + 0.013, 0);
  lap.rotation.x = INCL;
  pcGrp.add(lap);
  const alu = mat(0x9ea3aa, 0.35, 0.8);
  sous(lap, new THREE.BoxGeometry(0.34, 0.018, 0.24), alu, 0, 0.009, 0);                     // base
  sous(lap, new THREE.BoxGeometry(0.29, 0.002, 0.1), mat(0x1a1b1f, 0.8, 0.1), 0, 0.019, -0.01); // clavier
  const charn = new THREE.Group();                 // charnière côté public, écran penché en arrière
  charn.position.set(0, 0.018, -0.12);
  charn.rotation.x = -0.4;
  lap.add(charn);
  sous(charn, new THREE.BoxGeometry(0.34, 0.23, 0.01), alu, 0, 0.115, 0);                    // capot
  sous(charn, new THREE.BoxGeometry(0.31, 0.19, 0.002), lueur(0x2b4f86), 0, 0.12, 0.006);    // écran allumé, côté DJ

  // ── Grands totems lycra blancs, tube LED côté cabine ──
  const tube = new THREE.MeshBasicMaterial({ color:0xfff6e8 });
  for (const s of [-1, 1]) {
    const x = s * TX;
    box(0.5, 0.03, 0.46, noir, x, 0.015, TZ);                        // embase
    box(0.46, TH, 0.42, lycra, x, TH / 2, TZ);
    box(0.5, 0.04, 0.46, mat(0x111114, 0.5, 0.6), x, TH + 0.02, TZ);   // plateau pour la lyre
    box(0.06, 1.45, 0.06, tube, x - s * 0.21, 1.15, TZ - 0.24);
  }

  // ── Petits totems lycra blancs, à l'extérieur des colonnes PA ──
  // 1,2 m : une lyre ou un PAR s'y pose (hauteur à régler dans le tableau 3D,
  // l'accroche par défaut de la scène est celle des grands totems).
  for (const s of [-1, 1]) {

    box(0.42, 0.03, 0.42, noir, x, 0.015, z);            // embase
    box(0.36, h - 0.06, 0.36, lycra, x, h / 2, z);       // chaussette lycra
    box(0.42, 0.03, 0.42, noir, x, h - 0.015, z);        // plateau

  // ── Colonnes PA sur leur sub ──
  for (const s of [-1, 1]) {
    const x = s * PX, z = 3.1;
    box(0.5, 0.66, 0.62, noir, x, 0.33, z);
    box(0.44, 0.5, 0.01, grille, x, 0.36, z - 0.315);
    box(0.13, 1.85, 0.13, noir, x, 0.66 + 0.925, z);
    box(0.1, 1.75, 0.01, grille, x, 0.66 + 0.925, z - 0.07);
  }
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Conférence — amphithéâtre circulaire en gradins, grand écran au mur du fond
// ─────────────────────────────────────────────────────────────────────────────
// D'après une image fournie par l'utilisateur. Sans arbres (la verdure a été
// retirée des décors à sa demande) ni faux spots sur les rails : ce sont les
// projecteurs du patch qui s'y accrochent.

// Bloc courbe plein : secteur d'anneau de r0 à r1, entre les angles a0 < a1, de
// y = 0 à h. Angle compté depuis l'AVANT de la salle (−Z, côté public), positif
// vers +X ; ±π = le fond, côté écran. Dessus et côtés ont chacun leur matériau
// (bois sur béton pour un gradin). Faces doubles : pas d'enroulement à soigner.
function _blocArc(r0, r1, a0, a1, h, matDessus, matCote, n = 24) {
  const P = (r, a, y) => [r * Math.sin(a), y, -r * Math.cos(a)];
  const quad = (arr, A, B, C, D) => arr.push(...A, ...B, ...C, ...A, ...C, ...D);
  const dessus = [], cotes = [];
  for (let i = 0; i < n; i++) {
    const t0 = a0 + (a1 - a0) * i / n, t1 = a0 + (a1 - a0) * (i + 1) / n;
    quad(dessus, P(r0, t0, h), P(r1, t0, h), P(r1, t1, h), P(r0, t1, h));
    quad(cotes,  P(r0, t0, 0), P(r0, t0, h), P(r0, t1, h), P(r0, t1, 0));   // face intérieure
    quad(cotes,  P(r1, t0, 0), P(r1, t0, h), P(r1, t1, h), P(r1, t1, 0));   // face extérieure
  }
  for (const a of [a0, a1]) quad(cotes, P(r0, a, 0), P(r1, a, 0), P(r1, a, h), P(r0, a, h));
  const g = new THREE.Group();
  for (const [pts, mt] of [[dessus, matDessus], [cotes, matCote]]) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, mt));
  }
  return g;
}

function _makeConference() {
  const g = new THREE.Group();
  const mat = (c, r, m, extra = {}) =>
    new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, ...extra });
  const box = (w, h, d, mt, x, y, z) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mt);
    o.position.set(x, y, z); g.add(o); return o;
  };
  const DS = { side:THREE.DoubleSide };
  // Teintes sombres : l'ambiance de salle (jusqu'à ×20) éclaircit tout.
  const bois   = mat(0x3e2814, 0.8,  0.0, DS);
  const beton  = mat(0x2a2a28, 0.95, 0.0, DS);
  const pierre = mat(0x3a3a37, 0.9,  0.0, DS);

  // Gabarit. ⚠ Repris par `_SCENE_PRESETS['conference']` (rig_height 4,9), par
  // sa vignette et par l'écran du preset : retoucher ensemble.
  const R0 = 4.2, PAS = 0.8, HT = 0.45;   // gradins : rayon intérieur, profondeur et hauteur d'un rang
  const OUV = 12  * Math.PI / 180;        // demi-allée à l'avant
  const FIN = 145 * Math.PI / 180;        // fin des gradins côté écran
  const ESC = 8   * Math.PI / 180;        // largeur des escaliers
  const RP  = R0 + 3 * PAS;               // 6,6 m : pied du parapet
  const ZB = 6.8, LX = 7.6, HP = 6.0;     // salle : mur du fond, baies vitrées, hauteur
  const HC = 5.3;                         // sous-face de l'anneau du plafond

  // ── Gradins, escaliers, parapet (deux ailes symétriques) ──
  for (const s of [-1, 1]) {
    const [a0, a1] = s > 0 ? [OUV, FIN] : [-FIN, -OUV];
    for (let k = 0; k < 3; k++)
      g.add(_blocArc(R0 + k * PAS, R0 + (k + 1) * PAS, a0, a1, HT * (k + 1), bois, beton));
    // Escalier au bout côté écran : 6 marches qui montent vers l'extérieur
    const [e0, e1] = s > 0 ? [FIN, FIN + ESC] : [-FIN - ESC, -FIN];
    for (let j = 0; j < 6; j++)
      g.add(_blocArc(R0 + j * PAS / 2, R0 + (j + 1) * PAS / 2, e0, e1, HT / 2 * (j + 1), pierre, pierre, 4));
    const [p0, p1] = s > 0 ? [OUV, FIN + ESC] : [-FIN - ESC, -OUV];
    g.add(_blocArc(RP, RP + 0.35, p0, p1, 1.5, bois, beton));
  }
  box(2.6, 0.8, 0.5, beton, 0, 0.4, -7.3);           // muret à l'entrée de l'allée

  // ── Poufs au centre ──
  const poufGeo = new THREE.SphereGeometry(0.5, 20, 14), pouf = mat(0x2a2636, 0.95, 0.0);
  for (const [x, z] of [[-1.9, -2.6], [-2.8, -1.4], [-2.1, -0.1], [1.9, -2.6], [2.8, -1.4], [2.1, -0.1]]) {
    const m = new THREE.Mesh(poufGeo, pouf);
    m.scale.set(0.9, 0.5, 0.8);
    m.position.set(x, 0.24, z);
    g.add(m);
  }

  // ── Mur du fond (l'écran est une dalle vidéo du preset) et piliers ──
  const fond = new THREE.Mesh(new THREE.PlaneGeometry(2 * LX, HP), mat(0x1e150d, 0.95, 0.0));
  fond.position.set(0, HP / 2, ZB);
  fond.rotation.y = Math.PI;                        // face au public
  g.add(fond);
  const pilierGeo = new THREE.CylinderGeometry(0.35, 0.35, HP, 20), pilier = mat(0x2e2e2c, 0.9, 0.0);
  for (const s of [-1, 1]) {
    const c = new THREE.Mesh(pilierGeo, pilier);
    c.position.set(s * 5.6, HP / 2, 6.2);
    g.add(c);
  }

  // ── Baies vitrées : faces simples vers l'INTÉRIEUR (invisibles de dehors) ──
  const vitre = new THREE.MeshBasicMaterial({ color:0x8e9aa4 });
  const montant = new THREE.MeshBasicMaterial({ color:0x111214 });
  const ZA = -8.0, LB = ZB - ZA, ZC = (ZB + ZA) / 2;
  for (const s of [-1, 1]) {
    const plaque = (w, h, y, z, mt, dx) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mt);
      m.position.set(s * (LX - dx), y, z);
      m.rotation.y = -s * Math.PI / 2;
      g.add(m);
    };
    plaque(LB, HP, HP / 2, ZC, vitre, 0);
    for (let z = ZA; z <= ZB + 0.01; z += 2.4) plaque(0.12, HP, HP / 2, z, montant, 0.02);
    plaque(LB, 0.12, 0.6, ZC, montant, 0.02);
    plaque(LB, 0.12, HP - 0.3, ZC, montant, 0.02);
  }

  // ── Rails de plafond : c'est là que s'accroche le rig (rig_height 4,9) ──
  const rail = mat(0x0c0c0e, 0.5, 0.4);
  for (const x of [-5.4, -2.0, 2.0, 5.4]) box(0.08, 0.08, 11.5, rail, x, 5.0, 0.3);

  // ── Anneau de plafond et puits de lumière ──
  // Ils s'effacent quand la caméra passe au-dessus : sinon la vue DESSUS ne
  // montrerait qu'un disque blanc posé sur toute la salle.
  const plafond = mat(0x2e2e2c, 0.95, 0.0, { side:THREE.DoubleSide, transparent:true });
  const anneau = _blocArc(4.6, 6.4, -Math.PI, Math.PI, 0.6, plafond, plafond, 64);
  anneau.position.y = HC;
  g.add(anneau);
  const ciel = new THREE.Mesh(new THREE.CircleGeometry(4.6, 64),
    new THREE.MeshBasicMaterial({ color:0xf4f1ea, transparent:true }));
  ciel.rotation.x = Math.PI / 2;                    // face vers le bas : invisible d'en haut
  ciel.position.y = HC + 0.55;
  g.add(ciel);
  // Fondu court (1 m) : sur 3 m, la vue ISO (caméra vers 7 m) tombait en plein
  // milieu et montrait un anneau fantôme à moitié transparent.
  const fondu = (_r, _s, cam) => {
    const k = THREE.MathUtils.clamp((cam.position.y - (HC + 0.6)) / 1.0, 0, 1);
    plafond.opacity = 1 - k;
    plafond.depthWrite = k < 0.05;
    ciel.material.opacity = 1 - k;
  };
  anneau.children.forEach(m => { m.onBeforeRender = fondu; });
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Sapin de Noël — grand sapin stylisé vert foncé
// ─────────────────────────────────────────────────────────────────────────────
// D'après `sapin de noel.png` fourni par l'utilisateur : branches en lames
// plates rayonnant du tronc par étages. Sans boules ni cadeaux (retirés à la
// demande). Aucune structure : le rig est celui du patch.
function _makeSapinNoel() {
  const g = new THREE.Group();
  const mat = (c, r, m, extra = {}) =>
    new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, ...extra });
  // Tirage pseudo-aléatoire À GRAINE FIXE : le sapin est le même à chaque
  // chargement, et les miniatures rendues restent fidèles à la scène.
  let graine = 0x5a91;
  const rnd = () => {
    graine = (graine + 0x6D2B79F5) | 0;
    let t = Math.imul(graine ^ (graine >>> 15), 1 | graine);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const obj = new THREE.Object3D();

  // Gabarit. ⚠ Repris par `_SCENE_PRESETS['sapin_noel']` et par sa vignette :
  // retoucher ensemble.
  const SZ = 0.8;                        // centre du sapin (un peu en fond de plateau)
  const H = 6.6, Y0 = 0.55, R = 2.7;     // pointe, première couronne de branches, rayon au pied
  const rayon = (y) => 0.08 + R * Math.pow(Math.max(0, 1 - (y - Y0) / (H - Y0)), 0.95);

  // ── Tronc ──
  const tronc = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.2, H - 0.2, 10), mat(0x120a05, 0.9, 0.0));
  tronc.position.set(0, (H - 0.2) / 2, SZ);
  g.add(tronc);

  // ── Branches : lames plates par étages, légèrement tombantes ──
  // Une seule InstancedMesh (~1 000 lames, 1 draw call). Teintes SOMBRES : l'ambiance
  // de salle (jusqu'à ×20) les éclaircit.
  const lameGeo = new THREE.BoxGeometry(1, 0.02, 0.15);
  lameGeo.translate(0.5, 0, 0);                    // part du tronc, s'étend vers +X
  const lames = [];
  for (let y = Y0; y < H - 0.15; y += 0.11) {
    const r = rayon(y);
    const n = Math.max(5, Math.round(7 + 20 * r / R));
    const a0 = rnd() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      lames.push({
        y: y + (rnd() - 0.5) * 0.06,
        a: a0 + (i + (rnd() - 0.5) * 0.6) * Math.PI * 2 / n,
        l: r * (0.85 + rnd() * 0.3),
        p: -0.12 - rnd() * 0.22,                   // tombant (rad)
      });
    }
  }
  const branches = new THREE.InstancedMesh(lameGeo, mat(0xffffff, 0.8, 0.0), lames.length);
  const vert = new THREE.Color();
  lames.forEach((b, i) => {
    obj.position.set(0, b.y, SZ);
    obj.rotation.set(0, b.a, b.p, 'YZX');         // tombant d'abord, puis orienté autour du tronc
    obj.scale.set(b.l, 1, 1);
    obj.updateMatrix();
    branches.setMatrixAt(i, obj.matrix);
    branches.setColorAt(i, vert.setHSL(0.33 + rnd() * 0.02, 0.85, 0.003 + rnd() * 0.0025));
  });
  branches.frustumCulled = false;                  // sphère englobante = celle d'une seule lame
  g.add(branches);

  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Import de scène GLTF/GLB depuis Python (base64)
// ─────────────────────────────────────────────────────────────────────────────
const _gltfLoader    = new GLTFLoader();
const _importedGrp   = new THREE.Group();
scene.add(_importedGrp);

window.loadGLTF = function(b64, isGLB) {
  // Décode base64 → ArrayBuffer
  const bin    = atob(b64);
  const bytes  = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buffer = bytes.buffer;

  _gltfLoader.parse(buffer, '', (gltf) => {
    _importedGrp.clear();
    // Normalise la scène importée, puis la POSE SUR LE SOL (y=0) en la centrant
    // seulement en X/Z. Centrer aussi en Y enterrait le modèle : le plancher du
    // plan traversait le décor à mi-hauteur.
    const box    = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = maxDim > 0.01 ? 12.0 / maxDim : 1.0;
    gltf.scene.scale.setScalar(scale);
    gltf.scene.position.set(-center.x * scale,
                            -box.min.y * scale,
                            -center.z * scale);
    _importedGrp.add(gltf.scene);
  }, (err) => console.error('GLTF import error:', err));
};

window.clearImportedScene = function() { _importedGrp.clear(); };

// ── Décor livré avec une scène par défaut ────────────────────────────────────
// Groupe SÉPARÉ de `_importedGrp` à dessein : le décor importé à la main par
// l'utilisateur et celui qui accompagne un preset sont deux choses distinctes.
// Partager le groupe ferait disparaître l'import personnel dès qu'on change de
// scène — et le ferait réapparaître par-dessus le décor du preset à l'inverse.
const _sceneGrp = new THREE.Group();
scene.add(_sceneGrp);

// `yawDeg` : demi-tour (ou quart de tour) autour de Y pour remettre le décor
// dans le repère du plan — fond de scène vers les Z POSITIFS, public vers les
// Z négatifs. Les modèles ne sont pas tous bâtis dans ce sens ; l'angle est
// déclaré par décor dans `_SCENE_PRESETS` (clé `yaw`), jamais en dur ici.
// `spanM` : largeur en mètres à laquelle ramener le décor. C'est le plan de feu
// 2D qui fait foi — un projecteur ne peut y être posé qu'entre 5 % et 95 % du
// cadre, soit ±8,1 m une fois converti : un décor ramené à 18 m avait donc sa
// structure 90 cm trop large de chaque côté, et aligner une rangée de projos sur
// le grill devenait impossible sans les sortir du rectangle de scène. On réduit
// le décor jusqu'au 2D plutôt que d'élargir le 2D : aucune position de show
// existant n'est déplacée.
window.loadSceneGLB = function(b64, yawDeg, spanM) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  _gltfLoader.parse(bytes.buffer, '', (gltf) => {
    _sceneGrp.clear();
    // Même normalisation que l'import manuel : mise à l'échelle sur la plus
    // grande dimension, centrage en X/Z, et POSE SUR LE SOL (y = 0).
    // La rotation est portée par un groupe PARENT et non par `gltf.scene` :
    // la boîte englobante doit être mesurée sur le modèle non tourné, sinon
    // l'échelle et le centrage changeraient avec l'angle.
    const box    = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = maxDim > 0.01 ? (spanM || 18.0) / maxDim : 1.0;
    gltf.scene.scale.setScalar(scale);
    gltf.scene.position.set(-center.x * scale,
                            -box.min.y * scale,
                            -center.z * scale);
    const pivot = new THREE.Group();
    pivot.rotation.y = (yawDeg || 0) * Math.PI / 180;
    pivot.add(gltf.scene);
    _sceneGrp.add(pivot);

  }, (err) => console.error('Scene GLB error:', err));
};

window.clearSceneGLB = function() { _sceneGrp.clear(); };

// Sol / grille / cyclorama : ajoutés directement à la scène (pas dans _propsGrp),
// donc les presets ne peuvent pas les enlever. Nécessaire quand le décor vient
// d'un modèle importé qui apporte son propre sol.
window.setStageFloor = function(visible) {
  floorReflector.visible = visible;
  floorTint.visible      = visible;
  gridHelper.visible = visible;
  cycMesh.visible    = visible;
};

// Le cyclorama est un plan VERTICAL planté à z = +5,6 : un décor plus profond
// que ça passe derrière et se fait trancher net — la structure apparaît coupée
// par un « écran noir » en plein milieu. On peut donc l'éteindre seul, sans
// perdre le sol ni la grille. À appeler APRÈS `setStageFloor`, qui le rallume.
window.setCyclorama = function(visible) { cycMesh.visible = visible; };

window.setBloom = function(strength) {
  if (window.bloomPass) window.bloomPass.strength = strength;
  _flags.bloom = strength > 0;
};

window.setScenePreset = function(name) {
  // Un preset inconnu ici est presque toujours un preset déclaré côté Python
  // (`_SCENE_PRESETS`) et oublié dans la liste ci-dessus. L'ancien `return`
  // sortait AVANT le nettoyage : le décor précédent — trusses, totems,
  // silhouettes — restait affiché par-dessus le nouveau, et le seul symptôme
  // était « ça n'efface pas les autres quand on clique dessus ». On nettoie
  // donc quoi qu'il arrive, et on se rabat sur une scène nue : un décor GLB
  // n'a de toute façon ni truss ni accessoire à dessiner.
  const preset = SCENE_PRESETS[name] || { trusses: [], screen: null, buildProps() {} };
  if (!SCENE_PRESETS[name]) {
    console.warn(`[decor] preset « ${name} » absent de SCENE_PRESETS (html) — `
                 + `scène nue. À déclarer si ce décor doit dessiner des trusses.`);
  }
  _propsGrp.clear();
  buildTrusses(preset.trusses);
  preset.buildProps();
  // L'écran suit le décor : chaque scène sait où le sien tombe (fond de scène
  // pour un concert, derrière la régie pour un club). Un preset qui n'en
  // déclare pas — « Aucun décor » — n'en a tout simplement pas.
  window.setVideoScreen(preset.screen || null);
  window.currentTrusses = JSON.parse(JSON.stringify(preset.trusses));
  // Chaque scène a son cadrage : on réapplique la vue en cours avec celui-ci,
  // sinon passer au DJ mobile laissait la caméra à 25 m d'une cabine de 2 m.
  _camCadrage = preset.cam || {};
  window.setCam(_camActuelle);
};

// ── Activer preset live par défaut ──
window.setScenePreset('festival_plein_air');   // = _SCENE_PAR_DEFAUT (Python)

// QWebChannel — communication JS → Python

if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    window._bridge = channel.objects.bridge;
  });
}
