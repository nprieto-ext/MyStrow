<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';

document.getElementById('loading').remove();

// ── Sélection projector (raycasting + QWebChannel) ───────────────────────────
let _selectedProjo = -1;
const _raycaster   = new THREE.Raycaster();
const _mouse2D     = new THREE.Vector2();
let   _ptrDownPos  = null;   // pour distinguer clic vs drag

// ─────────────────────────────────────────────────────────────────────────────
// Renderer
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping       = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.renderer = renderer;

// ─────────────────────────────────────────────────────────────────────────────
// Scene + Camera
// ─────────────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
const fog = new THREE.FogExp2(0x05050f, 0.022);
scene.fog = fog;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const camera = new THREE.PerspectiveCamera(52, W()/H(), 0.2, 300);
camera.position.set(14, 11, 20);
camera.lookAt(0, 3, 0);

// ─────────────────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping  = false;
controls.minDistance    = 3;
controls.maxDistance    = 70;
controls.maxPolarAngle  = Math.PI * 0.89;
controls.update();


renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(14, 11, 20);
  controls.target.set(0, 3, 0);
  controls.update();
});

// ─────────────────────────────────────────────────────────────────────────────
// Post-processing — Bloom
// ─────────────────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
window.bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  0.65,  // strength — bloom activé par défaut pour l'ambiance
  0.42,  // radius
  0.08   // threshold — très bas pour capter même les lumières faibles
);
composer.addPass(window.bloomPass);
composer.addPass(new OutputPass());

// ─────────────────────────────────────────────────────────────────────────────
// Lumières de scène
// ─────────────────────────────────────────────────────────────────────────────
window.ambLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(window.ambLight);

const hemi = new THREE.HemisphereLight(0x8090c0, 0x000000, 0.18);
scene.add(hemi);

// Lumière de remplissage douce (toujours présente — visibilité de scène)
const _fillLight = new THREE.DirectionalLight(0xb0c0e0, 0.35);
_fillLight.position.set(0, 10, 4);
scene.add(_fillLight);

// ─────────────────────────────────────────────────────────────────────────────
// Géométrie de scène
// ─────────────────────────────────────────────────────────────────────────────

// Sol — parquet sombre
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 10),
  new THREE.MeshStandardMaterial({ color:0x0c0907, roughness:0.92, metalness:0.05 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = false;
scene.add(floorMesh);

// Grille de scène
const gridHelper = new THREE.GridHelper(18, 18, 0x0e0a06, 0x0b0806);
gridHelper.position.y = 0.005;
scene.add(gridHelper);

// Cyclorama (fond de scène)
const cycMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 11),
  new THREE.MeshStandardMaterial({ color:0x060412, roughness:1.0, side:THREE.FrontSide })
);
cycMesh.position.set(0, 5.5, -5.6);
scene.add(cycMesh);


// ─────────────────────────────────────────────────────────────────────────────
// Truss
// ─────────────────────────────────────────────────────────────────────────────
const _trussGrp = new THREE.Group();
scene.add(_trussGrp);

const _barMat = new THREE.MeshStandardMaterial({ color:0x8898b8, roughness:0.30, metalness:0.88 });
const _diagMat = new THREE.MeshStandardMaterial({ color:0x607090, roughness:0.45, metalness:0.75 });
const _legMat2 = new THREE.MeshStandardMaterial({ color:0x708298, roughness:0.38, metalness:0.82 });

function buildTrusses(defs) {
  _trussGrp.clear();
  for (const td of defs) {
    if (!td.enabled) continue;
    const hy = td.height ?? 7.0, tz = td.z ?? 0;
    const xl = td.x_l ?? -9, xr = td.x_r ?? 9, len = xr - xl;

    // Barre principale
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.26, 0.34), _barMat);
    bar.position.set((xl+xr)/2, hy, tz);
    _trussGrp.add(bar);

    // Rails supérieur/inférieur (cordons lumineux)
    for (const [dy, col] of [[0.14, 0xc0cce8], [-0.14, 0x708098]]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len, 0.04, 0.04),
        new THREE.MeshStandardMaterial({ color:col, roughness:0.35, metalness:0.85 })
      );
      rail.position.set((xl+xr)/2, hy+dy, tz);
      _trussGrp.add(rail);
    }

    // Entretoisement en croix (simplifié)
    const steps = Math.round(len);
    const dAngle = Math.atan2(0.28, len / Math.max(steps, 1));
    for (let i = 0; i < steps; i++) {
      const x0 = xl + i * (len/steps), x1 = xl + (i+1) * (len/steps);
      const diagLen = Math.sqrt((x1-x0)**2 + 0.28**2);
      for (const sign of [1, -1]) {
        const d = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.03, 0.03), _diagMat);
        d.position.set((x0+x1)/2, hy + sign*0.07, tz);
        d.rotation.z = sign * dAngle;
        _trussGrp.add(d);
      }
    }

    // Pieds de support
    for (const lx of [xl, xr]) {
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, hy, 0.10), _legMat2);
      foot.position.set(lx, hy/2, tz);
      _trussGrp.add(foot);
      // Semelle au sol
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.30),
        new THREE.MeshStandardMaterial({ color:0x404860, roughness:0.5, metalness:0.6 }));
      base.position.set(lx, 0.02, tz);
      _trussGrp.add(base);
    }
  }
}

buildTrusses([
  { label:'Truss avant',   enabled:true, height:7.0, z:-3.8, x_l:-9, x_r:9 },
  { label:'Truss arrière', enabled:true, height:7.0, z:4.0,  x_l:-9, x_r:9 },
]);

// ─────────────────────────────────────────────────────────────────────────────
// Shaders — faisceau conique volumétrique
// ─────────────────────────────────────────────────────────────────────────────
const BEAM_VERT = `
  varying float vT;
  void main() {
    vT = uv.y;   // 0 = base (sol), 1 = tip (fixture)
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const BEAM_FRAG = `
  uniform vec3  uColor;
  uniform float uAlpha;
  varying float vT;
  void main() {
    // Dégradé quadratique : plus lumineux près de la source (tip)
    float fade = vT * vT * (3.0 - 2.0*vT);  // smoothstep
    gl_FragColor = vec4(uColor, uAlpha * fade);
  }
`;

function makeBeamMat(alpha) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(1,1,1) },
      uAlpha: { value: alpha },
    },
    vertexShader:   BEAM_VERT,
    fragmentShader: BEAM_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
    side:           THREE.DoubleSide,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Shader — tache au sol
// ─────────────────────────────────────────────────────────────────────────────
const POOL_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const POOL_FRAG = `
  uniform vec3      uColor;
  uniform float     uAlpha;
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;
  uniform float     uGoboRot;
  varying vec2      vUv;
  void main() {
    float d = length(vUv - vec2(0.5));
    if (d > 0.5) discard;
    float soft  = 1.0 - smoothstep(0.12, 0.50, d);
    float hot   = 1.0 - smoothstep(0.0,  0.14, d);
    float alpha = uAlpha * (soft + hot * 0.8);
    // Masque gobo avec rotation
    float c = cos(uGoboRot), s = sin(uGoboRot);
    vec2 uv0 = vUv - 0.5;
    vec2 uvR = vec2(c*uv0.x - s*uv0.y, s*uv0.x + c*uv0.y) + 0.5;
    float goboMask = mix(1.0, texture2D(uGoboTex, clamp(uvR, 0.001, 0.999)).r, uGoboBlend);
    gl_FragColor = vec4(uColor + hot*0.25, clamp(alpha * goboMask, 0.0, 1.0));
  }
`;

function makePoolMat() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:     { value: new THREE.Color(1,1,1) },
      uAlpha:     { value: 0.5 },
      uGoboTex:   { value: _goboTextures[0] },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
    },
    vertexShader:   POOL_VERT,
    fragmentShader: POOL_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Textures gobo (8 slots, dessinées en canvas)
// ─────────────────────────────────────────────────────────────────────────────
function _createGoboTexture(slot) {
  const size = 256, cx = 128, cy = 128, r = 124;
  const cv  = document.createElement('canvas');
  cv.width  = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#fff';
  switch(slot) {
    case 0: // Open — disque plein
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      break;
    case 1: // Anneau
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.52, 0, Math.PI*2); ctx.fill();
      break;
    case 2: // Étoile 4 branches
      ctx.save(); ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 - Math.PI/4;
        const rad = (i%2===0) ? r : r*0.32;
        i===0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
              : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
      break;
    case 3: // 3 cercles
      { const dr=r*0.28, of=r*0.52;
        for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/2;
          ctx.beginPath();ctx.arc(cx+Math.cos(a)*of,cy+Math.sin(a)*of,dr,0,Math.PI*2);ctx.fill();}}
      break;
    case 4: // 3 palmes (hélice)
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<3;i++){ctx.save();ctx.rotate((i/3)*Math.PI*2);
        ctx.beginPath();ctx.ellipse(0,-r*0.45,r*0.28,r*0.40,0,0,Math.PI*2);
        ctx.fill();ctx.restore();}
      ctx.restore();
      break;
    case 5: // Breakup (découpes angulaires)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      [0.05,0.22,0.40,0.58,0.75,0.90].forEach(s=>{
        ctx.beginPath();ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,s*Math.PI*2,(s+0.06)*Math.PI*2);
        ctx.closePath();ctx.fill();});
      break;
    case 6: // 6 secteurs rayonnants
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<6;i++){ctx.save();ctx.rotate((i/6)*Math.PI*2);
        ctx.fillRect(-r*0.075,-r,r*0.15,r);ctx.restore();}
      ctx.restore();
      break;
    case 7: // Bull's-eye (anneau + point central)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.68,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.30,0,Math.PI*2); ctx.fill();
      break;
  }
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return new THREE.CanvasTexture(cv);
}
const _goboTextures = Array.from({length:8}, (_,i) => _createGoboTexture(i));

// ─────────────────────────────────────────────────────────────────────────────
// Géométries template (unit — scalées à la volée)
// ─────────────────────────────────────────────────────────────────────────────
const GEO_UNIT_CONE_24 = new THREE.CylinderGeometry(0, 1, 1, 24, 1, true);
const GEO_UNIT_CONE_16 = new THREE.CylinderGeometry(0, 1, 1, 16, 1, true);
const GEO_UNIT_CONE_10 = new THREE.CylinderGeometry(0, 1, 1, 10, 1, true);
const GEO_UNIT_CIRCLE  = new THREE.CircleGeometry(1, 36);
const GEO_BODY_PAR     = new THREE.CylinderGeometry(0.16, 0.20, 0.44, 16);
const GEO_BODY_MH      = new THREE.CylinderGeometry(0.14, 0.17, 0.38, 16);
const GEO_LENS_PAR     = new THREE.CircleGeometry(0.13, 20);
const GEO_LENS_MH      = new THREE.CircleGeometry(0.10, 20);
const GEO_BAR_MH       = new THREE.BoxGeometry(0.80, 0.10, 0.14);  // mounting bar lyre

const MAT_BODY = new THREE.MeshStandardMaterial({ color:0x3a3a5a, roughness:0.28, metalness:0.72 });

// ─────────────────────────────────────────────────────────────────────────────
// Pool de fixtures
// ─────────────────────────────────────────────────────────────────────────────
const _fixtureGrp = new THREE.Group();
const _beamGrp    = new THREE.Group();
const _poolGrp    = new THREE.Group();
const _lightGrp   = new THREE.Group();
scene.add(_fixtureGrp, _beamGrp, _poolGrp, _lightGrp);

// Couleurs groupe (même mapping que QPainter)
const GROUP_COLOR = {
  face:'#ff8844', contre:'#4488ff', douche1:'#44cc88',
  douche2:'#ffcc44', douche3:'#ff4488', lat:'#aa55ff',
  lyre:'#ee44bb', barre:'#44aaff',
};

let _objs = [];   // un objet par projecteur
window.beamScale = 1.7;

function _getObj(i) {
  if (i < _objs.length) return _objs[i];

  // Outer haze cone
  const cHaze = new THREE.Mesh(GEO_UNIT_CONE_10, makeBeamMat(0.04));
  cHaze.renderOrder = 0; _beamGrp.add(cHaze);

  // Mid glow cone
  const cGlow = new THREE.Mesh(GEO_UNIT_CONE_16, makeBeamMat(0.10));
  cGlow.renderOrder = 1; _beamGrp.add(cGlow);

  // Main beam cone
  const cMain = new THREE.Mesh(GEO_UNIT_CONE_24, makeBeamMat(0.28));
  cMain.renderOrder = 2; _beamGrp.add(cMain);

  // Core (cœur très fin et brillant)
  const cCore = new THREE.Mesh(GEO_UNIT_CONE_10, makeBeamMat(0.65));
  cCore.renderOrder = 3; _beamGrp.add(cCore);

  // Tache au sol
  const pool = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pool.rotation.x = -Math.PI/2;
  pool.renderOrder = 0; _poolGrp.add(pool);

  // Halo au sol (large et très doux)
  const halo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  halo.rotation.x = -Math.PI/2;
  halo.renderOrder = 0; _poolGrp.add(halo);

  // ── PAR LED — modèle compact réaliste ────────────────────────────────
  const parGrp = new THREE.Group();

  const _parBodyMat = new THREE.MeshStandardMaterial({ color:0x1c1c28, roughness:0.50, metalness:0.62 });
  const _parChrMat2 = new THREE.MeshStandardMaterial({ color:0x404858, roughness:0.38, metalness:0.78 });
  const _parYokeMat = new THREE.MeshStandardMaterial({ color:0x222234, roughness:0.42, metalness:0.78 });

  // Collier omega de fixation truss
  const parOme = new THREE.Mesh(
    new THREE.TorusGeometry(0.090, 0.026, 8, 18, Math.PI),
    _parChrMat2.clone()
  );
  parOme.rotation.z = Math.PI;
  parOme.position.set(0, 0.062, 0);
  parGrp.add(parOme);

  // Barre de yoke supérieure
  const parYokeBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.068, 0.098),
    _parYokeMat.clone()
  );
  parYokeBar.userData.projoIndex = i;
  parGrp.add(parYokeBar);

  // Bras du yoke ×2
  for (const sx of [-0.238, 0.238]) {
    const parArm = new THREE.Mesh(
      new THREE.BoxGeometry(0.058, 0.38, 0.082),
      _parYokeMat.clone()
    );
    parArm.position.set(sx, -0.19, 0);
    parArm.userData.projoIndex = i;
    parGrp.add(parArm);
    // Arrondi en bas de bras
    const parElbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.040, 8, 7),
      _parYokeMat.clone()
    );
    parElbow.position.set(sx, -0.38, 0);
    parGrp.add(parElbow);
  }

  // Corps cylindrique principal (noir mat)
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.160, 0.166, 0.24, 22),
    _parBodyMat.clone()
  );
  body.userData.projoIndex = i;
  body.position.set(0, -0.175, 0);
  parGrp.add(body);

  // Bande de couleur de groupe (accent sur le corps)
  const groupRingMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.28, metalness: 0.55,
    emissive: new THREE.Color(0.2, 0.2, 0.2), emissiveIntensity: 0.5,
  });
  const groupRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.168, 0.168, 0.018, 22),
    groupRingMat
  );
  groupRing.position.set(0, -0.094, 0);
  parGrp.add(groupRing);

  // Bague chrome avant (autour de la lentille)
  const parFrontRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.182, 0.182, 0.030, 28),
    _parChrMat2.clone()
  );
  parFrontRing.position.set(0, -0.317, 0);
  parGrp.add(parFrontRing);

  // Goupilles de pivot ×2 (reliant bras au corps)
  for (const sx of [-0.200, 0.200]) {
    const pPin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.030, 0.030, 0.095, 10),
      _parChrMat2.clone()
    );
    pPin.rotation.z = Math.PI / 2;
    pPin.position.set(sx, -0.175, 0);
    parGrp.add(pPin);
  }

  // Lentille émissive (face -Y = bas)
  const lensMat = new THREE.MeshStandardMaterial({
    color:0x060614, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.158, 32), lensMat);
  lens.position.set(0, -0.333, 0);
  lens.rotation.x = -Math.PI / 2;
  lens.userData.projoIndex = i;
  parGrp.add(lens);

  parGrp.visible = false;
  _fixtureGrp.add(parGrp);

  // clamp kept as alias for backward compat (now inside parGrp)
  const clamp = parOme;

  // ── Moving Head (Lyre) — modèle doré réaliste ────────────────────────
  const mhGrp = new THREE.Group();

  const _mhGoldMat = new THREE.MeshStandardMaterial({ color:0xc09030, roughness:0.28, metalness:0.82 });
  const _mhChrMat  = new THREE.MeshStandardMaterial({ color:0x7080a0, roughness:0.38, metalness:0.80 });
  const _mhDarkMat2= new THREE.MeshStandardMaterial({ color:0x141420, roughness:0.55, metalness:0.50 });

  // Barre de montage supérieure (top du yoke)
  const mhBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.64, 0.088, 0.17),
    _mhGoldMat.clone()
  );
  mhBar.userData.projoIndex = i;
  mhGrp.add(mhBar);

  // Colliers omega ×2 (mordent sur le truss par le dessus)
  for (const sx of [-0.185, 0.185]) {
    const ome = new THREE.Mesh(
      new THREE.TorusGeometry(0.096, 0.027, 8, 18, Math.PI),
      _mhChrMat.clone()
    );
    ome.rotation.z = Math.PI;         // demi-tore ouvert vers le haut
    ome.position.set(sx, 0.065, 0);
    mhGrp.add(ome);
    // Vis de serrage de l'omega
    const bolt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.019, 0.019, 0.050, 8),
      _mhChrMat.clone()
    );
    bolt.position.set(sx, 0.180, 0);
    mhGrp.add(bolt);
  }

  // Bras du yoke ×2 (gauche & droite) — longueur divisée par 2
  for (const sx of [-0.252, 0.252]) {
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.076, 0.28, 0.112),
      _mhGoldMat.clone()
    );
    arm.position.set(sx, -0.18, 0);
    arm.userData.projoIndex = i;
    mhGrp.add(arm);
    // Arrondi en bout de bras
    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.053, 10, 8),
      _mhGoldMat.clone()
    );
    elbow.position.set(sx, -0.323, 0);
    mhGrp.add(elbow);
  }

  // ── Groupe tête (tilt — rotation X) ──────────────────────────────────
  const mhHGrp = new THREE.Group();
  mhHGrp.position.set(0, -0.35, 0);

  // Corps principal — frustum légèrement évasé vers l'arrière (haut = +Y)
  const mhHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.158, 0.212, 0.43, 26),
    _mhGoldMat.clone()
  );
  mhHead.userData.projoIndex = i;
  mhHGrp.add(mhHead);

  // Bandeau sombre entre corps et bague lentille
  const mhBand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.170, 0.170, 0.034, 26),
    _mhDarkMat2.clone()
  );
  mhBand.position.set(0, -0.196, 0);
  mhHGrp.add(mhBand);

  // Bague chrome autour de la lentille
  const mhRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.192, 0.192, 0.040, 30),
    _mhChrMat.clone()
  );
  mhRing.position.set(0, -0.232, 0);
  mhHGrp.add(mhRing);

  // Lentille émissive (face -Y = bas par défaut)
  const mhLensMat = new THREE.MeshStandardMaterial({
    color:0x060618, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const mhLens = new THREE.Mesh(new THREE.CircleGeometry(0.175, 32), mhLensMat);
  mhLens.position.set(0, -0.248, 0);
  mhLens.rotation.x = -Math.PI / 2;
  mhLens.userData.projoIndex = i;
  mhHGrp.add(mhLens);

  // Goupilles de pivot tilt ×2 (reliant tête aux bras du yoke)
  for (const sx of [-0.266, 0.266]) {
    const pin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.040, 0.040, 0.118, 12),
      new THREE.MeshStandardMaterial({ color:0x9098a4, roughness:0.16, metalness:0.97 })
    );
    pin.rotation.z = Math.PI / 2;
    pin.position.set(sx, 0.055, 0);
    mhHGrp.add(pin);
  }

  mhGrp.add(mhHGrp);
  mhGrp.visible = false;
  _fixtureGrp.add(mhGrp);

  // Point light au sol (éclaire le sol et les silhouettes)
  const ptLight = new THREE.PointLight(0xffffff, 0, 14, 1.8);
  _lightGrp.add(ptLight);

  const obj = { cHaze, cGlow, cMain, cCore, pool, halo, ptLight,
                body, lens, groupRing, parGrp,
                mhGrp, mhHGrp, mhHead, mhLens };
  _objs.push(obj);
  return obj;
}

window.highlightProjo = function(idx) {
  // Efface ancien surlignage
  if (_selectedProjo >= 0 && _selectedProjo < _objs.length) {
    const prev = _objs[_selectedProjo];
    prev.body.material.emissive.setHex(0x000000);
    prev.body.material.emissiveIntensity = 0;
    prev.mhHead.material.emissive.setHex(0x000000);
    prev.mhHead.material.emissiveIntensity = 0;
    if (prev.groupRing) {
      prev.groupRing.material.emissiveIntensity = 0.5;   // retour à l'accent normal
    }
  }
  _selectedProjo = idx;
  if (idx >= 0 && idx < _objs.length) {
    const cur = _objs[idx];
    cur.body.material.emissive.setHex(0x0055aa);
    cur.body.material.emissiveIntensity = 1.2;
    cur.mhHead.material.emissive.setHex(0x0055aa);
    cur.mhHead.material.emissiveIntensity = 1.2;
    if (cur.groupRing) {
      cur.groupRing.material.emissive.setHex(0x0088ff);
      cur.groupRing.material.emissiveIntensity = 2.5;   // clignotant bleu visible
    }
  }
};

renderer.domElement.addEventListener('pointerdown', (e) => {
  _ptrDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!_ptrDownPos) return;
  const dx = e.clientX - _ptrDownPos.x;
  const dy = e.clientY - _ptrDownPos.y;
  _ptrDownPos = null;
  if (Math.sqrt(dx*dx + dy*dy) > 6) return;   // c'était un drag, pas un clic

  const rect = renderer.domElement.getBoundingClientRect();
  _mouse2D.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  _mouse2D.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_mouse2D, camera);

  const hits = _raycaster.intersectObjects(_fixtureGrp.children, true);
  let idx = -1;
  for (const h of hits) {
    if (h.object.userData.projoIndex !== undefined) {
      idx = h.object.userData.projoIndex;
      break;
    }
  }
  window.highlightProjo(idx);
  if (window._bridge) window._bridge.projoSelected(idx);
});

// ─────────────────────────────────────────────────────────────────────────────
// Calcul direction faisceau (miroir exact du code Python)
// ─────────────────────────────────────────────────────────────────────────────
function beamFloor(p) {
  const hy  = p.fixture_height ?? 7.0;
  const isMH = p.fixture_type === 'Moving Head';
  if (isMH) {
    const panA  = (p.pan - 32768)  / 32768.0 * Math.PI;
    const theta = (32768 - p.tilt) / 32768.0 * Math.PI * 0.75;
    const rx    = (p.rot3d_x || 0) * Math.PI / 180;
    // Direction correcte : tilt dévie le faisceau DANS la direction du pan.
    // Pan seul (tilt=0) → faisceau droit vers le bas. Tilt → déviation dans le plan pan.
    const bx_raw = Math.sin(theta) * Math.sin(panA);
    const by_raw = -Math.cos(theta);
    const bz_raw = Math.sin(theta) * Math.cos(panA);
    // Rotation de corps (rx)
    const bx = bx_raw;
    const by = by_raw * Math.cos(rx) - bz_raw * Math.sin(rx);
    const bz = by_raw * Math.sin(rx) + bz_raw * Math.cos(rx);
    // Position réelle de la lentille (même ordre : Ry d'abord, puis Rx)
    const ly_l  = -0.35 - 0.248 * Math.cos(theta);
    const lz_l  =          0.248 * Math.sin(theta);
    const lensX = p.x + lz_l * Math.sin(panA);
    const lensY = hy  + ly_l * Math.cos(rx) - lz_l * Math.cos(panA) * Math.sin(rx);
    const lensZ = p.z + ly_l * Math.sin(rx) + lz_l * Math.cos(panA) * Math.cos(rx);
    const goingUp = by > 0.05;
    let t;
    if      (by < -0.05)  t = Math.min(lensY / (-by), 10.0);
    else if (goingUp)     t = Math.min((15.0 - lensY) / by, 15.0);
    else                  t = 10.0;
    return {
      fx: Math.max(-11, Math.min(11, lensX + bx*t)),
      fz: Math.max(-8,  Math.min(13, lensZ + bz*t)),
      lensX, lensY, lensZ, bx, by, bz, isMH, goingUp,
    };
  } else {
    const lensY = hy - 0.333;
    const ry    = (p.rot3d_y ?? 0) * Math.PI / 180;  // pan — pivot horizontal
    const rx    = (p.rot3d_x ?? 0) * Math.PI / 180;  // tilt — inclinaison depuis nadir
    const bx    = Math.sin(ry) * Math.sin(rx);
    const by    = -Math.cos(rx);
    const bz    = Math.cos(ry) * Math.sin(rx);
    const goingUp = by > 0.05;
    const t = by < -0.05 ? Math.min(lensY / (-by), 12.0)
            : goingUp    ? Math.min((15.0 - lensY) / by, 15.0)
            :               12.0;
    return {
      fx: Math.max(-11, Math.min(11, p.x + bx * t)),
      fz: Math.max(-8,  Math.min(13, p.z + bz * t)),
      lensX: p.x, lensY, lensZ: p.z, bx, by, bz, isMH: false, goingUp,
    };
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Positionner / orienter un cône unit entre deux points
// ─────────────────────────────────────────────────────────────────────────────
const _vUp  = new THREE.Vector3(0, 1, 0);
const _vDir = new THREE.Vector3();
const _qTmp = new THREE.Quaternion();

function orientCone(mesh, tipX, tipY, tipZ, baseX, baseY, baseZ, rScale) {
  const dx = baseX - tipX, dy = baseY - tipY, dz = baseZ - tipZ;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (len < 0.05) { mesh.visible = false; return; }
  // direction de la base vers le tip (= haut local du cylindre)
  _vDir.set(-dx/len, -dy/len, -dz/len);
  _qTmp.setFromUnitVectors(_vUp, _vDir);
  mesh.position.set((tipX+baseX)/2, (tipY+baseY)/2, (tipZ+baseZ)/2);
  mesh.quaternion.copy(_qTmp);
  mesh.scale.set(rScale, len, rScale);
  mesh.visible = true;
}

// ─────────────────────────────────────────────────────────────────────────────
// updateScene — appelé depuis Python via runJavaScript
// ─────────────────────────────────────────────────────────────────────────────
// Buffers pré-alloués — évite ~600 allocations Color/s qui déclenchent le GC
const _colBuf = new THREE.Color();
const _briBuf = new THREE.Color();

window.updateScene = function(projectors) {
  const bs = window.beamScale;

  for (let i = 0; i < projectors.length; i++) {
    const p   = projectors[i];
    const obj = _getObj(i);
    const lvl = Math.max(0, Math.min(1, p.level / 100.0));
    const r = p.r/255, g = p.g/255, b = p.b/255;
    _colBuf.setRGB(r, g, b);
    const hy  = p.fixture_height ?? 7.0;
    const bf  = beamFloor(p);
    const { fx, fz, lensX, lensY, lensZ, isMH, goingUp } = bf;

    // ── Corps de fixture ─────────────────────────────────────────────
    if (isMH) {
      // Cache le groupe PAR
      obj.parGrp.visible = false;

      // Positionne + oriente le Moving Head
      const panA  = (p.pan - 32768)  / 32768.0 * Math.PI;
      const theta = (32768 - p.tilt) / 32768.0 * Math.PI * 0.75;
      const rx    = (p.rot3d_x || 0) * Math.PI / 180;
      obj.mhGrp.position.set(p.x, hy, p.z);
      obj.mhGrp.rotation.x  = rx;
      obj.mhGrp.rotation.y  = panA;
      obj.mhGrp.rotation.z  = (p.rot3d_z || 0) * Math.PI / 180;
      obj.mhHGrp.rotation.x = -theta;
      obj.mhGrp.visible = _flags.fixtures;

      // Lentille MH émissive
      if (lvl > 0) {
        _briBuf.copy(_colBuf).multiplyScalar(1.0 + lvl * 1.5);
        obj.mhLens.material.emissive.copy(_briBuf);
        obj.mhLens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.mhLens.material.emissive.set(0, 0, 0);
        obj.mhLens.material.emissiveIntensity = 0;
      }
    } else {
      // Cache le groupe MH
      obj.mhGrp.visible = false;

      // ── Groupe PAR LED ───────────────────────────────────────────
      obj.parGrp.position.set(p.x, hy, p.z);
      obj.parGrp.rotation.x = (p.rot3d_x ?? 0) * Math.PI / 180;
      obj.parGrp.rotation.y = (p.rot3d_y ?? 0) * Math.PI / 180;
      obj.parGrp.visible = _flags.fixtures;

      // Bande de couleur de groupe (accent toujours visible)
      const gcHex = GROUP_COLOR[p.group] ?? '#5577aa';
      if (i !== _selectedProjo) {   // ne pas écraser le surlignage de sélection
        obj.groupRing.material.color.set(gcHex);
        obj.groupRing.material.emissive.set(gcHex);
        obj.groupRing.material.emissiveIntensity = 0.6;
      }

      // Lentille émissive
      if (lvl > 0) {
        _briBuf.copy(_colBuf).multiplyScalar(1.0 + lvl * 1.5);
        obj.lens.material.emissive.copy(_briBuf);
        obj.lens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.lens.material.emissive.set(0, 0, 0);
        obj.lens.material.emissiveIntensity = 0;
      }
    }

    // ── Faisceaux ────────────────────────────────────────────────────
    if (lvl > 0.03) {
      const base_r = (0.22 + 2.0 * lvl) * bs;
      const fx2 = fx, fz2 = fz;

      const baseY = goingUp ? 14.5 : 0.03;

      // Haze extérieur (très large, très transparent)
      orientCone(obj.cHaze, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 3.0);
      obj.cHaze.material.uniforms.uColor.value.copy(_colBuf);
      obj.cHaze.material.uniforms.uAlpha.value = 0.04 * lvl;

      // Glow intermédiaire
      orientCone(obj.cGlow, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 1.8);
      obj.cGlow.material.uniforms.uColor.value.copy(_colBuf);
      obj.cGlow.material.uniforms.uAlpha.value = 0.11 * lvl;

      // Faisceau principal
      orientCone(obj.cMain, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 1.0);
      obj.cMain.material.uniforms.uColor.value.copy(_colBuf);
      obj.cMain.material.uniforms.uAlpha.value = 0.32 * lvl;

      // Cœur brillant (très fin)
      orientCone(obj.cCore, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 0.28);
      obj.cCore.material.uniforms.uColor.value.copy(_colBuf);
      obj.cCore.material.uniforms.uAlpha.value = 0.80 * lvl;

      if (!goingUp) {
        // Tache principale au sol (avec gobo)
        const goboSlot  = Math.min(7, Math.floor(((p.gobo || 0) / 256) * 8));
        const goboBlend = goboSlot > 0 ? 1.0 : 0.0;
        const goboRot   = ((p.gobo_rotation || 0) / 255.0) * Math.PI * 2;
        const poolR = (0.35 + 2.2*lvl) * bs;
        obj.pool.position.set(fx2, 0.02, fz2);
        obj.pool.scale.setScalar(poolR);
        obj.pool.material.uniforms.uColor.value.copy(_colBuf);
        obj.pool.material.uniforms.uAlpha.value = 0.70 * lvl;
        obj.pool.material.uniforms.uGoboTex.value   = _goboTextures[goboSlot];
        obj.pool.material.uniforms.uGoboBlend.value = goboBlend;
        obj.pool.material.uniforms.uGoboRot.value   = goboRot;
        obj.pool.visible = true;

        // Halo diffus au sol (plus large)
        obj.halo.position.set(fx2, 0.015, fz2);
        obj.halo.scale.setScalar(poolR * 2.8);
        obj.halo.material.uniforms.uColor.value.copy(_colBuf);
        obj.halo.material.uniforms.uAlpha.value = 0.15 * lvl;
        obj.halo.visible = true;

        // Point light au sol
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 4.5;
        obj.ptLight.position.set(fx2, 0.4, fz2);
      } else {
        // Faisceau montant — pas de tache au sol
        obj.pool.visible = false;
        obj.halo.visible = false;
        // Point light dans le faisceau montant
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 3.0;
        obj.ptLight.position.set(fx2, Math.min(lensY + 4.0, 13.0), fz2);
      }
      obj.ptLight.visible = true;

    } else {
      obj.cHaze.visible = obj.cGlow.visible =
      obj.cMain.visible = obj.cCore.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
    }
  }

  // Masquer les slots inutilisés
  for (let i = projectors.length; i < _objs.length; i++) {
    const o = _objs[i];
    o.cHaze.visible = o.cGlow.visible = o.cMain.visible = o.cCore.visible =
    o.pool.visible  = o.halo.visible  = o.ptLight.visible = false;
    o.parGrp.visible = false;
    o.mhGrp.visible  = false;
  }
};

const CAM_PRESETS = {
  iso:   { pos:[14,11,20], tgt:[0,3,0] },
  front: { pos:[0,5,24],   tgt:[0,4,0] },
  top:   { pos:[0,30,0.1], tgt:[0,0,0] },
  side:  { pos:[24,7,0],   tgt:[0,4,0] },
};
const CAM_BTNS = { iso:'b-iso', front:'b-front', top:'b-top', side:'b-side' };

window.setCam = function(name) {
  const p = CAM_PRESETS[name]; if (!p) return;
  camera.position.set(...p.pos);
  controls.target.set(...p.tgt);
  controls.update();
  Object.keys(CAM_BTNS).forEach(k => {
    const el = document.getElementById(CAM_BTNS[k]);
    if (el) el.classList.toggle('on', k===name);
  });
};

const _flags = { bloom:true,  fixtures:true, trusses:true, floor:true, grid:true, fog:true };

window.toggleFlag = function(what) {
  _flags[what] = !_flags[what];
  const _el = document.getElementById('b-'+what);
  if (_el) _el.classList.toggle('on', _flags[what]);

  if (what === 'bloom')    { /* handled in animate */ }
  if (what === 'fixtures') { _fixtureGrp.visible = _flags.fixtures; }
  if (what === 'trusses')  { _trussGrp.visible   = _flags.trusses;  }
  if (what === 'floor')    { floorMesh.visible    = _flags.floor;    }
  if (what === 'grid')     { gridHelper.visible   = _flags.grid;     }
  if (what === 'fog')      { scene.fog = _flags.fog ? fog : null;    }
};

const _SILO_MAT = new THREE.MeshStandardMaterial({ color:0x0d0d1a, roughness:0.95, metalness:0.0 });

function _makePersonSilhouette(x, z, hScale = 1.0) {
  const g = new THREE.Group();
  const h = 1.75 * hScale;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.20, h * 0.55, 4, 8), _SILO_MAT);
  body.position.set(0, h * 0.55, 0);
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17 * hScale, 10, 7), _SILO_MAT);
  head.position.set(0, h * 1.02, 0);
  g.add(head);
  g.position.set(x, 0, z);
  return g;
}

function _makeDJBooth(x, z) {
  const g = new THREE.Group();
  const matBody = new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:0.6, metalness:0.3 });
  const matTop  = new THREE.MeshStandardMaterial({ color:0x2a2a3e, roughness:0.3, metalness:0.6 });
  const matCDJ  = new THREE.MeshStandardMaterial({ color:0x0a0a14, roughness:0.2, metalness:0.85 });
  const facade  = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.85, 0.55), matBody);
  facade.position.set(0, 0.42, 0); g.add(facade);
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.55), matTop);
  top.position.set(0, 0.88, 0); g.add(top);
  for (const dx of [-0.60, 0.60]) {
    const cdj = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.05, 20), matCDJ);
    cdj.position.set(dx, 0.93, 0); g.add(cdj);
    const platter = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.14, 0.01, 20),
      new THREE.MeshStandardMaterial({ color:0x222233, emissive:0x001133, emissiveIntensity:0.5, roughness:0.1 })
    );
    platter.position.set(dx, 0.96, 0); g.add(platter);
  }
  const mixer = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.07, 0.45), matCDJ);
  mixer.position.set(0, 0.94, 0); g.add(mixer);
  for (const [dx, col] of [[-0.15, 0x00ff88], [0, 0xff2200], [0.15, 0x0088ff]]) {
    const led = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.01, 0.02),
      new THREE.MeshStandardMaterial({ emissive:col, emissiveIntensity:1.5, color:col })
    );
    led.position.set(dx, 0.985, -0.05); g.add(led);
  }
  g.position.set(x, 0, z);
  return g;
}

function _makeBackline() {
  const g = new THREE.Group();
  const matAmp = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.9, metalness:0.1 });
  for (const [x, w, h] of [[-5.0, 0.8, 1.30], [-5.8, 0.8, 0.70], [5.0, 0.8, 1.30], [5.8, 0.8, 0.70]]) {
    const amp = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), matAmp);
    amp.position.set(x, h / 2, 2.5); g.add(amp);
  }
  return g;
}

// Colonnes de haut-parleurs (sono mobile, festival…)
function _makeSpeakerColumn(x, z, nSats=4) {
  const g   = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x0a0a0a, roughness:0.95, metalness:0.06 });
  for (let i = 0; i < 2; i++) {
    const sub = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.54, 0.50), mat);
    sub.position.set(0, 0.27 + i * 0.54, 0);
    g.add(sub);
  }
  for (let i = 0; i < nSats; i++) {
    const sat = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.20, 0.26), mat);
    sat.position.set(0, 1.08 + 0.10 + i * 0.21, 0);
    g.add(sat);
  }
  g.position.set(x, 0, z);
  return g;
}

// Sono mobile — inspiré du GLB sonomobile_scene.glb
// Remorque 6×4m marron, 4 pieds de truss, 2 colonnes speaker suspendues, 6 satellites, 4 roues
function _makeSonomobile(x, z) {
  const g = new THREE.Group();
  const mat = (c, r, m) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
  const add = (geo, col, r, m, px, py, pz) => {
    const mesh = new THREE.Mesh(geo, mat(col, r, m));
    mesh.position.set(px, py, pz);
    g.add(mesh);
    return mesh;
  };

  // Plateau remorque (GLB: 6×4×0.2m, marron RGB 120,70,30)
  add(new THREE.BoxGeometry(6.0, 0.20, 4.0), 0x7a4618, 0.75, 0.08,  0, 0.10, 0);
  // Rails latéraux châssis
  for (const sx of [-3.0, 3.0])
    add(new THREE.BoxGeometry(0.08, 0.28, 4.0), 0xb4b4b4, 0.30, 0.80, sx, 0.24, 0);
  // Flèche de remorque (côté -Z = derrière)
  add(new THREE.BoxGeometry(0.10, 0.10, 1.2), 0xb4b4b4, 0.35, 0.75, 0, 0.25, -2.6);

  // Console DJ
  add(new THREE.BoxGeometry(2.2, 1.0, 1.0), 0x1a1a28, 0.55, 0.35,  0, 0.70, -0.3);
  add(new THREE.BoxGeometry(2.2, 0.05, 1.0), 0x2a2a3e, 0.25, 0.65, 0, 1.225,-0.3);
  for (const bx of [-0.55, 0.55])
    add(new THREE.CylinderGeometry(0.18,0.18,0.04,18), 0x0a0a14, 0.15, 0.85, bx, 1.27, -0.3);
  add(new THREE.BoxGeometry(0.55, 0.06, 0.42), 0x0a0a14, 0.15, 0.85, 0, 1.255, -0.3);

  // Barres latérales de truss (gauche/droite — les barres avant/arrière viennent de buildTrusses)
  const trussY = 3.40;
  for (const bx of [-2.5, 2.5])
    add(new THREE.BoxGeometry(0.09, 0.09, 3.0), 0xc8c8c8, 0.25, 0.85, bx, trussY, 0);

  // Speaker stacks suspendus (GLB: ±3.2m X, face +Z = vers piste)
  for (const sx of [-3.2, 3.2]) {
    const spkH = 1.50, spkY = trussY - 0.18 - spkH/2;
    add(new THREE.BoxGeometry(0.60, spkH, 0.55), 0x090909, 0.95, 0.06, sx, spkY, 1.5);
    add(new THREE.BoxGeometry(0.56, spkH-0.06, 0.02), 0x0e0e0e, 1.0, 0.0, sx, spkY, 1.785);
    add(new THREE.BoxGeometry(0.04, 0.30, 0.04), 0xb4b4b4, 0.28, 0.82, sx, trussY-0.10, 1.5);
  }

  // 6 satellites sur la barre avant (GLB: X=±2,±1.2,±0.4, face +Z)
  for (const sx of [-2.0,-1.2,-0.4,0.4,1.2,2.0]) {
    add(new THREE.BoxGeometry(0.22, 0.22, 0.24), 0x5a5a5a, 0.60, 0.40, sx, trussY-0.14, 1.5);
    add(new THREE.BoxGeometry(0.02, 0.12, 0.02), 0xb4b4b4, 0.30, 0.80, sx, trussY-0.06, 1.5);
  }

  // Roues (4 roues, 2 essieux)
  for (const wz of [-1.5, 1.5]) {
    for (const wx of [-2.3, 2.3]) {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.22,16),
        mat(0x1a1a1a,0.90,0.10));
      tire.rotation.z = Math.PI/2;
      tire.position.set(wx, 0.28, wz);
      g.add(tire);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.24,12),
        mat(0x6a6a7a,0.40,0.70));
      rim.rotation.z = Math.PI/2;
      rim.position.set(wx, 0.28, wz);
      g.add(rim);
    }
  }

  g.position.set(x, 0, z);
  return g;
}

// Totem — tour autoportante truss + colonne de haut-parleurs + lyre au sommet
function _makeTotem(x, z, height=4.5, nSpk=5) {
  const g   = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

  // Lestage (béton/acier)
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.46,0.65), mat(0x232323,0.85,0.18));
  base.position.set(0,0.23,0); g.add(base);
  const bride = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.05,0.42), mat(0x606070,0.40,0.70));
  bride.position.set(0,0.48,0); g.add(bride);

  // 2 tubes verticaux
  const colH   = height - 0.46;
  const tubeY  = 0.48 + colH/2;
  for (const tx of [-0.09, 0.09]) {
    const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,colH,10), mat(0xb0b8c8,0.28,0.85));
    tb.position.set(tx, tubeY, 0); g.add(tb);
  }
  // Barres horizontales de truss
  const nBars = Math.ceil(colH / 0.42);
  const bStep = colH / nBars;
  for (let i=0; i<=nBars; i++) {
    const hb = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.024,0.024), mat(0x8898a8,0.35,0.75));
    hb.position.set(0, 0.48+i*bStep, 0); g.add(hb);
  }

  // Colonne de haut-parleurs (face +Z = vers la piste)
  const spkStart = 0.48 + colH*0.10;
  const totalSpkH = colH * 0.78;
  const unitH     = totalSpkH / nSpk;
  for (let i=0; i<nSpk; i++) {
    const sy  = spkStart + i*unitH + unitH/2;
    const spk = new THREE.Mesh(new THREE.BoxGeometry(0.28, unitH*0.91, 0.22), mat(0x080808,0.95,0.05));
    spk.position.set(0, sy, 0.14); g.add(spk);
    if (i < nSpk-1) {
      const sep = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.008,0.22), mat(0x181818,0.95,0.05));
      sep.position.set(0, spkStart+(i+1)*unitH, 0.14); g.add(sep);
    }
  }

  // Lyre dorée au sommet
  const topY = 0.48 + colH;
  const yoke = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.06,0.10), mat(0xc09030,0.28,0.82));
  yoke.position.set(0, topY+0.08, 0); g.add(yoke);
  for (const yx of [-0.11,0.11]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.22,0.08), mat(0xc09030,0.28,0.82));
    arm.position.set(yx, topY-0.07, 0); g.add(arm);
  }
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.072,0.092,0.17,12), mat(0xc09030,0.28,0.82));
  head.position.set(0, topY-0.18, 0); g.add(head);

  g.position.set(x, 0, z);
  return g;
}

// Praticable / stage riser
function _makeStageRiser(x, z, w, d, h) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const deck = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(0x0f0f18,0.84,0.12));
  deck.position.set(0,h/2,0); g.add(deck);
  const top = new THREE.Mesh(new THREE.BoxGeometry(w+0.02,0.016,d+0.02), mat(0x2a2a3e,0.28,0.72));
  top.position.set(0,h+0.008,0); g.add(top);
  for (const [cx,cz] of [[-w/2+0.04,-d/2+0.04],[w/2-0.04,-d/2+0.04],[-w/2+0.04,d/2-0.04],[w/2-0.04,d/2-0.04]]) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.05,h,0.05), mat(0x484858,0.32,0.80));
    col.position.set(cx,h/2,cz); g.add(col);
  }
  const nS = Math.max(1, Math.round(h/0.20));
  for (let s=0;s<nS;s++) {
    const sh=h/nS;
    const step = new THREE.Mesh(new THREE.BoxGeometry(0.65,sh,0.28), mat(0x0c0c16,0.88,0.10));
    step.position.set(w/2+0.325, sh*0.5+s*sh, -d/2+0.14+s*0.24);
    g.add(step);
  }
  g.position.set(x,0,z); return g;
}

// Écran LED fond de scène
function _makeLEDScreen(x, z, w, h) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.12,h+0.12,0.08), mat(0x3a3a52,0.38,0.78));
  frame.position.set(0,h/2,0); g.add(frame);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.04),
    new THREE.MeshStandardMaterial({color:0x000820, emissive:new THREE.Color(0.03,0.06,0.16),
      emissiveIntensity:1.4, roughness:0.04, metalness:0.10}));
  panel.position.set(0,h/2,0.02); g.add(panel);
  const nH = Math.floor(h*5);
  for (let i=0;i<nH;i++) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(w-0.04,0.005,0.05),
      new THREE.MeshStandardMaterial({color:0x001040,roughness:0.15}));
    line.position.set(0, 0.06+i*(h/nH), 0.04); g.add(line);
  }
  const nV = Math.floor(w*3);
  for (let i=0;i<nV;i++) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.005,h-0.04,0.05),
      new THREE.MeshStandardMaterial({color:0x001040,roughness:0.15}));
    col.position.set(-w/2+0.06+i*(w/nV), h/2, 0.04); g.add(col);
  }
  for (const cx of [-w*0.3,0,w*0.3]) {
    const cable = new THREE.Mesh(new THREE.BoxGeometry(0.018,0.24,0.018), mat(0x1a1a1a,0.90,0.05));
    cable.position.set(cx,-0.12,-0.02); g.add(cable);
  }
  g.position.set(x,0,z); return g;
}

// Portique truss (goalpost)
function _makeGoalpost(x, z, h, spread=2.0, rotY=0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const bar = new THREE.Mesh(new THREE.BoxGeometry(spread*2+0.24,0.20,0.26), mat(0x8898b8,0.30,0.88));
  bar.position.set(0,h,0); g.add(bar);
  for (const dy of [0.09,-0.09]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(spread*2+0.24,0.030,0.030),
      new THREE.MeshStandardMaterial({color:0xc0d0e8,roughness:0.32,metalness:0.90}));
    rail.position.set(0,h+dy,0); g.add(rail);
  }
  for (const lx of [-spread,spread]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09,h,0.09), mat(0x7888a8,0.38,0.82));
    leg.position.set(lx,h/2,0); g.add(leg);
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.05,0.50), mat(0x3a4055,0.55,0.65));
    base.position.set(lx,0.025,0); g.add(base);
    const dSign = lx>0?1:-1, diagLen = Math.sqrt((spread*0.55)**2+(h*0.50)**2);
    const diag = new THREE.Mesh(new THREE.BoxGeometry(0.036,diagLen,0.036), mat(0x607090,0.42,0.72));
    diag.position.set(lx-dSign*spread*0.275, h*0.50/2, 0);
    diag.rotation.z = Math.atan2(spread*0.55, h*0.50)*dSign; g.add(diag);
  }
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Monitor wedge (retour de scène)
function _makeMonitorWedge(x, z, rotY=0) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.48,0.22,0.36),
    new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.92,metalness:0.06}));
  body.position.set(0,0.11,0); body.rotation.x=0.42; g.add(body);
  const cloth = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.16,0.008),
    new THREE.MeshStandardMaterial({color:0x0d0d0d,roughness:0.96}));
  cloth.position.set(0,0.15,0.14); cloth.rotation.x=0.42; g.add(cloth);
  const spk = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.006,14),
    new THREE.MeshStandardMaterial({color:0x151515,roughness:0.80,metalness:0.15}));
  spk.position.set(0,0.155,0.148); spk.rotation.x=Math.PI/2+0.42; g.add(spk);
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Stack guitare (ampli + baffle 4×12)
function _makeGuitarStack(x, z, rotY=0) {
  const g = new THREE.Group();
  const mC  = new THREE.MeshStandardMaterial({color:0x0c0c0f,roughness:0.92,metalness:0.04});
  const mHW = new THREE.MeshStandardMaterial({color:0x5a5a6a,roughness:0.35,metalness:0.75});
  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.76,0.72,0.38),mC);
  cab.position.set(0,0.36,0); g.add(cab);
  for (let r=0;r<2;r++) for (let c=0;c<2;c++) {
    const spk = new THREE.Mesh(new THREE.CircleGeometry(0.135,14),
      new THREE.MeshStandardMaterial({color:0x080808,roughness:0.85,side:THREE.FrontSide}));
    spk.position.set(-0.19+c*0.38, 0.18+r*0.38, 0.195); g.add(spk);
    const rim = new THREE.Mesh(new THREE.RingGeometry(0.130,0.148,14),
      new THREE.MeshStandardMaterial({color:0x707080,roughness:0.35,metalness:0.75,side:THREE.FrontSide}));
    rim.position.set(-0.19+c*0.38, 0.18+r*0.38, 0.197); g.add(rim);
  }
  const amp = new THREE.Mesh(new THREE.BoxGeometry(0.68,0.36,0.34),mC);
  amp.position.set(0,0.90,0); g.add(amp);
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.20,0.01),
    new THREE.MeshStandardMaterial({color:0x0e0e12,roughness:0.95}));
  grille.position.set(0,0.90,0.175); g.add(grille);
  for (let i=0;i<4;i++) {
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.016,8),mHW);
    knob.position.set(-0.22+i*0.15,1.04,0.175); g.add(knob);
  }
  const vu = new THREE.Mesh(new THREE.BoxGeometry(0.095,0.025,0.008),
    new THREE.MeshStandardMaterial({emissive:0x00cc44,emissiveIntensity:2.0,color:0x000000}));
  vu.position.set(0.22,1.04,0.178); g.add(vu);
  const pwr = new THREE.Mesh(new THREE.SphereGeometry(0.009,6,5),
    new THREE.MeshStandardMaterial({emissive:0xff2200,emissiveIntensity:3.0,color:0x000000}));
  pwr.position.set(-0.28,1.05,0.178); g.add(pwr);
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Batterie (drum kit)
function _makeDrumKit(x, z) {
  const g = new THREE.Group();
  const mD  = (c) => new THREE.MeshStandardMaterial({color:c,roughness:0.35,metalness:0.50});
  const mHW = new THREE.MeshStandardMaterial({color:0x9898aa,roughness:0.22,metalness:0.85});
  const mSk = new THREE.MeshStandardMaterial({color:0xd0c8a0,roughness:0.75,metalness:0.02});
  // Grosse caisse
  const kick = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.40,18),mD(0x18082a));
  kick.rotation.z=Math.PI/2; kick.position.set(0,0.28,0); g.add(kick);
  for (const s of [-1,1]) {
    const sk=new THREE.Mesh(new THREE.CircleGeometry(0.27,18),mSk);
    sk.rotation.y=s*Math.PI/2; sk.position.set(s*0.205,0.28,0); g.add(sk);
    const h=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.013,6,20),mHW);
    h.rotation.y=Math.PI/2; h.position.set(s*0.20,0.28,0); g.add(h);
  }
  for (const fz of [-0.18,0.18]) {
    const ft=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.22,5),mHW);
    ft.position.set(0.20,0.11,fz); g.add(ft);
  }
  // Caisse claire
  const snare=new THREE.Mesh(new THREE.CylinderGeometry(0.145,0.145,0.14,16),mD(0x101020));
  snare.position.set(-0.40,0.78,0.12); g.add(snare);
  const snSk=new THREE.Mesh(new THREE.CircleGeometry(0.140,16),mSk);
  snSk.position.set(-0.40,0.855,0.12); g.add(snSk);
  const snL=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.78,5),mHW);
  snL.position.set(-0.40,0.39,0.12); g.add(snL);
  // Floor tom
  const ftom=new THREE.Mesh(new THREE.CylinderGeometry(0.170,0.170,0.38,16),mD(0x0e0e22));
  ftom.position.set(0.48,0.55,0.12); g.add(ftom);
  const ftSk=new THREE.Mesh(new THREE.CircleGeometry(0.166,16),mSk);
  ftSk.position.set(0.48,0.745,0.12); g.add(ftSk);
  for (let i=0;i<3;i++) {
    const a=(i/3)*Math.PI*2;
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.55,5),mHW);
    fl.position.set(0.48+Math.cos(a)*0.16, 0.275, 0.12+Math.sin(a)*0.16); g.add(fl);
  }
  // Rack tom
  const rtom=new THREE.Mesh(new THREE.CylinderGeometry(0.122,0.122,0.22,14),mD(0x0e1022));
  rtom.position.set(0.10,1.00,-0.18); g.add(rtom);
  const rtSk=new THREE.Mesh(new THREE.CircleGeometry(0.118,14),mSk);
  rtSk.position.set(0.10,1.115,-0.18); g.add(rtSk);
  const rtL=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.30,6),mHW);
  rtL.position.set(0.10,0.82,-0.18); rtL.rotation.x=0.30; g.add(rtL);
  // Hi-hat
  for (let i=0;i<2;i++) {
    const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.200,0.200,0.010,20),mHW);
    hat.position.set(-0.44,0.95+i*0.055,-0.28); g.add(hat);
  }
  const hhSt=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.95,6),mHW);
  hhSt.position.set(-0.44,0.475,-0.28); g.add(hhSt);
  // Ride + crash
  const ride=new THREE.Mesh(new THREE.CylinderGeometry(0.255,0.255,0.010,20),mHW);
  ride.position.set(0.55,1.12,-0.30); ride.rotation.x=0.20; g.add(ride);
  const rideSt=new THREE.Mesh(new THREE.CylinderGeometry(0.007,0.007,1.12,6),mHW);
  rideSt.position.set(0.55,0.56,-0.30); g.add(rideSt);
  const crash=new THREE.Mesh(new THREE.CylinderGeometry(0.205,0.205,0.008,18),mHW);
  crash.position.set(-0.14,1.18,-0.34); crash.rotation.x=-0.25; g.add(crash);
  const crSt=new THREE.Mesh(new THREE.CylinderGeometry(0.007,0.007,1.18,6),mHW);
  crSt.position.set(-0.14,0.59,-0.34); g.add(crSt);
  // Pédale + tabouret
  const pedal=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.018,0.38),
    new THREE.MeshStandardMaterial({color:0x282832,roughness:0.45,metalness:0.65}));
  pedal.position.set(0,0.009,0.30); g.add(pedal);
  const stP=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.68,6),mHW);
  stP.position.set(0.05,0.34,0.58); g.add(stP);
  const stS=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.032,14),
    new THREE.MeshStandardMaterial({color:0x1a1a22,roughness:0.75,metalness:0.15}));
  stS.position.set(0.05,0.70,0.58); g.add(stS);
  for (let i=0;i<3;i++) {
    const a=(i/3)*Math.PI*2;
    const sf=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.68,5),mHW);
    sf.position.set(0.05+Math.cos(a)*0.14,0.34,0.58+Math.sin(a)*0.14); g.add(sf);
  }
  g.position.set(x,0,z); return g;
}

// Machine à brouillard (hazer)
function _makeHazer(x, z) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.24,0.46),mat(0x1a1a2e,0.55,0.38));
  body.position.set(0,0.12,0); g.add(body);
  const grill=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.10,0.016),mat(0x303050,0.50,0.60));
  grill.position.set(0,0.13,0.24); g.add(grill);
  const hndl=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.22,6),mat(0x505060,0.40,0.60));
  hndl.rotation.z=Math.PI/2; hndl.position.set(0,0.27,0); g.add(hndl);
  for (let i=0;i<2;i++) {
    const led=new THREE.Mesh(new THREE.SphereGeometry(0.009,6,5),
      new THREE.MeshStandardMaterial({emissive:[0x0088ff,0x00ff44][i],emissiveIntensity:2.5,color:0}));
    led.position.set(-0.05+i*0.10,0.22,0.245); g.add(led);
  }
  g.position.set(x,0,z); return g;
}

// Canon CO2
function _makeCanon(x, z, rotY=0) {

// Arche décorative avec guirlande lumineuse
function _makeArch(x, z, h=2.8, w=2.2, rotY=0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const postH=h*0.72, arcR=w*0.50+0.04, arcCY=postH;
  for (const lx of [-w/2,w/2]) {
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,postH,10),mat(0xeeeee8,0.28,0.18));
    post.position.set(lx,postH/2,0); g.add(post);
  }
  const nSeg=16;
  for (let i=0;i<nSeg;i++) {
    const a0=Math.PI+i*(Math.PI/nSeg), a1=Math.PI+(i+1)*(Math.PI/nSeg);
    const mx=arcR*Math.cos((a0+a1)/2), my=arcCY+arcR*Math.sin((a0+a1)/2);
    const dx=arcR*(Math.cos(a1)-Math.cos(a0)), dy=arcR*(Math.sin(a1)-Math.sin(a0));
    const sLen=Math.sqrt(dx*dx+dy*dy)*1.02;
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.036,sLen,7),mat(0xeeeee8,0.28,0.18));
    seg.position.set(mx,my,0); seg.rotation.z=Math.atan2(dx,dy)-Math.PI; g.add(seg);
  }
  // Guirlande lumineuse
  const nL=32, LCOLS=[0xffee88,0xffffff,0xffcc44,0xffffff];
  for (let i=0;i<=nL;i++) {
    const t=i/nL, pF=0.22;
    let lx,ly;
    if (t<pF) { lx=-w/2; ly=(t/pF)*postH; }
    else if (t>1-pF) { lx=w/2; ly=((1-t)/pF)*postH; }
    else { const tA=(t-pF)/(1-2*pF), a=Math.PI+tA*Math.PI; lx=arcR*Math.cos(a); ly=arcCY+arcR*Math.sin(a); }
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.024,5,4),
      new THREE.MeshStandardMaterial({emissive:new THREE.Color(LCOLS[i%LCOLS.length]),emissiveIntensity:2.2,color:0xffffff}));
    dot.position.set(lx,ly,0.06); g.add(dot);
  }
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Catwalk / passerelle de scène
function _makeCatwalk(x, z, length, w=1.0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const deck=new THREE.Mesh(new THREE.BoxGeometry(w,0.055,length),mat(0x0f0f1a,0.82,0.14));
  deck.position.set(0,0.0275,0); g.add(deck);
  const edgeMat=mat(0x505868,0.34,0.78);
  for (const lx of [-w/2+0.02,w/2-0.02]) {
    const topR=new THREE.Mesh(new THREE.BoxGeometry(0.030,0.030,length+0.06),edgeMat);
    topR.position.set(lx,0.92,0); g.add(topR);
    const nLegs=Math.max(2,Math.ceil(length/1.5));
    for (let j=0;j<=nLegs;j++) {
      const legZ=-length/2+j*(length/nLegs);
      const leg=new THREE.Mesh(new THREE.BoxGeometry(0.024,0.90,0.024),edgeMat);
      leg.position.set(lx,0.478,legZ); g.add(leg);
    }
  }
  // Strip LED latéral (ambiance piste)
  for (const lx of [-w/2+0.01,w/2-0.01]) {
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.010,0.008,length),
      new THREE.MeshStandardMaterial({emissive:0x003366,emissiveIntensity:1.5,color:0x000033}));
    strip.position.set(lx,0.05,0); g.add(strip);
  }
  g.position.set(x,0,z); return g;
}

// Import de scène GLTF/GLB depuis Python (base64)
// ─────────────────────────────────────────────────────────────────────────────
const _gltfLoader    = new GLTFLoader();
const _importedGrp   = new THREE.Group();
scene.add(_importedGrp);

window.loadGLTF = function(b64, isGLB) {
  // Décode base64 → ArrayBuffer
  const bin    = atob(b64);
  const bytes  = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buffer = bytes.buffer;

  _gltfLoader.parse(buffer, '', (gltf) => {
    _importedGrp.clear();
    // Centre + normalise la scène importée
    const box    = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = maxDim > 0.01 ? 12.0 / maxDim : 1.0;
    gltf.scene.position.sub(center.multiplyScalar(scale));
    gltf.scene.scale.setScalar(scale);
    _importedGrp.add(gltf.scene);
  }, (err) => console.error('GLTF import error:', err));
};

window.clearImportedScene = function() { _importedGrp.clear(); };

window.setBloom = function(strength) {
  if (window.bloomPass) window.bloomPass.strength = strength;
  _flags.bloom = strength > 0;
};

window.setScenePreset = function(name) {
  const preset = SCENE_PRESETS[name];
  if (!preset) return;
  _propsGrp.clear();
  buildTrusses(preset.trusses);
  preset.buildProps();
  window.currentTrusses = JSON.parse(JSON.stringify(preset.trusses));
};
