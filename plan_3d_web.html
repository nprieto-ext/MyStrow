<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';

document.getElementById('loading').remove();

// ── Sélection projector (raycasting + QWebChannel) ───────────────────────────
let _selectedProjo = -1;
const _raycaster   = new THREE.Raycaster();
const _mouse2D     = new THREE.Vector2();
let   _ptrDownPos  = null;   // pour distinguer clic vs drag

// ─────────────────────────────────────────────────────────────────────────────
// Renderer
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping       = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.renderer = renderer;

// ─────────────────────────────────────────────────────────────────────────────
// Scene + Camera
// ─────────────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
const fog = new THREE.FogExp2(0x05050f, 0.022);
scene.fog = fog;

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const camera = new THREE.PerspectiveCamera(52, W()/H(), 0.2, 300);
camera.position.set(14, 11, 20);
camera.lookAt(0, 3, 0);

// ─────────────────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping  = true;
controls.dampingFactor  = 0.055;
controls.minDistance    = 3;
controls.maxDistance    = 70;
controls.maxPolarAngle  = Math.PI * 0.89;
controls.update();

renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(14, 11, 20);
  controls.target.set(0, 3, 0);
  controls.update();
});

// ─────────────────────────────────────────────────────────────────────────────
// Post-processing — Bloom
// ─────────────────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
window.bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  0.65,  // strength — bloom activé par défaut pour l'ambiance
  0.42,  // radius
  0.08   // threshold — très bas pour capter même les lumières faibles
);
composer.addPass(window.bloomPass);
composer.addPass(new OutputPass());

// ─────────────────────────────────────────────────────────────────────────────
// Lumières de scène
// ─────────────────────────────────────────────────────────────────────────────
window.ambLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(window.ambLight);

const hemi = new THREE.HemisphereLight(0x8090c0, 0x000000, 0.18);
scene.add(hemi);

// Lumière de remplissage douce (toujours présente — visibilité de scène)
const _fillLight = new THREE.DirectionalLight(0xb0c0e0, 0.35);
_fillLight.position.set(0, 10, 4);
scene.add(_fillLight);

// ─────────────────────────────────────────────────────────────────────────────
// Géométrie de scène
// ─────────────────────────────────────────────────────────────────────────────

// Sol — parquet sombre
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 10),
  new THREE.MeshStandardMaterial({ color:0x0c0907, roughness:0.92, metalness:0.05 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = false;
scene.add(floorMesh);

// Grille de scène
const gridHelper = new THREE.GridHelper(18, 18, 0x0e0a06, 0x0b0806);
gridHelper.position.y = 0.005;
scene.add(gridHelper);

// Cyclorama (fond de scène)
const cycMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 11),
  new THREE.MeshStandardMaterial({ color:0x060412, roughness:1.0, side:THREE.FrontSide })
);
cycMesh.position.set(0, 5.5, -5.6);
scene.add(cycMesh);

// Jambes de scène (pendrilles noires côtés)
const legMat = new THREE.MeshStandardMaterial({ color:0x030208, roughness:1.0, side:THREE.DoubleSide });
for (const [sx, rY] of [[-9, Math.PI/2], [9, -Math.PI/2]]) {
  for (const cz of [-3, 1]) {
    const leg = new THREE.Mesh(new THREE.PlaneGeometry(4, 7), legMat);
    leg.rotation.y = rY;
    leg.position.set(sx, 3.5, cz);
    scene.add(leg);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Truss
// ─────────────────────────────────────────────────────────────────────────────
const _trussGrp = new THREE.Group();
scene.add(_trussGrp);

const _barMat = new THREE.MeshStandardMaterial({ color:0x8898b8, roughness:0.30, metalness:0.88 });
const _diagMat = new THREE.MeshStandardMaterial({ color:0x607090, roughness:0.45, metalness:0.75 });
const _legMat2 = new THREE.MeshStandardMaterial({ color:0x708298, roughness:0.38, metalness:0.82 });

function buildTrusses(defs) {
  _trussGrp.clear();
  for (const td of defs) {
    if (!td.enabled) continue;
    const hy = td.height ?? 7.0, tz = td.z ?? 0;
    const xl = td.x_l ?? -9, xr = td.x_r ?? 9, len = xr - xl;

    // Barre principale
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.26, 0.34), _barMat);
    bar.position.set((xl+xr)/2, hy, tz);
    _trussGrp.add(bar);

    // Rails supérieur/inférieur (cordons lumineux)
    for (const [dy, col] of [[0.14, 0xc0cce8], [-0.14, 0x708098]]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len, 0.04, 0.04),
        new THREE.MeshStandardMaterial({ color:col, roughness:0.35, metalness:0.85 })
      );
      rail.position.set((xl+xr)/2, hy+dy, tz);
      _trussGrp.add(rail);
    }

    // Entretoisement en croix (simplifié)
    const steps = Math.round(len);
    const dAngle = Math.atan2(0.28, len / Math.max(steps, 1));
    for (let i = 0; i < steps; i++) {
      const x0 = xl + i * (len/steps), x1 = xl + (i+1) * (len/steps);
      const diagLen = Math.sqrt((x1-x0)**2 + 0.28**2);
      for (const sign of [1, -1]) {
        const d = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.03, 0.03), _diagMat);
        d.position.set((x0+x1)/2, hy + sign*0.07, tz);
        d.rotation.z = sign * dAngle;
        _trussGrp.add(d);
      }
    }

    // Pieds de support
    for (const lx of [xl, xr]) {
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, hy, 0.10), _legMat2);
      foot.position.set(lx, hy/2, tz);
      _trussGrp.add(foot);
      // Semelle au sol
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.30),
        new THREE.MeshStandardMaterial({ color:0x404860, roughness:0.5, metalness:0.6 }));
      base.position.set(lx, 0.02, tz);
      _trussGrp.add(base);
    }
  }
}

buildTrusses([
  { label:'Truss avant',   enabled:true, height:7.0, z:-3.8, x_l:-9, x_r:9 },
  { label:'Truss arrière', enabled:true, height:7.0, z:4.0,  x_l:-9, x_r:9 },
]);

// ─────────────────────────────────────────────────────────────────────────────
// Shaders — faisceau conique volumétrique
// ─────────────────────────────────────────────────────────────────────────────
const BEAM_VERT = `
  varying float vT;
  void main() {
    vT = uv.y;   // 0 = base (sol), 1 = tip (fixture)
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const BEAM_FRAG = `
  uniform vec3  uColor;
  uniform float uAlpha;
  varying float vT;
  void main() {
    // Dégradé quadratique : plus lumineux près de la source (tip)
    float fade = vT * vT * (3.0 - 2.0*vT);  // smoothstep
    gl_FragColor = vec4(uColor, uAlpha * fade);
  }
`;

function makeBeamMat(alpha) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(1,1,1) },
      uAlpha: { value: alpha },
    },
    vertexShader:   BEAM_VERT,
    fragmentShader: BEAM_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
    side:           THREE.DoubleSide,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Shader — tache au sol
// ─────────────────────────────────────────────────────────────────────────────
const POOL_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const POOL_FRAG = `
  uniform vec3      uColor;
  uniform float     uAlpha;
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;
  uniform float     uGoboRot;
  varying vec2      vUv;
  void main() {
    float d = length(vUv - vec2(0.5));
    if (d > 0.5) discard;
    float soft  = 1.0 - smoothstep(0.12, 0.50, d);
    float hot   = 1.0 - smoothstep(0.0,  0.14, d);
    float alpha = uAlpha * (soft + hot * 0.8);
    // Masque gobo avec rotation
    float c = cos(uGoboRot), s = sin(uGoboRot);
    vec2 uv0 = vUv - 0.5;
    vec2 uvR = vec2(c*uv0.x - s*uv0.y, s*uv0.x + c*uv0.y) + 0.5;
    float goboMask = mix(1.0, texture2D(uGoboTex, clamp(uvR, 0.001, 0.999)).r, uGoboBlend);
    gl_FragColor = vec4(uColor + hot*0.25, clamp(alpha * goboMask, 0.0, 1.0));
  }
`;

function makePoolMat() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:     { value: new THREE.Color(1,1,1) },
      uAlpha:     { value: 0.5 },
      uGoboTex:   { value: _goboTextures[0] },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
    },
    vertexShader:   POOL_VERT,
    fragmentShader: POOL_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Textures gobo (8 slots, dessinées en canvas)
// ─────────────────────────────────────────────────────────────────────────────
function _createGoboTexture(slot) {
  const size = 256, cx = 128, cy = 128, r = 124;
  const cv  = document.createElement('canvas');
  cv.width  = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#fff';
  switch(slot) {
    case 0: // Open — disque plein
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      break;
    case 1: // Anneau
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.52, 0, Math.PI*2); ctx.fill();
      break;
    case 2: // Étoile 4 branches
      ctx.save(); ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 - Math.PI/4;
        const rad = (i%2===0) ? r : r*0.32;
        i===0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
              : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
      break;
    case 3: // 3 cercles
      { const dr=r*0.28, of=r*0.52;
        for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/2;
          ctx.beginPath();ctx.arc(cx+Math.cos(a)*of,cy+Math.sin(a)*of,dr,0,Math.PI*2);ctx.fill();}}
      break;
    case 4: // 3 palmes (hélice)
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<3;i++){ctx.save();ctx.rotate((i/3)*Math.PI*2);
        ctx.beginPath();ctx.ellipse(0,-r*0.45,r*0.28,r*0.40,0,0,Math.PI*2);
        ctx.fill();ctx.restore();}
      ctx.restore();
      break;
    case 5: // Breakup (découpes angulaires)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      [0.05,0.22,0.40,0.58,0.75,0.90].forEach(s=>{
        ctx.beginPath();ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,s*Math.PI*2,(s+0.06)*Math.PI*2);
        ctx.closePath();ctx.fill();});
      break;
    case 6: // 6 secteurs rayonnants
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<6;i++){ctx.save();ctx.rotate((i/6)*Math.PI*2);
        ctx.fillRect(-r*0.075,-r,r*0.15,r);ctx.restore();}
      ctx.restore();
      break;
    case 7: // Bull's-eye (anneau + point central)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.68,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.30,0,Math.PI*2); ctx.fill();
      break;
  }
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return new THREE.CanvasTexture(cv);
}
const _goboTextures = Array.from({length:8}, (_,i) => _createGoboTexture(i));

// ─────────────────────────────────────────────────────────────────────────────
// Géométries template (unit — scalées à la volée)
// ─────────────────────────────────────────────────────────────────────────────
const GEO_UNIT_CONE_24 = new THREE.CylinderGeometry(0, 1, 1, 24, 1, true);
const GEO_UNIT_CONE_16 = new THREE.CylinderGeometry(0, 1, 1, 16, 1, true);
const GEO_UNIT_CONE_10 = new THREE.CylinderGeometry(0, 1, 1, 10, 1, true);
const GEO_UNIT_CIRCLE  = new THREE.CircleGeometry(1, 36);
const GEO_BODY_PAR     = new THREE.CylinderGeometry(0.16, 0.20, 0.44, 16);
const GEO_BODY_MH      = new THREE.CylinderGeometry(0.14, 0.17, 0.38, 16);
const GEO_LENS_PAR     = new THREE.CircleGeometry(0.13, 20);
const GEO_LENS_MH      = new THREE.CircleGeometry(0.10, 20);
const GEO_BAR_MH       = new THREE.BoxGeometry(0.80, 0.10, 0.14);  // mounting bar lyre

const MAT_BODY = new THREE.MeshStandardMaterial({ color:0x3a3a5a, roughness:0.28, metalness:0.72 });

// ─────────────────────────────────────────────────────────────────────────────
// Pool de fixtures
// ─────────────────────────────────────────────────────────────────────────────
const _fixtureGrp = new THREE.Group();
const _beamGrp    = new THREE.Group();
const _poolGrp    = new THREE.Group();
const _lightGrp   = new THREE.Group();
scene.add(_fixtureGrp, _beamGrp, _poolGrp, _lightGrp);

// Couleurs groupe (même mapping que QPainter)
const GROUP_COLOR = {
  face:'#ff8844', contre:'#4488ff', douche1:'#44cc88',
  douche2:'#ffcc44', douche3:'#ff4488', lat:'#aa55ff',
  lyre:'#ee44bb', barre:'#44aaff',
};

let _objs = [];   // un objet par projecteur
window.beamScale = 1.7;

function _getObj(i) {
  if (i < _objs.length) return _objs[i];

  // Outer haze cone
  const cHaze = new THREE.Mesh(GEO_UNIT_CONE_10, makeBeamMat(0.04));
  cHaze.renderOrder = 0; _beamGrp.add(cHaze);

  // Mid glow cone
  const cGlow = new THREE.Mesh(GEO_UNIT_CONE_16, makeBeamMat(0.10));
  cGlow.renderOrder = 1; _beamGrp.add(cGlow);

  // Main beam cone
  const cMain = new THREE.Mesh(GEO_UNIT_CONE_24, makeBeamMat(0.28));
  cMain.renderOrder = 2; _beamGrp.add(cMain);

  // Core (cœur très fin et brillant)
  const cCore = new THREE.Mesh(GEO_UNIT_CONE_10, makeBeamMat(0.65));
  cCore.renderOrder = 3; _beamGrp.add(cCore);

  // Tache au sol
  const pool = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pool.rotation.x = -Math.PI/2;
  pool.renderOrder = 0; _poolGrp.add(pool);

  // Halo au sol (large et très doux)
  const halo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  halo.rotation.x = -Math.PI/2;
  halo.renderOrder = 0; _poolGrp.add(halo);

  // ── PAR LED — modèle compact réaliste ────────────────────────────────
  const parGrp = new THREE.Group();

  const _parBodyMat = new THREE.MeshStandardMaterial({ color:0x1c1c28, roughness:0.50, metalness:0.62 });
  const _parChrMat2 = new THREE.MeshStandardMaterial({ color:0x404858, roughness:0.38, metalness:0.78 });
  const _parYokeMat = new THREE.MeshStandardMaterial({ color:0x222234, roughness:0.42, metalness:0.78 });

  // Collier omega de fixation truss
  const parOme = new THREE.Mesh(
    new THREE.TorusGeometry(0.090, 0.026, 8, 18, Math.PI),
    _parChrMat2.clone()
  );
  parOme.rotation.z = Math.PI;
  parOme.position.set(0, 0.062, 0);
  parGrp.add(parOme);

  // Barre de yoke supérieure
  const parYokeBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.068, 0.098),
    _parYokeMat.clone()
  );
  parYokeBar.userData.projoIndex = i;
  parGrp.add(parYokeBar);

  // Bras du yoke ×2
  for (const sx of [-0.238, 0.238]) {
    const parArm = new THREE.Mesh(
      new THREE.BoxGeometry(0.058, 0.38, 0.082),
      _parYokeMat.clone()
    );
    parArm.position.set(sx, -0.19, 0);
    parArm.userData.projoIndex = i;
    parGrp.add(parArm);
    // Arrondi en bas de bras
    const parElbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.040, 8, 7),
      _parYokeMat.clone()
    );
    parElbow.position.set(sx, -0.38, 0);
    parGrp.add(parElbow);
  }

  // Corps cylindrique principal (noir mat)
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.160, 0.166, 0.24, 22),
    _parBodyMat.clone()
  );
  body.userData.projoIndex = i;
  body.position.set(0, -0.175, 0);
  parGrp.add(body);

  // Bande de couleur de groupe (accent sur le corps)
  const groupRingMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.28, metalness: 0.55,
    emissive: new THREE.Color(0.2, 0.2, 0.2), emissiveIntensity: 0.5,
  });
  const groupRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.168, 0.168, 0.018, 22),
    groupRingMat
  );
  groupRing.position.set(0, -0.094, 0);
  parGrp.add(groupRing);

  // Bague chrome avant (autour de la lentille)
  const parFrontRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.182, 0.182, 0.030, 28),
    _parChrMat2.clone()
  );
  parFrontRing.position.set(0, -0.317, 0);
  parGrp.add(parFrontRing);

  // Goupilles de pivot ×2 (reliant bras au corps)
  for (const sx of [-0.200, 0.200]) {
    const pPin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.030, 0.030, 0.095, 10),
      _parChrMat2.clone()
    );
    pPin.rotation.z = Math.PI / 2;
    pPin.position.set(sx, -0.175, 0);
    parGrp.add(pPin);
  }

  // Lentille émissive (face -Y = bas)
  const lensMat = new THREE.MeshStandardMaterial({
    color:0x060614, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.158, 32), lensMat);
  lens.position.set(0, -0.333, 0);
  lens.rotation.x = -Math.PI / 2;
  lens.userData.projoIndex = i;
  parGrp.add(lens);

  parGrp.visible = false;
  _fixtureGrp.add(parGrp);

  // clamp kept as alias for backward compat (now inside parGrp)
  const clamp = parOme;

  // ── Moving Head (Lyre) — modèle doré réaliste ────────────────────────
  const mhGrp = new THREE.Group();

  const _mhGoldMat = new THREE.MeshStandardMaterial({ color:0xc09030, roughness:0.28, metalness:0.82 });
  const _mhChrMat  = new THREE.MeshStandardMaterial({ color:0x7080a0, roughness:0.38, metalness:0.80 });
  const _mhDarkMat2= new THREE.MeshStandardMaterial({ color:0x141420, roughness:0.55, metalness:0.50 });

  // Barre de montage supérieure (top du yoke)
  const mhBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.64, 0.088, 0.17),
    _mhGoldMat.clone()
  );
  mhBar.userData.projoIndex = i;
  mhGrp.add(mhBar);

  // Colliers omega ×2 (mordent sur le truss par le dessus)
  for (const sx of [-0.185, 0.185]) {
    const ome = new THREE.Mesh(
      new THREE.TorusGeometry(0.096, 0.027, 8, 18, Math.PI),
      _mhChrMat.clone()
    );
    ome.rotation.z = Math.PI;         // demi-tore ouvert vers le haut
    ome.position.set(sx, 0.065, 0);
    mhGrp.add(ome);
    // Vis de serrage de l'omega
    const bolt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.019, 0.019, 0.050, 8),
      _mhChrMat.clone()
    );
    bolt.position.set(sx, 0.180, 0);
    mhGrp.add(bolt);
  }

  // Bras du yoke ×2 (gauche & droite) — longueur divisée par 2
  for (const sx of [-0.252, 0.252]) {
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.076, 0.28, 0.112),
      _mhGoldMat.clone()
    );
    arm.position.set(sx, -0.18, 0);
    arm.userData.projoIndex = i;
    mhGrp.add(arm);
    // Arrondi en bout de bras
    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.053, 10, 8),
      _mhGoldMat.clone()
    );
    elbow.position.set(sx, -0.323, 0);
    mhGrp.add(elbow);
  }

  // ── Groupe tête (tilt — rotation X) ──────────────────────────────────
  const mhHGrp = new THREE.Group();
  mhHGrp.position.set(0, -0.35, 0);

  // Corps principal — frustum légèrement évasé vers l'arrière (haut = +Y)
  const mhHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.158, 0.212, 0.43, 26),
    _mhGoldMat.clone()
  );
  mhHead.userData.projoIndex = i;
  mhHGrp.add(mhHead);

  // Bandeau sombre entre corps et bague lentille
  const mhBand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.170, 0.170, 0.034, 26),
    _mhDarkMat2.clone()
  );
  mhBand.position.set(0, -0.196, 0);
  mhHGrp.add(mhBand);

  // Bague chrome autour de la lentille
  const mhRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.192, 0.192, 0.040, 30),
    _mhChrMat.clone()
  );
  mhRing.position.set(0, -0.232, 0);
  mhHGrp.add(mhRing);

  // Lentille émissive (face -Y = bas par défaut)
  const mhLensMat = new THREE.MeshStandardMaterial({
    color:0x060618, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const mhLens = new THREE.Mesh(new THREE.CircleGeometry(0.175, 32), mhLensMat);
  mhLens.position.set(0, -0.248, 0);
  mhLens.rotation.x = -Math.PI / 2;
  mhLens.userData.projoIndex = i;
  mhHGrp.add(mhLens);

  // Goupilles de pivot tilt ×2 (reliant tête aux bras du yoke)
  for (const sx of [-0.266, 0.266]) {
    const pin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.040, 0.040, 0.118, 12),
      new THREE.MeshStandardMaterial({ color:0x9098a4, roughness:0.16, metalness:0.97 })
    );
    pin.rotation.z = Math.PI / 2;
    pin.position.set(sx, 0.055, 0);
    mhHGrp.add(pin);
  }

  mhGrp.add(mhHGrp);
  mhGrp.visible = false;
  _fixtureGrp.add(mhGrp);

  // Point light au sol (éclaire le sol et les silhouettes)
  const ptLight = new THREE.PointLight(0xffffff, 0, 14, 1.8);
  _lightGrp.add(ptLight);

  const obj = { cHaze, cGlow, cMain, cCore, pool, halo, ptLight,
                body, lens, groupRing, parGrp,
                mhGrp, mhHGrp, mhHead, mhLens };
  _objs.push(obj);
  return obj;
}

    }
  }
  _selectedProjo = idx;
  if (idx >= 0 && idx < _objs.length) {
    const cur = _objs[idx];
    cur.body.material.emissive.setHex(0x0055aa);
    cur.body.material.emissiveIntensity = 1.2;
    cur.mhHead.material.emissive.setHex(0x0055aa);
    cur.mhHead.material.emissiveIntensity = 1.2;
    if (cur.groupRing) {

      cur.groupRing.material.emissiveIntensity = 2.5;   // clignotant bleu visible
    }

};

renderer.domElement.addEventListener('pointerdown', (e) => {
  _ptrDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!_ptrDownPos) return;
  const dx = e.clientX - _ptrDownPos.x;
  const dy = e.clientY - _ptrDownPos.y;
  _ptrDownPos = null;
  if (Math.sqrt(dx*dx + dy*dy) > 6) return;   // c'était un drag, pas un clic

  const rect = renderer.domElement.getBoundingClientRect();
  _mouse2D.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  _mouse2D.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_mouse2D, camera);

  const hits = _raycaster.intersectObjects(_fixtureGrp.children, true);
  let idx = -1;
  for (const h of hits) {
    if (h.object.userData.projoIndex !== undefined) {
      idx = h.object.userData.projoIndex;
      break;
    }
  }
  window.highlightProjo(idx);
  if (window._bridge) window._bridge.projoSelected(idx);
});

// ─────────────────────────────────────────────────────────────────────────────
// Calcul direction faisceau (miroir exact du code Python)
// ─────────────────────────────────────────────────────────────────────────────
function beamFloor(p) {
  const hy  = p.fixture_height ?? 7.0;
  const isMH = p.fixture_type === 'Moving Head';
  if (isMH) {
    const panA  = (p.pan  - 32768) / 32768.0 * Math.PI;
    const theta = (p.tilt - 32768) / 32768.0 * Math.PI * 0.75;
    const rx    = (p.rot3d_x || 0) * Math.PI / 180;
    // Tilt effectif après rotation globale X : teff = theta - rx
    const teff  = theta - rx;
    const bx = Math.sin(panA) * Math.sin(teff);
    const by = -Math.cos(teff);
    const bz = Math.cos(panA) * Math.sin(teff);
    // Hauteur de la lentille : compense la rotation globale
    const lensY = hy - 0.60 * Math.cos(rx);
    const goingUp = by > 0.05;
    let t;
    if      (by < -0.05)  t = Math.min(lensY / (-by), 10.0);
    else if (goingUp)     t = Math.min((15.0 - lensY) / by, 15.0);
    else                  t = 10.0;
    return {
      fx: Math.max(-11, Math.min(11, p.x + bx*t)),
      fz: Math.max(-8,  Math.min(13, p.z + bz*t)),
      lensY, bx, by, bz, isMH, goingUp,
    };
  } else {
    const lensY = hy - 0.333;
    const ry    = (p.rot3d_y ?? 0) * Math.PI / 180;  // pan — pivot horizontal
    const rx    = (p.rot3d_x ?? 0) * Math.PI / 180;  // tilt — inclinaison depuis nadir
    const bx    = Math.sin(ry) * Math.sin(rx);
    const by    = -Math.cos(rx);
    const bz    = Math.cos(ry) * Math.sin(rx);
    const goingUp = by > 0.05;
    const t = by < -0.05 ? Math.min(lensY / (-by), 12.0)
            : goingUp    ? Math.min((15.0 - lensY) / by, 15.0)
            :               12.0;
    return {
      fx: Math.max(-11, Math.min(11, p.x + bx * t)),
      fz: Math.max(-8,  Math.min(13, p.z + bz * t)),
      lensY, bx, by, bz, isMH: false, goingUp,
    };
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Positionner / orienter un cône unit entre deux points
// ─────────────────────────────────────────────────────────────────────────────
const _vUp  = new THREE.Vector3(0, 1, 0);
const _vDir = new THREE.Vector3();
const _qTmp = new THREE.Quaternion();

function orientCone(mesh, tipX, tipY, tipZ, baseX, baseY, baseZ, rScale) {
  const dx = baseX - tipX, dy = baseY - tipY, dz = baseZ - tipZ;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (len < 0.05) { mesh.visible = false; return; }
  // direction de la base vers le tip (= haut local du cylindre)
  _vDir.set(-dx/len, -dy/len, -dz/len);
  _qTmp.setFromUnitVectors(_vUp, _vDir);
  mesh.position.set((tipX+baseX)/2, (tipY+baseY)/2, (tipZ+baseZ)/2);
  mesh.quaternion.copy(_qTmp);
  mesh.scale.set(rScale, len, rScale);
  mesh.visible = true;
}

// ─────────────────────────────────────────────────────────────────────────────
// updateScene — appelé depuis Python via runJavaScript
// ─────────────────────────────────────────────────────────────────────────────
window.updateScene = function(projectors) {
  const bs = window.beamScale;

  for (let i = 0; i < projectors.length; i++) {
    const p   = projectors[i];
    const obj = _getObj(i);
    const lvl = Math.max(0, Math.min(1, p.level / 100.0));
    const r = p.r/255, g = p.g/255, b = p.b/255;
    const col = new THREE.Color(r, g, b);
    const hy  = p.fixture_height ?? 7.0;
    const bf  = beamFloor(p);
    const { fx, fz, lensY, isMH, goingUp } = bf;

    // ── Corps de fixture ─────────────────────────────────────────────
    if (isMH) {
      // Cache le groupe PAR
      obj.parGrp.visible = false;

      // Positionne + oriente le Moving Head
      const panA  = (p.pan  - 32768) / 32768.0 * Math.PI;
      const theta = (p.tilt - 32768) / 32768.0 * Math.PI * 0.75;
      const rx    = (p.rot3d_x || 0) * Math.PI / 180;
      obj.mhGrp.position.set(p.x, hy, p.z);
      obj.mhGrp.rotation.x  = rx;
      obj.mhGrp.rotation.y  = panA;
      obj.mhGrp.rotation.z  = (p.rot3d_z || 0) * Math.PI / 180;
      obj.mhHGrp.rotation.x = -theta;
      obj.mhGrp.visible = _flags.fixtures;

      // Lentille MH émissive
      if (lvl > 0) {
        const bright = col.clone().multiplyScalar(1.0 + lvl * 1.5);
        obj.mhLens.material.emissive.copy(bright);
        obj.mhLens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.mhLens.material.emissive.set(0, 0, 0);
        obj.mhLens.material.emissiveIntensity = 0;
      }
    } else {
      // Cache le groupe MH
      obj.mhGrp.visible = false;

      // ── Groupe PAR LED ───────────────────────────────────────────
      obj.parGrp.position.set(p.x, hy, p.z);
      obj.parGrp.rotation.x = (p.rot3d_x ?? 0) * Math.PI / 180;
      obj.parGrp.rotation.y = (p.rot3d_y ?? 0) * Math.PI / 180;
      obj.parGrp.visible = _flags.fixtures;

      // Bande de couleur de groupe (accent toujours visible)
      const gcHex = GROUP_COLOR[p.group] ?? '#5577aa';
      if (i !== _selectedProjo) {   // ne pas écraser le surlignage de sélection
        obj.groupRing.material.color.set(gcHex);
        obj.groupRing.material.emissive.set(gcHex);
        obj.groupRing.material.emissiveIntensity = 0.6;
      }

      // Lentille émissive
      if (lvl > 0) {
        const bright = col.clone().multiplyScalar(1.0 + lvl * 1.5);
        obj.lens.material.emissive.copy(bright);
        obj.lens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.lens.material.emissive.set(0, 0, 0);
        obj.lens.material.emissiveIntensity = 0;
      }
    }

    // ── Faisceaux ────────────────────────────────────────────────────
    if (lvl > 0.03) {
      const base_r = (0.22 + 2.0 * lvl) * bs;
      const fx2 = fx, fz2 = fz;

      const baseY = goingUp ? 14.5 : 0.03;

      // Haze extérieur (très large, très transparent)
      orientCone(obj.cHaze, p.x, lensY, p.z, fx2, baseY, fz2, base_r * 3.0);
      obj.cHaze.material.uniforms.uColor.value.copy(col);
      obj.cHaze.material.uniforms.uAlpha.value = 0.04 * lvl;

      // Glow intermédiaire
      orientCone(obj.cGlow, p.x, lensY, p.z, fx2, baseY, fz2, base_r * 1.8);
      obj.cGlow.material.uniforms.uColor.value.copy(col);
      obj.cGlow.material.uniforms.uAlpha.value = 0.11 * lvl;

      // Faisceau principal
      orientCone(obj.cMain, p.x, lensY, p.z, fx2, baseY, fz2, base_r * 1.0);
      obj.cMain.material.uniforms.uColor.value.copy(col);
      obj.cMain.material.uniforms.uAlpha.value = 0.32 * lvl;

      // Cœur brillant (très fin)
      orientCone(obj.cCore, p.x, lensY, p.z, fx2, baseY, fz2, base_r * 0.28);
      obj.cCore.material.uniforms.uColor.value.copy(col);
      obj.cCore.material.uniforms.uAlpha.value = 0.80 * lvl;

      if (!goingUp) {
        // Tache principale au sol (avec gobo)
        const goboSlot  = Math.min(7, Math.floor(((p.gobo || 0) / 256) * 8));
        const goboBlend = goboSlot > 0 ? 1.0 : 0.0;
        const goboRot   = ((p.gobo_rotation || 0) / 255.0) * Math.PI * 2;
        const poolR = (0.35 + 2.2*lvl) * bs;
        obj.pool.position.set(fx2, 0.02, fz2);
        obj.pool.scale.setScalar(poolR);
        obj.pool.material.uniforms.uColor.value.copy(col);
        obj.pool.material.uniforms.uAlpha.value = 0.70 * lvl;
        obj.pool.material.uniforms.uGoboTex.value   = _goboTextures[goboSlot];
        obj.pool.material.uniforms.uGoboBlend.value = goboBlend;
        obj.pool.material.uniforms.uGoboRot.value   = goboRot;
        obj.pool.visible = true;

        // Halo diffus au sol (plus large)
        obj.halo.position.set(fx2, 0.015, fz2);
        obj.halo.scale.setScalar(poolR * 2.8);
        obj.halo.material.uniforms.uColor.value.copy(col);
        obj.halo.material.uniforms.uAlpha.value = 0.15 * lvl;
        obj.halo.visible = true;

        // Point light au sol
        obj.ptLight.color.copy(col);
        obj.ptLight.intensity = lvl * 4.5;
        obj.ptLight.position.set(fx2, 0.4, fz2);
      } else {
        // Faisceau montant — pas de tache au sol
        obj.pool.visible = false;
        obj.halo.visible = false;
        // Point light dans le faisceau montant
        obj.ptLight.color.copy(col);
        obj.ptLight.intensity = lvl * 3.0;
        obj.ptLight.position.set(fx2, Math.min(lensY + 4.0, 13.0), fz2);
      }
      obj.ptLight.visible = true;

    } else {
      obj.cHaze.visible = obj.cGlow.visible =
      obj.cMain.visible = obj.cCore.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
    }
  }

  // Masquer les slots inutilisés
  for (let i = projectors.length; i < _objs.length; i++) {
    const o = _objs[i];
    o.cHaze.visible = o.cGlow.visible = o.cMain.visible = o.cCore.visible =
    o.pool.visible  = o.halo.visible  = o.ptLight.visible = false;
    o.parGrp.visible = false;
    o.mhGrp.visible  = false;
  }
};

const _SILO_MAT = new THREE.MeshStandardMaterial({ color:0x0d0d1a, roughness:0.95, metalness:0.0 });

function _makePersonSilhouette(x, z, hScale = 1.0) {
  const g = new THREE.Group();
  const h = 1.75 * hScale;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.20, h * 0.55, 4, 8), _SILO_MAT);
  body.position.set(0, h * 0.55, 0);
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17 * hScale, 10, 7), _SILO_MAT);
  head.position.set(0, h * 1.02, 0);
  g.add(head);
  g.position.set(x, 0, z);
  return g;
}

function _makeDJBooth(x, z) {
  const g = new THREE.Group();
  const matBody = new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:0.6, metalness:0.3 });
  const matTop  = new THREE.MeshStandardMaterial({ color:0x2a2a3e, roughness:0.3, metalness:0.6 });
  const matCDJ  = new THREE.MeshStandardMaterial({ color:0x0a0a14, roughness:0.2, metalness:0.85 });
  const facade  = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.85, 0.55), matBody);
  facade.position.set(0, 0.42, 0); g.add(facade);
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.55), matTop);
  top.position.set(0, 0.88, 0); g.add(top);
  for (const dx of [-0.60, 0.60]) {
    const cdj = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.05, 20), matCDJ);
    cdj.position.set(dx, 0.93, 0); g.add(cdj);
    const platter = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.14, 0.01, 20),
      new THREE.MeshStandardMaterial({ color:0x222233, emissive:0x001133, emissiveIntensity:0.5, roughness:0.1 })
    );
    platter.position.set(dx, 0.96, 0); g.add(platter);
  }
  const mixer = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.07, 0.45), matCDJ);
  mixer.position.set(0, 0.94, 0); g.add(mixer);
  for (const [dx, col] of [[-0.15, 0x00ff88], [0, 0xff2200], [0.15, 0x0088ff]]) {
    const led = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.01, 0.02),
      new THREE.MeshStandardMaterial({ emissive:col, emissiveIntensity:1.5, color:col })
    );
    led.position.set(dx, 0.985, -0.05); g.add(led);
  }
  g.position.set(x, 0, z);
  return g;
}

function _makeBackline() {
  const g = new THREE.Group();
  const matAmp = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.9, metalness:0.1 });
  for (const [x, w, h] of [[-5.0, 0.8, 1.30], [-5.8, 0.8, 0.70], [5.0, 0.8, 1.30], [5.8, 0.8, 0.70]]) {
    const amp = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), matAmp);
    amp.position.set(x, h / 2, 2.5); g.add(amp);
  }
  return g;
}

      { label:'Truss milieu',  enabled:true, height:7.5, z: 0.0, x_l: -9.0, x_r: 9.0 },
      { label:'Truss arrière', enabled:true, height:7.0, z: 5.0, x_l: -9.0, x_r: 9.0 },
    ],
    buildProps() {
      for (const [x, z] of [[-3.5, 0], [-1.5, -0.5], [0, 0.5], [1.5, -0.5], [3.5, 0]])
        _propsGrp.add(_makePersonSilhouette(x, z));
      _propsGrp.add(_makeBackline());
    }
  },
  club: {
    trusses: [
      { label:'Rig central', enabled:true, height:4.5, z: 0.0, x_l:-5.0, x_r:5.0 },
      { label:'Truss avant', enabled:true, height:4.0, z:-3.0, x_l:-7.0, x_r:7.0 },
    ],
    buildProps() {
      _propsGrp.add(_makeDJBooth(0, -1.5));
      _propsGrp.add(_makePersonSilhouette(0, -0.5));
    }
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// Import de scène GLTF/GLB depuis Python (base64)
// ─────────────────────────────────────────────────────────────────────────────
const _gltfLoader    = new GLTFLoader();
const _importedGrp   = new THREE.Group();
scene.add(_importedGrp);

window.loadGLTF = function(b64, isGLB) {
  // Décode base64 → ArrayBuffer
  const bin    = atob(b64);
  const bytes  = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buffer = bytes.buffer;

  _gltfLoader.parse(buffer, '', (gltf) => {
    _importedGrp.clear();
    // Centre + normalise la scène importée
    const box    = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = maxDim > 0.01 ? 12.0 / maxDim : 1.0;
    gltf.scene.position.sub(center.multiplyScalar(scale));
    gltf.scene.scale.setScalar(scale);
    _importedGrp.add(gltf.scene);
  }, (err) => console.error('GLTF import error:', err));
};

window.clearImportedScene = function() { _importedGrp.clear(); };

window.setBloom = function(strength) {
  if (window.bloomPass) window.bloomPass.strength = strength;
  _flags.bloom = strength > 0;
};

window.setScenePreset = function(name) {
  const preset = SCENE_PRESETS[name];
  if (!preset) return;
  _propsGrp.clear();
  buildTrusses(preset.trusses);
  preset.buildProps();
  window.currentTrusses = JSON.parse(JSON.stringify(preset.trusses));
};

// ── Activer preset live par défaut ──
window.setScenePreset('live');

// ─────────────────────────────────────────────────────────────────────────────
// QWebChannel — communication JS → Python
// ─────────────────────────────────────────────────────────────────────────────
if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    window._bridge = channel.objects.bridge;
  });
}

</script>
