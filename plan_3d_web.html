    // Toute modification ici doit être répercutée sur `parGrp` dans
    // updateScene(), et réciproquement.
    const bx = -Math.sin(ry) * Math.sin(rx);
    const by = -Math.cos(rx);
    const bz = -Math.cos(ry) * Math.sin(rx);
    // La lentille SUIT le corps : elle est à 33 cm de l'accroche le long de
    // l'axe d'émission, et non bêtement à la verticale en dessous. Sans ça, un
    // PAR retourné vers le haut gardait sa lueur de lentille et le départ de
    // son cône SOUS lui. Même traitement que la lyre, qui fait déjà passer la
    // position de lentille par sa propre chaîne de rotations.
    const L = 0.333 * fs;
    const lensX = p.x + bx * L, lensY = hy + by * L, lensZ = p.z + bz * L;
    const goingUp = by > 0.05;
    // Même borne unique que pour les lyres — voir le commentaire plus haut :
    // trois bornes différentes (12 / 15 / 12) faisaient sauter la longueur au
    // franchissement de l'horizontale.
    const t = by < 0 ? Math.min(lensY / (-by), BEAM_TMAX)
            : by > 0 ? Math.min((15.0 - lensY) / by, BEAM_TMAX)
            :          BEAM_TMAX;
    return Object.assign(_beamEnd(lensX, lensY, lensZ, bx, by, bz, t),
                         { lensX, lensY, lensZ, bx, by, bz, isMH: false, goingUp });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Positionner / orienter un cône unit entre deux points
// ─────────────────────────────────────────────────────────────────────────────
const _vUp  = new THREE.Vector3(0, 1, 0);
const _vDir = new THREE.Vector3();
const _qTmp = new THREE.Quaternion();

function orientCone(mesh, tipX, tipY, tipZ, baseX, baseY, baseZ, rScale) {
  const dx = baseX - tipX, dy = baseY - tipY, dz = baseZ - tipZ;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (len < 0.05) { mesh.visible = false; return; }
  // direction de la base vers le tip (= haut local du cylindre)
  _vDir.set(-dx/len, -dy/len, -dz/len);
  _qTmp.setFromUnitVectors(_vUp, _vDir);
  mesh.position.set((tipX+baseX)/2, (tipY+baseY)/2, (tipZ+baseZ)/2);
  mesh.quaternion.copy(_qTmp);
  mesh.scale.set(rScale, len, rScale);
  mesh.visible = true;
}

// ─────────────────────────────────────────────────────────────────────────────
// updateScene — appelé depuis Python via runJavaScript
// ─────────────────────────────────────────────────────────────────────────────
// Buffers pré-alloués — évite ~600 allocations Color/s qui déclenchent le GC
const _colBuf = new THREE.Color();
const _briBuf = new THREE.Color();

// ─────────────────────────────────────────────────────────────────────────────
// Inertie pan/tilt
// ─────────────────────────────────────────────────────────────────────────────
// Python ne pousse une trame que toutes les ~50 ms (le débounce de
// `Plan3DWebWindow.refresh()`), alors que la scène est rendue à 60 images/s.
// Une lyre pilotée par un effet de MOUVEMENT sautait donc de palier en palier,
// et dès que l'oscillation approche la moitié de cette cadence les paliers se
// replient sur deux poses : la tête a l'air de basculer d'une position à
// l'autre au lieu de balayer (« ça bouge, mais c'est tout ou rien »).
//
// La trame reçue porte donc désormais la CIBLE ; l'affichage la rattrape image
// par image. C'est aussi ce que fait un vrai appareil : une tête mobile a de
// l'inertie, elle ne se téléporte pas d'un pas de DMX au suivant.
//
// ⚠️ La cible vit dans l'objet de scène (`_panT`/`_tiltT`), JAMAIS dans la
// trame : `updateScene` écrase `p.pan`/`p.tilt` par la valeur lissée pour que
// TOUT l'aval (corps, `beamFloor`, tache au sol) reste cohérent, et la passe
// d'animation relit la même trame.
const PT_TAU = 0.055;     // constante de temps du rattrapage, en secondes
const PT_EPS = 30;        // seuil d'arrêt sur 65535 (≈ 0,12° de course)
let _lastScene = null;    // dernière trame reçue de Python
let _ptPrev    = 0;       // horodatage de la dernière avance (ms)

function _tickPanTilt(dt) {
  // Avance toutes les positions lissées ; rend true s'il en reste une en route.
  const k = 1 - Math.exp(-dt / PT_TAU);
  let moving = false;
  for (let i = 0; i < _objs.length; i++) {
    const o = _objs[i];
    if (o._panS === undefined) continue;   // slot jamais alimenté (ou pixel)
    const dp = o._panT - o._panS;
    const dq = o._tiltT - o._tiltS;
    if (Math.abs(dp) < PT_EPS && Math.abs(dq) < PT_EPS) {
      o._panS = o._panT; o._tiltS = o._tiltT;
      o._ptMoving = false;
      continue;
    }
    o._panS  += dp * k;
    o._tiltS += dq * k;
    o._ptMoving = true;
    moving = true;
  }
  return moving;
}

// `_anim` : passe d'animation déclenchée par la boucle de rendu. Elle rejoue la
// DERNIÈRE trame pour les seuls appareils encore en mouvement — les autres ne
// coûtent rien, et la scène n'est pas reconstruite 60 fois par seconde.
window.updateScene = function(projectors, _anim) {
  const bs = window.beamScale;
  if (!_anim) _lastScene = projectors;

  for (let i = 0; i < projectors.length; i++) {
    const p   = projectors[i];
    const obj = _getObj(i);
    // Passe d'animation : seuls les appareils dont la tête bouge encore.
    if (_anim && !obj._ptMoving) continue;

    // ── Barre/matrice : rendu per-pixel (cellule légère, pas de corps/faisceau) ──
    if (p.is_pixel || p.is_master) {
      // Masquer les formes « fixture classique » de ce slot
      obj.parGrp.visible = obj.mhGrp.visible = false;
      obj.cVol.visible = obj.lensGlow.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
      obj._fx = null;
      if (obj._mach) _machStop(obj);

      if (p.is_master) {                 // canaux globaux : aucune forme
        obj.pxCell.visible = false;
        obj.pxGlow.visible = false; obj.pxHalo.visible = false;
        obj.pxHousing.visible = false;
        continue;
      }
      const plvl = Math.max(0, Math.min(1, p.level / 100.0));
      const hy   = p.fixture_height ?? 7.0;

      // Boîtier de la barre (seul le représentant porte `housing`)
      if (p.housing) {
        const h = p.housing;
        obj.pxHousing.visible = _flags.fixtures;
        obj.pxHousing.position.set(h.cx, hy + 0.02, h.cz);
        obj.pxHousing.rotation.y = -h.angle;      // aligne l'axe X sur la barre
        // Seule la SECTION du boîtier suit la taille : sa longueur est celle
        // de la barre réelle, déduite du patch. La rétrécir mentirait sur
        // l'encombrement de l'appareil au lieu de l'ajuster.
        const _hs = 0.11 * (p.fixture_scale ?? 1.0);
        obj.pxHousing.scale.set(Math.max(0.2, h.len), _hs, _hs);
      } else {
        obj.pxHousing.visible = false;
      }

      obj.pxCell.visible = true;
      obj.pxCell.position.set(p.x, hy, p.z);
      _colBuf.setRGB(p.r/255, p.g/255, p.b/255);
      obj.pxCell.material.color.copy(_colBuf).multiplyScalar(0.25);
      obj.pxCell.material.emissive.copy(_colBuf);
      // Émissif un peu plus fort : le bloom de la scène crée le glow diffus
      obj.pxCell.material.emissiveIntensity = plvl > 0 ? (0.5 + plvl * 3.6) : 0;
      // Nappe wash au sol : couche proche + halo large et très doux
      if (plvl > 0.02) {
        obj.pxGlow.visible = true;
        obj.pxGlow.position.set(p.x, 0.02, p.z);
        obj.pxGlow.scale.setScalar((0.45 + 1.1 * plvl) * bs);   // plus large
        obj.pxGlow.material.uniforms.uColor.value.copy(_colBuf);
        obj.pxGlow.material.uniforms.uAlpha.value = 0.42 * plvl * window.glowGain;
        obj.pxHalo.visible = true;
        obj.pxHalo.position.set(p.x, 0.012, p.z);
        obj.pxHalo.scale.setScalar((0.45 + 1.1 * plvl) * bs * 2.6);
        obj.pxHalo.material.uniforms.uColor.value.copy(_colBuf);
        obj.pxHalo.material.uniforms.uAlpha.value = 0.13 * plvl * window.glowGain;
      } else {
        obj.pxGlow.visible = false;
        obj.pxHalo.visible = false;
      }
      continue;
    }
    // Slot redevenu une fixture classique : cacher les cellules pixel
    obj.pxCell.visible = false;
    obj.pxGlow.visible = false;
    obj.pxHalo.visible = false;
    obj.pxHousing.visible = false;

    // ── Machine à effet : de la matière, jamais un faisceau ──────────────
    // `p.machine` vaut 'fog', 'haze', 'spark' ou 'flame' — le genre est décidé
    // côté Python (core.FX_MACHINE_KIND), la scène n'a pas à connaître le
    // vocabulaire des types de fixtures.
    if (p.machine) {
      obj.parGrp.visible = obj.mhGrp.visible = false;
      obj.cVol.visible   = obj.lensGlow.visible = false;
      obj.pool.visible   = obj.halo.visible = false;
      for (let k = 0; k < obj.prismBeams.length; k++) {
        obj.prismBeams[k].visible = false;
        obj.prismPools[k].visible = false;
      }
      obj._fx = null;

      const mk = _machEnsure(obj, p.machine);
      const my = p.fixture_height ?? 0.12;
      const fs = p.fixture_scale ?? 1.0;
      const mrx = (p.rot3d_x || 0) * Math.PI / 180;
      const mry = (p.rot3d_y ?? 0) * Math.PI / 180;
      const mrz = (p.rot3d_z || 0) * Math.PI / 180;

      if (!obj.machBody || obj.machKind !== p.machine) {
        if (obj.machBody) obj.machGrp.remove(obj.machBody);
        obj.machBody = _makeMachineBody(p.machine);
        // Cliquable dans la scène, comme n'importe quelle fixture.
        obj.machBody.traverse(function (o2) {
          if (o2.isMesh) o2.userData.projoIndex = i;
        });
        obj.machGrp.add(obj.machBody);
        obj.machKind = p.machine;
      }
      obj.machGrp.position.set(p.x, my, p.z);
      obj.machGrp.rotation.set(mrx, mry, mrz, 'YXZ');
      obj.machGrp.scale.setScalar(fs);
      obj.machGrp.visible = _flags.fixtures;

      // Buse et axe du jet, en repère MONDE : c'est de là que partent les
      // particules, et c'est l'inclinaison de la machine qui donne la
      // direction. La gravité, elle, reste verticale (cf. _tickMachines).
      _machE.set(mrx, mry, mrz, 'YXZ');
      _machQ.setFromEuler(_machE);
      mk.qx = _machQ.x; mk.qy = _machQ.y; mk.qz = _machQ.z; mk.qw = _machQ.w;
      _machV.set(0, (MACHINE_NOZZLE_Y[p.machine] ?? 0.30) * fs, 0)
            .applyQuaternion(_machQ);
      mk.ox = p.x + _machV.x;
      mk.oy = my  + _machV.y;
      mk.oz = p.z + _machV.z;
      mk.level = Math.max(0, Math.min(1, p.level / 100.0));

      // Une gerbe et une flamme ÉCLAIRENT : c'est même souvent leur vraie
      // fonction sur un plateau. Sans cette lumière, la 3D montrait une gerbe
      // qui brille toute seule au milieu du noir, sans un reflet au sol. La
      // fumée, elle, n'émet rien — elle ne fait que révéler les faisceaux.
      const _emit = (p.machine === 'spark' || p.machine === 'flame');
      obj.ptLight.visible = _emit && mk.level > 0.02;
      if (obj.ptLight.visible) {
        // Source au cœur du jet (le jet a grandi de ×PYRO_JET_SCALE) : restée
        // à 35 cm de la buse, elle éclairait le pied d'une flamme de 5 m.
        obj.ptLight.position.set(mk.ox, mk.oy + 0.35 * PYRO_JET_SCALE, mk.oz);
        obj.ptLight.color.setRGB(1.0,
                                 p.machine === 'spark' ? 0.72 : 0.48,
                                 p.machine === 'spark' ? 0.34 : 0.14);
        obj.ptLight.intensity = 4.5 * mk.level;
        obj.ptLight.distance  = 14.0;
      } else {
        obj.ptLight.intensity = 0;
      }
      continue;
    }
    // Slot redevenu un projecteur : couper la machine du slot précédent.
    if (obj._mach) _machStop(obj);

    // Position lissée : la trame porte la cible, l'affichage la rattrape
    // (cf. _tickPanTilt). Écrit dans `p` pour que le corps, `beamFloor()` et
    // la tache au sol partent tous de la même valeur.
    if (obj._panS === undefined) { obj._panS = p.pan; obj._tiltS = p.tilt; }
    if (!_anim) { obj._panT = p.pan; obj._tiltT = p.tilt; }
    p.pan = obj._panS; p.tilt = obj._tiltS;

    // Projecteur sélectionné dans le tableau : on le force allumé en blanc,
    // à pleine puissance. C'est ce qui permet de le repérer d'un coup d'œil
    // dans la scène, même s'il est éteint dans le show — cas le plus fréquent
    // quand on cherche « lequel est-ce ? ». Le clignotement est appliqué par
    // animate(), image par image (voir _selBlink).
    const _isSel = _selSet.has(i);
    const lvl = _isSel ? 1.0 : Math.max(0, Math.min(1, p.level / 100.0));
    const r = _isSel ? 1.0 : p.r/255,
          g = _isSel ? 1.0 : p.g/255,
          b = _isSel ? 1.0 : p.b/255;
    _colBuf.setRGB(r, g, b);
    const hy  = p.fixture_height ?? 7.0;
    const bf  = beamFloor(p);
    const { fx, fy, fz, lensX, lensY, lensZ, isMH, goingUp, hitsFloor } = bf;

    // ── Corps de fixture ─────────────────────────────────────────────
    if (isMH) {
      // Cache le groupe PAR
      obj.parGrp.visible = false;

      // Positionne + oriente le Moving Head
      // MÊME conversion que beamFloor() — cf. ptAngles(). Corps et
      // faisceau DOIVENT sortir du même calcul, sinon le cône part à côté
      // de la lentille.
      const _pt2   = ptAngles(p);
      const panDmx = _pt2.pan;
      const theta  = _pt2.tilt;
      const rx    = (p.rot3d_x || 0) * Math.PI / 180;
      obj.mhGrp.position.set(p.x, hy, p.z);
      // Le groupe est mis à l'échelle depuis son ORIGINE, qui est le point
      // d'accroche : réduire l'appareil ne le décroche pas de la structure,
      // il rapetisse vers le haut. Les décalages internes correspondants sont
      // repris dans beamFloor() (constante `fs`).
      obj.mhGrp.scale.setScalar(p.fixture_scale ?? 1.0);
      // mhGrp = ACCROCHE (rig) : RX / RY / RZ, immobiles pendant le show.
      // mhYoke = PAN DMX, mhHGrp = TILT DMX. La chaîne complète est donc
      //   Rx·Ry(RY)·Rz  ·  Ry(pan)  ·  Rx(-tilt)
      // et non plus Rx·Ry(pan)·Rz, qui plaçait le ROULIS À L'INTÉRIEUR du
      // pan : le roulis tournait avec le yoke au lieu d'appartenir au socle.
      // C'est ce qui rendait le pan aberrant sur toute lyre ayant RZ ≠ 0.
      // beamFloor() reproduit cet ordre à l'identique — les deux doivent
      // rester synchronisés.
      obj.mhGrp.rotation.x  = rx;
      obj.mhGrp.rotation.y  = (p.rot3d_y ?? 0) * Math.PI / 180;
      obj.mhGrp.rotation.z  = (p.rot3d_z || 0) * Math.PI / 180;
      obj.mhYoke.rotation.y = panDmx;
      obj.mhHGrp.rotation.x = -theta;
      obj.mhGrp.visible = _flags.fixtures;

      // Lentille MH émissive
      if (lvl > 0) {
        _briBuf.copy(_colBuf).multiplyScalar(1.0 + lvl * 1.5);
        obj.mhLens.material.emissive.copy(_briBuf);
        obj.mhLens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.mhLens.material.emissive.set(0, 0, 0);
        obj.mhLens.material.emissiveIntensity = 0;
      }
    } else {
      // Cache le groupe MH
      obj.mhGrp.visible = false;

      // ── Groupe PAR LED ───────────────────────────────────────────
      obj.parGrp.position.set(p.x, hy, p.z);
      obj.parGrp.scale.setScalar(p.fixture_scale ?? 1.0);   // cf. mhGrp
      // Ordre d'Euler 'YXZ', posé à la construction du groupe : Ry(pan) puis
      // Rx(tilt), la chaîne que `beamFloor()` reproduit à l'identique.
      obj.parGrp.rotation.x = (p.rot3d_x ?? 0) * Math.PI / 180;
      obj.parGrp.rotation.y = (p.rot3d_y ?? 0) * Math.PI / 180;
      obj.parGrp.visible = _flags.fixtures;

      // Bande de couleur de groupe (accent toujours visible)
      const gcHex = GROUP_COLOR[p.group] ?? '#5577aa';
      if (i !== _selectedProjo) {   // ne pas écraser le surlignage de sélection
        obj.groupRing.material.color.set(gcHex);
        obj.groupRing.material.emissive.set(gcHex);
        obj.groupRing.material.emissiveIntensity = 0.6;
      }

      // Galette de LED émissive. Dosage plus sage que la lyre juste au-dessus :
      // en ACESFilmic, tout ce qui dépasse ~2 vire au blanc, et sur quatorze
      // petites lentilles ça se voyait — un PAR rouge à fond rendait une
      // constellation de billes BLANCHES dans un halo rouge. La couleur n'est
      // plus amplifiée (elle porte la teinte), seule l'intensité monte.
      if (lvl > 0) {
        obj.lens.material.emissive.copy(_colBuf);
        obj.lens.material.emissiveIntensity = 0.55 + lvl * 1.55;
      } else {
        obj.lens.material.emissive.set(0, 0, 0);
        obj.lens.material.emissiveIntensity = 0;
      }
    }

    // ── Faisceaux ────────────────────────────────────────────────────
    if (lvl > 0.03) {
      // WASH (PAR LED) vs BEAM (lyre spot). Un PAR est une nappe large et
      // douce SANS cœur défini ; une lyre est un faisceau serré et punchy.
      const isWash = p.fixture_type === 'PAR LED';
      // Zoom DMX → largeur du faisceau (uniquement si le projo a un canal Zoom,
      // sinon zoom=0 rétrécirait tout). 0 = serré, 255 = large.
      const _zoomF = p.has_zoom ? (0.6 + (p.zoom / 255) * 1.6) : 1.0;
      // Ouverture réglée à la main (colonne « Angle » du tableau) : elle se
      // compose avec le zoom DMX au lieu de le remplacer. Un projecteur sans
      // canal Zoom n'a que ce réglage ; une lyre qui zoome garde sa course,
      // recentrée autour de l'ouverture choisie.
      const _angF  = Math.max(0.1, p.beam_angle === undefined ? 1.0 : p.beam_angle);
      const _openF = _zoomF * _angF;
      const _spread = (isWash ? 1.9  : 1.0) * _openF;  // wash + zoom + angle

      const base_r = (0.22 + 2.0 * lvl) * bs * _spread;
      const fx2 = fx, fz2 = fz;

      // Extrémité réelle du rayon (fy), et non le sol ou le plafond selon un
      // booléen : c'est ce qui rend le faisceau continu quand il franchit
      // l'horizontale. Constaté entre tilt 54885 et 55397 sur des lyres à 7 m,
      // où le faisceau sautait du sol au plafond d'un pas de tilt à l'autre.
      const baseY = fy;

      // Un seul cône, dont l'enveloppe est volontairement serrée : au-delà de
      // ~2× le rayon utile la densité est déjà nulle, et chaque mètre de
      // rayon en trop coûte des fragments raymarchés au carré.
      orientCone(obj.cVol, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 2.0);
      const _bu = obj.cVol.material.uniforms;
      _bu.uColor.value.copy(_colBuf);
      // Un wash est une nappe large sans cœur défini ; une lyre est un
      // faisceau serré avec un cœur très chaud. Le zoom resserre le profil
      // en plus d'élargir l'enveloppe.
      // uSharp est exprimé sur le rayon NORMALISÉ de l'enveloppe : en la
      // resserrant de 3× à 2×, le même rayon physique donne un rr 1,5× plus
      // grand, donc le coefficient doit être divisé par 1,5² pour conserver
      // exactement la même largeur de faisceau à l'écran.
      // `_zoomF` SEUL ici, surtout pas `_openF`. uSharp est exprimé sur le
      // rayon normalisé : à uSharp constant, la largeur visible suit
      // exactement l'enveloppe. En divisant AUSSI par l'angle, on resserrait
      // le profil EN PLUS du cône et la largeur variait en angle^1,5 — mesuré :
      // à 50 %, un faisceau à 35 % posé sur une tache à 50 %, qui ne se
      // rejoignent plus au sol. Le zoom garde son dosage d'origine.
      _bu.uSharp.value = (isWash ? 1.35 : 4.40) / Math.max(0.35, _zoomF);
      _bu.uCore.value  = isWash ? 0.35 : 2.20;
      // beamGain = réglage global ; p.beam_gain = dosage par projecteur,
      // réglé dans le tableau de l'onglet Plan.
      _bu.uAlpha.value = (isWash ? 1.70 : 2.40) * lvl * window.beamGain
                       * (p.beam_gain ?? 1.0);
      // Valeur de référence du clignotement : sans elle, _selBlink
      // multiplierait sa propre sortie à chaque image et le faisceau
      // s'éteindrait en quelques dixièmes de seconde.
      if (_isSel) obj._selA = _bu.uAlpha.value;

      // Halo de lentille : grossit et s'intensifie avec le niveau
      obj.lensGlow.visible = true;
      obj.lensGlow.position.set(lensX, lensY, lensZ);
      obj.lensGlow.scale.setScalar((0.30 + 0.85 * lvl) * (isWash ? 1.25 : 1.0) * bs);
      obj.lensGlow.material.color.copy(_colBuf);
      obj.lensGlow.material.opacity = Math.min(1.0, (0.35 + 0.65 * lvl) * lvl * window.glowGain);
      if (_isSel) obj._selG = obj.lensGlow.material.opacity;

      // Gobo : calculé ici et non dans le bloc « tache au sol », car il
      // découpe AUSSI le faisceau — y compris quand la lyre pointe vers le
      // haut, cas où il n'y a pas de tache au sol du tout.
      //
      // `has_gobo` : la fixture porte-t-elle une optique de PROJECTION ? Un PAR
      // LED, une barre, un strobe n'en ont pas — ils ne peuvent pas faire de
      // gobo, quelle que soit la valeur du canal. Décider ici sur `p.gobo > 0`
      // plaquait des motifs sur les PAR dont le canal `Gobo1` sert en réalité
      // de canal de PROGRAMME (seul `Gobo1` ouvre un éditeur de presets, d'où
      // le détournement). Le drapeau vient de `core.fixture_projects_gobo`,
      // partagé avec le plan 2D.
      const goboSlot  = p.has_gobo
        ? Math.min(GOBO_SLOT_COUNT - 1,
                   Math.floor(((p.gobo || 0) / 256) * GOBO_SLOT_COUNT))
        : 0;
      const goboBlend = goboSlot > 0 ? 1.0 : 0.0;
      // Même porte sur la rotation : sans motif, faire tourner le faisceau
      // n'aurait rien à quoi s'accrocher — et animate() le ferait pivoter dans
      // le vide.
      const goboRotV  = p.has_gobo ? (p.gobo_rotation || 0) : 0;
      const goboRot   = (goboRotV / 255.0) * Math.PI * 2;
      // Netteté du gobo.
      //
      // Sans canal Focus, l'appareil est mis au point à la main sur le plateau
      // une fois pour toutes : la 3D le montre NET. L'alternative — un flou
      // fixe — afficherait un défaut que l'utilisateur n'aurait aucun moyen de
      // corriger depuis le logiciel.
      //
      // Avec un canal Focus, c'est le curseur qui décide : 0 = flou,
      // 255 = net. Convention monotone assumée — la course réelle dépend de
      // l'appareil ET du jeté, que rien ici ne permet de connaître.
      const goboBlur = p.has_focus ? (1.0 - Math.min(255, Math.max(0, p.focus || 0)) / 255) : 0.0;
      _bu.uGoboTex.value   = _goboTextures[goboSlot];
      _bu.uGoboBlend.value = goboBlend;
      _bu.uGoboBlur.value  = goboBlur;
      // Rotation continue en cours ? C'est animate() qui pilote l'angle, image
      // par image. L'écraser ici — 25 fois par seconde, à la cadence des envois
      // Python — ramenait sans cesse le motif à son angle de départ : le gobo
      // tressautait au lieu de tourner.
      if (!(goboRotV > 0)) _bu.uGoboRot.value = goboRot;

      if (hitsFloor) {
        // Tache principale au sol (avec gobo)
        // Wash : nappe au sol plus large et plus douce qu'un spot de lyre
        // La tache suit l'ouverture : un faisceau resserré qui garderait une
        // tache pleine largeur se lit tout de suite comme un bug.
        //
        // Rayon de la tache DÉRIVÉ du cône, et non calculé par une formule
        // parallèle. L'ancienne — (0.35 + 2.2*lvl) * bs * (wash ? 1.6 : 1) *
        // _angF — ignorait complètement `_zoomF` et retenait 1.6 là où le cône
        // prend 1.9 pour un wash. Mesuré : tache 2,2× trop LARGE zoom serré,
        // 3,4× trop ÉTROITE zoom large, et systématiquement trop étroite sur
        // un wash. Le facteur 1.15 reproduit à 0,2 % près l'ancienne taille
        // dans le cas calibré (spot, zoom 1) : rien ne bouge là où c'était
        // juste, tout suit ailleurs.
        //
        // √_zoomF en plus : l'enveloppe suit `_zoomF`, mais `uSharp` est AUSSI
        // divisé par `_zoomF` (cf. plus haut), si bien que la largeur VISIBLE
        // du faisceau varie en _zoomF^1,5. La tache doit suivre la même loi.
        const poolR = base_r * 1.15 * Math.sqrt(Math.max(0.35, _zoomF));
        obj.pool.position.set(fx2, 0.02, fz2);
        obj.pool.scale.setScalar(poolR);
        obj.pool.material.uniforms.uColor.value.copy(_colBuf);
        obj.pool.material.uniforms.uAlpha.value = (isWash ? 0.52 : 0.70) * lvl;
        if (_isSel) obj._selP = obj.pool.material.uniforms.uAlpha.value;
        obj.pool.material.uniforms.uGoboTex.value   = _goboTextures[goboSlot];
        obj.pool.material.uniforms.uGoboBlend.value = goboBlend;
        obj.pool.material.uniforms.uGoboBlur.value  = goboBlur;
        if (!(goboRotV > 0))
          obj.pool.material.uniforms.uGoboRot.value = goboRot;
        obj.pool.visible = true;

        // Halo diffus au sol. 1.7 et non 2.8 : à 2,8 un simple spot à 7 m
        // posait un disque de 14 m de diamètre sur un plateau de 18 m — deux
        // projecteurs suffisaient à noyer toute la scène de blanc, très loin
        // devant un faisceau qui, lui, fait 4,4 m. C'est ce halo, et non la
        // tache principale, qui faisait « la tache est plus large que le
        // faisceau » (capture `depasse.png`). À 1.7 il redevient ce qu'il doit
        // être : la pénombre juste autour de la tache.
        obj.halo.position.set(fx2, 0.015, fz2);
        obj.halo.scale.setScalar(poolR * 1.7);
        obj.halo.material.uniforms.uColor.value.copy(_colBuf);
        obj.halo.material.uniforms.uAlpha.value = 0.15 * lvl * window.glowGain;
        obj.halo.visible = true;

        // Point light au sol
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 4.5;
        obj.ptLight.position.set(fx2, 0.4, fz2);
      } else {
        // Faisceau montant — pas de tache au sol
        obj.pool.visible = false;
        obj.halo.visible = false;
        // Point light dans le faisceau montant
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 3.0;
        obj.ptLight.position.set(fx2, Math.min(lensY + 4.0, 13.0), fz2);
      }
      obj.ptLight.visible = true;

      // État pour l'animation continue (prisme + rotation gobo) dans animate()
      obj._fx = {
        active:   true,
        lensX, lensY, lensZ,
        fx: fx2, fz: fz2, baseY,
        base_r,
        // Rayon EXACT de la tache principale, facteurs wash, ouverture et
        // zoom compris : les taches du prisme sont des copies, elles doivent
        // avoir la même taille — et leur écartement en dépend aussi. Recopier
        // la formule ici la faisait diverger de celle du bloc `hitsFloor`,
        // d'où une seule expression, identique des deux côtés.
        poolR:    base_r * 1.15 * Math.sqrt(Math.max(0.35, _zoomF)),
        goingUp,
        hitsFloor,
        prism:    (p.prism || 0) > 0,
        prismV:   (p.prism_rotation || 0),
        goboRotV,
        col:      [r, g, b],
        lvl,
      };

    } else {
      obj.cVol.visible = obj.lensGlow.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
      obj._fx = null;
    }
  }

  // Masquer les slots inutilisés
  if (_anim) return;
  for (let i = projectors.length; i < _objs.length; i++) {
    const o = _objs[i];
    o.cVol.visible  = o.lensGlow.visible =
    o.pool.visible  = o.halo.visible  = o.ptLight.visible = false;
    o.parGrp.visible = false;
    o.mhGrp.visible  = false;
    o.pxCell.visible = false;
    o.pxGlow.visible = false;
    o.pxHalo.visible = false;
    o.pxHousing.visible = false;
    o._fx = null;
    // Sans ça, retirer une machine du patch laissait sa gerbe tourner dans le
    // vide : les particules ne vivent pas dans le groupe des corps, masquer
    // `machGrp` ne les aurait pas éteintes.
    if (o._mach) _machStop(o);
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// Configuration truss depuis Python
// ─────────────────────────────────────────────────────────────────────────────
window.setTrusses = function(defs) {
  buildTrusses(defs);
};

// ─────────────────────────────────────────────────────────────────────────────
// Presets caméra
// ─────────────────────────────────────────────────────────────────────────────
// La vue du PUBLIC fait foi : le public est en Z négatif (cf. la caméra de
// départ à z = −20). Ces presets étaient restés à z > 0, du côté du fond de
// scène : FACE montrait l'arrière du rig et DESSUS mettait le public en haut.
const CAM_PRESETS = {
  iso:   { pos:[14,11,-20], tgt:[0,3,0] },
  front: { pos:[0,5,-24],   tgt:[0,4,0] },
  top:   { pos:[0,30,-0.1], tgt:[0,0,0] },
  side:  { pos:[24,7,0],    tgt:[0,4,0] },
};
const CAM_BTNS = { iso:'b-iso', front:'b-front', top:'b-top', side:'b-side' };

// Cadrage propre à la scène, posé par `setScenePreset` (clé `cam` du preset) :
// les presets ci-dessus visent un plateau de 20 m, où une installation DJ
// mobile de 2 m n'occupait qu'un coin de l'image. `zoom` rapproche la caméra
// de sa cible, `cibleY` / `cibleZ` déplacent la cible (DESSUS garde sa hauteur).
let _camActuelle = 'iso';
let _camCadrage  = {};

window.setCam = function(name) {
  const p = CAM_PRESETS[name]; if (!p) return;
  _camActuelle = name;
  const { zoom = 1, cibleY = null, cibleZ = null } = _camCadrage;
  const tgt = new THREE.Vector3(...p.tgt);
  if (cibleY != null && name !== 'top') tgt.y = cibleY;
  if (cibleZ != null) tgt.z = cibleZ;
  const pos = new THREE.Vector3(...p.pos).sub(new THREE.Vector3(...p.tgt))
                                         .multiplyScalar(zoom).add(tgt);
  camera.position.copy(pos);
  controls.target.copy(tgt);
  controls.update();
  Object.keys(CAM_BTNS).forEach(k => {
    const el = document.getElementById(CAM_BTNS[k]);
    if (el) el.classList.toggle('on', k===name);
  });
};

// ── Points de vue mémorisés ──────────────────────────────────────────────
// Un préréglage fige un angle ; ici on capture exactement où en est la
// caméra, pour retrouver un cadrage de travail au clic.
window.getView = function () {
  return JSON.stringify({
    pos: camera.position.toArray(),
    tgt: controls.target.toArray(),
    fov: camera.fov,
  });
};

window.setView = function (v) {
  if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return false; } }
  if (!v || !v.pos || !v.tgt) return false;
  camera.position.fromArray(v.pos);
  controls.target.fromArray(v.tgt);
  if (v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
  controls.update();
  Object.keys(CAM_BTNS).forEach(k => {
    const el = document.getElementById(CAM_BTNS[k]);
    if (el) el.classList.remove('on');
  });
  return true;
};

// ── Export image ─────────────────────────────────────────────────────────
// Le contexte WebGL est créé sans preserveDrawingBuffer : on relit donc le
// canvas dans la MÊME tâche que le rendu, avant que le compositeur ne l'efface.
window.snapshot = function () {
  try {
    if (_flags.bloom) composer.render(); else renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  } catch (e) {
    return 'ERR:' + e.message;
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// Flags d'affichage
// ─────────────────────────────────────────────────────────────────────────────
const _flags = { bloom:true,  fixtures:true, trusses:true, floor:true, grid:true, fog:true,
                 screen:true };
// Souhait de l'utilisateur pour le bloom, indépendant de ce que la qualité
// impose : en qualité basse le bloom est coupé, mais on doit le retrouver
// allumé en remontant la qualité si l'utilisateur ne l'avait pas éteint.
let _bloomWanted = true;

window.toggleFlag = function(what) {
  _flags[what] = !_flags[what];
  const _el = document.getElementById('b-'+what);
  if (_el) _el.classList.toggle('on', _flags[what]);

  if (what === 'bloom')    { _bloomWanted = _flags.bloom;
                             // Le composer n'est plus redimensionné tant que le
                             // bloom est éteint : on le remet à niveau ici.
                             if (_flags.bloom) composer.setSize(W(), H()); }
  if (what === 'fixtures') { _fixtureGrp.visible = _flags.fixtures; }
  if (what === 'trusses')  { _trussGrp.visible   = _flags.trusses;  }
  if (what === 'floor')    { floorReflector.visible = _flags.floor;
                             floorTint.visible      = _flags.floor;   }
  if (what === 'grid')     { gridHelper.visible   = _flags.grid;     }
  if (what === 'fog')      { scene.fog = _flags.fog ? fog : null;    }
  if (what === 'screen')   { _screenGrp.visible  = _flags.screen;  }
};

// ─────────────────────────────────────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────────────────────────────────────
// Redimensionnement : ne RIEN faire si la taille n'a pas bougé.
//
// setSize() réalloue les tampons du GPU, ce qui coûte une image noire sur
// beaucoup de pilotes. Or l'événement `resize` part aussi pour des raisons qui
// ne changent pas la taille utile de la vue — apparition d'une barre de
// défilement à côté, redessin du panneau, changement d'échelle système. D'où
// des clignotements noirs dans le plan 3D seul, sans que rien n'ait bougé.
let _lastW = 0, _lastH = 0;
window.addEventListener('resize', () => {
  const w = W(), h = H();
  if (w === _lastW && h === _lastH) return;
  _lastW = w; _lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (_flags.bloom) composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
});

// ─────────────────────────────────────────────────────────────────────────────
// Animation continue : rotation gobo + split prisme (par frame)
// ─────────────────────────────────────────────────────────────────────────────
const _fxColBuf = new THREE.Color();

function _orientPrism(obj, t) {
  const s = obj._fx;
  const pm0 = obj.prismBeams, pp0 = obj.prismPools;
  if (!s || !s.active) {
    for (let k = 0; k < PRISM_FACETS; k++) {
      pm0[k].visible = pp0[k].visible = false;
    }
    return;
  }

  // ── Rotation gobo continue (valeur DMX = vitesse) ──
  if (s.goboRotV > 0) {
    const gspd = (s.goboRotV / 255) * 2.4;          // rad/s max
    const grot = t * gspd;
    if (obj.pool.material.uniforms.uGoboBlend.value > 0)
      obj.pool.material.uniforms.uGoboRot.value = grot;
    // Le faisceau tourne avec la tache : sans ça, gobo figé dans la fumée et
    // motif tournant au sol — deux images du même gobo qui se contredisent.
    const _bu2 = obj.cVol && obj.cVol.material.uniforms;
    if (_bu2 && _bu2.uGoboBlend.value > 0) _bu2.uGoboRot.value = grot;
  }

  // ── Prisme : PRISM_FACETS copies complètes du faisceau ──
  if (!s.prism) {
    for (let k = 0; k < PRISM_FACETS; k++) {
      pm0[k].visible = pp0[k].visible = false;
    }
    return;
  }

  // Le prisme ne s'ajoute pas au faisceau : il le REMPLACE par ses copies.
  // Laisser cVol allumé donnait une image centrale que l'optique ne produit
  // pas, et surtout un gobo net au milieu de trois copies floues — d'où
  // l'impression que « le prisme fonctionne mal ». La tache principale part
  // avec lui ; le halo, la lentille et la point light restent, eux, le
  // rayonnement diffus ne disparaît pas quand on insère un prisme.
  // Les alphas sont lus dans les UNIFORMS, jamais via .visible : updateScene()
  // ne tourne qu'aux ~25 fps des envois Python alors qu'animate() tourne à 60,
  // donc dès la deuxième image on relirait le `visible = false` qu'on vient
  // d'écrire — et les copies s'éteindraient une image sur deux.
  const _cu = obj.cVol && obj.cVol.material.uniforms;
  const _mp = obj.pool.material.uniforms;
  const _centerAlpha = _cu ? _cu.uAlpha.value : 0;
  const _centerPoolA = _mp.uAlpha.value;
  obj.cVol.visible = false;
  obj.pool.visible = false;

  _fxColBuf.setRGB(s.col[0], s.col[1], s.col[2]);
  const pspd = (s.prismV / 255) * 2.2;              // rad/s — 0 = split fixe (comme une vraie lyre)
  const ang  = t * pspd;

  // Écart des copies, exprimé en rayons de tache — et non en divergence
  // angulaire depuis la lentille. Un prisme sépare bien ses images d'un angle
  // fixe, mais les deux grandeurs croissent ensemble avec le jeté : leur
  // RAPPORT est ce qui définit l'aspect du split, et c'est lui qu'il faut
  // tenir. Calculer l'écart à partir du jeté seul donnait ici 0,7 m pour des
  // taches de 4,3 m de rayon — trois copies empilées, soit exactement la
  // bouillie qu'on cherche à corriger.
  const R = Math.max(0.35, s.poolR * PRISM_SPREAD);

  for (let k = 0; k < PRISM_FACETS; k++) {
    const a  = ang + k * (2 * Math.PI / PRISM_FACETS);
    const bx = s.fx + Math.cos(a) * R;
    const bz = s.fz + Math.sin(a) * R;
    orientCone(pm0[k], s.lensX, s.lensY, s.lensZ, bx, s.baseY, bz, s.base_r * 2.0);
    const _pu = pm0[k].material.uniforms;
    _pu.uColor.value.copy(_fxColBuf);
    // Copie conforme du faisceau d'origine : même profil (donc même zoom, même
    // distinction wash/beam) et surtout MÊME GOBO. C'est tout l'intérêt d'un
    // prisme : il multiplie le motif projeté, il ne le remplace pas par des
    // taches lisses. uGoboRot est repris tel quel, rotation continue comprise,
    // pour que les trois images tournent ensemble.
    if (_cu) {
      _pu.uSharp.value     = _cu.uSharp.value;
      _pu.uCore.value      = _cu.uCore.value;
      _pu.uGoboTex.value   = _cu.uGoboTex.value;
      _pu.uGoboBlend.value = _cu.uGoboBlend.value;
      _pu.uGoboRot.value   = _cu.uGoboRot.value;
      _pu.uGoboBlur.value  = _cu.uGoboBlur.value;
    }
    // Chaque facette reçoit une fraction du flux. Pas 1/3 strict : l'œil (et
    // le rendu HDR + bloom) écraserait trois faisceaux à 33 %, alors qu'un
    // prisme réel reste très lisible sur scène.
    _pu.uAlpha.value = _centerAlpha * 0.62;
    pm0[k].visible = true;

    if (s.hitsFloor) {
      const _ppu = pp0[k].material.uniforms;
      pp0[k].position.set(bx, 0.02, bz);
      pp0[k].scale.setScalar(s.poolR);        // une copie a la taille de l'original
      _ppu.uColor.value.copy(_fxColBuf);
      _ppu.uAlpha.value = _centerPoolA * 0.62;
      _ppu.uGoboTex.value   = _mp.uGoboTex.value;
      _ppu.uGoboBlend.value = _mp.uGoboBlend.value;
      _ppu.uGoboRot.value   = _mp.uGoboRot.value;
      _ppu.uGoboBlur.value  = _mp.uGoboBlur.value;
      pp0[k].visible = true;
    } else {
      pp0[k].visible = false;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Boucle de rendu
// ─────────────────────────────────────────────────────────────────────────────
// ── Niveaux de qualité ───────────────────────────────────────────────────
// Le raymarching coûte au fragment : sur un portable modeste avec beaucoup de
// projecteurs, il faut pouvoir retomber sur un rendu plus léger.
// `oct` = octaves de bruit du brouillard. En qualité Bas on tombe à 1 : les
// volutes restent lisibles alors que le fbm coûte trois fois moins.
const QUALITY = [
  { name:'Bas',   steps: 8,  ratio: 1.0, refl:false, bloom:false, oct: 1 },
  { name:'Moyen', steps: 16, ratio: 1.5, refl:true,  bloom:true,  oct: 2 },
  { name:'Haut',  steps: 24, ratio: 2.0, refl:true,  bloom:true,  oct: 2 },
  { name:'Ultra', steps: 40, ratio: 2.0, refl:true,  bloom:true,  oct: 3 },
];
window.qualityLevel = 2;
window.autoQuality  = true;

window.setQuality = function (lvl, redimensionner) {
  lvl = Math.max(0, Math.min(QUALITY.length - 1, lvl | 0));
  // Tracé : la dégradation automatique est à SENS UNIQUE (aucune remontée).
  // Si elle se déclenche, la baisse est définitive — un tramage permanent des
  // faisceaux, pas un glitch passager. Le journal permet de trancher.
  if (lvl !== window.qualityLevel) {
    console.log(`[3D] qualité ${QUALITY[window.qualityLevel].name} → `
              + `${QUALITY[lvl].name} (${QUALITY[lvl].steps} pas, `
              + `redimensionnement=${redimensionner !== false})`);
  }
  window.qualityLevel = lvl;
  const q = QUALITY[lvl];
  window.setBeamQuality(q.steps);
  window.setFogOctaves(q.oct);

  // Changer la résolution de rendu réalloue les tampons du GPU, ce qui coûte
  // UNE IMAGE NOIRE sur beaucoup de pilotes. Acceptable quand l'utilisateur
  // choisit lui-même sa qualité — il s'y attend. Inacceptable quand c'est la
  // dégradation automatique qui se déclenche : l'écran clignote en noir sans
  // que personne n'ait rien demandé, et ça se répète à chaque palier.
  // Par défaut on redimensionne ; la dégradation auto passe `false` et se
  // contente de réduire les pas de raymarching, qui est de toute façon le
  // poste le plus coûteux.
  const _ratioVoulu = Math.min(window.devicePixelRatio, q.ratio);
  if (redimensionner !== false &&
      Math.abs(renderer.getPixelRatio() - _ratioVoulu) > 1e-3) {
    renderer.setPixelRatio(_ratioVoulu);
    renderer.setSize(W(), H());
    composer.setSize(W(), H());
  }
  // Le sol n'est plus un miroir : la qualité n'a plus à l'éteindre. Garder
  // ces lignes ferait disparaître le sol lui-même en qualité Bas/Moyen, où
  // `refl` valait false. Seul le bouton « Sol » contrôle sa visibilité.
  _flags.bloom = q.bloom && _bloomWanted;
  return q.name;
};

// ── Compteur de performance ──────────────────────────────────────────────
const _fpsEl = document.getElementById('fps');
let _fpsFrames = 0, _fpsLast = performance.now(), _fpsValue = 60;
let _diagPrev = 0, _diagLongFrames = 0, _diagCtxLost = 0;

// ── Perte de contexte WebGL ────────────────────────────────────────────────
// Symptôme identique au clignotement signalé : tout devient noir un instant
// puis revient sans que la scène soit rechargée. Le pilote peut réinitialiser
// le contexte (TDR Windows, bascule GPU, veille) à tout moment.
//
// ⚠️ Ceci est du DIAGNOSTIC, pas un correctif : Three.js pose déjà son propre
// gestionnaire et appelle `preventDefault()` (`three.module.js`, onContextLost),
// la restauration marchait donc déjà. Ce qui manquait, c'est de le SAVOIR — ses
// messages n'ont pas le préfixe `[3D]` et n'atteignent pas le terminal Python.
renderer.domElement.addEventListener('webglcontextlost', () => {
  _diagCtxLost++;
  console.log(`[3D] CONTEXTE WEBGL PERDU (${_diagCtxLost}e fois) — `
            + `Three.js va tenter la restauration`);
}, false);

renderer.domElement.addEventListener('webglcontextrestored', () => {
  console.log('[3D] contexte WebGL restauré');
}, false);

// Visibilité de la page. Deux raisons de la tracer : elle explique les écarts
// de plusieurs secondes entre deux images (rendu suspendu, cf. boucle de
// rendu), et une reprise d'affichage est justement un moment où le compositeur
// réalloue sa surface — donc un suspect pour le clignotement.
document.addEventListener('visibilitychange', () => {
  _diagPrev = 0;
  console.log(`[3D] page ${document.hidden ? 'masquée — rendu suspendu' : 'visible'}`);
});

// ── Détecteur de glitch ────────────────────────────────────────────────────
// Les sondes ci-dessus ne voient QUE des causes supposées (contexte perdu,
// image longue, qualité). Si le clignotement vient d'ailleurs — tramage des
// faisceaux, ordre de dessin, bloom — elles restent muettes et l'utilisateur
// aura reproduit pour rien. Celle-ci mesure le SYMPTÔME.
//
// DEUX symptômes, parce que la capture `glitch.jpg` en montre deux à la fois :
// la scène qui s'assombrit, ET les faisceaux qui se trament pixel par pixel.
//   • `lum`  : luminance moyenne — attrape le « tout devient noir ».
//   • `dith` : alternance d'un pixel au suivant (laplacien horizontal
//              normalisé). Un dégradé lisse donne ~0,02 ; un damier 1 pixel
//              monte au-delà de 1. C'est la signature du bruit de raymarching
//              (`ign(gl_FragCoord.xy)`) devenu visible.
//
// On lit une BANDE en travers de toute l'image et non un carré au centre :
// les faisceaux sont répartis sur la largeur, un carré central peut très bien
// tomber sur du vide et ne rien voir du glitch.
//
// `readPixels` force une synchronisation GPU, donc jamais à 60 Hz : ~10 Hz
// suffit largement à attraper un glitch d'un quart de seconde (~15 images).
// Mettre `window.diagBlack = false` pour le couper.
window.diagBlack = true;
let _dbLast = 0, _dbMoy = -1, _dbHits = 0;
let _dbInst = -1, _dbSamples = 0, _dbTrace = 0, _dbMin = 1e9;
let _dbBuf = null, _dbBufW = 0, _dbLum = null;
let _ditMoy = -1, _ditInst = 0, _ditMax = 0, _ditHits = 0;

// Capture de l'image fautive. C'est LE point qui manquait : une photo de
// l'écran prise au téléphone ne permet pas de distinguer un tramage réel d'un
// moiré d'appareil photo, et le glitch est trop bref pour cliquer sur quoi que
// ce soit. Ici l'image est prise dans la MÊME tâche que le rendu — obligatoire,
// le contexte n'a pas `preserveDrawingBuffer` — puis remise à Python qui
// l'écrit à côté du journal.
let _shots = 0, _shotLast = -1e9;
const _SHOTS_MAX = 8;

function _capturerGlitch(raison) {
  if (_shots >= _SHOTS_MAX) return;
  const t = performance.now();
  if (t - _shotLast < 2000) return;   // un glitch = une image, pas une rafale
  _shotLast = t;
  _shots++;
  try {
    const url = renderer.domElement.toDataURL('image/jpeg', 0.92);
    if (window._bridge && window._bridge.saveGlitchShot) {
      window._bridge.saveGlitchShot(url, raison);
    } else {
      console.log('[3D] capture impossible : pont Python absent');
    }
  } catch (e) {
    console.log('[3D] capture échouée : ' + e.message);
  }
}

// ── Sonde rapide : UNE mesure par image ────────────────────────────────────
// La sonde large ci-dessous tourne à 10 Hz. C'est suffisant pour un glitch
// d'un quart de seconde, mais **pas** pour un clignotement d'une seule image :
// 16 ms sur 100, elle a une chance sur six de tomber dessus. Or c'est
// exactement ce qui a été observé — dix minutes de journal parfaitement plats
// alors que l'utilisateur voyait le glitch.
//
// Celle-ci ne lit que 32×4 pixels au centre (512 octets) : le coût n'est pas
// dans le volume mais dans la synchronisation GPU qu'impose `readPixels`.
// Mesuré à ~60 fps maintenus sur la scène de test. `window.diagFast = false`
// la coupe si la cadence en souffre.
window.diagFast = true;
let _fastBuf = new Uint8Array(4 * 32 * 4), _fastMoy = -1, _fastHits = 0;
let _fastCout = 0, _fastN = 0;

function _sondeRapide(now) {
  if (!window.diagFast) return;
  const gl = renderer.getContext();
  const cw = renderer.domElement.width, ch = renderer.domElement.height;
  if (cw < 64 || ch < 64) return;
  const t0 = performance.now();
  try {
    gl.readPixels((cw / 2 - 16) | 0, (ch * 0.45) | 0, 32, 4,
                  gl.RGBA, gl.UNSIGNED_BYTE, _fastBuf);
  } catch (e) { return; }
  // Auto-limitation. Le coût de `readPixels` n'est pas dans les 512 octets lus
  // mais dans la synchronisation GPU qu'il impose, et celle-ci dépend de la
  // machine. Un diagnostic n'a pas le droit de coûter le confort de rendu à
  // l'utilisateur : s'il pèse, il s'éteint tout seul et le journal le dit.
  _fastCout += performance.now() - t0;
  if (++_fastN === 120) {
    const moyen = _fastCout / _fastN;
    console.log(`[3D] sonde par image : ${moyen.toFixed(2)} ms par lecture`);
    if (moyen > 4.0) {
      window.diagFast = false;
      console.log('[3D] sonde par image COUPÉE (trop coûteuse) — '
                + 'seule la sonde 10 Hz reste active');
    }
  }
  let s = 0;
  for (let i = 0; i < _fastBuf.length; i += 4)
    s += _fastBuf[i] * 0.299 + _fastBuf[i + 1] * 0.587 + _fastBuf[i + 2] * 0.114;
  const lum = s / (_fastBuf.length / 4);
  if (_fastMoy < 0) { _fastMoy = lum; return; }

  if (_fastMoy > 8 && lum < _fastMoy * 0.55) {
    _fastHits++;
    const inf = renderer.info.render;
    console.log(`[3D] IMAGE NOIRE (${_fastHits}e) : luminance ${lum.toFixed(1)} `
              + `contre ${_fastMoy.toFixed(1)} — ${inf.calls} draws, `
              + `${inf.triangles} tri, ambiance ${window.ambLight.intensity.toFixed(1)}, `
              + `bloom=${_flags.bloom}, ${_fpsValue.toFixed(0)} fps`);
    _capturerGlitch('noire');
  }
  // Moyenne lente (~0,8 s) : une image isolée ne la tire pas, un changement
  // voulu (caméra, projecteurs éteints) est suivi en moins d'une seconde.
  _fastMoy = _fastMoy * 0.98 + lum * 0.02;
}

function _mesurerNoirceur(now) {
  if (!window.diagBlack || now - _dbLast < 100) { _sondeRapide(now); return; }
  _dbLast = now;
  const gl = renderer.getContext();
  const cw = renderer.domElement.width, ch = renderer.domElement.height;
  if (cw < 64 || ch < 64) return;
  const w = Math.min(cw, 1280), h = 8;
  const x0 = ((cw - w) / 2) | 0, y0 = (ch * 0.45) | 0;
  if (_dbBufW !== w) { _dbBufW = w; _dbBuf = new Uint8Array(4 * w * h);
                       _dbLum = new Float32Array(w); }
  try {
    gl.readPixels(x0, y0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, _dbBuf);
  } catch (e) { return; }

  let som = 0, lap = 0, somClair = 0, nClair = 0;
  for (let r = 0; r < h; r++) {
    const base = r * w * 4;
    for (let i = 0; i < w; i++) {
      const o = base + i * 4;
      _dbLum[i] = _dbBuf[o] * 0.299 + _dbBuf[o + 1] * 0.587 + _dbBuf[o + 2] * 0.114;
      som += _dbLum[i];
    }
    // Le laplacien n'a de sens que là où il y a quelque chose à voir : sur du
    // noir il vaut 0 et diluerait la mesure jusqu'à la rendre aveugle.
    for (let i = 1; i < w - 1; i++) {
      const a = _dbLum[i - 1], b = _dbLum[i], c = _dbLum[i + 1];
      if (Math.max(a, b, c) < 14) continue;
      lap += Math.abs(2 * b - a - c);
      somClair += b;
      nClair++;
    }
  }
  const lum  = som / (w * h);
  const dith = nClair > 64 ? (lap / nClair) / (2 * Math.max(somClair / nClair, 1)) : 0;
  _dbInst = lum;
  _ditInst = dith;
  _ditMax = Math.max(_ditMax, dith);
  _dbMin = Math.min(_dbMin, lum);
  _dbSamples++;

  const inf = renderer.info.render;
  const etat = `qualité ${QUALITY[window.qualityLevel].name}, ${window.beamQuality} pas, `
             + `${_fpsValue.toFixed(0)} fps, ${inf.calls} draws, `
             + `ambiance ${window.ambLight.intensity.toFixed(1)}, bloom=${_flags.bloom}`;

  if (_dbMoy < 0) { _dbMoy = lum; _ditMoy = dith; return; }

  // Chute brutale = glitch. Le seuil est relatif : une scène sombre par nature
  // ne doit pas déclencher en permanence.
  if (_dbMoy > 8 && lum < _dbMoy * 0.45) {
    _dbHits++;
    console.log(`[3D] IMAGE ASSOMBRIE (${_dbHits}e) : luminance ${lum.toFixed(1)} `
              + `contre ${_dbMoy.toFixed(1)} en moyenne — ${etat}`);
    _capturerGlitch('assombrie');
  }
  // Tramage. Le nombre de draws est journalisé avec : s'il s'effondre, ce sont
  // les objets qui ne sont plus dessinés ; s'il ne bouge pas, c'est le rendu
  // des faisceaux lui-même qui se dégrade.
  if (dith > 0.25 && dith > _ditMoy * 1.6 + 0.04) {
    _ditHits++;
    console.log(`[3D] IMAGE TRAMÉE (${_ditHits}e) : indice ${dith.toFixed(3)} `
              + `contre ${Math.max(_ditMoy, 0).toFixed(3)} en moyenne — ${etat}`);
    _capturerGlitch('tramee');
  }
  // Trace périodique. Les seuils ci-dessus reposent sur des hypothèses, et une
  // hypothèse peut être fausse sur la scène de quelqu'un d'autre. Ce relevé,
  // lui, ne suppose rien : si le clignotement a bien lieu, le creux se lit dans
  // la suite des valeurs même si aucun seuil n'a rien vu. Une ligne toutes les
  // 5 s, c'est négligeable dans un journal.
  if (now - _dbTrace > 5000) {
    _dbTrace = now;
    console.log(`[3D] luminance ${lum.toFixed(1)} (moyenne ${_dbMoy.toFixed(1)}, `
              + `min ${_dbMin.toFixed(1)}), tramage ${dith.toFixed(3)} `
              + `(max ${_ditMax.toFixed(3)}), ${_fpsValue.toFixed(0)} fps, `
              + `${inf.calls} draws`);
    _dbMin = lum;
    _ditMax = dith;
  }

  // Moyennes glissantes lentes : elles suivent les changements voulus (on bouge
  // la caméra, on éteint les projecteurs) sans se laisser tirer par un glitch
  // isolé.
  _dbMoy  = _dbMoy  * 0.9 + lum  * 0.1;
  _ditMoy = _ditMoy * 0.9 + dith * 0.1;
}

// Journal consultable depuis Python (bouton « Diagnostic » de l'onglet Cam.)
window.diag3d = function () {
  return {
    imagesLongues:   _diagLongFrames,
    contextesPerdus: _diagCtxLost,
    imagesNoires:    _fastHits,
    imagesAssombries: _dbHits,
    imagesTramees:   _ditHits,
    luminanceMoyenne: +_dbMoy.toFixed(1),
    luminanceInstant: +_dbInst.toFixed(1),
    tramageMoyen:    +Math.max(_ditMoy, 0).toFixed(3),
    tramageInstant:  +_ditInst.toFixed(3),
    captures:        _shots,
    mesures:          _dbSamples,
    qualite:         QUALITY[window.qualityLevel].name,
    pas:             window.beamQuality,
    fps:             Math.round(_fpsValue),
  };
};

// Capture à la demande : `window.captureGlitch()` depuis Python, ou la touche G
// dans la vue 3D. Sert de témoin — comparer une image saine à une image fautive
// est le seul moyen de trancher sur le tramage.
//
// DIFFÉRÉE d'une image, contrairement à la capture automatique : le contexte
// n'a pas `preserveDrawingBuffer`, donc relire le canevas depuis un gestionnaire
// de touche ou depuis `runJavaScript` — c'est-à-dire hors de la tâche qui a
// rendu l'image — ne ramènerait que du noir. La boucle de rendu honore la
// demande juste après le prochain `render()`.
let _shotPending = '';
window.captureGlitch = function () {
  _shotLast = -1e9;
  _shotPending = 'manuelle';
};
window.addEventListener('keydown', (e) => {
  if ((e.key === 'g' || e.key === 'G') && !e.ctrlKey && !e.altKey) window.captureGlitch();
});
let _slowStreak = 0;
window.showFps = function (on) {
  _fpsEl.style.display = on ? 'block' : 'none';
};
window.getFps = function () { return _fpsValue; };

// Clignotement blanc du projecteur sélectionné.
//
// Appliqué dans la boucle de rendu et non dans updateScene() : celle-ci n'est
// appelée que lorsque Python pousse un état (~25 fps, et pas du tout si rien
// ne bouge dans le show). Un clignotement qui s'arrête dès que la scène est
// figée n'attirerait l'œil que par hasard.
function _selBlink(t) {
  if (_selSet.size === 0) return;
  // Battement doux entre 25 % et 100 % — un créneau franc fatigue vite.
  // Même phase pour tous : des projecteurs qui battent ensemble se lisent
  // comme un groupe, alors que des phases décalées ressembleraient à un effet.
  const k = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 6.0));
  for (const i of _selSet) _selBlinkOne(i, k);
}

function _selBlinkOne(i, k) {
  if (i < 0 || i >= _objs.length) return;
  const obj = _objs[i];
  const bu = obj.cVol && obj.cVol.visible && obj.cVol.material.uniforms;
  if (bu && obj._selA !== undefined) bu.uAlpha.value = obj._selA * k;
  if (obj.lensGlow && obj.lensGlow.visible && obj._selG !== undefined)
    obj.lensGlow.material.opacity = obj._selG * k;
  if (obj.pool && obj.pool.visible && obj._selP !== undefined)
    obj.pool.material.uniforms.uAlpha.value = obj._selP * k;
}

// Compteurs de rendu remis à zéro À LA MAIN, une fois par image.
//
// Par défaut, Three.js les remet à zéro à CHAQUE `renderer.render()`. Avec le
// bloom, l'EffectComposer enchaîne plusieurs passes : `info.render.calls` ne
// rapportait donc que la DERNIÈRE — 1 draw, quelle que soit la scène. Or c'est
// justement ce compteur qui doit dire, pendant un glitch, si les objets ont
// cessé d'être dessinés ou si c'est leur rendu qui se dégrade.
renderer.info.autoReset = false;

(function animate() {
  requestAnimationFrame(animate);
  renderer.info.reset();
  controls.update();
  const _now = performance.now();
  const _t = _now / 1000;
  // Dérive du brouillard.
  //
  // L'offset est SOUSTRAIT de la position d'échantillonnage du bruit : une
  // composante Y négative fait donc MONTER les volutes — c'est le sens dans
  // lequel une fumée de scène se déplace, tirée par la chaleur des lampes.
  // Les termes en sinus, de périodes non harmoniques, ajoutent un balancement
  // latéral : sans eux, la fumée défile comme un tapis roulant, ce qui se
  // repère tout de suite. Les vitesses sont en unités de bruit par seconde ;
  // à la finesse par défaut (0,55 m⁻¹), 0,16 vaut ≈ 29 cm/s.
  if (window.fogAmount > 0) {
    const v = window.fogSpeed;
    const w = _t * v;
    const dx =  w * 0.055 + Math.sin(_t * 0.11 * v) * 0.35 * v;
    const dy = -w * 0.160;
    const dz =  w * 0.037 + Math.cos(_t * 0.09 * v) * 0.28 * v;
    for (let i = 0; i < _beamMats.length; i++) {
      _beamMats[i].uniforms.uFogDrift.value.set(dx, dy, dz);
    }
  }
  // Inertie pan/tilt : rattrapage à la cadence d'AFFICHAGE, pas à celle des
  // trames Python. dt plafonné — un onglet masqué puis réaffiché ne doit pas
  // faire sauter les têtes d'un coup (rAF est suspendu pendant ce temps).
  const _ptDt = _ptPrev ? Math.min(0.1, (_now - _ptPrev) / 1000) : 0;
  _ptPrev = _now;
  if (_ptDt > 0 && _lastScene && _tickPanTilt(_ptDt)) {
    window.updateScene(_lastScene, true);
  }
  // Particules des machines à effet : à la cadence d'AFFICHAGE, pas à celle
  // des trames Python. Une gerbe d'étincelles simulée à 25 Hz saccade.
  _tickMachines(_ptDt);
  for (let i = 0; i < _objs.length; i++) _orientPrism(_objs[i], _t);
  _selBlink(_t);
  if (_flags.bloom) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }

  // Capture demandée à la main : ici et pas ailleurs, l'image vient d'être
  // rendue et le canevas est encore lisible.
  if (_shotPending) { const r = _shotPending; _shotPending = ''; _capturerGlitch(r); }

  // ── Diagnostic du clignotement noir ──────────────────────────────────────
  // Une image anormalement longue et une perte de contexte WebGL donnent le
  // MÊME symptôme à l'œil (noir bref, scène intacte ensuite) mais n'ont rien
  // à voir : l'une est un à-coup CPU/GPU, l'autre une réinitialisation du
  // pilote. Les distinguer demande de les horodater au moment où ça arrive.
  //
  // ⚠️ Un écart de plusieurs secondes n'est PAS un à-coup : Chromium suspend
  // `requestAnimationFrame` dès que la page n'est plus visible (fenêtre
  // masquée, minimisée, autre onglet). Le premier journal était rempli de
  // « images longues » de 16 s, 29 s, 53 s — c'était simplement l'utilisateur
  // travaillant dans la fenêtre principale. Les compter comme des à-coups
  // aurait envoyé l'enquête droit dans le mur.
  if (_diagPrev > 0 && !document.hidden) {
    const _dt = _now - _diagPrev;
    if (_dt > 2000) {
      console.log(`[3D] rendu repris après ${(_dt / 1000).toFixed(1)} s `
                + `(vue masquée ou GPU suspendu) — pas un à-coup`);
    } else if (_dt > 70) {
      // 70 ms = quatre images sautées à 60 Hz. Le seuil était à 150 ms, ce qui
      // laissait passer le saut d'image le plus banal — or c'est exactement ce
      // qu'on cherche : un clignotement d'une seule image ne dure que 16 ms.
      _diagLongFrames++;
      console.log(`[3D] image longue : ${_dt.toFixed(0)} ms `
                + `(${_diagLongFrames}e depuis l'ouverture, qualité `
                + `${QUALITY[window.qualityLevel].name}, ${window.beamQuality} pas)`);
    }
  }
  _diagPrev = _now;
  _mesurerNoirceur(_now);

  // Mesure sur une fenêtre glissante d'une demi-seconde
  _fpsFrames++;
  if (_now - _fpsLast >= 500) {
    _fpsValue = (_fpsFrames * 1000) / (_now - _fpsLast);
    _fpsFrames = 0;
    _fpsLast = _now;
    if (_fpsEl.style.display !== 'none') {
      const inf = renderer.info.render;
      _fpsEl.textContent =
        `${_fpsValue.toFixed(0)} fps · ${QUALITY[window.qualityLevel].name}\n` +
        `${inf.calls} draws · ${window.beamQuality} pas`;
    }
    // Dégradation automatique : on ne descend jamais tout seul d'un coup, il
    // faut 3 mesures lentes d'affilée (≈1,5 s) pour éviter de réagir à un
    // à-coup de chargement.
    // Seuil bas volontairement : MyStrow ne pousse l'état des projecteurs
    // qu'à 25 fps, au-delà le rendu n'apporte plus rien. On ne dégrade donc
    // que quand ça devient réellement saccadé.
    if (window.autoQuality && _fpsValue < 20 && window.qualityLevel > 0) {
      if (++_slowStreak >= 3) {
        _slowStreak = 0;
        // Sans redimensionnement : pas de clignotement noir à l'écran.
        window.setQuality(window.qualityLevel - 1, false);
      }
    } else {
      _slowStreak = 0;
    }
  }
})();

// ─────────────────────────────────────────────────────────────────────────────
// Props de scène
// ─────────────────────────────────────────────────────────────────────────────
const _propsGrp = new THREE.Group();
scene.add(_propsGrp);

// Écran LED fond de scène
function _makeLEDScreen(x, z, w, h) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.12,h+0.12,0.08), mat(0x3a3a52,0.38,0.78));
  frame.position.set(0,h/2,0); g.add(frame);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.04),
    new THREE.MeshStandardMaterial({color:0x000820, emissive:new THREE.Color(0.03,0.06,0.16),
      emissiveIntensity:1.4, roughness:0.04, metalness:0.10}));
  panel.position.set(0,h/2,0.03); g.add(panel);
  // La dalle est le seul élément que la vidéo doit habiller : on la sort par
  // nom pour que `setVideoScreen` puisse lui poser une texture sans avoir à
  // deviner sa place dans les enfants du groupe.
  g.userData.panel = panel;
  // La trame de la dalle (une grille de fines réglettes posées SUR le panneau)
  // a été retirée : elle affleurait exactement la face avant, hachurait
  // l'image d'un quadrillage clignotant et délavait les couleurs. Une trame de
  // pixels ne se voit de toute façon pas à dix mètres, et ici c'est l'image
  // qui doit être lisible.
  for (const cx of [-w*0.3,0,w*0.3]) {
    const cable = new THREE.Mesh(new THREE.BoxGeometry(0.018,0.24,0.018), mat(0x1a1a1a,0.90,0.05));
    cable.position.set(cx,-0.12,-0.02); g.add(cable);
  }
  g.position.set(x,0,z); return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Retour vidéo — l'écran LED du fond de scène affiche le média du séquenceur
// ─────────────────────────────────────────────────────────────────────────────
// Les images arrivent DÉJÀ DÉCODÉES par Python (frames du QVideoSink du
// lecteur, réduites et encodées en JPEG). On ne rouvre donc jamais le fichier
// ici : un second décodeur sur le même média doublerait la charge CPU et
// dériverait du son. Ce qu'on affiche est, à la frame près, ce qui part sur la
// sortie vidéo — c'est ce qui rend la synchro gratuite.
const _screenGrp = new THREE.Group();
scene.add(_screenGrp);

// Retour vidéo coupé (case de l'onglet Scène) : les dalles du décor passent au
// noir, celles qui n'existent QUE pour la vidéo (`siVideo` dans le preset)
// disparaissent, et ce qu'elles remplaçaient (`userData.siPasVideo` sur un
// accessoire — le néon de la cabine DJ mobile) revient à sa place.
let _videoRetour = true;
function _appliquerRetourVideo() {
  _screenGrp.children.forEach(gr => { if (gr.userData.siVideo) gr.visible = _videoRetour; });
  _propsGrp.traverse(o => { if (o.userData.siPasVideo) o.visible = !_videoRetour; });
}
window.setVideoReturn = function (on) {
  _videoRetour = !!on;
  if (!_videoRetour) _screenBlack();
  _appliquerRetourVideo();
};
let _screenCfg   = null;   // [{x,y,z,w,h,rotY,fit}] du preset en cours, null = pas d'écran
let _screenTex   = null;   // CanvasTexture nourrie par setVideoFrame()
let _screenCanvas = null, _screenCtx = null;
const _screenImg = new Image();   // UN seul décodeur JPEG, réutilisé
_screenImg.onload = () => {
  if (!_screenCtx) return;
  const cw = _screenCanvas.width, ch = _screenCanvas.height;
  // « contain » : une vidéo 4:3 sur une dalle 16:9 garde ses proportions et
  // pose des bandes noires, comme sur un vrai processeur d'écran. L'étirer
  // ferait mentir l'aperçu sur le cadrage.
  const s = Math.min(cw / _screenImg.width, ch / _screenImg.height);
  const dw = _screenImg.width * s, dh = _screenImg.height * s;
  _screenCtx.fillStyle = '#000';
  _screenCtx.fillRect(0, 0, cw, ch);
  _screenCtx.drawImage(_screenImg, (cw-dw)/2, (ch-dh)/2, dw, dh);
  if (_screenTex) _screenTex.needsUpdate = true;
};

function _screenBlack() {
  if (!_screenCtx) return;
  _screenCtx.fillStyle = '#000';
  _screenCtx.fillRect(0, 0, _screenCanvas.width, _screenCanvas.height);
  if (_screenTex) _screenTex.needsUpdate = true;
}

// Format du canvas vidéo (512 × 288) : sert au recadrage des dalles d'un autre format.
const _SCREEN_ASPECT = 512 / 288;

// Recadre une dalle « au plus serré » : l'image 16:9 remplit un écran d'un
// autre format (portrait des ailes de festival) en perdant ses bords, au lieu
// d'être étirée. Réservé aux dalles qui le demandent (`fit: 'cover'`) : les
// écrans existants gardent l'image entière.
function _uvCover(geo, aspect) {
  const su = Math.min(1, aspect / _SCREEN_ASPECT), sv = Math.min(1, _SCREEN_ASPECT / aspect);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++)
    uv.setXY(i, 0.5 + (uv.getX(i) - 0.5) * su, 0.5 + (uv.getY(i) - 0.5) * sv);
  uv.needsUpdate = true;
}

// Pose (ou retire) les écrans. Appelée par le preset de décor : la position
// n'est pas réglable à la main, chaque scène sait où ses écrans tombent.
// `cfg` : un objet, ou une LISTE (festival : fond de scène + écrans des
// ailes). Toutes les dalles partagent la même texture — une seule image
// décodée par frame, quel que soit le nombre d'écrans.
window.setVideoScreen = function(cfg) {
  _screenGrp.clear();
  const cfgs = !cfg ? [] : (Array.isArray(cfg) ? cfg : [cfg]);
  _screenCfg = cfgs.length ? cfgs : null;
  if (!cfgs.length) return;

  if (!_screenCanvas) {
    _screenCanvas = document.createElement('canvas');
    _screenCanvas.width = 512; _screenCanvas.height = 288;
    _screenCtx = _screenCanvas.getContext('2d');
    _screenTex = new THREE.CanvasTexture(_screenCanvas);
    _screenTex.colorSpace = THREE.SRGBColorSpace;
  }
  _screenBlack();

  for (const c of cfgs) {
    const w = c.w ?? 6.0, h = c.h ?? 3.4;
    const g = _makeLEDScreen(0, 0, w, h);
    g.userData.siVideo = !!c.siVideo;
    g.position.set(c.x ?? 0, c.y ?? 0, c.z ?? 5.0);
    // 180° par défaut : le fond de scène est du côté des Z POSITIFS (le backline
    // du décor y est planté à z = +2,5), le public est donc en Z négatif — et
    // les dalles sont construites tournées vers +Z. Sans ce demi-tour, l'écran
    // jouait pour le mur du fond, dos à la salle.
    g.rotation.y = (c.rotY ?? 180) * Math.PI / 180;
    const panel = g.userData.panel;
    if (c.fit === 'cover') _uvCover(panel.geometry, w / h);
    // `emissiveMap` et non `map` : une dalle LED ÉMET, elle ne réfléchit pas.
    // En `map` seul, l'image s'assombrissait avec l'ambiance de la salle et
    // disparaissait dès qu'on baissait la lumière — l'inverse d'un écran.
    panel.material.map = _screenTex;
    panel.material.emissiveMap = _screenTex;
    panel.material.emissive.setRGB(1, 1, 1);
    panel.material.emissiveIntensity = 1.15;
    panel.material.needsUpdate = true;
    _screenGrp.add(g);
  }
  _screenGrp.visible = _flags.screen;
  _appliquerRetourVideo();
};

// Une frame poussée par Python : data URL JPEG, ou '' pour éteindre la dalle.
window.setVideoFrame = function(dataUrl) {
  if (!_screenCtx || !_videoRetour) return;
  // Même image que la précédente (photo fixe reposée après un noir, ou retour
  // vidéo recoché) : le navigateur ne redécode pas une source inchangée,
  // `onload` ne part pas, et la dalle restait noire. On redessine à la main.
  if (dataUrl && _screenImg.src === dataUrl && _screenImg.complete) {
    _screenImg.onload();
    return;
  }
  if (!dataUrl) { _screenBlack(); return; }
  _screenImg.src = dataUrl;
};

// ─────────────────────────────────────────────────────────────────────────────
// Festival plein air — toit à 4 tours, ailes PA et grands écrans latéraux
// ─────────────────────────────────────────────────────────────────────────────
// Le treillis passe par des InstancedMesh : ~1 500 barres pour 3 draw calls.
// Un Mesh par barre, comme `buildTrusses`, en aurait coûté autant que de
// barres — de quoi faire ramer le plan 3D pour un simple décor.

// Truss carré de section `w`, de A à B : 4 membrures et un treillis en zigzag
// sur chaque face, un pas tous les 50 cm. Remplit les listes, ne crée rien.
function _trussBars(chords, lace, a, b, w = 0.40) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(B, A);
  const L = dir.length();
  dir.normalize();
  const ref = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const u = new THREE.Vector3().crossVectors(dir, ref).normalize();
  const v = new THREE.Vector3().crossVectors(u, dir).normalize();
  const h = w / 2;
  const coins = [[-h, -h], [h, -h], [h, h], [-h, h]].map(
    ([cu, cv]) => u.clone().multiplyScalar(cu).addScaledVector(v, cv));
  for (const c of coins) chords.push([A.clone().add(c), B.clone().add(c), 0.05]);
  const n = Math.max(1, Math.round(L / 0.5));
  for (let f = 0; f < 4; f++) {
    const c0 = coins[f], c1 = coins[(f + 1) % 4];
    for (let i = 0; i < n; i++) {
      const [s0, s1] = i % 2 ? [c1, c0] : [c0, c1];
      lace.push([A.clone().addScaledVector(dir, L * i / n).add(s0),
                 A.clone().addScaledVector(dir, L * (i + 1) / n).add(s1), 0.024]);
    }
  }
}

// Une liste de barres [A, B, épaisseur] → un seul InstancedMesh.
function _barsMesh(bars, mat) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, bars.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const c = new THREE.Vector3(), d = new THREE.Vector3(), s = new THREE.Vector3();
  const Y = new THREE.Vector3(0, 1, 0);
  bars.forEach(([a, b, t], i) => {
    d.subVectors(b, a);
    const L = d.length() || 1e-3;
    q.setFromUnitVectors(Y, d.divideScalar(L));
    c.addVectors(a, b).multiplyScalar(0.5);
    s.set(t, L, t);
    im.setMatrixAt(i, m.compose(c, q, s));
  });
  im.instanceMatrix.needsUpdate = true;
  // La sphère englobante d'un InstancedMesh est celle du cube unité : le décor
  // entier disparaissait dès que l'origine sortait du champ.
  im.frustumCulled = false;
  return im;
}

function _makeFestivalStage() {
  const g = new THREE.Group();
  const mat = (c, r, m, extra = {}) =>
    new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, ...extra });
  const box = (w, h, d, mt, x, y, z) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mt);
    o.position.set(x, y, z); g.add(o); return o;
  };
  const chords = [], lace = [], grille = [];
  const truss = (a, b, w) => _trussBars(chords, lace, a, b, w);

  // Gabarit. ⚠ Repris côté Python par `_SCENE_PRESETS['festival_plein_air']`
  // (rig_height), par sa vignette et par les écrans du preset ci-dessous :
  // retoucher l'un sans les autres désaligne le rig ou les dalles.
  const RX = 6.0, RZ = 4.0;       // tours du toit (±6 m × ±4 m)
  const GY = 8.2;                 // centre du gril, section 0,40 → dessous à 8,0 m
  const FY = 10.6, FX = 2.8;      // faîtage de la bâche
  const DY = 0.12;                // épaisseur du plateau
  const WZ = -RZ;                 // plan des ailes, aligné sur la face du toit
  const WT = [7.2, 8.8, 12.6];    // tours d'une aile (|x|)

  box(2*RX + 0.8, DY, 2*RZ + 0.8, mat(0x131316, 0.9, 0.05), 0, DY/2, 0);

  // ── Toit : 4 tours, gril (périmètre + ligne du milieu), bâche en croupe ──
  for (const x of [-RX, RX]) for (const z of [-RZ, RZ]) truss([x, 0, z], [x, GY + 0.4, z]);
  for (const z of [-RZ, 0, RZ]) truss([-RX, GY, z], [RX, GY, z]);
  for (const x of [-RX, RX]) truss([x, GY, -RZ], [x, GY, RZ]);

  const EX = RX + 0.5, EZ = RZ + 0.5, BY = GY + 0.25;
  const roofGeo = new THREE.BufferGeometry();
  roofGeo.setAttribute('position', new THREE.Float32BufferAttribute([
    -EX,BY,-EZ,  EX,BY,-EZ,  FX,FY,0,   -EX,BY,-EZ,  FX,FY,0, -FX,FY,0,   // pan avant
     EX,BY, EZ, -EX,BY, EZ, -FX,FY,0,    EX,BY, EZ, -FX,FY,0,  FX,FY,0,   // pan arrière
    -EX,BY, EZ, -EX,BY,-EZ, -FX,FY,0,    EX,BY,-EZ,  EX,BY,EZ, FX,FY,0,   // croupes
  ], 3));
  roofGeo.computeVertexNormals();
  const roofMat = mat(0xd6d9df, 0.8, 0.0, { side:THREE.DoubleSide, transparent:true });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  // Caméra au-dessus du faîtage : la bâche s'efface, sinon la vue DESSUS ne
  // montre qu'elle et cache tout le rig accroché dessous. Jusqu'à ZÉRO : un
  // reste de 15 % d'opacité, poussé par l'ambiance de salle et le bloom,
  // redevenait un aplat blanc opaque. (Pas `visible = false` : un objet
  // invisible n'est plus rendu, `onBeforeRender` ne serait plus jamais rappelé.)
  roof.onBeforeRender = (_r, _s, cam) => {
    const k = THREE.MathUtils.clamp((cam.position.y - FY) / 6, 0, 1);
    roofMat.opacity = 1 - k;
    roofMat.depthWrite = k < 0.05;
  };
  g.add(roof);

  // Fond de scène : c'est un écran vidéo sur toute la largeur, posé par le
  // preset (`screen`) — noir tant qu'aucun média ne joue. Plateau laissé nu.

  // ── Ailes : 3 tours, poutre haute, line array en J, subs ──
  // Les grands écrans portrait, entre les deux tours extérieures, sont des
  // dalles VIDÉO posées par le preset.
  const ballast = mat(0x6d6f73, 0.95, 0.0);
  const noir = mat(0x0f1012, 0.85, 0.12), accroche = mat(0x2b2d31, 0.5, 0.7);
  const cabGeo = new THREE.BoxGeometry(1.0, 0.32, 0.62);
  for (const s of [-1, 1]) {
    for (const x of WT) {
      truss([s*x, 0, WZ], [s*x, GY + 0.8, WZ]);
      // Pied : poutre au sol dans la profondeur, lestée aux deux bouts
      truss([s*x, 0.15, WZ - 1.4], [s*x, 0.15, WZ + 1.4], 0.30);
      for (const dz of [-1.4, 1.4]) box(0.6, 0.35, 0.6, ballast, s*x, 0.175, WZ + dz);
    }
    truss([s*RX, GY, WZ], [s*WT[2], GY, WZ]);

    const lx = s * (WT[0] + WT[1]) / 2;
    box(0.03, 0.38, 0.03, accroche, lx, GY - 0.39, WZ);       // palan
    box(1.1, 0.10, 0.75, accroche, lx, GY - 0.63, WZ);        // bumper
    // J : chaque boîte plonge un peu plus vers le public et recule d'autant
    let y = GY - 0.68, z = WZ, ang = 0;
    for (let i = 0; i < 9; i++) {
      ang += i < 3 ? 0.015 : 0.05;
      const cab = new THREE.Mesh(cabGeo, noir);
      cab.rotation.x = -ang;
      cab.position.set(lx, y - 0.16 * Math.cos(ang), z + 0.16 * Math.sin(ang));
      g.add(cab);
      y -= 0.32 * Math.cos(ang);
      z += 0.32 * Math.sin(ang);
    }
    for (const sy of [0.3, 0.9]) box(1.0, 0.6, 0.85, noir, lx, sy, WZ - 1.0);   // subs
  }

  // ── Barrière crowd devant la scène ──
  const BZ = -6.8, V = (x, y, z) => new THREE.Vector3(x, y, z);
  for (let x = -13; x <= 13.001; x += 0.14) grille.push([V(x, 0.08, BZ), V(x, 1.08, BZ), 0.02]);
  for (const y of [0.1, 1.05]) grille.push([V(-13, y, BZ), V(13, y, BZ), 0.045]);
  for (let x = -13; x <= 13.001; x += 2) grille.push([V(x, 0.02, BZ - 0.4), V(x, 0.02, BZ + 0.4), 0.06]);

  g.add(_barsMesh(chords, mat(0x9aa2ad, 0.35, 0.85)),
        _barsMesh(lace,   mat(0x6b7380, 0.45, 0.75)),
        _barsMesh(grille, mat(0x0b0b0d, 0.6, 0.4)));
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Discothèque — salle noire, estrade DJ, cercle de truss au-dessus de la piste
// ─────────────────────────────────────────────────────────────────────────────
// Murs et plafond sont des faces SIMPLES tournées vers l'intérieur : vues de
// dehors, elles ne sont pas rendues. Les caméras ISO, DESSUS et CÔTÉ regardent
// donc dans la salle comme dans une maquette coupée, sans rien masquer à la
// main — et en orbitant dedans, la salle redevient fermée.
function _makeDiscotheque() {
  const g = new THREE.Group();
  const mat = (c, r, m, extra = {}) =>
    new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, ...extra });
  const box = (w, h, d, mt, x, y, z) => {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mt);
    o.position.set(x, y, z); g.add(o); return o;
  };
  const chords = [], lace = [], cables = [];
  const truss = (a, b) => _trussBars(chords, lace, a, b, 0.30);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const cable = (x, z, y0) => cables.push([V(x, y0, z), V(x, HP, z), 0.012]);

  // Gabarit. ⚠ Repris par `_SCENE_PRESETS['discotheque']` (rig_height 4,8),
  // par sa vignette et par les écrans du preset : retoucher ensemble.
  const LX = 10, ZB = 6.5, ZF = -9, HP = 6.5;   // salle : murs ±10 m, fond, ouverture, plafond
  const TY = 5.0;                               // centre des trusses (section 0,30 → dessous à 4,85)
  const RZ = 3.2, RH = 0.6;                     // bord avant et hauteur de l'estrade
  const SX = 6.2;                               // tours du cadre de scène
  const LED = (c) => mat(0x000000, 0.5, 0.0, { emissive:c, emissiveIntensity:2.2 });

  // ── Salle ──
  const murMat = mat(0x0b0b0e, 0.95, 0.0);
  const paroi = (w, h, x, y, z, rx, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), murMat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); g.add(m);
  };
  paroi(2*LX, HP, 0, HP/2, ZB, 0, Math.PI);                    // fond
  paroi(ZB - ZF, HP, -LX, HP/2, (ZB + ZF)/2, 0,  Math.PI/2);   // murs latéraux
  paroi(ZB - ZF, HP,  LX, HP/2, (ZB + ZF)/2, 0, -Math.PI/2);
  paroi(2*LX, ZB - ZF, 0, HP, (ZB + ZF)/2, Math.PI/2, 0);      // plafond

  // ── Estrade + cabine DJ ──
  box(2*SX, RH, ZB - RZ, mat(0x141417, 0.8, 0.1), 0, RH/2, (RZ + ZB)/2);
  box(2*SX, 0.03, 0.03, LED(0xffa040), 0, RH - 0.015, RZ - 0.01);     // nez d'estrade
  const CZ = 4.2;
  box(3.4, 1.15, 0.9, mat(0x0c0c10, 0.6, 0.3), 0, RH + 0.575, CZ);
  const liser = LED(0xdfe8ff), fz = CZ - 0.46;                        // liseré en façade
  box(3.1, 0.035, 0.02, liser, 0, RH + 0.15, fz);
  box(3.1, 0.035, 0.02, liser, 0, RH + 1.00, fz);
  box(0.035, 0.85, 0.02, liser, -1.55, RH + 0.575, fz);
  box(0.035, 0.85, 0.02, liser,  1.55, RH + 0.575, fz);
  for (const x of [-0.9, 0, 0.9])                                     // platines + mixage
    box(x ? 0.45 : 0.55, 0.08, 0.45, mat(0x050507, 0.3, 0.7), x, RH + 1.19, CZ);
  const bois = mat(0x221a14, 0.85, 0.05), flight = mat(0x2c2c30, 0.5, 0.6);
  for (const s of [-1, 1]) {                                          // enceintes + flight-cases
    box(0.9, 0.9, 0.7, bois, s * 2.6, RH + 0.45, CZ + 0.2);
    box(0.9, 0.9, 0.7, bois, s * 2.6, RH + 1.35, CZ + 0.2);
    box(0.8, 0.6, 0.6, flight, s * 3.7, RH + 0.3, CZ + 0.4);
  }

  // ── Trusses : cadre de scène, cercle au-dessus de la piste, latéraux ──
  truss([-SX, TY, RZ], [SX, TY, RZ]);
  for (const s of [-1, 1]) {
    truss([s*SX, 0, RZ], [s*SX, TY + 0.3, RZ]);
    truss([s*SX, TY, RZ], [s*SX, TY, ZB - 0.5]);
    truss([s*8.5, TY, -8.0], [s*8.5, TY, 2.0]);
    for (const z of [-8.0, -3.0, 2.0]) cable(s*8.5, z, TY + 0.15);
  }
  const CR = 3.6, CC = -3.0, N = 20;
  for (let i = 0; i < N; i++) {
    const a0 = i / N * 2 * Math.PI, a1 = (i + 1) / N * 2 * Math.PI;
    truss([CR*Math.cos(a0), TY, CC + CR*Math.sin(a0)], [CR*Math.cos(a1), TY, CC + CR*Math.sin(a1)]);
  }
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    cable(CR*Math.cos(a), CC + CR*Math.sin(a), TY + 0.15);
  }

  // ── Gradins côté cour, nez de marche LED ──
  const zs0 = -8.0, zs1 = 1.5;
  for (let i = 0; i < 3; i++) {
    const h = 0.25 * (i + 1), xb = -6.8 - i * 1.0;
    box(xb + LX, h, zs1 - zs0, mat(0x151518, 0.85, 0.05), (xb - LX) / 2, h / 2, (zs0 + zs1) / 2);
    box(0.04, 0.03, zs1 - zs0, LED(0xffa040), xb + 0.02, h - 0.02, (zs0 + zs1) / 2);
  }

  // ── Arceaux inox ──
  const inox = mat(0xc9ccd2, 0.25, 0.95);
  const pied = new THREE.CylinderGeometry(0.025, 0.025, 1.0, 8);
  const barre = new THREE.CylinderGeometry(0.025, 0.025, 0.9, 8);
  const arceau = (x, z, ry) => {
    const a = new THREE.Group();
    for (const dx of [-0.45, 0.45]) {
      const p = new THREE.Mesh(pied, inox); p.position.set(dx, 0.5, 0); a.add(p);
    }
    const t = new THREE.Mesh(barre, inox); t.rotation.z = Math.PI / 2; t.position.y = 1.0; a.add(t);
    a.position.set(x, 0, z); a.rotation.y = ry; g.add(a);
  };
  for (const x of [-4.8, -3.2, 3.2, 4.8]) arceau(x, RZ - 0.5, 0);
  for (const z of [-6.5, -3.5, -0.5]) arceau(-6.4, z, Math.PI / 2);

  g.add(_barsMesh(chords, mat(0x9aa2ad, 0.35, 0.85)),
        _barsMesh(lace,   mat(0x6b7380, 0.45, 0.75)),
        _barsMesh(cables, mat(0x1a1a1c, 0.6, 0.5)));
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// DJ mobile — cabine blanche à néon MyStrow, totems lycra blancs, colonnes PA
// ─────────────────────────────────────────────────────────────────────────────
// D'après une photo de presta de mariage fournie par l'utilisateur. Pas de
// salle : l'installation est posée seule sur le sol du plan.
