const _flags = { bloom:true,  fixtures:true, trusses:true, floor:true, grid:true, fog:true };
// Souhait de l'utilisateur pour le bloom, indépendant de ce que la qualité
// impose : en qualité basse le bloom est coupé, mais on doit le retrouver
// allumé en remontant la qualité si l'utilisateur ne l'avait pas éteint.
let _bloomWanted = true;

window.toggleFlag = function(what) {
  _flags[what] = !_flags[what];
  const _el = document.getElementById('b-'+what);
  if (_el) _el.classList.toggle('on', _flags[what]);

  if (what === 'bloom')    { _bloomWanted = _flags.bloom;
                             // Le composer n'est plus redimensionné tant que le
                             // bloom est éteint : on le remet à niveau ici.
                             if (_flags.bloom) composer.setSize(W(), H()); }
  if (what === 'fixtures') { _fixtureGrp.visible = _flags.fixtures; }
  if (what === 'trusses')  { _trussGrp.visible   = _flags.trusses;  }
  if (what === 'floor')    { floorReflector.visible = _flags.floor;
                             floorTint.visible      = _flags.floor;   }
  if (what === 'grid')     { gridHelper.visible   = _flags.grid;     }
  if (what === 'fog')      { scene.fog = _flags.fog ? fog : null;    }
};

// ─────────────────────────────────────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────────────────────────────────────
// Redimensionnement : ne RIEN faire si la taille n'a pas bougé.
//
// setSize() réalloue les tampons du GPU, ce qui coûte une image noire sur
// beaucoup de pilotes. Or l'événement `resize` part aussi pour des raisons qui
// ne changent pas la taille utile de la vue — apparition d'une barre de
// défilement à côté, redessin du panneau, changement d'échelle système. D'où
// des clignotements noirs dans le plan 3D seul, sans que rien n'ait bougé.
let _lastW = 0, _lastH = 0;
window.addEventListener('resize', () => {
  const w = W(), h = H();
  if (w === _lastW && h === _lastH) return;
  _lastW = w; _lastH = h;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (_flags.bloom) composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
});

// ─────────────────────────────────────────────────────────────────────────────
// Animation continue : rotation gobo + split prisme (par frame)
// ─────────────────────────────────────────────────────────────────────────────
const _fxColBuf = new THREE.Color();

function _orientPrism(obj, t) {
  const s = obj._fx;
  const pm0 = obj.prismBeams, pp0 = obj.prismPools;
  if (!s || !s.active) {
    for (let k = 0; k < 2; k++) {
      pm0[k].visible = pp0[k].visible = false;
    }
    return;
  }

  // ── Rotation gobo continue (valeur DMX = vitesse) ──
  if (s.goboRotV > 0) {
    const gspd = (s.goboRotV / 255) * 2.4;          // rad/s max
    const grot = t * gspd;
    if (obj.pool.material.uniforms.uGoboBlend.value > 0)
      obj.pool.material.uniforms.uGoboRot.value = grot;
    // Le faisceau tourne avec la tache : sans ça, gobo figé dans la fumée et
    // motif tournant au sol — deux images du même gobo qui se contredisent.
    const _bu2 = obj.cVol && obj.cVol.material.uniforms;
    if (_bu2 && _bu2.uGoboBlend.value > 0) _bu2.uGoboRot.value = grot;
  }

  // ── Prisme : 2 faisceaux/taches latéraux opposés, tournants ──
  if (!s.prism) {
    for (let k = 0; k < 2; k++) {
      pm0[k].visible = pp0[k].visible = false;
    }
    return;
  }
  _fxColBuf.setRGB(s.col[0], s.col[1], s.col[2]);
  const pspd = (s.prismV / 255) * 2.2;              // rad/s — 0 = split fixe (comme une vraie lyre)
  const ang  = t * pspd;
  const R    = Math.max(0.4, s.poolR * 0.55);       // écart des faisceaux au sol
  for (let k = 0; k < 2; k++) {
    const a  = ang + k * Math.PI;                   // 2 côtés opposés du faisceau central
    const bx = s.fx + Math.cos(a) * R;
    const bz = s.fz + Math.sin(a) * R;
    // Faisceau latéral : même shader volumétrique, enveloppe plus étroite
    orientCone(pm0[k], s.lensX, s.lensY, s.lensZ, bx, s.baseY, bz, s.base_r * 1.1);
    const _pu = pm0[k].material.uniforms;
    _pu.uColor.value.copy(_fxColBuf);
    _pu.uSharp.value = 5.20;
    _pu.uCore.value  = 1.3;
    _pu.uAlpha.value = 0.65 * s.lvl * window.beamGain;
    if (s.hitsFloor) {
      pp0[k].position.set(bx, 0.02, bz);
      pp0[k].scale.setScalar(s.poolR * 0.7);
      pp0[k].material.uniforms.uColor.value.copy(_fxColBuf);
      pp0[k].material.uniforms.uAlpha.value = 0.50 * s.lvl;
      pp0[k].material.uniforms.uGoboBlend.value = 0.0;
      pp0[k].visible = true;
    } else {
      pp0[k].visible = false;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Boucle de rendu
// ─────────────────────────────────────────────────────────────────────────────
// ── Niveaux de qualité ───────────────────────────────────────────────────
// Le raymarching coûte au fragment : sur un portable modeste avec beaucoup de
// projecteurs, il faut pouvoir retomber sur un rendu plus léger.
// `oct` = octaves de bruit du brouillard. En qualité Bas on tombe à 1 : les
// volutes restent lisibles alors que le fbm coûte trois fois moins.
const QUALITY = [
  { name:'Bas',   steps: 8,  ratio: 1.0, refl:false, bloom:false, oct: 1 },
  { name:'Moyen', steps: 16, ratio: 1.5, refl:true,  bloom:true,  oct: 2 },
  { name:'Haut',  steps: 24, ratio: 2.0, refl:true,  bloom:true,  oct: 2 },
  { name:'Ultra', steps: 40, ratio: 2.0, refl:true,  bloom:true,  oct: 3 },
];
window.qualityLevel = 2;
window.autoQuality  = true;

window.setQuality = function (lvl, redimensionner) {
  lvl = Math.max(0, Math.min(QUALITY.length - 1, lvl | 0));
  window.qualityLevel = lvl;
  const q = QUALITY[lvl];
  window.setBeamQuality(q.steps);
  window.setFogOctaves(q.oct);

  // Changer la résolution de rendu réalloue les tampons du GPU, ce qui coûte
  // UNE IMAGE NOIRE sur beaucoup de pilotes. Acceptable quand l'utilisateur
  // choisit lui-même sa qualité — il s'y attend. Inacceptable quand c'est la
  // dégradation automatique qui se déclenche : l'écran clignote en noir sans
  // que personne n'ait rien demandé, et ça se répète à chaque palier.
  // Par défaut on redimensionne ; la dégradation auto passe `false` et se
  // contente de réduire les pas de raymarching, qui est de toute façon le
  // poste le plus coûteux.
  const _ratioVoulu = Math.min(window.devicePixelRatio, q.ratio);
  if (redimensionner !== false &&
      Math.abs(renderer.getPixelRatio() - _ratioVoulu) > 1e-3) {
    renderer.setPixelRatio(_ratioVoulu);
    renderer.setSize(W(), H());
    composer.setSize(W(), H());
  }
  // Le sol n'est plus un miroir : la qualité n'a plus à l'éteindre. Garder
  // ces lignes ferait disparaître le sol lui-même en qualité Bas/Moyen, où
  // `refl` valait false. Seul le bouton « Sol » contrôle sa visibilité.
  _flags.bloom = q.bloom && _bloomWanted;
  return q.name;
};

// ── Compteur de performance ──────────────────────────────────────────────
const _fpsEl = document.getElementById('fps');
let _fpsFrames = 0, _fpsLast = performance.now(), _fpsValue = 60;
let _slowStreak = 0;
window.showFps = function (on) {
  _fpsEl.style.display = on ? 'block' : 'none';
};
window.getFps = function () { return _fpsValue; };

// Clignotement blanc du projecteur sélectionné.
//
// Appliqué dans la boucle de rendu et non dans updateScene() : celle-ci n'est
// appelée que lorsque Python pousse un état (~25 fps, et pas du tout si rien
// ne bouge dans le show). Un clignotement qui s'arrête dès que la scène est
// figée n'attirerait l'œil que par hasard.
function _selBlink(t) {
  if (_selSet.size === 0) return;
  // Battement doux entre 25 % et 100 % — un créneau franc fatigue vite.
  // Même phase pour tous : des projecteurs qui battent ensemble se lisent
  // comme un groupe, alors que des phases décalées ressembleraient à un effet.
  const k = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 6.0));
  for (const i of _selSet) _selBlinkOne(i, k);
}

function _selBlinkOne(i, k) {
  if (i < 0 || i >= _objs.length) return;
  const obj = _objs[i];
  const bu = obj.cVol && obj.cVol.visible && obj.cVol.material.uniforms;
  if (bu && obj._selA !== undefined) bu.uAlpha.value = obj._selA * k;
  if (obj.lensGlow && obj.lensGlow.visible && obj._selG !== undefined)
    obj.lensGlow.material.opacity = obj._selG * k;
  if (obj.pool && obj.pool.visible && obj._selP !== undefined)
    obj.pool.material.uniforms.uAlpha.value = obj._selP * k;
}

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const _now = performance.now();
  const _t = _now / 1000;
  // Dérive du brouillard.
  //
  // L'offset est SOUSTRAIT de la position d'échantillonnage du bruit : une
  // composante Y négative fait donc MONTER les volutes — c'est le sens dans
  // lequel une fumée de scène se déplace, tirée par la chaleur des lampes.
  // Les termes en sinus, de périodes non harmoniques, ajoutent un balancement
  // latéral : sans eux, la fumée défile comme un tapis roulant, ce qui se
  // repère tout de suite. Les vitesses sont en unités de bruit par seconde ;
  // à la finesse par défaut (0,55 m⁻¹), 0,16 vaut ≈ 29 cm/s.
  if (window.fogAmount > 0) {
    const v = window.fogSpeed;
    const w = _t * v;
    const dx =  w * 0.055 + Math.sin(_t * 0.11 * v) * 0.35 * v;
    const dy = -w * 0.160;
    const dz =  w * 0.037 + Math.cos(_t * 0.09 * v) * 0.28 * v;
    for (let i = 0; i < _beamMats.length; i++) {
      _beamMats[i].uniforms.uFogDrift.value.set(dx, dy, dz);
    }
  }
  for (let i = 0; i < _objs.length; i++) _orientPrism(_objs[i], _t);
  _selBlink(_t);
  if (_flags.bloom) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }

  // Mesure sur une fenêtre glissante d'une demi-seconde
  _fpsFrames++;
  if (_now - _fpsLast >= 500) {
    _fpsValue = (_fpsFrames * 1000) / (_now - _fpsLast);
    _fpsFrames = 0;
    _fpsLast = _now;
    if (_fpsEl.style.display !== 'none') {
      const inf = renderer.info.render;
      _fpsEl.textContent =
        `${_fpsValue.toFixed(0)} fps · ${QUALITY[window.qualityLevel].name}\n` +
        `${inf.calls} draws · ${window.beamQuality} pas`;
    }
    // Dégradation automatique : on ne descend jamais tout seul d'un coup, il
    // faut 3 mesures lentes d'affilée (≈1,5 s) pour éviter de réagir à un
    // à-coup de chargement.
    // Seuil bas volontairement : MyStrow ne pousse l'état des projecteurs
    // qu'à 25 fps, au-delà le rendu n'apporte plus rien. On ne dégrade donc
    // que quand ça devient réellement saccadé.
    if (window.autoQuality && _fpsValue < 20 && window.qualityLevel > 0) {
      if (++_slowStreak >= 3) {
        _slowStreak = 0;
        // Sans redimensionnement : pas de clignotement noir à l'écran.
        window.setQuality(window.qualityLevel - 1, false);
      }
    } else {
      _slowStreak = 0;
    }
  }
})();

// ─────────────────────────────────────────────────────────────────────────────
// Props de scène
// ─────────────────────────────────────────────────────────────────────────────
const _propsGrp = new THREE.Group();
scene.add(_propsGrp);

const _SILO_MAT = new THREE.MeshStandardMaterial({ color:0x0d0d1a, roughness:0.95, metalness:0.0 });

function _makePersonSilhouette(x, z, hScale = 1.0) {
  const g = new THREE.Group();
  const h = 1.75 * hScale;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.20, h * 0.55, 4, 8), _SILO_MAT);
  body.position.set(0, h * 0.55, 0);
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17 * hScale, 10, 7), _SILO_MAT);
  head.position.set(0, h * 1.02, 0);
  g.add(head);
  g.position.set(x, 0, z);
  return g;
}

function _makeDJBooth(x, z) {
  const g = new THREE.Group();
  const matBody = new THREE.MeshStandardMaterial({ color:0x1a1a2e, roughness:0.6, metalness:0.3 });
  const matTop  = new THREE.MeshStandardMaterial({ color:0x2a2a3e, roughness:0.3, metalness:0.6 });
  const matCDJ  = new THREE.MeshStandardMaterial({ color:0x0a0a14, roughness:0.2, metalness:0.85 });

// Sono mobile — inspiré du GLB sonomobile_scene.glb
// Remorque 6×4m marron, 4 pieds de truss, 2 colonnes speaker suspendues, 6 satellites, 4 roues
function _makeSonomobile(x, z) {
  const g = new THREE.Group();
  const mat = (c, r, m) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
  const add = (geo, col, r, m, px, py, pz) => {
    const mesh = new THREE.Mesh(geo, mat(col, r, m));
    mesh.position.set(px, py, pz);
    g.add(mesh);
    return mesh;
  };

  // Plateau remorque (GLB: 6×4×0.2m, marron RGB 120,70,30)
  add(new THREE.BoxGeometry(6.0, 0.20, 4.0), 0x7a4618, 0.75, 0.08,  0, 0.10, 0);
  // Rails latéraux châssis
  for (const sx of [-3.0, 3.0])
    add(new THREE.BoxGeometry(0.08, 0.28, 4.0), 0xb4b4b4, 0.30, 0.80, sx, 0.24, 0);
  // Flèche de remorque (côté -Z = derrière)
  add(new THREE.BoxGeometry(0.10, 0.10, 1.2), 0xb4b4b4, 0.35, 0.75, 0, 0.25, -2.6);

  // Console DJ
  add(new THREE.BoxGeometry(2.2, 1.0, 1.0), 0x1a1a28, 0.55, 0.35,  0, 0.70, -0.3);
  add(new THREE.BoxGeometry(2.2, 0.05, 1.0), 0x2a2a3e, 0.25, 0.65, 0, 1.225,-0.3);
  for (const bx of [-0.55, 0.55])
    add(new THREE.CylinderGeometry(0.18,0.18,0.04,18), 0x0a0a14, 0.15, 0.85, bx, 1.27, -0.3);
  add(new THREE.BoxGeometry(0.55, 0.06, 0.42), 0x0a0a14, 0.15, 0.85, 0, 1.255, -0.3);

  // Barres latérales de truss (gauche/droite — les barres avant/arrière viennent de buildTrusses)
  const trussY = 3.40;
  for (const bx of [-2.5, 2.5])
    add(new THREE.BoxGeometry(0.09, 0.09, 3.0), 0xc8c8c8, 0.25, 0.85, bx, trussY, 0);

  // Speaker stacks suspendus (GLB: ±3.2m X, face +Z = vers piste)
  for (const sx of [-3.2, 3.2]) {
    const spkH = 1.50, spkY = trussY - 0.18 - spkH/2;
    add(new THREE.BoxGeometry(0.60, spkH, 0.55), 0x090909, 0.95, 0.06, sx, spkY, 1.5);
    add(new THREE.BoxGeometry(0.56, spkH-0.06, 0.02), 0x0e0e0e, 1.0, 0.0, sx, spkY, 1.785);
    add(new THREE.BoxGeometry(0.04, 0.30, 0.04), 0xb4b4b4, 0.28, 0.82, sx, trussY-0.10, 1.5);
  }

  // 6 satellites sur la barre avant (GLB: X=±2,±1.2,±0.4, face +Z)
  for (const sx of [-2.0,-1.2,-0.4,0.4,1.2,2.0]) {
    add(new THREE.BoxGeometry(0.22, 0.22, 0.24), 0x5a5a5a, 0.60, 0.40, sx, trussY-0.14, 1.5);
    add(new THREE.BoxGeometry(0.02, 0.12, 0.02), 0xb4b4b4, 0.30, 0.80, sx, trussY-0.06, 1.5);
  }

  // Roues (4 roues, 2 essieux)
  for (const wz of [-1.5, 1.5]) {
    for (const wx of [-2.3, 2.3]) {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.22,16),
        mat(0x1a1a1a,0.90,0.10));
      tire.rotation.z = Math.PI/2;
      tire.position.set(wx, 0.28, wz);
      g.add(tire);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.24,12),
        mat(0x6a6a7a,0.40,0.70));
      rim.rotation.z = Math.PI/2;
      rim.position.set(wx, 0.28, wz);
      g.add(rim);
    }
  }

  g.position.set(x, 0, z);
  return g;
}

// Totem — tour autoportante truss + colonne de haut-parleurs + lyre au sommet
function _makeTotem(x, z, height=4.5, nSpk=5) {
  const g   = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

  // Lestage (béton/acier)
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.46,0.65), mat(0x232323,0.85,0.18));
  base.position.set(0,0.23,0); g.add(base);
  const bride = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.05,0.42), mat(0x606070,0.40,0.70));
  bride.position.set(0,0.48,0); g.add(bride);

  // 2 tubes verticaux
  const colH   = height - 0.46;
  const tubeY  = 0.48 + colH/2;
  for (const tx of [-0.09, 0.09]) {
    const tb = new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,colH,10), mat(0xb0b8c8,0.28,0.85));
    tb.position.set(tx, tubeY, 0); g.add(tb);
  }
  // Barres horizontales de truss
  const nBars = Math.ceil(colH / 0.42);
  const bStep = colH / nBars;
  for (let i=0; i<=nBars; i++) {
    const hb = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.024,0.024), mat(0x8898a8,0.35,0.75));
    hb.position.set(0, 0.48+i*bStep, 0); g.add(hb);
  }

  // Colonne de haut-parleurs (face +Z = vers la piste)
  const spkStart = 0.48 + colH*0.10;
  const totalSpkH = colH * 0.78;
  const unitH     = totalSpkH / nSpk;
  for (let i=0; i<nSpk; i++) {
    const sy  = spkStart + i*unitH + unitH/2;
    const spk = new THREE.Mesh(new THREE.BoxGeometry(0.28, unitH*0.91, 0.22), mat(0x080808,0.95,0.05));
    spk.position.set(0, sy, 0.14); g.add(spk);
    if (i < nSpk-1) {
      const sep = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.008,0.22), mat(0x181818,0.95,0.05));
      sep.position.set(0, spkStart+(i+1)*unitH, 0.14); g.add(sep);
    }
  }

  // Pas de lyre décorative au sommet des totems : ces 4 maillages dorés
  // (yoke + 2 bras + tête) imitaient un projecteur qui n'existe pas dans le
  // patch. On voyait donc 6 lyres orange allumées en permanence, impossibles à
  // piloter et faciles à confondre avec de vrais projecteurs. Le décor ne doit
  // représenter que ce qui n'est pas un projecteur ; les projecteurs, eux,
  // viennent du patch.

  g.position.set(x, 0, z);
  return g;
}

// Portique truss (goalpost)
function _makeGoalpost(x, z, h, spread=2.0, rotY=0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const bar = new THREE.Mesh(new THREE.BoxGeometry(spread*2+0.24,0.20,0.26), mat(0x8898b8,0.30,0.88));
  bar.position.set(0,h,0); g.add(bar);
  for (const dy of [0.09,-0.09]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(spread*2+0.24,0.030,0.030),
      new THREE.MeshStandardMaterial({color:0xc0d0e8,roughness:0.32,metalness:0.90}));
    rail.position.set(0,h+dy,0); g.add(rail);
  }
  for (const lx of [-spread,spread]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09,h,0.09), mat(0x7888a8,0.38,0.82));
    leg.position.set(lx,h/2,0); g.add(leg);
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.05,0.50), mat(0x3a4055,0.55,0.65));
    base.position.set(lx,0.025,0); g.add(base);
    const dSign = lx>0?1:-1, diagLen = Math.sqrt((spread*0.55)**2+(h*0.50)**2);
    const diag = new THREE.Mesh(new THREE.BoxGeometry(0.036,diagLen,0.036), mat(0x607090,0.42,0.72));
    diag.position.set(lx-dSign*spread*0.275, h*0.50/2, 0);
    diag.rotation.z = Math.atan2(spread*0.55, h*0.50)*dSign; g.add(diag);
  }
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Arche décorative avec guirlande lumineuse
function _makeArch(x, z, h=2.8, w=2.2, rotY=0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const postH=h*0.72, arcR=w*0.50+0.04, arcCY=postH;
  for (const lx of [-w/2,w/2]) {
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,postH,10),mat(0xeeeee8,0.28,0.18));
    post.position.set(lx,postH/2,0); g.add(post);
  }
  const nSeg=16;
  for (let i=0;i<nSeg;i++) {
    const a0=Math.PI+i*(Math.PI/nSeg), a1=Math.PI+(i+1)*(Math.PI/nSeg);
    const mx=arcR*Math.cos((a0+a1)/2), my=arcCY+arcR*Math.sin((a0+a1)/2);
    const dx=arcR*(Math.cos(a1)-Math.cos(a0)), dy=arcR*(Math.sin(a1)-Math.sin(a0));
    const sLen=Math.sqrt(dx*dx+dy*dy)*1.02;
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.036,sLen,7),mat(0xeeeee8,0.28,0.18));
    seg.position.set(mx,my,0); seg.rotation.z=Math.atan2(dx,dy)-Math.PI; g.add(seg);
  }
  // Guirlande lumineuse
  const nL=32, LCOLS=[0xffee88,0xffffff,0xffcc44,0xffffff];
  for (let i=0;i<=nL;i++) {
    const t=i/nL, pF=0.22;
    let lx,ly;
    if (t<pF) { lx=-w/2; ly=(t/pF)*postH; }
    else if (t>1-pF) { lx=w/2; ly=((1-t)/pF)*postH; }
    else { const tA=(t-pF)/(1-2*pF), a=Math.PI+tA*Math.PI; lx=arcR*Math.cos(a); ly=arcCY+arcR*Math.sin(a); }
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.024,5,4),
      new THREE.MeshStandardMaterial({emissive:new THREE.Color(LCOLS[i%LCOLS.length]),emissiveIntensity:2.2,color:0xffffff}));
    dot.position.set(lx,ly,0.06); g.add(dot);
  }
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}

// Catwalk / passerelle de scène
function _makeCatwalk(x, z, length, w=1.0) {
  const g = new THREE.Group();
  const mat = (c,r,m) => new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const deck=new THREE.Mesh(new THREE.BoxGeometry(w,0.055,length),mat(0x0f0f1a,0.82,0.14));
  deck.position.set(0,0.0275,0); g.add(deck);
  const edgeMat=mat(0x505868,0.34,0.78);
  for (const lx of [-w/2+0.02,w/2-0.02]) {
    const topR=new THREE.Mesh(new THREE.BoxGeometry(0.030,0.030,length+0.06),edgeMat);
    topR.position.set(lx,0.92,0); g.add(topR);
    const nLegs=Math.max(2,Math.ceil(length/1.5));
    for (let j=0;j<=nLegs;j++) {
      const legZ=-length/2+j*(length/nLegs);
      const leg=new THREE.Mesh(new THREE.BoxGeometry(0.024,0.90,0.024),edgeMat);
      leg.position.set(lx,0.478,legZ); g.add(leg);
    }
  }
  // Strip LED latéral (ambiance piste)
  for (const lx of [-w/2+0.01,w/2-0.01]) {
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.010,0.008,length),
      new THREE.MeshStandardMaterial({emissive:0x003366,emissiveIntensity:1.5,color:0x000033}));
    strip.position.set(lx,0.05,0); g.add(strip);
  }
  g.position.set(x,0,z); return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Import de scène GLTF/GLB depuis Python (base64)
// ─────────────────────────────────────────────────────────────────────────────
const _gltfLoader    = new GLTFLoader();
const _importedGrp   = new THREE.Group();
scene.add(_importedGrp);

window.loadGLTF = function(b64, isGLB) {
  // Décode base64 → ArrayBuffer
  const bin    = atob(b64);
  const bytes  = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buffer = bytes.buffer;

  _gltfLoader.parse(buffer, '', (gltf) => {
    _importedGrp.clear();
    // Normalise la scène importée, puis la POSE SUR LE SOL (y=0) en la centrant
    // seulement en X/Z. Centrer aussi en Y enterrait le modèle : le plancher du
    // plan traversait le décor à mi-hauteur.
    const box    = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale  = maxDim > 0.01 ? 12.0 / maxDim : 1.0;
    gltf.scene.scale.setScalar(scale);
    gltf.scene.position.set(-center.x * scale,
                            -box.min.y * scale,
                            -center.z * scale);
    _importedGrp.add(gltf.scene);
  }, (err) => console.error('GLTF import error:', err));
};

window.clearImportedScene = function() { _importedGrp.clear(); };

// Sol / grille / cyclorama : ajoutés directement à la scène (pas dans _propsGrp),
// donc les presets ne peuvent pas les enlever. Nécessaire quand le décor vient
// d'un modèle importé qui apporte son propre sol.

window.setBloom = function(strength) {
  if (window.bloomPass) window.bloomPass.strength = strength;
  _flags.bloom = strength > 0;
};

window.setScenePreset = function(name) {
  const preset = SCENE_PRESETS[name];
  if (!preset) return;
  _propsGrp.clear();
  buildTrusses(preset.trusses);
  preset.buildProps();
  window.currentTrusses = JSON.parse(JSON.stringify(preset.trusses));
};
