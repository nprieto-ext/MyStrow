<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plan de feu 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#05050f; overflow:hidden; user-select:none; }
canvas { display:block; }


/* ── Footer ──────────────────────────────────────────────────────────── */
#footer {
  position:fixed; bottom:5px; left:8px;
  color:#1e1e3a; font-size:9px;
  font-family:'Segoe UI',sans-serif; letter-spacing:0.3px;
  pointer-events:none;
}
#loading {
  position:fixed; top:50%; left:45%; transform:translate(-50%,-50%);
  color:#333355; font-family:'Segoe UI',sans-serif; font-size:12px;
  letter-spacing:1px;
}
/* ── Compteur de performance (masqué par défaut) ──────────────────────── */
#fps {
  position:fixed; top:6px; right:8px; display:none;
  color:#5ad0ff; font-size:10px; font-family:Consolas,monospace;
  background:rgba(6,6,18,0.72); border:1px solid #1c2740;
  border-radius:3px; padding:3px 7px; letter-spacing:0.4px;
  pointer-events:none; white-space:pre;
}
</style>
</head>
<body>

<div id="loading">Chargement Three.js…</div>


<div id="fps"></div>

<div id="footer">drag: orbite · scroll: zoom · double-clic: reset</div>

<!-- Three.js EN LOCAL (vendor/three, version 0.161.0).
     Surtout pas de CDN : en prestation la machine est très souvent hors ligne
     ou derrière un réseau fermé, et un import de module qui échoue est
     silencieux — la fenêtre resterait bloquée sur « Chargement Three.js… ».
     Les chemins sont relatifs au HTML, donc vendor/ doit rester à côté de
     plan_3d_web.html (y compris dans le bundle PyInstaller). -->
<script type="importmap">
{
  "imports": {
    "three":          "./vendor/three/three.module.js",
    "three/addons/":  "./vendor/three/addons/"
  }
}
</script>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries }  from 'three/addons/utils/BufferGeometryUtils.js';

document.getElementById('loading').remove();

// ── Sélection projector (raycasting + QWebChannel) ───────────────────────────
let _selectedProjo = -1;
// Sélection MULTIPLE : tous les projecteurs sélectionnés s'allument en blanc et
// clignotent. `_selectedProjo` reste le « primaire » — celui dont le corps
// prend le surlignage bleu et que suit le panneau de réglages.
let _selSet = new Set();
const _raycaster   = new THREE.Raycaster();
const _mouse2D     = new THREE.Vector2();
let   _ptrDownPos  = null;   // pour distinguer clic vs drag

// ─────────────────────────────────────────────────────────────────────────────
// Renderer
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
// Tone mapping ACES : rendu plus « filmique », meilleure tenue des hautes
// lumières (les faisceaux saturés ne cramment plus en blanc pur).
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.renderer = renderer;

// ─────────────────────────────────────────────────────────────────────────────
// Scene + Camera
// ─────────────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
// Haze atmosphérique : un peu plus dense qu'avant → l'air « accroche » la
// lumière, les faisceaux lointains se fondent dans une ambiance enfumée
// (l'équivalent light du brouillard volumétrique d'Unreal, en bien plus léger).
const fog = new THREE.FogExp2(0x060612, 0.030);
scene.fog = fog;
window.scene = scene;   // exposé pour le diagnostic depuis Qt
// Réglable en live depuis Python si besoin (densité 0.010–0.060).
window.setHaze = function(density) {
  fog.density = Math.max(0.0, Math.min(0.08, density));
};

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const camera = new THREE.PerspectiveCamera(52, W()/H(), 0.2, 300);
camera.position.set(14, 11, -20);
camera.lookAt(0, 3, 0);

// ─────────────────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping  = false;
controls.minDistance    = 3;
controls.maxDistance    = 70;
controls.maxPolarAngle  = Math.PI * 0.89;
controls.update();


renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(14, 11, -20);
  controls.target.set(0, 3, 0);
  controls.update();
});

// ─────────────────────────────────────────────────────────────────────────────
// Post-processing — Bloom
// ─────────────────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
window.bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  0.65,  // strength — bloom activé par défaut pour l'ambiance
  0.42,  // radius
  0.08   // threshold — très bas pour capter même les lumières faibles
);
composer.addPass(window.bloomPass);

// Vignette + léger boost de contraste : touche « ciné » qui concentre le
// regard au centre et assombrit les bords, comme dans les rendus Unreal.
const VignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    uStrength: { value: 0.62 },   // 0 = aucune vignette, 1 = très marquée
    uContrast: { value: 1.06 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uStrength; uniform float uContrast;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // Contraste doux autour du gris moyen
      c.rgb = (c.rgb - 0.5) * uContrast + 0.5;
      // Vignette radiale
      vec2 d = vUv - 0.5;
      float v = smoothstep(0.85, 0.30, dot(d, d) * uStrength * 4.0);
      gl_FragColor = vec4(c.rgb * (0.55 + 0.45 * v), c.a);
    }`,
};
window.vignettePass = new ShaderPass(VignetteShader);
composer.addPass(window.vignettePass);

composer.addPass(new OutputPass());

// ─────────────────────────────────────────────────────────────────────────────
// Lumières de scène
// ─────────────────────────────────────────────────────────────────────────────
window.ambLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(window.ambLight);

const hemi = new THREE.HemisphereLight(0x8090c0, 0x000000, 0.18);
scene.add(hemi);

// Lumière de remplissage douce (toujours présente — visibilité de scène)
const _fillLight = new THREE.DirectionalLight(0xb0c0e0, 0.35);
_fillLight.position.set(0, 10, 4);
scene.add(_fillLight);

// Ambiance salle — un seul point d'entrée pour les TROIS lumières d'ambiance.
// Le curseur ne pilotait que l'AmbientLight : elle éclaire à plat, sature vite
// et ne donne jamais l'impression d'une salle éclairée. En montant aussi
// l'hémisphérique (dégradé haut/bas, qui « ouvre » le volume) et le
// remplissage, le curseur devient réellement efficace sur toute sa course.
// x = 1.0 reproduit exactement le réglage d'origine.
window.setRoomAmbience = function (x) {
  x = Math.max(0, x);
  window.ambLight.intensity = 2.0  * x;
  hemi.intensity            = 0.18 * x;
  _fillLight.intensity      = 0.35 * x;
};

// ─────────────────────────────────────────────────────────────────────────────
// Géométrie de scène
// ─────────────────────────────────────────────────────────────────────────────

// Sol — plan mat, SANS réflexion.
//
// C'était un Reflector (effet « sol mouillé ») qui renvoyait les faisceaux et
// les taches de couleur. Rendu flatteur en capture d'écran, mais gênant à
// l'usage : chaque projecteur apparaissait en double et la scène devenait
// difficile à lire. Le miroir est supprimé, pas seulement masqué — un
// Reflector coûte une passe de rendu complète et une cible 1024², donc autant
// de FPS récupérés sur les machines modestes.
//
// `floorReflector` reste le nom exposé : c'est lui que manipulent le bouton
// « Sol », le niveau de qualité et window.setFloorVisible(). Il désigne
// désormais ce plan mat, et tous ces réglages continuent de fonctionner.
//
// ⚠️ L'EMPRISE du sol est déclarée ici et NULLE PART AILLEURS : c'est la même
// qui borne le point d'arrivée des faisceaux dans `beamFloor()`. Les deux
// avaient divergé — plancher 18 × 10 (x ±9, z ±5) contre une arrivée bornée à
// x ±11 et z ∈ [−8, 13]. Un faisceau incliné vers le public atterrissait donc
// jusqu'à 3 m DEVANT le bord du plancher : le cône traversait la scène et sa
// tache flottait sur le noir (capture `depasse.png`, 11/09/2026). Le public
// étant côté −z (caméra en z = −20), c'est vers l'avant que ça se voyait.
// Z0 vaut -9 et non -8 (la borne d'origine) : la grille de scène fait 18 × 18,
// donc z ∈ [-9, 9]. À -8 il restait un mètre de grille tracée sur le vide, côté
// public. Le plancher doit contenir la grille, jamais l'inverse.
const FLOOR_X0 = -11.0, FLOOR_X1 = 11.0;
const FLOOR_Z0 =  -9.0, FLOOR_Z1 = 13.0;
const FLOOR_W  = FLOOR_X1 - FLOOR_X0, FLOOR_D  = FLOOR_Z1 - FLOOR_Z0;
const FLOOR_CX = (FLOOR_X0 + FLOOR_X1) / 2, FLOOR_CZ = (FLOOR_Z0 + FLOOR_Z1) / 2;

const floorReflector = new THREE.Mesh(
  new THREE.PlaneGeometry(FLOOR_W, FLOOR_D),
  new THREE.MeshStandardMaterial({ color:0x0d0b16, roughness:0.94, metalness:0.04 })
);
floorReflector.rotation.x = -Math.PI / 2;
floorReflector.position.set(FLOOR_CX, 0.0, FLOOR_CZ);
scene.add(floorReflector);
window.floorReflector = floorReflector;

// Voile sombre conservé : il donnait sa couleur au sol en plus d'atténuer le
// reflet. Opaque maintenant qu'il n'y a plus de miroir dessous.
const floorTint = new THREE.Mesh(
  new THREE.PlaneGeometry(FLOOR_W, FLOOR_D),
  new THREE.MeshBasicMaterial({ color:0x090710, transparent:true, opacity:0.55 })
);
floorTint.rotation.x = -Math.PI / 2;
floorTint.position.set(FLOOR_CX, 0.004, FLOOR_CZ);
scene.add(floorTint);
window.floorTint = floorTint;

// Grille de scène — volontairement PLUS PETITE que le plancher : c'est elle
// qui marque le plateau (18 × 18 m), le plancher débordant jusque sous les
// taches des faisceaux qui partent au-delà du bord de scène.
const gridHelper = new THREE.GridHelper(18, 18, 0x141018, 0x0d0a12);
gridHelper.position.y = 0.008;
scene.add(gridHelper);

// Cyclorama (fond de scène) — DERRIÈRE la scène, donc côté Z positif, face
// tournée vers la salle. Il était à z = -5.6 tourné vers +Z : correct tant que
// la caméra regardait depuis le fond, mais depuis qu'elle est passée côté
// public il se retrouvait ENTRE la caméra et le rig, en voile bleu vertical
// devant tout — et il s'évanouissait dès qu'on tournait un peu, puisque
// `FrontSide` le rend invisible de dos.
// `FrontSide` est gardé volontairement : en passant derrière la scène, le fond
// s'efface au lieu de masquer le rig.
const cycMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 11),
  new THREE.MeshStandardMaterial({ color:0x060412, roughness:1.0, side:THREE.FrontSide })
);
cycMesh.position.set(0, 5.5, 5.6);
cycMesh.rotation.y = Math.PI;
scene.add(cycMesh);


// ─────────────────────────────────────────────────────────────────────────────
// Truss
// ─────────────────────────────────────────────────────────────────────────────
const _trussGrp = new THREE.Group();
scene.add(_trussGrp);

const _barMat = new THREE.MeshStandardMaterial({ color:0x8898b8, roughness:0.30, metalness:0.88 });
const _diagMat = new THREE.MeshStandardMaterial({ color:0x607090, roughness:0.45, metalness:0.75 });
const _legMat2 = new THREE.MeshStandardMaterial({ color:0x708298, roughness:0.38, metalness:0.82 });

function buildTrusses(defs) {
  _trussGrp.clear();
  for (const td of defs) {
    if (!td.enabled) continue;
    const hy = td.height ?? 7.0, tz = td.z ?? 0;
    const xl = td.x_l ?? -9, xr = td.x_r ?? 9, len = xr - xl;

    // Barre principale
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.26, 0.34), _barMat);
    bar.position.set((xl+xr)/2, hy, tz);
    _trussGrp.add(bar);

    // Rails supérieur/inférieur (cordons lumineux)
    for (const [dy, col] of [[0.14, 0xc0cce8], [-0.14, 0x708098]]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len, 0.04, 0.04),
        new THREE.MeshStandardMaterial({ color:col, roughness:0.35, metalness:0.85 })
      );
      rail.position.set((xl+xr)/2, hy+dy, tz);
      _trussGrp.add(rail);
    }

    // Entretoisement en croix (simplifié)
    const steps = Math.round(len);
    const dAngle = Math.atan2(0.28, len / Math.max(steps, 1));
    for (let i = 0; i < steps; i++) {
      const x0 = xl + i * (len/steps), x1 = xl + (i+1) * (len/steps);
      const diagLen = Math.sqrt((x1-x0)**2 + 0.28**2);
      for (const sign of [1, -1]) {
        const d = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.03, 0.03), _diagMat);
        d.position.set((x0+x1)/2, hy + sign*0.07, tz);
        d.rotation.z = sign * dAngle;
        _trussGrp.add(d);
      }
    }

    // Pieds de support
    for (const lx of [xl, xr]) {
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, hy, 0.10), _legMat2);
      foot.position.set(lx, hy/2, tz);
      _trussGrp.add(foot);
      // Semelle au sol
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.30),
        new THREE.MeshStandardMaterial({ color:0x404860, roughness:0.5, metalness:0.6 }));
      base.position.set(lx, 0.02, tz);
      _trussGrp.add(base);
    }
  }
}


// ─────────────────────────────────────────────────────────────────────────────
// Shaders — faisceau conique volumétrique
// ─────────────────────────────────────────────────────────────────────────────
// Le faisceau n'est plus un empilement de cônes translucides : on intègre
// réellement la lumière diffusée par la fumée le long du rayon de vue
// (raymarching dans le volume du cône). C'est ce qui donne le cœur chaud, la
// pénombre douce sur les bords et surtout l'éblouissement quand le faisceau
// pointe vers la caméra — les trois choses qui manquaient.
const BEAM_VERT = `
  varying vec3 vObjPos;
  varying vec3 vWorldPos;
  void main() {
    vObjPos = position;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const BEAM_FRAG = `
  precision highp float;

  uniform vec3  uColor;
  uniform float uAlpha;     // intensité globale (niveau du projecteur)
  uniform float uSharp;     // concentration radiale : spot élevé, wash faible
  uniform float uCore;      // sur-brillance du cœur
  uniform float uHaze;      // absorption de la fumée, par mètre
  uniform float uAniso;     // g de Henyey-Greenstein (diffusion avant)
  uniform float uFall;      // chute d'intensité avec la distance
  uniform int   uSteps;     // pas de raymarching — piloté par la qualité
  // Gobo projeté DANS le volume : un vrai gobo est un masque placé au foyer,
  // il découpe donc le faisceau lui-même, pas seulement la tache au sol. Le
  // motif est constant en coupe normalisée — c'est ce qui lui fait épouser
  // l'ouverture du cône, comme en vrai.
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;   // 0 = pas de gobo (aucun coût : branche évitée)
  uniform float     uGoboRot;
  uniform float     uGoboBlur;    // 0 = net, 1 = flou (canal Focus)
  uniform float     uGoboScale;   // enveloppe / rayon utile (cf. orientCone)
  // Brouillard : la fumée n'est pas homogène, elle fait des volutes. C'est ce
  // qui donne les stries et les nuages DANS le faisceau, au lieu d'un cône
  // uniforme qui trahit tout de suite le rendu de synthèse.
  //
  // Le bruit est échantillonné en coordonnées MONDE — jamais dans le repère du
  // cône. C'est le point décisif : la fumée appartient à la salle, pas au
  // projecteur. Deux faisceaux qui se croisent traversent donc la MÊME volute,
  // et une lyre qui balaye révèle un brouillard immobile au lieu d'emporter ses
  // volutes avec elle.
  uniform float uFogAmt;    // 0 = pas de brouillard (branche entièrement évitée)
  uniform float uFogScale;  // finesse des volutes (m⁻¹)
  uniform vec3  uFogDrift;  // dérive lente du volume (pré-multipliée par le temps)
  uniform int   uFogOct;    // octaves — indexé sur la qualité

  // Three n'injecte modelMatrix que dans le vertex shader : on la passe ici.
  uniform mat4  uModel;
  uniform mat4  uInvModel;

  varying vec3 vObjPos;
  varying vec3 vWorldPos;

  // Décale le premier pas pour casser le banding. Bruit à gradient entrelacé
  // (Jorge Jimenez) plutôt qu'un hash : le motif est bien mieux réparti, donc
  // beaucoup moins de grain visible à nombre de pas égal.
  float ign(vec2 p) {
    return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
  }

  // Bruit de valeur 3D + fbm. Procédural plutôt qu'une texture 3D : pas de
  // téléversement GPU, pas de tuilage visible, et surtout un coût nul quand le
  // brouillard est à zéro puisque la branche n'est jamais prise.
  float hash13(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }

  float vnoise(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);          // lissage hermite : pas d'arêtes de grille
    return mix(mix(mix(hash13(i + vec3(0.0, 0.0, 0.0)),
                       hash13(i + vec3(1.0, 0.0, 0.0)), f.x),
                   mix(hash13(i + vec3(0.0, 1.0, 0.0)),
                       hash13(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
               mix(mix(hash13(i + vec3(0.0, 0.0, 1.0)),
                       hash13(i + vec3(1.0, 0.0, 1.0)), f.x),
                   mix(hash13(i + vec3(0.0, 1.0, 1.0)),
                       hash13(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
  }

  // Boucle bornée à 3 : WebGL1 exige un nombre d'itérations constant.
  float fbm(vec3 p, int oct) {
    float amp = 0.5, som = 0.0, norm = 0.0;
    for (int k = 0; k < 3; k++) {
      if (k >= oct) break;
      som  += amp * vnoise(p);
      norm += amp;
      p    *= 2.03;      // décalé de 2.0 pour éviter que les octaves se calent
      amp  *= 0.5;
    }
    return som / max(norm, 1e-4);
  }

  // Repère du gobo, perpendiculaire au faisceau et STABLE.
  //
  // On ne peut pas se servir du repère local du cône : orientCone() l'oriente
  // avec la rotation d'arc minimal (setFromUnitVectors), qui laisse le roulis
  // autour de l'axe indéterminé. Le motif tournait donc tout seul au gré des
  // mouvements de la lyre, sans jamais correspondre à la tache au sol.
  // On reconstruit ici une base déterministe à partir des axes du monde : pour
  // un faisceau vertical elle s'aligne sur X/Z, exactement comme la tache.
  void goboBasis(vec3 axis, out vec3 u, out vec3 v) {
    vec3 ref = abs(axis.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
    u = normalize(cross(ref, axis));
    v = cross(axis, u);
  }

  void main() {
    mat3 M  = mat3(uModel);
    vec3 gU, gV;
    goboBasis(normalize(M * vec3(0.0, -1.0, 0.0)), gU, gV);
    vec3 ro = (uInvModel * vec4(cameraPosition, 1.0)).xyz;  // caméra en espace objet
    vec3 rd = normalize(vObjPos - ro);

    // Cône unité : apex en (0, 0.5, 0), rayon 1 en y = -0.5. Solide convexe,
    // donc un rayon le traverse en un seul segment : entrée = face avant,
    // sortie = face arrière. On choisit la borne selon la face rasterisée,
    // ce qui évite de compter l'intégrale deux fois.
    float hCam = 0.5 - ro.y;
    bool camInside = (hCam > 0.0 && hCam < 1.0 && length(ro.xz) < hCam);

    float tFrag = length(vObjPos - ro);
    float tStart, tEnd;
    if (camInside) {
      if (gl_FrontFacing) discard;    // la face arrière porte l'intégrale
      tStart = 0.0;
      tEnd   = tFrag;
    } else {
      if (!gl_FrontFacing) discard;   // la face avant porte l'intégrale
      tStart = tFrag;
      tEnd   = tFrag + 2.25;          // diamètre de la sphère englobante
      if (abs(rd.y) > 1e-6) {         // resserre via la tranche y ∈ [-0.5, 0.5]
        float ta = (0.5 - ro.y) / rd.y;
        float tb = (-0.5 - ro.y) / rd.y;
        tEnd = min(tEnd, max(ta, tb));
      }
    }
    if (tEnd <= tStart) discard;

    float lenW = length(M * vec3(0.0, 1.0, 0.0));  // longueur du faisceau, en mètres
    float rW   = length(M * vec3(1.0, 0.0, 0.0));  // rayon de l'enveloppe, en mètres
    float o2w  = length(M * rd);                   // 1 unité objet → mètres

    float dt  = (tEnd - tStart) / float(uSteps);
    float jit = ign(gl_FragCoord.xy) * dt;
    float acc = 0.0;

    for (int i = 0; i < 48; i++) {
      if (i >= uSteps) break;
      float t = tStart + jit + float(i) * dt;
      if (t > tEnd) break;
      vec3 p = ro + rd * t;

      float h = 0.5 - p.y;               // 0 = lentille, 1 = bout du faisceau
      if (h <= 0.001 || h > 1.0) continue;
      float rr = length(p.xz) / h;       // 0 = axe, 1 = bord de l'enveloppe
      if (rr > 1.0) continue;

      // Profil radial : cœur gaussien + pénombre qui s'éteint sur le bord
      float dens = exp(-rr * rr * uSharp)
                 + uCore * exp(-rr * rr * uSharp * 4.0);
      dens *= 0.25 + 0.75 * (1.0 - smoothstep(0.45, 1.0, rr));

      // Masque gobo. rr donne la distance à l'axe (0 au centre, 1 au bord,
      // donc indépendante de la distance parcourue : le motif s'ouvre avec le
      // cône). L'ANGLE, lui, est pris dans le repère stable ci-dessus et non
      // dans le repère local du cône. Testé sur uGoboBlend : sans gobo, aucune
      // lecture de texture dans la boucle.
      if (uGoboBlend > 0.0) {
        vec3  perp = p - vec3(0.0, 0.5, 0.0);
        perp = perp - vec3(0.0, -1.0, 0.0) * dot(perp, vec3(0.0, -1.0, 0.0));
        vec3  pw   = M * perp;
        vec2  dir  = vec2(dot(pw, gU), dot(pw, gV));
        float dl   = length(dir);
        if (dl > 1e-5) {
          dir /= dl;
          float gc = cos(uGoboRot), gs = sin(uGoboRot);
          vec2  gd = vec2(gc * dir.x - gs * dir.y, gs * dir.x + gc * dir.y);
          // rr = 1 au bord de l'ENVELOPPE, or celle-ci est volontairement
        // dessinée deux fois plus large que le faisceau utile (orientCone est
        // appelé avec base_r * 2.0, la densité étant déjà nulle bien avant le
        // bord). Sans ce facteur, le motif s'étalait sur l'enveloppe : le
        // faisceau paraissait plus large que le gobo projeté.
        vec2  gr = gd * clamp(rr * uGoboScale, 0.0, 1.0);
          float gm = texture2D(uGoboTex, clamp(gr * 0.5 + 0.5, 0.001, 0.999)).r;
          // Netteté du gobo. Ici, contrairement à la tache au sol, on se
          // contente d'élargir le seuil : chaque pas de raymarching paierait
          // les prélèvements supplémentaires d'un vrai flou, soit 9× le coût
          // du gobo sur TOUT le volume. L'approximation passe parce que le
          // faisceau en l'air est de toute façon lissé par l'intégration le
          // long du rayon — c'est au sol que la netteté se juge.
          float e = 0.15 + uGoboBlur * 0.34;
          dens *= mix(1.0, smoothstep(0.5 - e, 0.5 + e, gm), uGoboBlend);
        }
      }

      // Volutes de fumée. Le facteur est centré sur 1 (le bruit vaut 0,5 en
      // moyenne, d'où 0.30 + 1.40 * 0.5 ≈ 1) : activer le brouillard
      // REDISTRIBUE la lumière, il ne l'assombrit pas. Sans ça, monter le
      // curseur éteignait tout le plan de feu.
      if (uFogAmt > 0.0) {
        vec3 pw = (uModel * vec4(p, 1.0)).xyz;      // coordonnées MONDE
        // Étirement du bruit le long de l'axe du faisceau. Sans lui, l'effet
        // est INVISIBLE : on somme 24 à 40 échantillons le long du rayon de
        // vue, et un bruit isotrope se moyenne à ~1 sur ce trajet — il ne
        // restait qu'un voile uniforme, strictement identique au rendu sans
        // brouillard (vérifié au rendu). En comprimant la composante axiale,
        // les volutes deviennent de longues traînées parallèles au faisceau :
        // elles varient d'un pixel à l'autre EN TRAVERS, donc elles survivent
        // à l'intégration. C'est aussi ce qu'on voit en vrai, la fumée étant
        // brassée par le flux d'air du projecteur.
        vec3 ax = normalize(M * vec3(0.0, -1.0, 0.0));
        vec3 q  = pw - ax * dot(pw, ax) * 0.82;
        float f = clamp(fbm(q * uFogScale + uFogDrift, uFogOct), 0.0, 1.0);
        // Le contraste doit croître avec le curseur, et fort. Sommer 24 à 40
        // échantillons le long du rayon écrase les écarts : mesuré au rendu,
        // une modulation de ±15 % est purement et simplement invisible, et
        // même ±80 % ne donne qu'un frémissement. À fond, la fenêtre se
        // resserre presque en seuil — ce sont alors de vraies déchirures de
        // fumée, comme sur une scène enfumée à la machine.
        f = smoothstep(0.32 + 0.10 * uFogAmt, 0.72 - 0.10 * uFogAmt, f);
        // Plancher à 18 % et non ~0 : les volutes font plus d'un mètre, un
        // faisceau entier peut donc tomber dans un creux du bruit. Avec un
        // plancher trop bas il s'ÉTEIGNAIT complètement pendant quelques
        // secondes (constaté au rendu) — on croyait le projecteur coupé. 18 %
        // laisse traverser la fumée épaisse sans jamais perdre le faisceau.
        // La moyenne reste 1 (0,18 + 1,64 × 0,5), donc pas d'assombrissement.
        dens *= mix(1.0, 0.18 + 1.64 * f, uFogAmt);
      }

      // Absorption de la fumée + chute avec la distance parcourue
      float dist = h * lenW;
      dens *= exp(-uHaze * dist) / (1.0 + uFall * dist * dist);
      dens *= smoothstep(0.0, 0.03, h);  // adoucit la sortie de lentille

      acc += dens;
    }
    // Normalisation par le rayon : sans ça, l'intégrale grandit avec la taille
    // du faisceau et un zoom large partirait en surexposition totale.
    acc *= dt * o2w / max(rW, 1e-3);
    if (acc <= 0.0) discard;

    // Diffusion avant : dans la vraie fumée, un faisceau pointé vers l'œil
    // est bien plus lumineux que vu de côté. Sans ça les faisceaux ont l'air
    // plats quels que soient l'angle de vue.
    vec3  axisW = normalize(M * vec3(0.0, -1.0, 0.0));   // sens de propagation
    vec3  toCam = normalize(cameraPosition - vWorldPos);
    float cosT  = dot(axisW, toCam);
    float g     = uAniso;
    float gg    = g * g;
    float hg    = (1.0 - gg) / pow(max(1.0 + gg - 2.0 * g * cosT, 1e-4), 1.5);
    float hg0   = (1.0 - gg) / pow(1.0 + gg, 1.5);       // normalisé sur le profil à 90°
    float phase = clamp(hg / max(hg0, 1e-4), 0.35, 6.0);

    gl_FragColor = vec4(uColor * acc * uAlpha * phase, 1.0);
  }
`;

// Qualité de rendu des faisceaux : nombre de pas de raymarching.
// Piloté depuis Python via window.setBeamQuality().
window.beamQuality = 24;
// Brouillard : 0 = faisceaux lisses (rendu d'avant), 1 = fumée bien marquée.
// Doit exister AVANT le premier makeBeamMat(), qui lit ces valeurs.
window.fogAmount  = 0.0;
window.fogOctaves = 2;
window.fogSpeed   = 0.35;   // 0 = fumée figée, 1 = brassage vif
const _beamMats = [];

function makeBeamMat(alpha, opts) {
  opts = opts || {};
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uColor:    { value: new THREE.Color(1, 1, 1) },
      uAlpha:    { value: alpha },
      uSharp:    { value: opts.sharp !== undefined ? opts.sharp : 8.0 },
      uCore:     { value: opts.core  !== undefined ? opts.core  : 0.9 },
      uHaze:     { value: 0.045 },
      uAniso:    { value: 0.55 },
      uFall:     { value: 0.004 },
      uSteps:    { value: window.beamQuality },
      uGoboTex:   { value: null },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
      uGoboBlur:  { value: 0.0 },
      uGoboScale: { value: 2.0 },
      uFogAmt:   { value: window.fogAmount },
      uFogScale: { value: 0.55 },   // ≈ 1,8 m par volute
      uFogDrift: { value: new THREE.Vector3() },
      uFogOct:   { value: window.fogOctaves },
      uModel:    { value: new THREE.Matrix4() },
      uInvModel: { value: new THREE.Matrix4() },
    },
    vertexShader:   BEAM_VERT,
    fragmentShader: BEAM_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
    side:           THREE.DoubleSide,   // requis : le shader trie via gl_FrontFacing
  });
  _beamMats.push(m);
  return m;
}

// L'inverse de la matrice monde doit être réévalué à chaque rendu puisque la
// caméra orbite et que le faisceau bouge.
function makeVolBeam(geo, alpha, opts) {
  const mesh = new THREE.Mesh(geo, makeBeamMat(alpha, opts));
  mesh.onBeforeRender = function () {
    const u = this.material.uniforms;
    u.uModel.value.copy(this.matrixWorld);
    u.uInvModel.value.copy(this.matrixWorld).invert();
  };
  return mesh;
}

// Densité de fumée globale : agit sur l'absorption ET sur la diffusion avant.
window.setBeamHaze = function (v) {
  for (const m of _beamMats) m.uniforms.uHaze.value = v;
};
window.setBeamQuality = function (steps) {
  window.beamQuality = Math.max(4, Math.min(48, steps | 0));
  for (const m of _beamMats) m.uniforms.uSteps.value = window.beamQuality;
};

// Brouillard — 0 à 100 %. Piloté depuis Python (onglet Scène).
window.setFog = function (pct) {
  window.fogAmount = Math.max(0, Math.min(100, pct)) / 100;
  for (const m of _beamMats) m.uniforms.uFogAmt.value = window.fogAmount;
};

// Vitesse de brassage — 0 à 100 %. À 0 la fumée est complètement figée, ce qui
// est utile pour juger une photo de plan de feu.
window.setFogSpeed = function (pct) {
  window.fogSpeed = Math.max(0, Math.min(100, pct)) / 100;
};

// Finesse des volutes : petit = nappes larges, grand = fumée nerveuse.
window.setFogScale = function (v) {
  const s = Math.max(0.15, Math.min(2.0, v));
  for (const m of _beamMats) m.uniforms.uFogScale.value = s;
};

// Octaves de bruit. Le fbm est LA dépense de la boucle de raymarching : une
// octave de plus, c'est 8 hachages de plus à chaque pas, sur chaque fragment
// de chaque faisceau. On l'indexe donc sur la qualité plutôt que de l'exposer.
window.setFogOctaves = function (n) {
  window.fogOctaves = Math.max(1, Math.min(3, n | 0));
  for (const m of _beamMats) m.uniforms.uFogOct.value = window.fogOctaves;
};

// ─────────────────────────────────────────────────────────────────────────────
// Shader — tache au sol
// ─────────────────────────────────────────────────────────────────────────────
const POOL_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const POOL_FRAG = `
  uniform vec3      uColor;
  uniform float     uAlpha;
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;
  uniform float     uGoboRot;
  uniform float     uGoboBlur;   // 0 = net au sol, 1 = complètement flou
  varying vec2      vUv;

  float goboTap(vec2 uv) {
    return texture2D(uGoboTex, clamp(uv, 0.001, 0.999)).r;
  }

  void main() {
    float d = length(vUv - vec2(0.5));
    if (d > 0.5) discard;
    float soft  = 1.0 - smoothstep(0.12, 0.50, d);
    float hot   = 1.0 - smoothstep(0.0,  0.14, d);
    float alpha = uAlpha * (soft + hot * 0.8);
    // Masque gobo avec rotation
    float c = cos(uGoboRot), s = sin(uGoboRot);
    vec2 uv0 = vUv - 0.5;
    vec2 uvR = vec2(c*uv0.x - s*uv0.y, s*uv0.x + c*uv0.y) + 0.5;

    float gm;
    if (uGoboBlur <= 0.002) {
      // NET. La texture est dessinée au canvas, donc anticrénelée : son bord
      // s'étale sur plusieurs texels et, étiré sur une tache de plusieurs
      // mètres, ça donne un motif mou. Le seuil raidit ce bord — c'est lui qui
      // fait la différence entre « un gobo » et « une vague tache plus sombre ».
      gm = smoothstep(0.35, 0.65, goboTap(uvR));
    } else {
      // FLOU : vraie moyenne spatiale. Élargir un seuil ne suffirait pas — la
      // texture ne vaut presque partout que 0 ou 1, un seuil ne toucherait donc
      // que les bords et le motif resterait net au milieu du flou.
      //
      // DEUX anneaux décalés d'un demi-pas, pas un seul. Avec un anneau unique
      // de 8 prélèvements, le flou se lit comme 8 copies du motif : le bord
      // devient un octogone au lieu de s'estomper (constaté au banc de test).
      // Le deuxième anneau, plus serré et tourné de 22,5°, remplit ces creux.
      //
      // Pas de biais de mipmap ici, qui serait pourtant moins cher : le niveau
      // choisi dépendrait du zoom de la caméra, et la mise au point changerait
      // en s'approchant de la scène.
      float r  = uGoboBlur * 0.070;
      float ri = r * 0.55;
      float k  = 0.3827;   // sin(22,5°)
      float m  = 0.9239;   // cos(22,5°)
      gm  = goboTap(uvR) * 0.14;
      gm += (goboTap(uvR + vec2( r, 0.0)) + goboTap(uvR + vec2(-r, 0.0))
           + goboTap(uvR + vec2(0.0,  r)) + goboTap(uvR + vec2(0.0, -r))) * 0.06;
      float rd = r * 0.707;
      gm += (goboTap(uvR + vec2( rd,  rd)) + goboTap(uvR + vec2(-rd,  rd))
           + goboTap(uvR + vec2( rd, -rd)) + goboTap(uvR + vec2(-rd, -rd))) * 0.06;
      gm += (goboTap(uvR + vec2( ri*m,  ri*k)) + goboTap(uvR + vec2(-ri*m,  ri*k))
           + goboTap(uvR + vec2( ri*m, -ri*k)) + goboTap(uvR + vec2(-ri*m, -ri*k))
           + goboTap(uvR + vec2( ri*k,  ri*m)) + goboTap(uvR + vec2(-ri*k,  ri*m))
           + goboTap(uvR + vec2( ri*k, -ri*m)) + goboTap(uvR + vec2(-ri*k, -ri*m))) * 0.0475;
    }

    float goboMask = mix(1.0, gm, uGoboBlend);
    gl_FragColor = vec4(uColor + hot*0.25, clamp(alpha * goboMask, 0.0, 1.0));
  }
`;

function makePoolMat() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:     { value: new THREE.Color(1,1,1) },
      uAlpha:     { value: 0.5 },
      uGoboTex:   { value: _goboTextures[0] },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
      uGoboBlur:  { value: 0.0 },
    },
    vertexShader:   POOL_VERT,
    fragmentShader: POOL_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Textures gobo (16 slots, dessinées en canvas)
// ─────────────────────────────────────────────────────────────────────────────
// ⚠️ L'ordre de ces seize motifs fait foi et vit dans `core.GOBO_SLOT_NAMES` :
// le plan 2D les redessine au QPainter dans la tache au sol
// (`plan_de_feu._draw_gobo_pattern`). Les deux listes ont DIVERGÉ par le passé
// — le slot 3 montrait trois cercles ici et une croix × en 2D — et le même show
// ne se lisait pas pareil selon le plan ouvert. Modifier l'un = modifier
// l'autre.
//
// Les motifs d'index PAIR sont les huit d'origine, à leur valeur DMX
// historique ; les impairs sont les huit ajoutés. Cf. le commentaire de
// `core.GOBO_SLOT_NAMES` pour la raison de cet entrelacement.
function _createGoboTexture(slot) {
  const size = 256, cx = 128, cy = 128, r = 124;
  const cv  = document.createElement('canvas');
  cv.width  = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#fff';
  switch(slot) {
    case 0: // Open — disque plein
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      break;
    case 1: // Barre — une seule fente en travers du faisceau
      ctx.fillRect(0, cy - r*0.20, size, r*0.40);
      break;
    case 2: // Anneau
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.52, 0, Math.PI*2); ctx.fill();
      break;
    case 3: // Logo MyStrow
      // Relevé au pixel sur `logo.png` (512²) puis normalisé par le rayon
      // extérieur : anneau plein 0,613 → 1,0 traversé de part en part par une
      // encoche verticale de demi-largeur 0,196, et une hampe de même largeur
      // qui remplit le disque intérieur, arrondie en bas, coupée en haut par
      // l'arc intérieur de l'anneau. Redessiné en vectoriel plutôt qu'importé :
      // le HTML 3D n'embarque aucune image, et un gobo n'est de toute façon
      // qu'un masque à deux niveaux.
      { const Ri = r*0.613, bw = r*0.196, sy = cy + r*0.011;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(cx, cy, Ri, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(cx - bw, 0, bw*2, size);
        ctx.fillStyle = '#fff';
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, Ri, 0, Math.PI*2); ctx.clip();
        ctx.fillRect(cx - bw, 0, bw*2, sy);
        ctx.restore();
        ctx.beginPath(); ctx.arc(cx, sy, bw, 0, Math.PI*2); ctx.fill(); }
      break;
    case 4: // Étoile 4 branches
      ctx.save(); ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 - Math.PI/4;
        const rad = (i%2===0) ? r : r*0.32;
        i===0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
              : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
      break;
    case 5: // Gouttes — pastilles de tailles franchement différentes
      // Positions figées (pas de random) : la texture n'est créée qu'une fois au
      // chargement, mais un motif tiré au sort changerait d'une session à
      // l'autre et le même show ne se rejouerait pas à l'identique.
      [[-0.45,-0.44,0.21],[ 0.26,-0.55,0.13],[ 0.56,-0.12,0.23],
       [-0.63, 0.16,0.15],[ 0.04, 0.10,0.29],[-0.17, 0.63,0.19],
       [ 0.49, 0.54,0.14],[-0.72,-0.14,0.09],[ 0.22,-0.18,0.08]]
        .forEach(([ux,uy,ur])=>{
          ctx.beginPath(); ctx.arc(cx+ux*r, cy+uy*r, ur*r, 0, Math.PI*2); ctx.fill(); });
      break;
    case 6: // 3 cercles
      { const dr=r*0.28, of=r*0.52;
        for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/2;
          ctx.beginPath();ctx.arc(cx+Math.cos(a)*of,cy+Math.sin(a)*of,dr,0,Math.PI*2);ctx.fill();}}
      break;
    case 7: // Feuillage — lumière tachetée à travers des feuilles
      // Polarité volontaire : disque plein PERCÉ d'ombres allongées. Un gobo de
      // feuillage éclaire surtout les interstices ; dessiner les feuilles en
      // clair donnerait le négatif, et un sol beaucoup trop sombre.
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      [[-0.35,-0.46,0.34,0.15, 0.6],[ 0.41,-0.36,0.30,0.14,-0.5],
       [ 0.09, 0.04,0.38,0.15, 0.2],[-0.51, 0.26,0.26,0.12,-0.8],
       [ 0.45, 0.41,0.32,0.14, 0.9],[-0.09, 0.63,0.28,0.12,-0.3],
       [ 0.63, 0.01,0.20,0.09, 1.2],[-0.69,-0.13,0.18,0.08, 0.3]]
        .forEach(([ux,uy,rx,ry,rot])=>{
          ctx.beginPath();
          ctx.ellipse(cx+ux*r, cy+uy*r, rx*r, ry*r, rot, 0, Math.PI*2);
          ctx.fill(); });
      break;
    case 8: // 3 palmes (hélice)
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<3;i++){ctx.save();ctx.rotate((i/3)*Math.PI*2);
        ctx.beginPath();ctx.ellipse(0,-r*0.45,r*0.28,r*0.40,0,0,Math.PI*2);
        ctx.fill();ctx.restore();}
      ctx.restore();
      break;
    case 9: // Vitrail — facettes séparées par le plomb
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = r*0.075;
      // Deux cercles de plomb…
      [0.38, 0.72].forEach(rr=>{
        ctx.beginPath(); ctx.arc(cx, cy, rr*r, 0, Math.PI*2); ctx.stroke(); });
      // …et des refends radiaux décalés d'un anneau à l'autre, sinon les
      // facettes s'alignent en rayons et le motif redevient « Six rayons ».
      [[0.00,0.38,5,0.00],[0.38,0.72,8,0.30],[0.72,1.02,11,0.55]]
        .forEach(([r0,r1,n,off])=>{
          for(let i=0;i<n;i++){
            const a=((i+off)/n)*Math.PI*2;
            ctx.beginPath();
            ctx.moveTo(cx+Math.cos(a)*r0*r, cy+Math.sin(a)*r0*r);
            ctx.lineTo(cx+Math.cos(a)*r1*r, cy+Math.sin(a)*r1*r);
            ctx.stroke(); } });
      break;
    case 10: // Breakup (découpes angulaires)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      [0.05,0.22,0.40,0.58,0.75,0.90].forEach(s=>{
        ctx.beginPath();ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,s*Math.PI*2,(s+0.06)*Math.PI*2);
        ctx.closePath();ctx.fill();});
      break;
    case 11: // Spirale
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = r*0.15; ctx.lineCap = 'round';
      ctx.beginPath();
      { const tmax = 2.4*Math.PI*2;
        for(let i=0;i<=180;i++){
          const t  = (i/180)*tmax;
          const rr = r*(0.10 + 0.82*(t/tmax));
          const x  = cx + Math.cos(t)*rr, y = cy + Math.sin(t)*rr;
          i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); } }
      ctx.stroke();
      break;
    case 12: // 6 secteurs rayonnants
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<6;i++){ctx.save();ctx.rotate((i/6)*Math.PI*2);
        ctx.fillRect(-r*0.075,-r,r*0.15,r);ctx.restore();}
      ctx.restore();
      break;
    case 13: // Triangles — pointe vers l'extérieur, base vers le centre
      // ⚠️ La base est RENTRÉE (0,34 au lieu de 0,24) et resserrée : avec des
      // bases plus larges, les coins de deux triangles voisins se touchaient et
      // les trois se lisaient comme UN seul grand triangle évidé. Il faut un
      // écart angulaire d'une vingtaine de degrés entre coins voisins.
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<3;i++){
        ctx.save(); ctx.rotate((i/3)*Math.PI*2);
        ctx.beginPath();
        ctx.moveTo(0, -r*1.00);
        ctx.lineTo( r*0.38, -r*0.34);
        ctx.lineTo(-r*0.38, -r*0.34);
        ctx.closePath(); ctx.fill(); ctx.restore(); }
      ctx.restore();
      break;
    case 14: // Bull's-eye (anneau + point central)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.68,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.30,0,Math.PI*2); ctx.fill();
      break;
    case 15: // Nuages — amas de bulles qui se recouvrent
      [[-0.44,-0.34,0.30],[-0.16,-0.46,0.24],[-0.62,-0.16,0.20],
       [ 0.42,-0.40,0.26],[ 0.66,-0.18,0.19],[ 0.20,-0.30,0.17],
       [-0.06, 0.32,0.32],[ 0.32, 0.46,0.25],[-0.40, 0.48,0.22],
       [ 0.62, 0.30,0.16]]
        .forEach(([ux,uy,ur])=>{
          ctx.beginPath(); ctx.arc(cx+ux*r, cy+uy*r, ur*r, 0, Math.PI*2); ctx.fill(); });
      break;
  }
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return new THREE.CanvasTexture(cv);
}

// ── Galette de LED d'un PAR ────────────────────────────────────────────────
// Un PAR LED n'est pas un projecteur à lampe : sa face n'est pas UN disque
// lumineux mais une grappe de petites lentilles, et c'est à ça qu'on le
// reconnaît d'un coup d'œil sur un plan de feu. On garde malgré tout UN SEUL
// maillage — les cercles sont fusionnés en une géométrie unique — pour que
// dessiner 14 LED coûte exactement le même draw call que l'ancien disque.
// Sans cette fusion, un rig de 40 PAR ajoutait 560 objets à la scène.
const PAR_LED_COUNT = 14;

// Répartition en anneaux concentriques : 1 au centre, puis autant de LED que
// la circonférence en accepte à pas régulier (6, 12, 18…). C'est le pavage
// hexagonal des vraies galettes, et il reste correct pour un compte partiel —
// le dernier anneau se répartit alors sur 2π/k au lieu de se tasser d'un côté.
function _ledLayout(n, R) {
  const rings = [];          // [nb de LED par anneau]
  let left = n, ring = 0;
  while (left > 0) {
    const cap = ring === 0 ? 1 : Math.floor(2 * Math.PI * ring);
    rings.push(Math.min(left, cap));
    left -= rings[ring];
    ring++;
  }
  // Pas radial : le dernier anneau doit tenir DANS le rayon utile, lentille
  // comprise — d'où le demi-pas de marge, sinon les LED du bord mordent la
  // bague chrome.
  const step = R / (rings.length - 0.5 + 0.0001);
  const rad  = step * 0.42;
  const pts  = [];
  for (let k = 0; k < rings.length; k++) {
    const cnt = rings[k];
    if (k === 0) { pts.push([0, 0, rad]); continue; }
    // Décalage d'un demi-pas d'un anneau à l'autre : les LED se logent dans
    // les creux de l'anneau précédent au lieu de s'aligner en rayons.
    const off = (k % 2) * (Math.PI / cnt);
    for (let j = 0; j < cnt; j++) {
      const a = off + j * (2 * Math.PI / cnt);
      pts.push([Math.cos(a) * k * step, Math.sin(a) * k * step, rad]);
    }
  }
  return pts;
}

const _LED_GEO_CACHE = new Map();
function _ledClusterGeo(n, R) {
  const key = n + '|' + R.toFixed(4);
  let g = _LED_GEO_CACHE.get(key);
  if (g) return g;
  const parts = [];
  for (const [px, py, rad] of _ledLayout(n, R)) {
    // Un dôme très aplati, pas un disque plat : c'est ce qui accroche la
    // lumière de la salle et donne le relief des lentilles quand le PAR est
    // ÉTEINT. Un cercle plat rend une galette de gommettes.
    const c = new THREE.SphereGeometry(rad, 10, 5, 0, Math.PI * 2, 0, Math.PI * 0.34);
    // Vers -Z, et non +Z : la lentille est portée par un mesh tourné de -90°
    // sur X, qui envoie -Z vers le BAS — le sens de sortie du PAR. Bombée dans
    // l'autre sens, la calotte rentrait dans le boîtier et le plateau noir
    // passait devant : la face redevenait un disque uni.
    c.rotateX(-Math.PI / 2);
    c.scale(1, 1, 0.55);
    c.translate(px, py, -rad * 0.18);
    parts.push(c);
  }
  g = mergeGeometries(parts);
  _LED_GEO_CACHE.set(key, g);
  return g;
}

function _makeMachinePointsMat(additive) {
  return new THREE.ShaderMaterial({
    uniforms: { uPix: { value: Math.min(2, window.devicePixelRatio || 1) } },
    vertexShader: [
      'attribute float aSize;',
      'attribute float aAlpha;',
      'attribute vec3  aColor;',
      'varying   vec3  vCol;',
      'varying   float vA;',
      'uniform   float uPix;',
      'void main() {',
      '  vCol = aColor; vA = aAlpha;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      // Taille ramenée à la distance : une étincelle à 20 m doit être un point,
      // pas la même tache qu'à 2 m.
      '  gl_PointSize = aSize * uPix * (26.0 / max(0.05, -mv.z));',
      '  gl_Position  = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vCol; varying float vA;',
      'void main() {',
      '  vec2  d = gl_PointCoord - vec2(0.5);',
      '  float r = length(d);',
      '  if (r > 0.5 || vA <= 0.001) discard;',
      '  gl_FragColor = vec4(vCol, vA * smoothstep(0.5, 0.0, r));',
      '}'
    ].join('\n'),
    transparent: true,
    depthWrite:  false,
    blending:    additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
}

function _makeMachinePoints() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MACH_MAX * 3), 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array(MACH_MAX * 3), 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array(MACH_MAX), 1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(MACH_MAX), 1));
  const pts = new THREE.Points(g, _makeMachinePointsMat(true));
  // Les particules quittent la boîte englobante d'origine dès la première
  // seconde : sans ça, le frustum culling escamote toute la gerbe dès que la
  // caméra bouge un peu.
  pts.frustumCulled = false;
  pts.renderOrder   = 3;
  pts.visible       = false;
  return pts;
}

// Hauteur de la buse au-dessus du pied de la machine (m).
const MACHINE_NOZZLE_Y = { spark:0.42, flame:0.56, fog:0.28, haze:0.22 };

// Couleur et alpha d'une particule selon son ÂGE RELATIF u (0 neuve, 1 morte).
function _machShade(kind, u, out) {
  if (kind === 'spark') {
    // Blanc-jaune incandescent qui refroidit vers l'orange puis le rouge.
    out[0] = 1.0;
    out[1] = Math.max(0.06, 0.95 - 0.70 * u);
    out[2] = Math.max(0.01, 0.60 - 0.62 * u);
    return 1.0 - u * u;
  }
  if (kind === 'flame') {
    out[0] = 1.0;
    out[1] = Math.max(0.05, 0.82 - 0.70 * u);
    out[2] = Math.max(0.01, 0.32 - 0.34 * u);
    // Extinction franche en fin de course : une flamme ne s'efface pas en
    // douceur, elle se disloque.
    // 0,42 et non 0,85 : depuis le jet ×3, les bouffées sont 3× plus grosses
    // et le débit a doublé pour lier la colonne. À 0,85 elle se lisait comme
    // une pile de boules blanches, brûlées par le bloom.
    return 0.42 * (1.0 - u) * (1.0 - u);
  }
  // Fumée / brume : gris légèrement bleuté, opacité en cloche — la bouffée
  // apparaît, s'épaissit, se dilue.
  out[0] = 0.55; out[1] = 0.58; out[2] = 0.65;
  return (kind === 'haze' ? 0.028 : 0.055) * Math.sin(Math.PI * u);
}

// Prépare (ou reconfigure) l'état particulaire d'un slot pour un genre donné.
function _machEnsure(obj, kind) {
  let m = obj._mach;
  if (m && m.kind === kind) return m;
  if (!obj.machPts) {
    obj.machPts = _makeMachinePoints();
    _machPtsGrp.add(obj.machPts);
  }
  const P = MACHINE_PARAMS[kind];
  obj.machPts.material.blending    = P.add ? THREE.AdditiveBlending : THREE.NormalBlending;
  obj.machPts.material.needsUpdate = true;
  m = {
    kind: kind, acc: 0, level: 0,
    ox: 0, oy: 0, oz: 0,
    qx: 0, qy: 0, qz: 0, qw: 1,
    geo: obj.machPts.geometry,
    vx:  new Float32Array(MACH_MAX),
    vy:  new Float32Array(MACH_MAX),
    vz:  new Float32Array(MACH_MAX),
    age: new Float32Array(MACH_MAX),
    ttl: new Float32Array(MACH_MAX),
  };
  // Toutes mortes au départ : age >= ttl.
  m.age.fill(1); m.ttl.fill(0);
  obj.machPts.geometry.attributes.aAlpha.array.fill(0);
  obj._mach = m;
  return m;
}

// Coupe une machine : particules éteintes, corps caché.
function _machStop(obj) {
  if (obj.machPts) obj.machPts.visible = false;
  if (obj.machGrp) obj.machGrp.visible = false;
  obj._mach = null;
}

function _tickMachines(dt) {
  if (dt <= 0) return;
  for (let i = 0; i < _objs.length; i++) {
    const o = _objs[i];
    const m = o._mach;
    if (!m) continue;
    const P = MACHINE_PARAMS[m.kind];
    if (!P) continue;

    const at  = m.geo.attributes;
    const pos = at.position.array, col = at.aColor.array;
    const siz = at.aSize.array,    alp = at.aAlpha.array;

    // Émissions dues sur cette image. L'accumulateur garde la fraction : à
    // faible débit, une particule tous les trois dixièmes de seconde, sans
    // à-coup lié à la cadence d'affichage.
    m.acc += P.rate * m.level * dt;
    let born = Math.floor(m.acc);
    m.acc -= born;
    if (born > P.n) born = P.n;

    const damp = Math.max(0, 1 - P.drag * dt);
    let anyAlive = false;

    for (let k = 0; k < P.n; k++) {
      const k3 = k * 3;
      if (m.age[k] >= m.ttl[k]) {
        if (born <= 0) { alp[k] = 0; continue; }
        born--;
        // ── Naissance ──────────────────────────────────────────────────
        const th = P.spread * Math.sqrt(Math.random());
        const ph = Math.random() * Math.PI * 2;
        const st = Math.sin(th);
        _machV.set(st * Math.cos(ph), Math.cos(th), st * Math.sin(ph));
        _machQ.set(m.qx, m.qy, m.qz, m.qw);
        _machV.applyQuaternion(_machQ);
        // Le niveau OUVRE la machine, il ne fait pas qu'émettre plus souvent :
        // à 20 % la gerbe est basse, à 100 % elle monte. Sans ça, le curseur
        // ne changeait que la densité et la hauteur mentait.
        const sp = (P.spd[0] + Math.random() * (P.spd[1] - P.spd[0]))
                 * (0.42 + 0.58 * m.level);
        m.vx[k] = _machV.x * sp;
        m.vy[k] = _machV.y * sp;
        m.vz[k] = _machV.z * sp;
        pos[k3] = m.ox; pos[k3 + 1] = m.oy; pos[k3 + 2] = m.oz;
        m.age[k] = 0;
        m.ttl[k] = P.life[0] + Math.random() * (P.life[1] - P.life[0]);
        siz[k]   = P.size[0] + Math.random() * (P.size[1] - P.size[0]);
      }

      // ── Intégration ──────────────────────────────────────────────────
      m.vx[k] *= damp;
      m.vz[k] *= damp;
      m.vy[k]  = m.vy[k] * damp + P.grav * dt;
      pos[k3]     += m.vx[k] * dt;
      pos[k3 + 1] += m.vy[k] * dt;
      pos[k3 + 2] += m.vz[k] * dt;

      if (pos[k3 + 1] < 0.02) {
        pos[k3 + 1] = 0.02;
        if (P.bounce) {
          // Les étincelles froides REBONDISSENT au sol et roulent : c'est ce
          // tapis de points au pied de la machine qui fait « machine à
          // étincelles » et non « feu d'artifice ».
          m.vy[k] = Math.abs(m.vy[k]) * 0.28;
          m.vx[k] *= 0.55; m.vz[k] *= 0.55;
        } else {
          // La fumée rampe au lieu de traverser le plateau.
          m.vy[k] = Math.max(0, m.vy[k]);
        }
      }

      m.age[k] += dt;
      const u = m.age[k] / m.ttl[k];
      if (u >= 1) { alp[k] = 0; continue; }
      anyAlive = true;
      alp[k] = _machShade(m.kind, u, _machRGB);
      col[k3] = _machRGB[0]; col[k3 + 1] = _machRGB[1]; col[k3 + 2] = _machRGB[2];
    }

    // Au-delà de P.n, les emplacements ne servent pas pour ce genre : on borne
    // le tirage plutôt que d'allouer un tampon par genre.
    for (let k = P.n; k < MACH_MAX; k++) alp[k] = 0;

    at.position.needsUpdate = true;
    at.aColor.needsUpdate   = true;
    at.aSize.needsUpdate    = true;
    at.aAlpha.needsUpdate   = true;
    o.machPts.visible = anyAlive;
  }
}

function _getObj(i) {
  if (i < _objs.length) return _objs[i];

  // Faisceau volumétrique — un seul cône remplace l'ancien empilement
  // haze/glow/main/core : le profil radial est intégré dans le shader.
  const cVol = makeVolBeam(GEO_VOL_CONE, 1.0);
  cVol.renderOrder = 2; _beamGrp.add(cVol);

  // Halo de lentille (toujours face caméra)
  const lensGlow = new THREE.Sprite(makeLensGlowMat());
  lensGlow.renderOrder = 4; lensGlow.visible = false; _beamGrp.add(lensGlow);

  // Tache au sol
  const pool = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pool.rotation.x = -Math.PI/2;
  pool.renderOrder = 0; _poolGrp.add(pool);

  // Halo au sol (large et très doux)
  const halo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  halo.rotation.x = -Math.PI/2;
  halo.renderOrder = 0; _poolGrp.add(halo);

  // ── PRISME : 3 faisceaux + 3 taches, une par facette ──────────────────
  // Un prisme 3 facettes ne « décore » pas le faisceau : il en produit trois
  // copies complètes, gobo compris, à 120° autour de l'axe. Le faisceau
  // central (cVol) est donc éteint tant que le prisme est actif — sinon on
  // verrait quatre images là où l'optique n'en donne que trois.
  // Cachés par défaut, pilotés par _orientPrism().
  const prismBeams = [], prismPools = [];
  for (let k = 0; k < PRISM_FACETS; k++) {
    const pm = makeVolBeam(GEO_VOL_CONE, 1.0);
    pm.renderOrder = 2; pm.visible = false; _beamGrp.add(pm); prismBeams.push(pm);
    const pp = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
    pp.rotation.x = -Math.PI/2; pp.renderOrder = 0; pp.visible = false;
    _poolGrp.add(pp); prismPools.push(pp);
  }

  // ── PAR LED — modèle compact réaliste ────────────────────────────────
  const parGrp = new THREE.Group();
  // 'YXZ' et non l'ordre par défaut 'XYZ' : sur un PAR, RY est le lacet de
  // l'ÉTRIER (axe vertical d'accroche) et RX l'inclinaison DANS cet étrier.
  // En 'XYZ', le lacet est appliqué en premier, donc à l'intérieur du tilt :
  // pivoter un PAR déjà incliné le faisait tourner autour d'un axe basculé, et
  // surtout la direction de la lentille ne dépendait plus du tout de RY —
  // alors que `beamFloor()`, elle, en tenait compte. Les deux doivent décrire
  // la MÊME chaîne, sinon corps et faisceau divergent.
  parGrp.rotation.order = 'YXZ';

  const _parBodyMat = new THREE.MeshStandardMaterial({ color:0x1c1c28, roughness:0.50, metalness:0.62 });
  const _parChrMat2 = new THREE.MeshStandardMaterial({ color:0x404858, roughness:0.38, metalness:0.78 });
  const _parYokeMat = new THREE.MeshStandardMaterial({ color:0x222234, roughness:0.42, metalness:0.78 });

  // Collier omega de fixation truss
  const parOme = new THREE.Mesh(
    new THREE.TorusGeometry(0.090, 0.026, 8, 18, Math.PI),
    _parChrMat2.clone()
  );
  parOme.rotation.z = Math.PI;
  parOme.position.set(0, 0.062, 0);
  parGrp.add(parOme);

  // Barre de yoke supérieure
  const parYokeBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.068, 0.098),
    _parYokeMat.clone()
  );
  parYokeBar.userData.projoIndex = i;
  parGrp.add(parYokeBar);

  // Bras du yoke ×2
  for (const sx of [-0.238, 0.238]) {
    const parArm = new THREE.Mesh(
      new THREE.BoxGeometry(0.058, 0.38, 0.082),
      _parYokeMat.clone()
    );
    parArm.position.set(sx, -0.19, 0);
    parArm.userData.projoIndex = i;
    parGrp.add(parArm);
    // Arrondi en bas de bras
    const parElbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.040, 8, 7),
      _parYokeMat.clone()
    );
    parElbow.position.set(sx, -0.38, 0);
    parGrp.add(parElbow);
  }

  // Corps cylindrique principal (noir mat)
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.160, 0.166, 0.24, 22),
    _parBodyMat.clone()
  );
  body.userData.projoIndex = i;
  body.position.set(0, -0.175, 0);
  parGrp.add(body);

  // Bande de couleur de groupe (accent sur le corps)
  const groupRingMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.28, metalness: 0.55,
    emissive: new THREE.Color(0.2, 0.2, 0.2), emissiveIntensity: 0.5,
  });
  const groupRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.168, 0.168, 0.018, 22),
    groupRingMat
  );
  groupRing.position.set(0, -0.094, 0);
  parGrp.add(groupRing);

  // Bague chrome avant (autour de la lentille). OUVERTE aux deux bouts — une
  // bague est un anneau, pas un jeton : en cylindre plein, son fond faisait
  // écran et masquait entièrement la galette de LED enchâssée derrière.
  // DoubleSide parce qu'on regarde un PAR par en dessous, donc par l'INTÉRIEUR
  // de l'anneau : ses faces avant sont tournées à l'opposé.
  const _parRingMat = _parChrMat2.clone();
  _parRingMat.side = THREE.DoubleSide;
  const parFrontRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.182, 0.182, 0.030, 28, 1, true),
    _parRingMat
  );
  parFrontRing.position.set(0, -0.317, 0);
  parGrp.add(parFrontRing);

  // Goupilles de pivot ×2 (reliant bras au corps)
  for (const sx of [-0.200, 0.200]) {
    const pPin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.030, 0.030, 0.095, 10),
      _parChrMat2.clone()
    );
    pPin.rotation.z = Math.PI / 2;
    pPin.position.set(sx, -0.175, 0);
    parGrp.add(pPin);
  }

  // Plateau noir de la face avant : c'est le fond sur lequel les LED sont
  // montées. Il est indispensable — la galette de LED laisse du vide entre les
  // lentilles, et sans lui on voyait à travers le PAR jusqu'à l'intérieur du
  // corps.
  const lensBack = new THREE.Mesh(
    new THREE.CircleGeometry(0.180, 32),
    new THREE.MeshStandardMaterial({ color:0x0a0a12, roughness:0.72, metalness:0.18 })
  );
  // Enchâssé DANS la bague chrome avant (qui court de -0,302 à -0,332), et
  // non posé sur son bord : les dômes des LED avancent de 19 mm, à -0,331 ils
  // débordaient du boîtier et le PAR ressemblait à une galette de billes
  // collées sur le devant. Le plateau ferme aussi le fond de la bague, qui est
  // creuse — d'où son rayon calé sur elle (0,180) et non sur la galette.
  lensBack.position.set(0, -0.309, 0);
  lensBack.rotation.x = -Math.PI / 2;
  lensBack.userData.projoIndex = i;
  parGrp.add(lensBack);

  // Galette de LED émissive (face -Y = bas). Une seule géométrie fusionnée,
  // donc `obj.lens` reste UN maillage à un matériau : toute la logique
  // d'allumage (emissive / emissiveIntensity) est inchangée.
  const lensMat = new THREE.MeshStandardMaterial({
    color:0x111122, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.10, metalness:0.06,
  });
  const lens = new THREE.Mesh(_ledClusterGeo(PAR_LED_COUNT, 0.152), lensMat);
  lens.position.set(0, -0.310, 0);
  lens.rotation.x = -Math.PI / 2;
  lens.userData.projoIndex = i;
  parGrp.add(lens);

  parGrp.visible = false;
  _fixtureGrp.add(parGrp);

  // clamp kept as alias for backward compat (now inside parGrp)
  const clamp = parOme;

  // ── Moving Head (Lyre) — modèle doré réaliste ────────────────────────
  const mhGrp = new THREE.Group();

  const _mhGoldMat = new THREE.MeshStandardMaterial({ color:0xc09030, roughness:0.28, metalness:0.82 });
  const _mhChrMat  = new THREE.MeshStandardMaterial({ color:0x7080a0, roughness:0.38, metalness:0.80 });
  const _mhDarkMat2= new THREE.MeshStandardMaterial({ color:0x141420, roughness:0.55, metalness:0.50 });

  // Barre de montage supérieure (top du yoke)
  const mhBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.64, 0.088, 0.17),
    _mhGoldMat.clone()
  );
  mhBar.userData.projoIndex = i;
  mhGrp.add(mhBar);

  // Colliers omega ×2 (mordent sur le truss par le dessus)
  for (const sx of [-0.185, 0.185]) {
    const ome = new THREE.Mesh(
      new THREE.TorusGeometry(0.096, 0.027, 8, 18, Math.PI),
      _mhChrMat.clone()
    );
    ome.rotation.z = Math.PI;         // demi-tore ouvert vers le haut
    ome.position.set(sx, 0.065, 0);
    mhGrp.add(ome);
    // Vis de serrage de l'omega
    const bolt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.019, 0.019, 0.050, 8),
      _mhChrMat.clone()
    );
    bolt.position.set(sx, 0.180, 0);
    mhGrp.add(bolt);
  }

  // ── Groupe yoke (pan — rotation Y) ───────────────────────────────────
  // Tout ce qui suit TOURNE avec le pan ; tout ce qui précède (barre de
  // montage, colliers omega, vis) reste solidaire du truss. Sur un vrai
  // appareil, le pan pivote entre la BASE et le yoke : les colliers qui
  // mordent la structure ne bougent évidemment pas. Sans ce groupe
  // intermédiaire, `mhGrp.rotation.y = pan` faisait tourner l'accroche avec
  // la tête — la lyre semblait dévisser son propre point de suspension.
  // Origine à (0,0,0) : l'axe de pan passe bien par le point d'accroche.
  const mhYoke = new THREE.Group();
  mhGrp.add(mhYoke);

  // Bras du yoke ×2 (gauche & droite) — longueur divisée par 2
  for (const sx of [-0.252, 0.252]) {
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.076, 0.28, 0.112),
      _mhGoldMat.clone()
    );
    arm.position.set(sx, -0.18, 0);
    arm.userData.projoIndex = i;
    mhYoke.add(arm);
    // Arrondi en bout de bras
    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.053, 10, 8),
      _mhGoldMat.clone()
    );
    elbow.position.set(sx, -0.323, 0);
    mhYoke.add(elbow);
  }

  // ── Groupe tête (tilt — rotation X) ──────────────────────────────────
  const mhHGrp = new THREE.Group();
  mhHGrp.position.set(0, -0.35, 0);

  // Corps principal — frustum légèrement évasé vers l'arrière (haut = +Y)
  const mhHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.158, 0.212, 0.43, 26),
    _mhGoldMat.clone()
  );
  mhHead.userData.projoIndex = i;
  mhHGrp.add(mhHead);

  // Bandeau sombre entre corps et bague lentille
  const mhBand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.170, 0.170, 0.034, 26),
    _mhDarkMat2.clone()
  );
  mhBand.position.set(0, -0.196, 0);
  mhHGrp.add(mhBand);

  // Bague chrome autour de la lentille
  const mhRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.192, 0.192, 0.040, 30),
    _mhChrMat.clone()
  );
  mhRing.position.set(0, -0.232, 0);
  mhHGrp.add(mhRing);

  // Lentille émissive (face -Y = bas par défaut)
  const mhLensMat = new THREE.MeshStandardMaterial({
    color:0x060618, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const mhLens = new THREE.Mesh(new THREE.CircleGeometry(0.175, 32), mhLensMat);
  mhLens.position.set(0, -0.248, 0);
  mhLens.rotation.x = -Math.PI / 2;
  mhLens.userData.projoIndex = i;
  mhHGrp.add(mhLens);

  // Goupilles de pivot tilt ×2 (reliant tête aux bras du yoke)
  for (const sx of [-0.266, 0.266]) {
    const pin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.040, 0.040, 0.118, 12),
      new THREE.MeshStandardMaterial({ color:0x9098a4, roughness:0.16, metalness:0.97 })
    );
    pin.rotation.z = Math.PI / 2;
    pin.position.set(sx, 0.055, 0);
    mhHGrp.add(pin);
  }

  mhYoke.add(mhHGrp);        // la tête suit le pan, pas l'accroche
  mhGrp.visible = false;
  _fixtureGrp.add(mhGrp);

  // Point light au sol (éclaire le sol et les silhouettes)
  const ptLight = new THREE.PointLight(0xffffff, 0, 14, 1.8);
  _lightGrp.add(ptLight);

  // ── Cellule pixel (barre/matrice) ────────────────────────────────────
  // Petit cube émissif à la place d'un corps + faisceau complet : c'est ce
  // qui permet de voir un chase courir sans faire ramer la scène.
  const pxCell = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.16, 0.16),
    new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.4, metalness:0.3,
                                     emissive:0x000000, emissiveIntensity:0 })
  );
  pxCell.userData.projoIndex = i;
  pxCell.visible = false;
  _fixtureGrp.add(pxCell);
  // Nappe wash au sol sous le pixel : 2 couches (proche + halo large et doux)
  // pour la lueur diffuse d'un ruban LED, pas un spot net.
  const pxGlow = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pxGlow.rotation.x = -Math.PI/2; pxGlow.renderOrder = 0; pxGlow.visible = false;
  _poolGrp.add(pxGlow);
  const pxHalo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pxHalo.rotation.x = -Math.PI/2; pxHalo.renderOrder = 0; pxHalo.visible = false;
  _poolGrp.add(pxHalo);
  // Boîtier physique de la barre/matrice : réglette d'alu sombre (échelle X =
  // longueur, posée sur le représentant). C'est ce qui fait « fixture » plutôt
  // que « rectangle lumineux ». Cube unité (1×1×1) → mis à l'échelle au runtime.
  const pxHousing = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color:0x16171c, roughness:0.55, metalness:0.65 })
  );
  pxHousing.userData.projoIndex = i;
  pxHousing.visible = false;
  _fixtureGrp.add(pxHousing);

  // ── Machine à effet : corps posé au sol ──────────────────────────────
  // Le corps vit dans `_fixtureGrp` (il suit donc le bouton « Fixtures ») ;
  // les particules, elles, vivent dans `_machPtsGrp`, à part : ce sont l'effet,
  // pas l'appareil — comme les faisceaux, qui ne sont pas non plus dans le
  // groupe des corps.
  const machGrp = new THREE.Group();
  machGrp.visible = false;
  _fixtureGrp.add(machGrp);

  const obj = { cVol, lensGlow, pool, halo, ptLight,
                body, lens, groupRing, parGrp,
                mhGrp, mhYoke, mhHGrp, mhHead, mhLens,
                prismBeams, prismPools,
                pxCell, pxGlow, pxHalo, pxHousing, _fx: null,
                machGrp, machBody: null, machKind: null,
                machPts: null, _mach: null };
  _objs.push(obj);
  return obj;
}

// ─────────────────────────────────────────────────────────────────────────────
// Sélection par clic — raycasting sur les fixtures
// ─────────────────────────────────────────────────────────────────────────────
window.setSelectedProjos = function(list) {
  // Efface les références de clignotement de l'ancienne sélection : elles
  // décrivent des valeurs qui ne la concernent plus.
  for (const i of _selSet) {
    if (i >= 0 && i < _objs.length) {
      const o = _objs[i];
      o._selA = o._selG = o._selP = undefined;
    }
  }
  _selSet = new Set((list || []).filter(i => i >= 0 && i < _objs.length));
  for (const i of _selSet) {
    const o = _objs[i];
    o._selA = o._selG = o._selP = undefined;   // repris à la prochaine image
  }
};

window.highlightProjo = function(idx) {
  // Efface ancien surlignage
  if (_selectedProjo >= 0 && _selectedProjo < _objs.length) {
    const prev = _objs[_selectedProjo];
    prev.body.material.emissive.setHex(0x000000);
    prev.body.material.emissiveIntensity = 0;
    prev.mhHead.material.emissive.setHex(0x000000);
    prev.mhHead.material.emissiveIntensity = 0;
    if (prev.groupRing) {
      prev.groupRing.material.emissiveIntensity = 0.5;   // retour à l'accent normal
    }
    // Références de clignotement : elles décrivent l'ancien sélectionné,
    // elles n'ont plus de sens pour le nouveau.
    prev._selA = prev._selG = prev._selP = undefined;
  }
  _selectedProjo = idx;
  // Appelé seul (clic dans la 3D, sélection simple) : la sélection se résume à
  // ce projecteur. Le tableau, lui, complète ensuite avec setSelectedProjos().
  window.setSelectedProjos(idx >= 0 ? [idx] : []);
  if (idx >= 0 && idx < _objs.length) {
    const cur = _objs[idx];
    cur.body.material.emissive.setHex(0x0055aa);
    cur.body.material.emissiveIntensity = 1.2;
    cur.mhHead.material.emissive.setHex(0x0055aa);
    cur.mhHead.material.emissiveIntensity = 1.2;
    if (cur.groupRing) {
      cur.groupRing.material.emissive.setHex(0x0088ff);
      cur.groupRing.material.emissiveIntensity = 2.5;   // clignotant bleu visible
    }
  }
};

renderer.domElement.addEventListener('pointerdown', (e) => {
  _ptrDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!_ptrDownPos) return;
  const dx = e.clientX - _ptrDownPos.x;
  const dy = e.clientY - _ptrDownPos.y;
  _ptrDownPos = null;
  if (Math.sqrt(dx*dx + dy*dy) > 6) return;   // c'était un drag, pas un clic

  const rect = renderer.domElement.getBoundingClientRect();
  _mouse2D.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  _mouse2D.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_mouse2D, camera);

  const hits = _raycaster.intersectObjects(_fixtureGrp.children, true);
  let idx = -1;
  for (const h of hits) {
    if (h.object.userData.projoIndex !== undefined) {
      idx = h.object.userData.projoIndex;
      break;
    }
  }
  window.highlightProjo(idx);
  if (window._bridge) window._bridge.projoSelected(idx);
});

// ─────────────────────────────────────────────────────────────────────────────
// Calcul direction faisceau (miroir exact du code Python)
// ─────────────────────────────────────────────────────────────────────────────
// Longueur maximale d'un faisceau qui ne rencontre ni le sol ni le plafond.
// UNE seule valeur pour tous les cas : c'est ce qui garantit la continuité au
// franchissement de l'horizontale (cf. beamFloor).
// 22 m ≈ diagonale utile de la scène. UNE seule distance pour la longueur
// dessinée ET pour décider si le faisceau touche le sol : avec deux valeurs
// différentes, il existait une bande de tilt où la tache s'affichait alors
// que le cône s'arrêtait encore à 2 m du sol.
const BEAM_TMAX = 22.0;

// Raccourcir `t` pour que le point d'arrivée reste DANS la salle — sans jamais
// le sortir du rayon.
//
// ⚠️ Les trois coordonnées étaient rabotées SÉPARÉMENT :
//     fx: clamp(lensX + bx*t, -11, 11)
//     fy: clamp(lensY + by*t, 0.03, 14.5)
//     fz: clamp(lensZ + bz*t,  -8, 13)
// Dès qu'une seule borne mordait, le sommet du cône n'était plus sur l'axe du
// faisceau : le cône partait de travers, s'allongeait, et ne rejoignait plus sa
// tache au sol. En bornant `t`, le point reste sur le rayon par construction.
function _clampT(o, d, lo, hi, t) {
  if (d >  1e-9) t = Math.min(t, (hi - o) / d);
  if (d < -1e-9) t = Math.min(t, (lo - o) / d);
  return t;
}

// Point d'arrivée du faisceau + « ce rayon touche-t-il le plancher DESSINÉ ? ».
//
// `hitsFloor` est une question de SURFACE, pas seulement de hauteur : un rayon
// qui sort par le côté de la salle avant d'atteindre le sol ne doit pas laisser
// une tache orpheline sur le plancher, loin du cône. C'est la même famille de
// piège que le `!goingUp` d'origine (cf. l'historique de `fy`).
function _beamEnd(lensX, lensY, lensZ, bx, by, bz, t) {
  t = Math.max(0, _clampT(lensX, bx, FLOOR_X0, FLOOR_X1,
               _clampT(lensY, by, 0.03, 14.5,
               _clampT(lensZ, bz, FLOOR_Z0, FLOOR_Z1, t))));
  const tf = by < -1e-6 ? lensY / -by : Infinity;
  const hx = lensX + bx * tf, hz = lensZ + bz * tf;
  return {
    fx: lensX + bx * t, fy: lensY + by * t, fz: lensZ + bz * t,
    hitsFloor: tf <= BEAM_TMAX
            && hx >= FLOOR_X0 && hx <= FLOOR_X1
            && hz >= FLOOR_Z0 && hz <= FLOOR_Z1,
  };
}

// ─── Débattement mécanique pan / tilt ────────────────────────────────────────
// Combien de degrés la lyre balaie sur toute sa course DMX. Réglable par
// fixture dans la fenêtre Patch, transmis ici en `pan_range` / `tilt_range`.
//
// ⚠️ Ces deux angles étaient écrits EN DUR (π pour le pan, 0,75·π pour le tilt)
// et à DEUX endroits — beamFloor() pour le faisceau, updateScene() pour le
// corps. UN SEUL point de conversion désormais : les laisser diverger fait
// partir le cône à côté de la lentille.
//
// Le pan valait donc 360° pour tout le monde, alors que le moteur d'effets,
// lui, supposait déjà 540° (PAN_ANGULAR_RATIO). Sur une lyre 540° la 3D ne
// montrait qu'un demi-tour : « la 3D ne correspond pas à la réalité ».
//
// 32768 = milieu de course = 0 rad, le point neutre d'une lyre ; 0 et 65535
// sont ses deux butées.
//
// Signe négatif sur le pan : le repère a jardin du côté des X POSITIFS (cf. la
// conversion depuis le plan 2D), alors qu'un pan « gauche » vaut moins de
// 32768 (presets « Gauche » 15360 / « Droite » 49920). Sans lui, deux lyres
// qui convergent sur le plan 2D divergeaient en 3D — le pan y partait du côté
// opposé, corps et faisceau compris.
const PAN_RANGE_DEFAULT  = 540.0;
const TILT_RANGE_DEFAULT = 270.0;

function ptAngles(p) {
  const panDeg  = (p.pan_range  > 0) ? p.pan_range  : PAN_RANGE_DEFAULT;
  const tiltDeg = (p.tilt_range > 0) ? p.tilt_range : TILT_RANGE_DEFAULT;
  return {
    pan:  -(p.pan  - 32768) / 32768.0 * (panDeg  / 2.0) * Math.PI / 180.0,
    tilt:  (32768 - p.tilt) / 32768.0 * (tiltDeg / 2.0) * Math.PI / 180.0,
  };
}
function beamFloor(p) {
  const hy  = p.fixture_height ?? 7.0;
  const isMH = p.fixture_type === 'Moving Head';
  // Taille du corps (colonne « Taille » de l'onglet Plan). Le groupe de la
  // fixture est mis à l'échelle dans updateScene(), donc TOUS les décalages
  // internes qui suivent — pivot du yoke, sortie de lentille — se contractent
  // d'autant. Les laisser en dur ferait démarrer le faisceau à côté de
  // l'appareil dès qu'on le réduit : à 40 %, le cône partait 20 cm sous une
  // lentille qui, elle, était remontée.
  const fs = p.fixture_scale ?? 1.0;
  if (isMH) {
    const _pt = ptAngles(p);   // DMX → angles, cf. ptAngles()
    const panDmx = _pt.pan;
    // RY (body_rotation) = lacet d'ACCROCHE du pied de la lyre. Sans lui, RY
    // était purement décorative sur une lyre (corps ET faisceau), et il était
    // impossible d'accrocher des lyres sur les faces d'une structure orientée
    // (tour, praticable, portique biais) : elles regardaient toutes du même
    // côté. Il appartient au SOCLE, pas au yoke — cf. la chaîne ci-dessous.
    const ry    = (p.rot3d_y ?? 0) * Math.PI / 180;
    const theta = _pt.tilt;
    const rx    = (p.rot3d_x || 0) * Math.PI / 180;
    const rz    = (p.rot3d_z || 0) * Math.PI / 180;
    // Direction correcte : tilt dévie le faisceau DANS la direction du pan.
    // Pan seul (tilt=0) → faisceau droit vers le bas. Tilt → déviation dans le plan pan.
    //
    // L'ordre reproduit EXACTEMENT la hiérarchie Three.js :
    //   mhGrp (accroche, Euler XYZ = Rx·Ry(RY)·Rz)
    //     └ mhYoke (pan DMX, Ry)
    //         └ mhHGrp (tilt DMX, Rx)
    // soit, appliqué au vecteur : Ry(pan) → Rz → Ry(RY) → Rx.
    //
    // L'ancienne version mettait le pan DANS le slot Y de l'accroche
    // (Rx·Ry(pan)·Rz) : le roulis RZ se retrouvait à l'INTÉRIEUR du pan et
    // tournait donc avec le yoke au lieu d'appartenir au socle. Sur une lyre
    // à RZ = 180°, panner faisait pivoter l'appareil autour d'un axe mirroité
    // — la « rotation bizarre » constatée sur les lyres 2 et 4 d'un plan de
    // feu en tour, seules à porter un roulis de 180°.
    const _rig = (x, y, z) => {
      // Ry(pan) — yoke
      const x1 =  x * Math.cos(panDmx) + z * Math.sin(panDmx);
      const z1 = -x * Math.sin(panDmx) + z * Math.cos(panDmx);
      // Rz — roulis d'accroche
      const x2 = x1 * Math.cos(rz) - y * Math.sin(rz);
      const y2 = x1 * Math.sin(rz) + y * Math.cos(rz);
      // Ry(RY) — lacet d'accroche
      const x3 =  x2 * Math.cos(ry) + z1 * Math.sin(ry);
      const z3 = -x2 * Math.sin(ry) + z1 * Math.cos(ry);
      // Rx — inclinaison d'accroche
      return { x: x3,
               y: y2 * Math.cos(rx) - z3 * Math.sin(rx),
               z: y2 * Math.sin(rx) + z3 * Math.cos(rx) };
    };
    const d = _rig(0, -Math.cos(theta), Math.sin(theta));
    const bx = d.x, by = d.y, bz = d.z;
    // Position réelle de la lentille — MÊME chaîne, sinon le faisceau démarre
    // à côté de la lentille dès que l'appareil est pivoté.
    const ly_l  = (-0.35 - 0.248 * Math.cos(theta)) * fs;
    const lz_l  = (         0.248 * Math.sin(theta)) * fs;
    const a = _rig(0, ly_l, lz_l);
    const ax = a.x, ay = a.y, az = a.z;
    // _rig() applique DÉJÀ le Rx d'accroche : ne pas le repasser ici.
    const lensX = p.x + ax;
    const lensY = hy  + ay;
    const lensZ = p.z + az;
    const goingUp = by > 0.05;
    // Longueur du faisceau : jusqu'au sol s'il descend, jusqu'au plafond s'il
    // monte, bornée à BEAM_TMAX.
    //
    // Les trois branches d'origine ne se raccordaient PAS : 10 m en descendant,
    // 10 m dans la zone morte |by| <= 0.05, mais 15 m dès que ça montait. Au
    // franchissement de l'horizontale, la longueur sautait de 10 à 15 m et le
    // point d'arrivée basculait du sol au plafond — le faisceau paraissait
    // sauter « de bas en haut » (constaté entre tilt 54995 et 55499 sur une
    // lyre à 7 m). Avec une borne UNIQUE, les deux quotients divergent vers
    // BEAM_TMAX quand by → 0 de part et d'autre : la longueur est continue.
    let t;
    if      (by < 0) t = Math.min(lensY / (-by), BEAM_TMAX);
    else if (by > 0) t = Math.min((15.0 - lensY) / by, BEAM_TMAX);
    else             t = BEAM_TMAX;
    // Altitude d'arrivée calculée, et NON forcée au sol ou au plafond selon
    // `goingUp`. C'est ce forçage qui téléportait le faisceau : au
    // franchissement du seuil, l'extrémité sautait de 0.03 à 14.5 m.
    return Object.assign(_beamEnd(lensX, lensY, lensZ, bx, by, bz, t),
                         { lensX, lensY, lensZ, bx, by, bz, isMH, goingUp });
  } else {
    const ry    = (p.rot3d_y ?? 0) * Math.PI / 180;  // pan — pivot horizontal
    const rx    = (p.rot3d_x ?? 0) * Math.PI / 180;  // tilt — inclinaison depuis nadir
    // La galette de LED d'un PAR est montée SOUS le corps : sa direction
    // d'émission est le nadir local (0, -1, 0), auquel on applique la même
    // chaîne que le maillage — `parGrp`, en ordre d'Euler 'YXZ', soit
    // Ry(pan) · Rx(tilt). Le lacet appartient à l'étrier (axe vertical
    // d'accroche), l'inclinaison bascule à l'intérieur de l'étrier ainsi
    // orienté : c'est un yoke, pas un cardan.
    //
    // ⚠️ Les signes de X et Z étaient INVERSÉS : le calcul appliquait Rx(-tilt)
    // là où le maillage applique Rx(+tilt). Le corps s'inclinait donc d'un côté
    // et le faisceau partait de l'autre — « je retourne mes PAR et ils éclairent
    // à l'opposé » (remontée du 27/08/2026, capture `Bug_affichage3D.png` : des
    // PAR galette vers le public lavant de rouge la structure DERRIÈRE eux).
