<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plan de feu 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#05050f; overflow:hidden; user-select:none; }
canvas { display:block; }


/* ── Footer ──────────────────────────────────────────────────────────── */
#footer {
  position:fixed; bottom:5px; left:8px;
  color:#1e1e3a; font-size:9px;
  font-family:'Segoe UI',sans-serif; letter-spacing:0.3px;
  pointer-events:none;
}
#loading {
  position:fixed; top:50%; left:45%; transform:translate(-50%,-50%);
  color:#333355; font-family:'Segoe UI',sans-serif; font-size:12px;
  letter-spacing:1px;
}
/* ── Compteur de performance (masqué par défaut) ──────────────────────── */
#fps {
  position:fixed; top:6px; right:8px; display:none;
  color:#5ad0ff; font-size:10px; font-family:Consolas,monospace;
  background:rgba(6,6,18,0.72); border:1px solid #1c2740;
  border-radius:3px; padding:3px 7px; letter-spacing:0.4px;
  pointer-events:none; white-space:pre;
}
</style>
</head>
<body>

<div id="loading">Chargement Three.js…</div>


<div id="fps"></div>

<div id="footer">drag: orbite · scroll: zoom · double-clic: reset</div>

<!-- Three.js EN LOCAL (vendor/three, version 0.161.0).
     Surtout pas de CDN : en prestation la machine est très souvent hors ligne
     ou derrière un réseau fermé, et un import de module qui échoue est
     silencieux — la fenêtre resterait bloquée sur « Chargement Three.js… ».
     Les chemins sont relatifs au HTML, donc vendor/ doit rester à côté de
     plan_3d_web.html (y compris dans le bundle PyInstaller). -->
<script type="importmap">
{
  "imports": {
    "three":          "./vendor/three/three.module.js",
    "three/addons/":  "./vendor/three/addons/"
  }
}
</script>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader }       from 'three/addons/loaders/GLTFLoader.js';

document.getElementById('loading').remove();

// ── Sélection projector (raycasting + QWebChannel) ───────────────────────────
let _selectedProjo = -1;
// Sélection MULTIPLE : tous les projecteurs sélectionnés s'allument en blanc et
// clignotent. `_selectedProjo` reste le « primaire » — celui dont le corps
// prend le surlignage bleu et que suit le panneau de réglages.
let _selSet = new Set();
const _raycaster   = new THREE.Raycaster();
const _mouse2D     = new THREE.Vector2();
let   _ptrDownPos  = null;   // pour distinguer clic vs drag

// ─────────────────────────────────────────────────────────────────────────────
// Renderer
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
// Tone mapping ACES : rendu plus « filmique », meilleure tenue des hautes
// lumières (les faisceaux saturés ne cramment plus en blanc pur).
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace  = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.renderer = renderer;

// ─────────────────────────────────────────────────────────────────────────────
// Scene + Camera
// ─────────────────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
// Haze atmosphérique : un peu plus dense qu'avant → l'air « accroche » la
// lumière, les faisceaux lointains se fondent dans une ambiance enfumée
// (l'équivalent light du brouillard volumétrique d'Unreal, en bien plus léger).
const fog = new THREE.FogExp2(0x060612, 0.030);
scene.fog = fog;
window.scene = scene;   // exposé pour le diagnostic depuis Qt
// Réglable en live depuis Python si besoin (densité 0.010–0.060).
window.setHaze = function(density) {
  fog.density = Math.max(0.0, Math.min(0.08, density));
};

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const camera = new THREE.PerspectiveCamera(52, W()/H(), 0.2, 300);
camera.position.set(14, 11, 20);
camera.lookAt(0, 3, 0);

// ─────────────────────────────────────────────────────────────────────────────
// Controls
// ─────────────────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping  = false;
controls.minDistance    = 3;
controls.maxDistance    = 70;
controls.maxPolarAngle  = Math.PI * 0.89;
controls.update();


renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(14, 11, 20);
  controls.target.set(0, 3, 0);
  controls.update();
});

// ─────────────────────────────────────────────────────────────────────────────
// Post-processing — Bloom
// ─────────────────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
window.bloomPass = new UnrealBloomPass(
  new THREE.Vector2(W(), H()),
  0.65,  // strength — bloom activé par défaut pour l'ambiance
  0.42,  // radius
  0.08   // threshold — très bas pour capter même les lumières faibles
);
composer.addPass(window.bloomPass);

// Vignette + léger boost de contraste : touche « ciné » qui concentre le
// regard au centre et assombrit les bords, comme dans les rendus Unreal.
const VignetteShader = {
  uniforms: {
    tDiffuse: { value: null },
    uStrength: { value: 0.62 },   // 0 = aucune vignette, 1 = très marquée
    uContrast: { value: 1.06 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uStrength; uniform float uContrast;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // Contraste doux autour du gris moyen
      c.rgb = (c.rgb - 0.5) * uContrast + 0.5;
      // Vignette radiale
      vec2 d = vUv - 0.5;
      float v = smoothstep(0.85, 0.30, dot(d, d) * uStrength * 4.0);
      gl_FragColor = vec4(c.rgb * (0.55 + 0.45 * v), c.a);
    }`,
};
window.vignettePass = new ShaderPass(VignetteShader);
composer.addPass(window.vignettePass);

composer.addPass(new OutputPass());

// ─────────────────────────────────────────────────────────────────────────────
// Lumières de scène
// ─────────────────────────────────────────────────────────────────────────────
window.ambLight = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(window.ambLight);

const hemi = new THREE.HemisphereLight(0x8090c0, 0x000000, 0.18);
scene.add(hemi);

// Lumière de remplissage douce (toujours présente — visibilité de scène)
const _fillLight = new THREE.DirectionalLight(0xb0c0e0, 0.35);
_fillLight.position.set(0, 10, 4);
scene.add(_fillLight);

// Ambiance salle — un seul point d'entrée pour les TROIS lumières d'ambiance.
// Le curseur ne pilotait que l'AmbientLight : elle éclaire à plat, sature vite
// et ne donne jamais l'impression d'une salle éclairée. En montant aussi
// l'hémisphérique (dégradé haut/bas, qui « ouvre » le volume) et le
// remplissage, le curseur devient réellement efficace sur toute sa course.
// x = 1.0 reproduit exactement le réglage d'origine.
window.setRoomAmbience = function (x) {
  x = Math.max(0, x);
  window.ambLight.intensity = 2.0  * x;
  hemi.intensity            = 0.18 * x;
  _fillLight.intensity      = 0.35 * x;
};

// ─────────────────────────────────────────────────────────────────────────────
// Géométrie de scène
// ─────────────────────────────────────────────────────────────────────────────

// Sol — plan mat, SANS réflexion.
//
// C'était un Reflector (effet « sol mouillé ») qui renvoyait les faisceaux et
// les taches de couleur. Rendu flatteur en capture d'écran, mais gênant à
// l'usage : chaque projecteur apparaissait en double et la scène devenait
// difficile à lire. Le miroir est supprimé, pas seulement masqué — un
// Reflector coûte une passe de rendu complète et une cible 1024², donc autant
// de FPS récupérés sur les machines modestes.
//
// `floorReflector` reste le nom exposé : c'est lui que manipulent le bouton
// « Sol », le niveau de qualité et window.setFloorVisible(). Il désigne
// désormais ce plan mat, et tous ces réglages continuent de fonctionner.
const floorReflector = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 10),
  new THREE.MeshStandardMaterial({ color:0x0d0b16, roughness:0.94, metalness:0.04 })
);
floorReflector.rotation.x = -Math.PI / 2;
floorReflector.position.y = 0.0;
scene.add(floorReflector);
window.floorReflector = floorReflector;

// Voile sombre conservé : il donnait sa couleur au sol en plus d'atténuer le
// reflet. Opaque maintenant qu'il n'y a plus de miroir dessous.
const floorTint = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 10),
  new THREE.MeshBasicMaterial({ color:0x090710, transparent:true, opacity:0.55 })
);
floorTint.rotation.x = -Math.PI / 2;
floorTint.position.y = 0.004;
scene.add(floorTint);
window.floorTint = floorTint;

// Grille de scène
const gridHelper = new THREE.GridHelper(18, 18, 0x141018, 0x0d0a12);
gridHelper.position.y = 0.008;
scene.add(gridHelper);

// Cyclorama (fond de scène)
const cycMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 11),
  new THREE.MeshStandardMaterial({ color:0x060412, roughness:1.0, side:THREE.FrontSide })
);
cycMesh.position.set(0, 5.5, -5.6);
scene.add(cycMesh);


// ─────────────────────────────────────────────────────────────────────────────
// Truss
// ─────────────────────────────────────────────────────────────────────────────
const _trussGrp = new THREE.Group();
scene.add(_trussGrp);

const _barMat = new THREE.MeshStandardMaterial({ color:0x8898b8, roughness:0.30, metalness:0.88 });
const _diagMat = new THREE.MeshStandardMaterial({ color:0x607090, roughness:0.45, metalness:0.75 });
const _legMat2 = new THREE.MeshStandardMaterial({ color:0x708298, roughness:0.38, metalness:0.82 });

function buildTrusses(defs) {
  _trussGrp.clear();
  for (const td of defs) {
    if (!td.enabled) continue;
    const hy = td.height ?? 7.0, tz = td.z ?? 0;
    const xl = td.x_l ?? -9, xr = td.x_r ?? 9, len = xr - xl;

    // Barre principale
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len, 0.26, 0.34), _barMat);
    bar.position.set((xl+xr)/2, hy, tz);
    _trussGrp.add(bar);

    // Rails supérieur/inférieur (cordons lumineux)
    for (const [dy, col] of [[0.14, 0xc0cce8], [-0.14, 0x708098]]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len, 0.04, 0.04),
        new THREE.MeshStandardMaterial({ color:col, roughness:0.35, metalness:0.85 })
      );
      rail.position.set((xl+xr)/2, hy+dy, tz);
      _trussGrp.add(rail);
    }

    // Entretoisement en croix (simplifié)
    const steps = Math.round(len);
    const dAngle = Math.atan2(0.28, len / Math.max(steps, 1));
    for (let i = 0; i < steps; i++) {
      const x0 = xl + i * (len/steps), x1 = xl + (i+1) * (len/steps);
      const diagLen = Math.sqrt((x1-x0)**2 + 0.28**2);
      for (const sign of [1, -1]) {
        const d = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.03, 0.03), _diagMat);
        d.position.set((x0+x1)/2, hy + sign*0.07, tz);
        d.rotation.z = sign * dAngle;
        _trussGrp.add(d);
      }
    }

    // Pieds de support
    for (const lx of [xl, xr]) {
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, hy, 0.10), _legMat2);
      foot.position.set(lx, hy/2, tz);
      _trussGrp.add(foot);
      // Semelle au sol
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.04, 0.30),
        new THREE.MeshStandardMaterial({ color:0x404860, roughness:0.5, metalness:0.6 }));
      base.position.set(lx, 0.02, tz);
      _trussGrp.add(base);
    }
  }
}

buildTrusses([
  { label:'Truss avant',   enabled:true, height:7.0, z:-3.8, x_l:-9, x_r:9 },
  { label:'Truss arrière', enabled:true, height:7.0, z:4.0,  x_l:-9, x_r:9 },
]);

// ─────────────────────────────────────────────────────────────────────────────
// Shaders — faisceau conique volumétrique
// ─────────────────────────────────────────────────────────────────────────────
// Le faisceau n'est plus un empilement de cônes translucides : on intègre
// réellement la lumière diffusée par la fumée le long du rayon de vue
// (raymarching dans le volume du cône). C'est ce qui donne le cœur chaud, la
// pénombre douce sur les bords et surtout l'éblouissement quand le faisceau
// pointe vers la caméra — les trois choses qui manquaient.
const BEAM_VERT = `
  varying vec3 vObjPos;
  varying vec3 vWorldPos;
  void main() {
    vObjPos = position;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const BEAM_FRAG = `
  precision highp float;

  uniform vec3  uColor;
  uniform float uAlpha;     // intensité globale (niveau du projecteur)
  uniform float uSharp;     // concentration radiale : spot élevé, wash faible
  uniform float uCore;      // sur-brillance du cœur
  uniform float uHaze;      // absorption de la fumée, par mètre
  uniform float uAniso;     // g de Henyey-Greenstein (diffusion avant)
  uniform float uFall;      // chute d'intensité avec la distance
  uniform int   uSteps;     // pas de raymarching — piloté par la qualité
  // Gobo projeté DANS le volume : un vrai gobo est un masque placé au foyer,
  // il découpe donc le faisceau lui-même, pas seulement la tache au sol. Le
  // motif est constant en coupe normalisée — c'est ce qui lui fait épouser
  // l'ouverture du cône, comme en vrai.
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;   // 0 = pas de gobo (aucun coût : branche évitée)
  uniform float     uGoboRot;
  uniform float     uGoboScale;   // enveloppe / rayon utile (cf. orientCone)
  // Brouillard : la fumée n'est pas homogène, elle fait des volutes. C'est ce
  // qui donne les stries et les nuages DANS le faisceau, au lieu d'un cône
  // uniforme qui trahit tout de suite le rendu de synthèse.
  //
  // Le bruit est échantillonné en coordonnées MONDE — jamais dans le repère du
  // cône. C'est le point décisif : la fumée appartient à la salle, pas au
  // projecteur. Deux faisceaux qui se croisent traversent donc la MÊME volute,
  // et une lyre qui balaye révèle un brouillard immobile au lieu d'emporter ses
  // volutes avec elle.
  uniform float uFogAmt;    // 0 = pas de brouillard (branche entièrement évitée)
  uniform float uFogScale;  // finesse des volutes (m⁻¹)
  uniform vec3  uFogDrift;  // dérive lente du volume (pré-multipliée par le temps)
  uniform int   uFogOct;    // octaves — indexé sur la qualité

  // Three n'injecte modelMatrix que dans le vertex shader : on la passe ici.
  uniform mat4  uModel;
  uniform mat4  uInvModel;

  varying vec3 vObjPos;
  varying vec3 vWorldPos;

  // Décale le premier pas pour casser le banding. Bruit à gradient entrelacé
  // (Jorge Jimenez) plutôt qu'un hash : le motif est bien mieux réparti, donc
  // beaucoup moins de grain visible à nombre de pas égal.
  float ign(vec2 p) {
    return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
  }

  // Bruit de valeur 3D + fbm. Procédural plutôt qu'une texture 3D : pas de
  // téléversement GPU, pas de tuilage visible, et surtout un coût nul quand le
  // brouillard est à zéro puisque la branche n'est jamais prise.
  float hash13(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }

  float vnoise(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);          // lissage hermite : pas d'arêtes de grille
    return mix(mix(mix(hash13(i + vec3(0.0, 0.0, 0.0)),
                       hash13(i + vec3(1.0, 0.0, 0.0)), f.x),
                   mix(hash13(i + vec3(0.0, 1.0, 0.0)),
                       hash13(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
               mix(mix(hash13(i + vec3(0.0, 0.0, 1.0)),
                       hash13(i + vec3(1.0, 0.0, 1.0)), f.x),
                   mix(hash13(i + vec3(0.0, 1.0, 1.0)),
                       hash13(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
  }

  // Boucle bornée à 3 : WebGL1 exige un nombre d'itérations constant.
  float fbm(vec3 p, int oct) {
    float amp = 0.5, som = 0.0, norm = 0.0;
    for (int k = 0; k < 3; k++) {
      if (k >= oct) break;
      som  += amp * vnoise(p);
      norm += amp;
      p    *= 2.03;      // décalé de 2.0 pour éviter que les octaves se calent
      amp  *= 0.5;
    }
    return som / max(norm, 1e-4);
  }

  // Repère du gobo, perpendiculaire au faisceau et STABLE.
  //
  // On ne peut pas se servir du repère local du cône : orientCone() l'oriente
  // avec la rotation d'arc minimal (setFromUnitVectors), qui laisse le roulis
  // autour de l'axe indéterminé. Le motif tournait donc tout seul au gré des
  // mouvements de la lyre, sans jamais correspondre à la tache au sol.
  // On reconstruit ici une base déterministe à partir des axes du monde : pour
  // un faisceau vertical elle s'aligne sur X/Z, exactement comme la tache.
  void goboBasis(vec3 axis, out vec3 u, out vec3 v) {
    vec3 ref = abs(axis.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
    u = normalize(cross(ref, axis));
    v = cross(axis, u);
  }

  void main() {
    mat3 M  = mat3(uModel);
    vec3 gU, gV;
    goboBasis(normalize(M * vec3(0.0, -1.0, 0.0)), gU, gV);
    vec3 ro = (uInvModel * vec4(cameraPosition, 1.0)).xyz;  // caméra en espace objet
    vec3 rd = normalize(vObjPos - ro);

    // Cône unité : apex en (0, 0.5, 0), rayon 1 en y = -0.5. Solide convexe,
    // donc un rayon le traverse en un seul segment : entrée = face avant,
    // sortie = face arrière. On choisit la borne selon la face rasterisée,
    // ce qui évite de compter l'intégrale deux fois.
    float hCam = 0.5 - ro.y;
    bool camInside = (hCam > 0.0 && hCam < 1.0 && length(ro.xz) < hCam);

    float tFrag = length(vObjPos - ro);
    float tStart, tEnd;
    if (camInside) {
      if (gl_FrontFacing) discard;    // la face arrière porte l'intégrale
      tStart = 0.0;
      tEnd   = tFrag;
    } else {
      if (!gl_FrontFacing) discard;   // la face avant porte l'intégrale
      tStart = tFrag;
      tEnd   = tFrag + 2.25;          // diamètre de la sphère englobante
      if (abs(rd.y) > 1e-6) {         // resserre via la tranche y ∈ [-0.5, 0.5]
        float ta = (0.5 - ro.y) / rd.y;
        float tb = (-0.5 - ro.y) / rd.y;
        tEnd = min(tEnd, max(ta, tb));
      }
    }
    if (tEnd <= tStart) discard;

    float lenW = length(M * vec3(0.0, 1.0, 0.0));  // longueur du faisceau, en mètres
    float rW   = length(M * vec3(1.0, 0.0, 0.0));  // rayon de l'enveloppe, en mètres
    float o2w  = length(M * rd);                   // 1 unité objet → mètres

    float dt  = (tEnd - tStart) / float(uSteps);
    float jit = ign(gl_FragCoord.xy) * dt;
    float acc = 0.0;

    for (int i = 0; i < 48; i++) {
      if (i >= uSteps) break;
      float t = tStart + jit + float(i) * dt;
      if (t > tEnd) break;
      vec3 p = ro + rd * t;

      float h = 0.5 - p.y;               // 0 = lentille, 1 = bout du faisceau
      if (h <= 0.001 || h > 1.0) continue;
      float rr = length(p.xz) / h;       // 0 = axe, 1 = bord de l'enveloppe
      if (rr > 1.0) continue;

      // Profil radial : cœur gaussien + pénombre qui s'éteint sur le bord
      float dens = exp(-rr * rr * uSharp)
                 + uCore * exp(-rr * rr * uSharp * 4.0);
      dens *= 0.25 + 0.75 * (1.0 - smoothstep(0.45, 1.0, rr));

      // Masque gobo. rr donne la distance à l'axe (0 au centre, 1 au bord,
      // donc indépendante de la distance parcourue : le motif s'ouvre avec le
      // cône). L'ANGLE, lui, est pris dans le repère stable ci-dessus et non
      // dans le repère local du cône. Testé sur uGoboBlend : sans gobo, aucune
      // lecture de texture dans la boucle.
      if (uGoboBlend > 0.0) {
        vec3  perp = p - vec3(0.0, 0.5, 0.0);
        perp = perp - vec3(0.0, -1.0, 0.0) * dot(perp, vec3(0.0, -1.0, 0.0));
        vec3  pw   = M * perp;
        vec2  dir  = vec2(dot(pw, gU), dot(pw, gV));
        float dl   = length(dir);
        if (dl > 1e-5) {
          dir /= dl;
          float gc = cos(uGoboRot), gs = sin(uGoboRot);
          vec2  gd = vec2(gc * dir.x - gs * dir.y, gs * dir.x + gc * dir.y);
          // rr = 1 au bord de l'ENVELOPPE, or celle-ci est volontairement
        // dessinée deux fois plus large que le faisceau utile (orientCone est
        // appelé avec base_r * 2.0, la densité étant déjà nulle bien avant le
        // bord). Sans ce facteur, le motif s'étalait sur l'enveloppe : le
        // faisceau paraissait plus large que le gobo projeté.
        vec2  gr = gd * clamp(rr * uGoboScale, 0.0, 1.0);
          float gm = texture2D(uGoboTex, clamp(gr * 0.5 + 0.5, 0.001, 0.999)).r;
          dens *= mix(1.0, gm, uGoboBlend);
        }
      }

      // Volutes de fumée. Le facteur est centré sur 1 (le bruit vaut 0,5 en
      // moyenne, d'où 0.30 + 1.40 * 0.5 ≈ 1) : activer le brouillard
      // REDISTRIBUE la lumière, il ne l'assombrit pas. Sans ça, monter le
      // curseur éteignait tout le plan de feu.
      if (uFogAmt > 0.0) {
        vec3 pw = (uModel * vec4(p, 1.0)).xyz;      // coordonnées MONDE
        // Étirement du bruit le long de l'axe du faisceau. Sans lui, l'effet
        // est INVISIBLE : on somme 24 à 40 échantillons le long du rayon de
        // vue, et un bruit isotrope se moyenne à ~1 sur ce trajet — il ne
        // restait qu'un voile uniforme, strictement identique au rendu sans
        // brouillard (vérifié au rendu). En comprimant la composante axiale,
        // les volutes deviennent de longues traînées parallèles au faisceau :
        // elles varient d'un pixel à l'autre EN TRAVERS, donc elles survivent
        // à l'intégration. C'est aussi ce qu'on voit en vrai, la fumée étant
        // brassée par le flux d'air du projecteur.
        vec3 ax = normalize(M * vec3(0.0, -1.0, 0.0));
        vec3 q  = pw - ax * dot(pw, ax) * 0.82;
        float f = clamp(fbm(q * uFogScale + uFogDrift, uFogOct), 0.0, 1.0);
        // Le contraste doit croître avec le curseur, et fort. Sommer 24 à 40
        // échantillons le long du rayon écrase les écarts : mesuré au rendu,
        // une modulation de ±15 % est purement et simplement invisible, et
        // même ±80 % ne donne qu'un frémissement. À fond, la fenêtre se
        // resserre presque en seuil — ce sont alors de vraies déchirures de
        // fumée, comme sur une scène enfumée à la machine.
        f = smoothstep(0.32 + 0.10 * uFogAmt, 0.72 - 0.10 * uFogAmt, f);
        // Plancher à 18 % et non ~0 : les volutes font plus d'un mètre, un
        // faisceau entier peut donc tomber dans un creux du bruit. Avec un
        // plancher trop bas il s'ÉTEIGNAIT complètement pendant quelques
        // secondes (constaté au rendu) — on croyait le projecteur coupé. 18 %
        // laisse traverser la fumée épaisse sans jamais perdre le faisceau.
        // La moyenne reste 1 (0,18 + 1,64 × 0,5), donc pas d'assombrissement.
        dens *= mix(1.0, 0.18 + 1.64 * f, uFogAmt);
      }

      // Absorption de la fumée + chute avec la distance parcourue
      float dist = h * lenW;
      dens *= exp(-uHaze * dist) / (1.0 + uFall * dist * dist);
      dens *= smoothstep(0.0, 0.03, h);  // adoucit la sortie de lentille

      acc += dens;
    }
    // Normalisation par le rayon : sans ça, l'intégrale grandit avec la taille
    // du faisceau et un zoom large partirait en surexposition totale.
    acc *= dt * o2w / max(rW, 1e-3);
    if (acc <= 0.0) discard;

    // Diffusion avant : dans la vraie fumée, un faisceau pointé vers l'œil
    // est bien plus lumineux que vu de côté. Sans ça les faisceaux ont l'air
    // plats quels que soient l'angle de vue.
    vec3  axisW = normalize(M * vec3(0.0, -1.0, 0.0));   // sens de propagation
    vec3  toCam = normalize(cameraPosition - vWorldPos);
    float cosT  = dot(axisW, toCam);
    float g     = uAniso;
    float gg    = g * g;
    float hg    = (1.0 - gg) / pow(max(1.0 + gg - 2.0 * g * cosT, 1e-4), 1.5);
    float hg0   = (1.0 - gg) / pow(1.0 + gg, 1.5);       // normalisé sur le profil à 90°
    float phase = clamp(hg / max(hg0, 1e-4), 0.35, 6.0);

    gl_FragColor = vec4(uColor * acc * uAlpha * phase, 1.0);
  }
`;

// Qualité de rendu des faisceaux : nombre de pas de raymarching.
// Piloté depuis Python via window.setBeamQuality().
window.beamQuality = 24;
// Brouillard : 0 = faisceaux lisses (rendu d'avant), 1 = fumée bien marquée.
// Doit exister AVANT le premier makeBeamMat(), qui lit ces valeurs.
window.fogAmount  = 0.0;
window.fogOctaves = 2;
window.fogSpeed   = 0.35;   // 0 = fumée figée, 1 = brassage vif
const _beamMats = [];

function makeBeamMat(alpha, opts) {
  opts = opts || {};
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uColor:    { value: new THREE.Color(1, 1, 1) },
      uAlpha:    { value: alpha },
      uSharp:    { value: opts.sharp !== undefined ? opts.sharp : 8.0 },
      uCore:     { value: opts.core  !== undefined ? opts.core  : 0.9 },
      uHaze:     { value: 0.045 },
      uAniso:    { value: 0.55 },
      uFall:     { value: 0.004 },
      uSteps:    { value: window.beamQuality },
      uGoboTex:   { value: null },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
      uGoboScale: { value: 2.0 },
      uFogAmt:   { value: window.fogAmount },
      uFogScale: { value: 0.55 },   // ≈ 1,8 m par volute
      uFogDrift: { value: new THREE.Vector3() },
      uFogOct:   { value: window.fogOctaves },
      uModel:    { value: new THREE.Matrix4() },
      uInvModel: { value: new THREE.Matrix4() },
    },
    vertexShader:   BEAM_VERT,
    fragmentShader: BEAM_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
    side:           THREE.DoubleSide,   // requis : le shader trie via gl_FrontFacing
  });
  _beamMats.push(m);
  return m;
}

// L'inverse de la matrice monde doit être réévalué à chaque rendu puisque la
// caméra orbite et que le faisceau bouge.
function makeVolBeam(geo, alpha, opts) {
  const mesh = new THREE.Mesh(geo, makeBeamMat(alpha, opts));
  mesh.onBeforeRender = function () {
    const u = this.material.uniforms;
    u.uModel.value.copy(this.matrixWorld);
    u.uInvModel.value.copy(this.matrixWorld).invert();
  };
  return mesh;
}

// Densité de fumée globale : agit sur l'absorption ET sur la diffusion avant.
window.setBeamHaze = function (v) {
  for (const m of _beamMats) m.uniforms.uHaze.value = v;
};
window.setBeamQuality = function (steps) {
  window.beamQuality = Math.max(4, Math.min(48, steps | 0));
  for (const m of _beamMats) m.uniforms.uSteps.value = window.beamQuality;
};

// Brouillard — 0 à 100 %. Piloté depuis Python (onglet Scène).
window.setFog = function (pct) {
  window.fogAmount = Math.max(0, Math.min(100, pct)) / 100;
  for (const m of _beamMats) m.uniforms.uFogAmt.value = window.fogAmount;
};

// Vitesse de brassage — 0 à 100 %. À 0 la fumée est complètement figée, ce qui
// est utile pour juger une photo de plan de feu.
window.setFogSpeed = function (pct) {
  window.fogSpeed = Math.max(0, Math.min(100, pct)) / 100;
};

// Finesse des volutes : petit = nappes larges, grand = fumée nerveuse.
window.setFogScale = function (v) {
  const s = Math.max(0.15, Math.min(2.0, v));
  for (const m of _beamMats) m.uniforms.uFogScale.value = s;
};

// Octaves de bruit. Le fbm est LA dépense de la boucle de raymarching : une
// octave de plus, c'est 8 hachages de plus à chaque pas, sur chaque fragment
// de chaque faisceau. On l'indexe donc sur la qualité plutôt que de l'exposer.
window.setFogOctaves = function (n) {
  window.fogOctaves = Math.max(1, Math.min(3, n | 0));
  for (const m of _beamMats) m.uniforms.uFogOct.value = window.fogOctaves;
};

// ─────────────────────────────────────────────────────────────────────────────
// Shader — tache au sol
// ─────────────────────────────────────────────────────────────────────────────
const POOL_VERT = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const POOL_FRAG = `
  uniform vec3      uColor;
  uniform float     uAlpha;
  uniform sampler2D uGoboTex;
  uniform float     uGoboBlend;
  uniform float     uGoboRot;
  varying vec2      vUv;
  void main() {
    float d = length(vUv - vec2(0.5));
    if (d > 0.5) discard;
    float soft  = 1.0 - smoothstep(0.12, 0.50, d);
    float hot   = 1.0 - smoothstep(0.0,  0.14, d);
    float alpha = uAlpha * (soft + hot * 0.8);
    // Masque gobo avec rotation
    float c = cos(uGoboRot), s = sin(uGoboRot);
    vec2 uv0 = vUv - 0.5;
    vec2 uvR = vec2(c*uv0.x - s*uv0.y, s*uv0.x + c*uv0.y) + 0.5;
    float goboMask = mix(1.0, texture2D(uGoboTex, clamp(uvR, 0.001, 0.999)).r, uGoboBlend);
    gl_FragColor = vec4(uColor + hot*0.25, clamp(alpha * goboMask, 0.0, 1.0));
  }
`;

function makePoolMat() {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor:     { value: new THREE.Color(1,1,1) },
      uAlpha:     { value: 0.5 },
      uGoboTex:   { value: _goboTextures[0] },
      uGoboBlend: { value: 0.0 },
      uGoboRot:   { value: 0.0 },
    },
    vertexShader:   POOL_VERT,
    fragmentShader: POOL_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Textures gobo (8 slots, dessinées en canvas)
// ─────────────────────────────────────────────────────────────────────────────
function _createGoboTexture(slot) {
  const size = 256, cx = 128, cy = 128, r = 124;
  const cv  = document.createElement('canvas');
  cv.width  = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#fff';
  switch(slot) {
    case 0: // Open — disque plein
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      break;
    case 1: // Anneau
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.52, 0, Math.PI*2); ctx.fill();
      break;
    case 2: // Étoile 4 branches
      ctx.save(); ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 - Math.PI/4;
        const rad = (i%2===0) ? r : r*0.32;
        i===0 ? ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
              : ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
      break;
    case 3: // 3 cercles
      { const dr=r*0.28, of=r*0.52;
        for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/2;
          ctx.beginPath();ctx.arc(cx+Math.cos(a)*of,cy+Math.sin(a)*of,dr,0,Math.PI*2);ctx.fill();}}
      break;
    case 4: // 3 palmes (hélice)
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<3;i++){ctx.save();ctx.rotate((i/3)*Math.PI*2);
        ctx.beginPath();ctx.ellipse(0,-r*0.45,r*0.28,r*0.40,0,0,Math.PI*2);
        ctx.fill();ctx.restore();}
      ctx.restore();
      break;
    case 5: // Breakup (découpes angulaires)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      [0.05,0.22,0.40,0.58,0.75,0.90].forEach(s=>{
        ctx.beginPath();ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,s*Math.PI*2,(s+0.06)*Math.PI*2);
        ctx.closePath();ctx.fill();});
      break;
    case 6: // 6 secteurs rayonnants
      ctx.save(); ctx.translate(cx,cy);
      for(let i=0;i<6;i++){ctx.save();ctx.rotate((i/6)*Math.PI*2);
        ctx.fillRect(-r*0.075,-r,r*0.15,r);ctx.restore();}
      ctx.restore();
      break;
    case 7: // Bull's-eye (anneau + point central)
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.68,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx,cy,r*0.30,0,Math.PI*2); ctx.fill();
      break;
  }
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return new THREE.CanvasTexture(cv);
}
const _goboTextures = Array.from({length:8}, (_,i) => _createGoboTexture(i));

// ─────────────────────────────────────────────────────────────────────────────
// Halo de lentille — le flare vu sur la source elle-même
// ─────────────────────────────────────────────────────────────────────────────
const _LENS_GLOW_TEX = (function () {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0.00, 'rgba(255,255,255,1.00)');
  grd.addColorStop(0.10, 'rgba(255,255,255,0.72)');
  grd.addColorStop(0.32, 'rgba(255,255,255,0.18)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0.00)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function makeLensGlowMat() {
  return new THREE.SpriteMaterial({
    map:         _LENS_GLOW_TEX,
    color:       0xffffff,
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Géométries template (unit — scalées à la volée)
// ─────────────────────────────────────────────────────────────────────────────
// Cône fermé (avec le disque de base) : le raymarching a besoin d'une face
// avant même quand on regarde le faisceau par en dessous.
const GEO_VOL_CONE     = new THREE.CylinderGeometry(0, 1, 1, 28, 1, false);
const GEO_UNIT_CONE_24 = new THREE.CylinderGeometry(0, 1, 1, 24, 1, true);
const GEO_UNIT_CONE_16 = new THREE.CylinderGeometry(0, 1, 1, 16, 1, true);
const GEO_UNIT_CONE_10 = new THREE.CylinderGeometry(0, 1, 1, 10, 1, true);
const GEO_UNIT_CIRCLE  = new THREE.CircleGeometry(1, 36);
const GEO_BODY_PAR     = new THREE.CylinderGeometry(0.16, 0.20, 0.44, 16);
const GEO_BODY_MH      = new THREE.CylinderGeometry(0.14, 0.17, 0.38, 16);
const GEO_LENS_PAR     = new THREE.CircleGeometry(0.13, 20);
const GEO_LENS_MH      = new THREE.CircleGeometry(0.10, 20);
const GEO_BAR_MH       = new THREE.BoxGeometry(0.80, 0.10, 0.14);  // mounting bar lyre

const MAT_BODY = new THREE.MeshStandardMaterial({ color:0x3a3a5a, roughness:0.28, metalness:0.72 });

// ─────────────────────────────────────────────────────────────────────────────
// Pool de fixtures
// ─────────────────────────────────────────────────────────────────────────────
const _fixtureGrp = new THREE.Group();
const _beamGrp    = new THREE.Group();
const _poolGrp    = new THREE.Group();
const _lightGrp   = new THREE.Group();
scene.add(_fixtureGrp, _beamGrp, _poolGrp, _lightGrp);

// Couleurs groupe (même mapping que QPainter)
const GROUP_COLOR = {
  face:'#ff8844', contre:'#4488ff', douche1:'#44cc88',
  douche2:'#ffcc44', douche3:'#ff4488', lat:'#aa55ff',
  lyre:'#ee44bb', barre:'#44aaff',
};

let _objs = [];   // un objet par projecteur
window.beamScale = 1.7;
// Gain global des faisceaux volumétriques — permet de doser l'intensité
// sans toucher au niveau DMX des projecteurs.
// 1.0 → 0.62 : à pleine échelle les faisceaux écrasaient tout le reste de la
// scène (sol, structures, taches au sol devenaient illisibles). On garde les
// rapports wash/spot d'origine, seul le niveau global descend.
window.beamGain = 0.62;

// Gain global des halos lumineux (auréoles autour des lentilles et des cellules
// de barre LED). À ne pas confondre avec le bloom : l'UnrealBloomPass est déjà
// coupé au chargement par Python, ces halos sont des maillages additifs dessinés
// autour de chaque source. C'est eux qui donnent l'impression de « glow ».
// Ils ne portent aucune information — la tache au sol, si — donc on peut les
// baisser franchement sans perdre en lisibilité.
window.glowGain = 0.55;

function _getObj(i) {
  if (i < _objs.length) return _objs[i];

  // Faisceau volumétrique — un seul cône remplace l'ancien empilement
  // haze/glow/main/core : le profil radial est intégré dans le shader.
  const cVol = makeVolBeam(GEO_VOL_CONE, 1.0);
  cVol.renderOrder = 2; _beamGrp.add(cVol);

  // Halo de lentille (toujours face caméra)
  const lensGlow = new THREE.Sprite(makeLensGlowMat());
  lensGlow.renderOrder = 4; lensGlow.visible = false; _beamGrp.add(lensGlow);

  // Tache au sol
  const pool = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pool.rotation.x = -Math.PI/2;
  pool.renderOrder = 0; _poolGrp.add(pool);

  // Halo au sol (large et très doux)
  const halo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  halo.rotation.x = -Math.PI/2;
  halo.renderOrder = 0; _poolGrp.add(halo);

  // ── PRISME : 2 faisceaux + 2 taches latéraux (le faisceau central reste cVol) ──
  // Donnent le split « \ | / » qui tourne avec prism_rotation. Cachés par défaut.
  const prismBeams = [], prismPools = [];
  for (let k = 0; k < 2; k++) {
    const pm = makeVolBeam(GEO_VOL_CONE, 1.0);
    pm.renderOrder = 2; pm.visible = false; _beamGrp.add(pm); prismBeams.push(pm);
    const pp = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
    pp.rotation.x = -Math.PI/2; pp.renderOrder = 0; pp.visible = false;
    _poolGrp.add(pp); prismPools.push(pp);
  }

  // ── PAR LED — modèle compact réaliste ────────────────────────────────
  const parGrp = new THREE.Group();

  const _parBodyMat = new THREE.MeshStandardMaterial({ color:0x1c1c28, roughness:0.50, metalness:0.62 });
  const _parChrMat2 = new THREE.MeshStandardMaterial({ color:0x404858, roughness:0.38, metalness:0.78 });
  const _parYokeMat = new THREE.MeshStandardMaterial({ color:0x222234, roughness:0.42, metalness:0.78 });

  // Collier omega de fixation truss
  const parOme = new THREE.Mesh(
    new THREE.TorusGeometry(0.090, 0.026, 8, 18, Math.PI),
    _parChrMat2.clone()
  );
  parOme.rotation.z = Math.PI;
  parOme.position.set(0, 0.062, 0);
  parGrp.add(parOme);

  // Barre de yoke supérieure
  const parYokeBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.068, 0.098),
    _parYokeMat.clone()
  );
  parYokeBar.userData.projoIndex = i;
  parGrp.add(parYokeBar);

  // Bras du yoke ×2
  for (const sx of [-0.238, 0.238]) {
    const parArm = new THREE.Mesh(
      new THREE.BoxGeometry(0.058, 0.38, 0.082),
      _parYokeMat.clone()
    );
    parArm.position.set(sx, -0.19, 0);
    parArm.userData.projoIndex = i;
    parGrp.add(parArm);
    // Arrondi en bas de bras
    const parElbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.040, 8, 7),
      _parYokeMat.clone()
    );
    parElbow.position.set(sx, -0.38, 0);
    parGrp.add(parElbow);
  }

  // Corps cylindrique principal (noir mat)
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.160, 0.166, 0.24, 22),
    _parBodyMat.clone()
  );
  body.userData.projoIndex = i;
  body.position.set(0, -0.175, 0);
  parGrp.add(body);

  // Bande de couleur de groupe (accent sur le corps)
  const groupRingMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.28, metalness: 0.55,
    emissive: new THREE.Color(0.2, 0.2, 0.2), emissiveIntensity: 0.5,
  });
  const groupRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.168, 0.168, 0.018, 22),
    groupRingMat
  );
  groupRing.position.set(0, -0.094, 0);
  parGrp.add(groupRing);

  // Bague chrome avant (autour de la lentille)
  const parFrontRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.182, 0.182, 0.030, 28),
    _parChrMat2.clone()
  );
  parFrontRing.position.set(0, -0.317, 0);
  parGrp.add(parFrontRing);

  // Goupilles de pivot ×2 (reliant bras au corps)
  for (const sx of [-0.200, 0.200]) {
    const pPin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.030, 0.030, 0.095, 10),
      _parChrMat2.clone()
    );
    pPin.rotation.z = Math.PI / 2;
    pPin.position.set(sx, -0.175, 0);
    parGrp.add(pPin);
  }

  // Lentille émissive (face -Y = bas)
  const lensMat = new THREE.MeshStandardMaterial({
    color:0x060614, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.158, 32), lensMat);
  lens.position.set(0, -0.333, 0);
  lens.rotation.x = -Math.PI / 2;
  lens.userData.projoIndex = i;
  parGrp.add(lens);

  parGrp.visible = false;
  _fixtureGrp.add(parGrp);

  // clamp kept as alias for backward compat (now inside parGrp)
  const clamp = parOme;

  // ── Moving Head (Lyre) — modèle doré réaliste ────────────────────────
  const mhGrp = new THREE.Group();

  const _mhGoldMat = new THREE.MeshStandardMaterial({ color:0xc09030, roughness:0.28, metalness:0.82 });
  const _mhChrMat  = new THREE.MeshStandardMaterial({ color:0x7080a0, roughness:0.38, metalness:0.80 });
  const _mhDarkMat2= new THREE.MeshStandardMaterial({ color:0x141420, roughness:0.55, metalness:0.50 });

  // Barre de montage supérieure (top du yoke)
  const mhBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.64, 0.088, 0.17),
    _mhGoldMat.clone()
  );
  mhBar.userData.projoIndex = i;
  mhGrp.add(mhBar);

  // Colliers omega ×2 (mordent sur le truss par le dessus)
  for (const sx of [-0.185, 0.185]) {
    const ome = new THREE.Mesh(
      new THREE.TorusGeometry(0.096, 0.027, 8, 18, Math.PI),
      _mhChrMat.clone()
    );
    ome.rotation.z = Math.PI;         // demi-tore ouvert vers le haut
    ome.position.set(sx, 0.065, 0);
    mhGrp.add(ome);
    // Vis de serrage de l'omega
    const bolt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.019, 0.019, 0.050, 8),
      _mhChrMat.clone()
    );
    bolt.position.set(sx, 0.180, 0);
    mhGrp.add(bolt);
  }

  // Bras du yoke ×2 (gauche & droite) — longueur divisée par 2
  for (const sx of [-0.252, 0.252]) {
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.076, 0.28, 0.112),
      _mhGoldMat.clone()
    );
    arm.position.set(sx, -0.18, 0);
    arm.userData.projoIndex = i;
    mhGrp.add(arm);
    // Arrondi en bout de bras
    const elbow = new THREE.Mesh(
      new THREE.SphereGeometry(0.053, 10, 8),
      _mhGoldMat.clone()
    );
    elbow.position.set(sx, -0.323, 0);
    mhGrp.add(elbow);
  }

  // ── Groupe tête (tilt — rotation X) ──────────────────────────────────
  const mhHGrp = new THREE.Group();
  mhHGrp.position.set(0, -0.35, 0);

  // Corps principal — frustum légèrement évasé vers l'arrière (haut = +Y)
  const mhHead = new THREE.Mesh(
    new THREE.CylinderGeometry(0.158, 0.212, 0.43, 26),
    _mhGoldMat.clone()
  );
  mhHead.userData.projoIndex = i;
  mhHGrp.add(mhHead);

  // Bandeau sombre entre corps et bague lentille
  const mhBand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.170, 0.170, 0.034, 26),
    _mhDarkMat2.clone()
  );
  mhBand.position.set(0, -0.196, 0);
  mhHGrp.add(mhBand);

  // Bague chrome autour de la lentille
  const mhRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.192, 0.192, 0.040, 30),
    _mhChrMat.clone()
  );
  mhRing.position.set(0, -0.232, 0);
  mhHGrp.add(mhRing);

  // Lentille émissive (face -Y = bas par défaut)
  const mhLensMat = new THREE.MeshStandardMaterial({
    color:0x060618, emissive:new THREE.Color(0,0,0),
    emissiveIntensity:0, roughness:0.02, metalness:0.12,
  });
  const mhLens = new THREE.Mesh(new THREE.CircleGeometry(0.175, 32), mhLensMat);
  mhLens.position.set(0, -0.248, 0);
  mhLens.rotation.x = -Math.PI / 2;
  mhLens.userData.projoIndex = i;
  mhHGrp.add(mhLens);

  // Goupilles de pivot tilt ×2 (reliant tête aux bras du yoke)
  for (const sx of [-0.266, 0.266]) {
    const pin = new THREE.Mesh(
      new THREE.CylinderGeometry(0.040, 0.040, 0.118, 12),
      new THREE.MeshStandardMaterial({ color:0x9098a4, roughness:0.16, metalness:0.97 })
    );
    pin.rotation.z = Math.PI / 2;
    pin.position.set(sx, 0.055, 0);
    mhHGrp.add(pin);
  }

  mhGrp.add(mhHGrp);
  mhGrp.visible = false;
  _fixtureGrp.add(mhGrp);

  // Point light au sol (éclaire le sol et les silhouettes)
  const ptLight = new THREE.PointLight(0xffffff, 0, 14, 1.8);
  _lightGrp.add(ptLight);

  // ── Cellule pixel (barre/matrice) ────────────────────────────────────
  // Petit cube émissif à la place d'un corps + faisceau complet : c'est ce
  // qui permet de voir un chase courir sans faire ramer la scène.
  const pxCell = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.16, 0.16),
    new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.4, metalness:0.3,
                                     emissive:0x000000, emissiveIntensity:0 })
  );
  pxCell.userData.projoIndex = i;
  pxCell.visible = false;
  _fixtureGrp.add(pxCell);
  // Nappe wash au sol sous le pixel : 2 couches (proche + halo large et doux)
  // pour la lueur diffuse d'un ruban LED, pas un spot net.
  const pxGlow = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pxGlow.rotation.x = -Math.PI/2; pxGlow.renderOrder = 0; pxGlow.visible = false;
  _poolGrp.add(pxGlow);
  const pxHalo = new THREE.Mesh(GEO_UNIT_CIRCLE, makePoolMat());
  pxHalo.rotation.x = -Math.PI/2; pxHalo.renderOrder = 0; pxHalo.visible = false;
  _poolGrp.add(pxHalo);
  // Boîtier physique de la barre/matrice : réglette d'alu sombre (échelle X =
  // longueur, posée sur le représentant). C'est ce qui fait « fixture » plutôt
  // que « rectangle lumineux ». Cube unité (1×1×1) → mis à l'échelle au runtime.
  const pxHousing = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color:0x16171c, roughness:0.55, metalness:0.65 })
  );
  pxHousing.userData.projoIndex = i;
  pxHousing.visible = false;
  _fixtureGrp.add(pxHousing);

  const obj = { cVol, lensGlow, pool, halo, ptLight,
                body, lens, groupRing, parGrp,
                mhGrp, mhHGrp, mhHead, mhLens,
                prismBeams, prismPools,
                pxCell, pxGlow, pxHalo, pxHousing, _fx: null };
  _objs.push(obj);
  return obj;
}

// ─────────────────────────────────────────────────────────────────────────────
// Sélection par clic — raycasting sur les fixtures
// ─────────────────────────────────────────────────────────────────────────────
window.setSelectedProjos = function(list) {
  // Efface les références de clignotement de l'ancienne sélection : elles
  // décrivent des valeurs qui ne la concernent plus.
  for (const i of _selSet) {
    if (i >= 0 && i < _objs.length) {
      const o = _objs[i];
      o._selA = o._selG = o._selP = undefined;
    }
  }
  _selSet = new Set((list || []).filter(i => i >= 0 && i < _objs.length));
  for (const i of _selSet) {
    const o = _objs[i];
    o._selA = o._selG = o._selP = undefined;   // repris à la prochaine image
  }
};

window.highlightProjo = function(idx) {
  // Efface ancien surlignage
  if (_selectedProjo >= 0 && _selectedProjo < _objs.length) {
    const prev = _objs[_selectedProjo];
    prev.body.material.emissive.setHex(0x000000);
    prev.body.material.emissiveIntensity = 0;
    prev.mhHead.material.emissive.setHex(0x000000);
    prev.mhHead.material.emissiveIntensity = 0;
    if (prev.groupRing) {
      prev.groupRing.material.emissiveIntensity = 0.5;   // retour à l'accent normal
    }
    // Références de clignotement : elles décrivent l'ancien sélectionné,
    // elles n'ont plus de sens pour le nouveau.
    prev._selA = prev._selG = prev._selP = undefined;
  }
  _selectedProjo = idx;
  // Appelé seul (clic dans la 3D, sélection simple) : la sélection se résume à
  // ce projecteur. Le tableau, lui, complète ensuite avec setSelectedProjos().
  window.setSelectedProjos(idx >= 0 ? [idx] : []);
  if (idx >= 0 && idx < _objs.length) {
    const cur = _objs[idx];
    cur.body.material.emissive.setHex(0x0055aa);
    cur.body.material.emissiveIntensity = 1.2;
    cur.mhHead.material.emissive.setHex(0x0055aa);
    cur.mhHead.material.emissiveIntensity = 1.2;
    if (cur.groupRing) {
      cur.groupRing.material.emissive.setHex(0x0088ff);
      cur.groupRing.material.emissiveIntensity = 2.5;   // clignotant bleu visible
    }
  }
};

renderer.domElement.addEventListener('pointerdown', (e) => {
  _ptrDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!_ptrDownPos) return;
  const dx = e.clientX - _ptrDownPos.x;
  const dy = e.clientY - _ptrDownPos.y;
  _ptrDownPos = null;
  if (Math.sqrt(dx*dx + dy*dy) > 6) return;   // c'était un drag, pas un clic

  const rect = renderer.domElement.getBoundingClientRect();
  _mouse2D.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  _mouse2D.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_mouse2D, camera);

  const hits = _raycaster.intersectObjects(_fixtureGrp.children, true);
  let idx = -1;
  for (const h of hits) {
    if (h.object.userData.projoIndex !== undefined) {
      idx = h.object.userData.projoIndex;
      break;
    }
  }
  window.highlightProjo(idx);
  if (window._bridge) window._bridge.projoSelected(idx);
});

// ─────────────────────────────────────────────────────────────────────────────
// Calcul direction faisceau (miroir exact du code Python)
// ─────────────────────────────────────────────────────────────────────────────
// Longueur maximale d'un faisceau qui ne rencontre ni le sol ni le plafond.
// UNE seule valeur pour tous les cas : c'est ce qui garantit la continuité au
// franchissement de l'horizontale (cf. beamFloor).
// 22 m ≈ diagonale utile de la scène. UNE seule distance pour la longueur
// dessinée ET pour décider si le faisceau touche le sol : avec deux valeurs
// différentes, il existait une bande de tilt où la tache s'affichait alors
// que le cône s'arrêtait encore à 2 m du sol.
const BEAM_TMAX = 22.0;

function beamFloor(p) {
  const hy  = p.fixture_height ?? 7.0;
  const isMH = p.fixture_type === 'Moving Head';
  if (isMH) {
    const panA  = (p.pan - 32768)  / 32768.0 * Math.PI;
    const theta = (32768 - p.tilt) / 32768.0 * Math.PI * 0.75;
    const rx    = (p.rot3d_x || 0) * Math.PI / 180;
    const rz    = (p.rot3d_z || 0) * Math.PI / 180;
    // Direction correcte : tilt dévie le faisceau DANS la direction du pan.
    // Pan seul (tilt=0) → faisceau droit vers le bas. Tilt → déviation dans le plan pan.
    //
    // L'ordre reproduit exactement la hiérarchie Three.js du corps :
    // mhGrp porte (rx, pan, rz) en Euler XYZ, donc R = Rx·Ry·Rz, et la tête
    // porte le tilt. Rz s'applique donc EN PREMIER, avant le pan.
    // Il manquait ici : le corps pivotait avec rot3d_z, le faisceau non — d'où
    // un projecteur retourné dont le faisceau partait dans une autre direction.
    const vy0 = -Math.cos(theta), vz0 = Math.sin(theta);
    const wx  =  -vy0 * Math.sin(rz);          // Rz autour de l'axe du corps
    const wy  =   vy0 * Math.cos(rz);
    const wz  =   vz0;
    const bx_raw = wx * Math.cos(panA) + wz * Math.sin(panA);
    const by_raw = wy;
    const bz_raw = -wx * Math.sin(panA) + wz * Math.cos(panA);
    // Rotation de corps (rx)
    const bx = bx_raw;
    const by = by_raw * Math.cos(rx) - bz_raw * Math.sin(rx);
    const bz = by_raw * Math.sin(rx) + bz_raw * Math.cos(rx);
    // Position réelle de la lentille (même ordre : Ry d'abord, puis Rx)
    const ly_l  = -0.35 - 0.248 * Math.cos(theta);
    const lz_l  =          0.248 * Math.sin(theta);
    // Même chaîne Rz → Ry → Rx que la direction : sans ça, sur un projecteur
    // pivoté, le faisceau démarrait à côté de la lentille au lieu d'en sortir.
    const qx = -ly_l * Math.sin(rz), qy = ly_l * Math.cos(rz), qz = lz_l;
    const ax =  qx * Math.cos(panA) + qz * Math.sin(panA);
    const ay =  qy;
    const az = -qx * Math.sin(panA) + qz * Math.cos(panA);
    const lensX = p.x + ax;
    const lensY = hy  + ay * Math.cos(rx) - az * Math.sin(rx);
    const lensZ = p.z + ay * Math.sin(rx) + az * Math.cos(rx);
    const goingUp = by > 0.05;
    // Longueur du faisceau : jusqu'au sol s'il descend, jusqu'au plafond s'il
    // monte, bornée à BEAM_TMAX.
    //
    // Les trois branches d'origine ne se raccordaient PAS : 10 m en descendant,
    // 10 m dans la zone morte |by| <= 0.05, mais 15 m dès que ça montait. Au
    // franchissement de l'horizontale, la longueur sautait de 10 à 15 m et le
    // point d'arrivée basculait du sol au plafond — le faisceau paraissait
    // sauter « de bas en haut » (constaté entre tilt 54995 et 55499 sur une
    // lyre à 7 m). Avec une borne UNIQUE, les deux quotients divergent vers
    // BEAM_TMAX quand by → 0 de part et d'autre : la longueur est continue.
    let t;
    if      (by < 0) t = Math.min(lensY / (-by), BEAM_TMAX);
    else if (by > 0) t = Math.min((15.0 - lensY) / by, BEAM_TMAX);
    else             t = BEAM_TMAX;
    return {
      fx: Math.max(-11, Math.min(11, lensX + bx*t)),
      // Altitude d'arrivée calculée comme fx/fz, et NON forcée au sol ou au
      // plafond selon `goingUp`. C'est ce forçage qui téléportait le faisceau :
      // au franchissement du seuil, l'extrémité sautait de 0.03 à 14.5 m.
      fy: Math.max(0.03, Math.min(14.5, lensY + by*t)),
      fz: Math.max(-8,  Math.min(13, lensZ + bz*t)),
      lensX, lensY, lensZ, bx, by, bz, isMH, goingUp,
      hitsFloor: by < -1e-6 && (lensY / -by) <= BEAM_TMAX,
    };
  } else {
    const lensY = hy - 0.333;
    const ry    = (p.rot3d_y ?? 0) * Math.PI / 180;  // pan — pivot horizontal
    const rx    = (p.rot3d_x ?? 0) * Math.PI / 180;  // tilt — inclinaison depuis nadir
    const bx    = Math.sin(ry) * Math.sin(rx);
    const by    = -Math.cos(rx);
    const bz    = Math.cos(ry) * Math.sin(rx);
    const goingUp = by > 0.05;
    // Même borne unique que pour les lyres — voir le commentaire plus haut :
    // trois bornes différentes (12 / 15 / 12) faisaient sauter la longueur au
    // franchissement de l'horizontale.
    const t = by < 0 ? Math.min(lensY / (-by), BEAM_TMAX)
            : by > 0 ? Math.min((15.0 - lensY) / by, BEAM_TMAX)
            :          BEAM_TMAX;
    return {
      fx: Math.max(-11, Math.min(11, p.x + bx * t)),
      fy: Math.max(0.03, Math.min(14.5, lensY + by * t)),
      fz: Math.max(-8,  Math.min(13, p.z + bz * t)),
      lensX: p.x, lensY, lensZ: p.z, bx, by, bz, isMH: false, goingUp,
      hitsFloor: by < -1e-6 && (lensY / -by) <= BEAM_TMAX,
    };
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Positionner / orienter un cône unit entre deux points
// ─────────────────────────────────────────────────────────────────────────────
const _vUp  = new THREE.Vector3(0, 1, 0);
const _vDir = new THREE.Vector3();
const _qTmp = new THREE.Quaternion();

function orientCone(mesh, tipX, tipY, tipZ, baseX, baseY, baseZ, rScale) {
  const dx = baseX - tipX, dy = baseY - tipY, dz = baseZ - tipZ;
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (len < 0.05) { mesh.visible = false; return; }
  // direction de la base vers le tip (= haut local du cylindre)
  _vDir.set(-dx/len, -dy/len, -dz/len);
  _qTmp.setFromUnitVectors(_vUp, _vDir);
  mesh.position.set((tipX+baseX)/2, (tipY+baseY)/2, (tipZ+baseZ)/2);
  mesh.quaternion.copy(_qTmp);
  mesh.scale.set(rScale, len, rScale);
  mesh.visible = true;
}

// ─────────────────────────────────────────────────────────────────────────────
// updateScene — appelé depuis Python via runJavaScript
// ─────────────────────────────────────────────────────────────────────────────
// Buffers pré-alloués — évite ~600 allocations Color/s qui déclenchent le GC
const _colBuf = new THREE.Color();
const _briBuf = new THREE.Color();

window.updateScene = function(projectors) {
  const bs = window.beamScale;

  for (let i = 0; i < projectors.length; i++) {
    const p   = projectors[i];
    const obj = _getObj(i);

    // ── Barre/matrice : rendu per-pixel (cellule légère, pas de corps/faisceau) ──
    if (p.is_pixel || p.is_master) {
      // Masquer les formes « fixture classique » de ce slot
      obj.parGrp.visible = obj.mhGrp.visible = false;
      obj.cVol.visible = obj.lensGlow.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
      obj._fx = null;

      if (p.is_master) {                 // canaux globaux : aucune forme
        obj.pxCell.visible = false;
        obj.pxGlow.visible = false; obj.pxHalo.visible = false;
        obj.pxHousing.visible = false;
        continue;
      }
      const plvl = Math.max(0, Math.min(1, p.level / 100.0));
      const hy   = p.fixture_height ?? 7.0;

      // Boîtier de la barre (seul le représentant porte `housing`)
      if (p.housing) {
        const h = p.housing;
        obj.pxHousing.visible = _flags.fixtures;
        obj.pxHousing.position.set(h.cx, hy + 0.02, h.cz);
        obj.pxHousing.rotation.y = -h.angle;      // aligne l'axe X sur la barre
        obj.pxHousing.scale.set(Math.max(0.2, h.len), 0.11, 0.11);
      } else {
        obj.pxHousing.visible = false;
      }

      obj.pxCell.visible = true;
      obj.pxCell.position.set(p.x, hy, p.z);
      _colBuf.setRGB(p.r/255, p.g/255, p.b/255);
      obj.pxCell.material.color.copy(_colBuf).multiplyScalar(0.25);
      obj.pxCell.material.emissive.copy(_colBuf);
      // Émissif un peu plus fort : le bloom de la scène crée le glow diffus
      obj.pxCell.material.emissiveIntensity = plvl > 0 ? (0.5 + plvl * 3.6) : 0;
      // Nappe wash au sol : couche proche + halo large et très doux
      if (plvl > 0.02) {
        obj.pxGlow.visible = true;
        obj.pxGlow.position.set(p.x, 0.02, p.z);
        obj.pxGlow.scale.setScalar((0.45 + 1.1 * plvl) * bs);   // plus large
        obj.pxGlow.material.uniforms.uColor.value.copy(_colBuf);
        obj.pxGlow.material.uniforms.uAlpha.value = 0.42 * plvl * window.glowGain;
        obj.pxHalo.visible = true;
        obj.pxHalo.position.set(p.x, 0.012, p.z);
        obj.pxHalo.scale.setScalar((0.45 + 1.1 * plvl) * bs * 2.6);
        obj.pxHalo.material.uniforms.uColor.value.copy(_colBuf);
        obj.pxHalo.material.uniforms.uAlpha.value = 0.13 * plvl * window.glowGain;
      } else {
        obj.pxGlow.visible = false;
        obj.pxHalo.visible = false;
      }
      continue;
    }
    // Slot redevenu une fixture classique : cacher les cellules pixel
    obj.pxCell.visible = false;
    obj.pxGlow.visible = false;
    obj.pxHalo.visible = false;
    obj.pxHousing.visible = false;

    // Projecteur sélectionné dans le tableau : on le force allumé en blanc,
    // à pleine puissance. C'est ce qui permet de le repérer d'un coup d'œil
    // dans la scène, même s'il est éteint dans le show — cas le plus fréquent
    // quand on cherche « lequel est-ce ? ». Le clignotement est appliqué par
    // animate(), image par image (voir _selBlink).
    const _isSel = _selSet.has(i);
    const lvl = _isSel ? 1.0 : Math.max(0, Math.min(1, p.level / 100.0));
    const r = _isSel ? 1.0 : p.r/255,
          g = _isSel ? 1.0 : p.g/255,
          b = _isSel ? 1.0 : p.b/255;
    _colBuf.setRGB(r, g, b);
    const hy  = p.fixture_height ?? 7.0;
    const bf  = beamFloor(p);
    const { fx, fy, fz, lensX, lensY, lensZ, isMH, goingUp, hitsFloor } = bf;

    // ── Corps de fixture ─────────────────────────────────────────────
    if (isMH) {
      // Cache le groupe PAR
      obj.parGrp.visible = false;

      // Positionne + oriente le Moving Head
      const panA  = (p.pan - 32768)  / 32768.0 * Math.PI;
      const theta = (32768 - p.tilt) / 32768.0 * Math.PI * 0.75;
      const rx    = (p.rot3d_x || 0) * Math.PI / 180;
      obj.mhGrp.position.set(p.x, hy, p.z);
      obj.mhGrp.rotation.x  = rx;
      obj.mhGrp.rotation.y  = panA;
      obj.mhGrp.rotation.z  = (p.rot3d_z || 0) * Math.PI / 180;
      obj.mhHGrp.rotation.x = -theta;
      obj.mhGrp.visible = _flags.fixtures;

      // Lentille MH émissive
      if (lvl > 0) {
        _briBuf.copy(_colBuf).multiplyScalar(1.0 + lvl * 1.5);
        obj.mhLens.material.emissive.copy(_briBuf);
        obj.mhLens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.mhLens.material.emissive.set(0, 0, 0);
        obj.mhLens.material.emissiveIntensity = 0;
      }
    } else {
      // Cache le groupe MH
      obj.mhGrp.visible = false;

      // ── Groupe PAR LED ───────────────────────────────────────────
      obj.parGrp.position.set(p.x, hy, p.z);
      obj.parGrp.rotation.x = (p.rot3d_x ?? 0) * Math.PI / 180;
      obj.parGrp.rotation.y = (p.rot3d_y ?? 0) * Math.PI / 180;
      obj.parGrp.visible = _flags.fixtures;

      // Bande de couleur de groupe (accent toujours visible)
      const gcHex = GROUP_COLOR[p.group] ?? '#5577aa';
      if (i !== _selectedProjo) {   // ne pas écraser le surlignage de sélection
        obj.groupRing.material.color.set(gcHex);
        obj.groupRing.material.emissive.set(gcHex);
        obj.groupRing.material.emissiveIntensity = 0.6;
      }

      // Lentille émissive
      if (lvl > 0) {
        _briBuf.copy(_colBuf).multiplyScalar(1.0 + lvl * 1.5);
        obj.lens.material.emissive.copy(_briBuf);
        obj.lens.material.emissiveIntensity = 0.8 + lvl * 3.5;
      } else {
        obj.lens.material.emissive.set(0, 0, 0);
        obj.lens.material.emissiveIntensity = 0;
      }
    }

    // ── Faisceaux ────────────────────────────────────────────────────
    if (lvl > 0.03) {
      // WASH (PAR LED) vs BEAM (lyre spot). Un PAR est une nappe large et
      // douce SANS cœur défini ; une lyre est un faisceau serré et punchy.
      const isWash = p.fixture_type === 'PAR LED';
      // Zoom DMX → largeur du faisceau (uniquement si le projo a un canal Zoom,
      // sinon zoom=0 rétrécirait tout). 0 = serré, 255 = large.
      const _zoomF = p.has_zoom ? (0.6 + (p.zoom / 255) * 1.6) : 1.0;
      const _spread = (isWash ? 1.9  : 1.0) * _zoomF;  // wash + zoom

      const base_r = (0.22 + 2.0 * lvl) * bs * _spread;
      const fx2 = fx, fz2 = fz;

      // Extrémité réelle du rayon (fy), et non le sol ou le plafond selon un
      // booléen : c'est ce qui rend le faisceau continu quand il franchit
      // l'horizontale. Constaté entre tilt 54885 et 55397 sur des lyres à 7 m,
      // où le faisceau sautait du sol au plafond d'un pas de tilt à l'autre.
      const baseY = fy;

      // Un seul cône, dont l'enveloppe est volontairement serrée : au-delà de
      // ~2× le rayon utile la densité est déjà nulle, et chaque mètre de
      // rayon en trop coûte des fragments raymarchés au carré.
      orientCone(obj.cVol, lensX, lensY, lensZ, fx2, baseY, fz2, base_r * 2.0);
      const _bu = obj.cVol.material.uniforms;
      _bu.uColor.value.copy(_colBuf);
      // Un wash est une nappe large sans cœur défini ; une lyre est un
      // faisceau serré avec un cœur très chaud. Le zoom resserre le profil
      // en plus d'élargir l'enveloppe.
      // uSharp est exprimé sur le rayon NORMALISÉ de l'enveloppe : en la
      // resserrant de 3× à 2×, le même rayon physique donne un rr 1,5× plus
      // grand, donc le coefficient doit être divisé par 1,5² pour conserver
      // exactement la même largeur de faisceau à l'écran.
      _bu.uSharp.value = (isWash ? 1.35 : 4.40) / Math.max(0.35, _zoomF);
      _bu.uCore.value  = isWash ? 0.35 : 2.20;
      // beamGain = réglage global ; p.beam_gain = dosage par projecteur,
      // réglé dans le tableau de l'onglet Plan.
      _bu.uAlpha.value = (isWash ? 1.70 : 2.40) * lvl * window.beamGain
                       * (p.beam_gain ?? 1.0);
      // Valeur de référence du clignotement : sans elle, _selBlink
      // multiplierait sa propre sortie à chaque image et le faisceau
      // s'éteindrait en quelques dixièmes de seconde.
      if (_isSel) obj._selA = _bu.uAlpha.value;

      // Halo de lentille : grossit et s'intensifie avec le niveau
      obj.lensGlow.visible = true;
      obj.lensGlow.position.set(lensX, lensY, lensZ);
      obj.lensGlow.scale.setScalar((0.30 + 0.85 * lvl) * (isWash ? 1.25 : 1.0) * bs);
      obj.lensGlow.material.color.copy(_colBuf);
      obj.lensGlow.material.opacity = Math.min(1.0, (0.35 + 0.65 * lvl) * lvl * window.glowGain);
      if (_isSel) obj._selG = obj.lensGlow.material.opacity;

      // Gobo : calculé ici et non dans le bloc « tache au sol », car il
      // découpe AUSSI le faisceau — y compris quand la lyre pointe vers le
      // haut, cas où il n'y a pas de tache au sol du tout.
      const goboSlot  = Math.min(7, Math.floor(((p.gobo || 0) / 256) * 8));
      const goboBlend = goboSlot > 0 ? 1.0 : 0.0;
      const goboRot   = ((p.gobo_rotation || 0) / 255.0) * Math.PI * 2;
      _bu.uGoboTex.value   = _goboTextures[goboSlot];
      _bu.uGoboBlend.value = goboBlend;
      // Rotation continue en cours ? C'est animate() qui pilote l'angle, image
      // par image. L'écraser ici — 25 fois par seconde, à la cadence des envois
      // Python — ramenait sans cesse le motif à son angle de départ : le gobo
      // tressautait au lieu de tourner.
      if (!((p.gobo_rotation || 0) > 0)) _bu.uGoboRot.value = goboRot;

      if (hitsFloor) {
        // Tache principale au sol (avec gobo)
        // Wash : nappe au sol plus large et plus douce qu'un spot de lyre
        const poolR = (0.35 + 2.2*lvl) * bs * (isWash ? 1.6 : 1.0);
        obj.pool.position.set(fx2, 0.02, fz2);
        obj.pool.scale.setScalar(poolR);
        obj.pool.material.uniforms.uColor.value.copy(_colBuf);
        obj.pool.material.uniforms.uAlpha.value = (isWash ? 0.52 : 0.70) * lvl;
        if (_isSel) obj._selP = obj.pool.material.uniforms.uAlpha.value;
        obj.pool.material.uniforms.uGoboTex.value   = _goboTextures[goboSlot];
        obj.pool.material.uniforms.uGoboBlend.value = goboBlend;
        if (!((p.gobo_rotation || 0) > 0))
          obj.pool.material.uniforms.uGoboRot.value = goboRot;
        obj.pool.visible = true;

        // Halo diffus au sol (plus large)
        obj.halo.position.set(fx2, 0.015, fz2);
        obj.halo.scale.setScalar(poolR * 2.8);
        obj.halo.material.uniforms.uColor.value.copy(_colBuf);
        obj.halo.material.uniforms.uAlpha.value = 0.15 * lvl * window.glowGain;
        obj.halo.visible = true;

        // Point light au sol
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 4.5;
        obj.ptLight.position.set(fx2, 0.4, fz2);
      } else {
        // Faisceau montant — pas de tache au sol
        obj.pool.visible = false;
        obj.halo.visible = false;
        // Point light dans le faisceau montant
        obj.ptLight.color.copy(_colBuf);
        obj.ptLight.intensity = lvl * 3.0;
        obj.ptLight.position.set(fx2, Math.min(lensY + 4.0, 13.0), fz2);
      }
      obj.ptLight.visible = true;

      // État pour l'animation continue (prisme + rotation gobo) dans animate()
      obj._fx = {
        active:   true,
        lensX, lensY, lensZ,
        fx: fx2, fz: fz2, baseY,
        base_r,
        poolR:    (0.35 + 2.2 * lvl) * bs,
        goingUp,
        hitsFloor,
        prism:    (p.prism || 0) > 0,
        prismV:   (p.prism_rotation || 0),
        goboRotV: (p.gobo_rotation || 0),
        col:      [r, g, b],
        lvl,
      };

    } else {
      obj.cVol.visible = obj.lensGlow.visible = false;
      obj.pool.visible  = obj.halo.visible  = false;
      obj.ptLight.visible = false;
      obj._fx = null;
    }
  }

  // Masquer les slots inutilisés
  for (let i = projectors.length; i < _objs.length; i++) {
    const o = _objs[i];
    o.cVol.visible  = o.lensGlow.visible =
    o.pool.visible  = o.halo.visible  = o.ptLight.visible = false;
    o.parGrp.visible = false;
    o.mhGrp.visible  = false;
    o.pxCell.visible = false;
    o.pxGlow.visible = false;
    o.pxHalo.visible = false;
    o.pxHousing.visible = false;
    o._fx = null;
  }
};

// Presets caméra

const CAM_PRESETS = {
  iso:   { pos:[14,11,20], tgt:[0,3,0] },
  front: { pos:[0,5,24],   tgt:[0,4,0] },
  top:   { pos:[0,30,0.1], tgt:[0,0,0] },
  side:  { pos:[24,7,0],   tgt:[0,4,0] },
};
const CAM_BTNS = { iso:'b-iso', front:'b-front', top:'b-top', side:'b-side' };

window.setCam = function(name) {
  const p = CAM_PRESETS[name]; if (!p) return;
  camera.position.set(...p.pos);
  controls.target.set(...p.tgt);
  controls.update();
  Object.keys(CAM_BTNS).forEach(k => {
    const el = document.getElementById(CAM_BTNS[k]);
    if (el) el.classList.toggle('on', k===name);
  });
};

// ── Points de vue mémorisés ──────────────────────────────────────────────
// Un préréglage fige un angle ; ici on capture exactement où en est la
// caméra, pour retrouver un cadrage de travail au clic.
window.getView = function () {
  return JSON.stringify({
    pos: camera.position.toArray(),
    tgt: controls.target.toArray(),
    fov: camera.fov,
  });
};

window.setView = function (v) {
  if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return false; } }
  if (!v || !v.pos || !v.tgt) return false;
  camera.position.fromArray(v.pos);
  controls.target.fromArray(v.tgt);
  if (v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
  controls.update();
  Object.keys(CAM_BTNS).forEach(k => {
    const el = document.getElementById(CAM_BTNS[k]);
    if (el) el.classList.remove('on');
  });
  return true;
};

// ── Export image ─────────────────────────────────────────────────────────
// Le contexte WebGL est créé sans preserveDrawingBuffer : on relit donc le
// canvas dans la MÊME tâche que le rendu, avant que le compositeur ne l'efface.
window.snapshot = function () {
  try {
    if (_flags.bloom) composer.render(); else renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  } catch (e) {
    return 'ERR:' + e.message;
  }
};

// Flags d'affichage
