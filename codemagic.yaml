# Codemagic : builds de l'app tablette (mobile/, Capacitor) et envoi sur les stores.
# Lancement manuel depuis codemagic.io (pas de déclenchement automatique sur push).
#
# À configurer une fois dans Codemagic :
# - Settings > Integrations > Developer Portal : clé API App Store Connect nommée « MyStrow ASC »
# - Environment variables, groupe « ios_signing » : CERTIFICATE_PRIVATE_KEY (clé RSA PEM, secrète)
#   qui sert à créer / retrouver le certificat Apple Distribution.
# - Android (workflow android-play) — en place depuis le 30/10/2026 :
#   · Settings > Code signing identities > Android keystores : mystrow-upload.jks
#     (%USERPROFILE%\.mystrow-android), nom de référence « mystrow_upload ».
#   · Applications > MyStrow > Environment variables, groupe « google_play » :
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON du compte de service invité dans la Play Console).
workflows:
  android-play:
    name: Android Google Play (tablette)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    environment:
      android_signing:
        - mystrow_upload
      groups:
        - google_play
      vars:
        PACKAGE_NAME: fr.mystrow.app
      node: 22
      java: 21
    scripts:
      - name: Dépendances npm
        script: npm ci
      - name: Construire www + cap sync
        script: npm run build && npx cap sync android
      - name: Clé d'envoi (même fichier qu'en local, lu par app/build.gradle)
        script: |
          mkdir -p "$HOME/.mystrow-android"
          cat > "$HOME/.mystrow-android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: versionCode = dernier envoyé sur Google Play + 1
        script: |
          # Jamais en dessous du versionCode du dépôt : si Google ne répond pas
          # (droits du compte de service pas encore actifs), repartir de 0
          # donnerait un versionCode 1, refusé à l'envoi.
          LOCAL=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          [ "$NEXT" -lt "$LOCAL" ] && NEXT=$LOCAL
          echo "versionCode $NEXT (Play : $LATEST, dépôt : $LOCAL)"
          sed -i '' "s/versionCode [0-9]*/versionCode $NEXT/" android/app/build.gradle
      - name: Compiler l'AAB
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        # Brouillon : la release arrive dans la Play Console, on y ajoute les
        # notes de version et on clique « Publier » soi-même.
        submit_as_draft: true

  ios-appstore:
    name: iOS App Store (tablette)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    integrations:
      app_store_connect: MyStrow ASC
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.happlysas.mystrow
        APP_STORE_APPLE_ID: 6760429882
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Dépendances npm
        script: npm ci
      - name: Construire www + cap sync
        script: npm run build && npx cap sync ios
      - name: Signature (certificat + profil App Store)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Numéro de build = dernier TestFlight + 1
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/" "$XCODE_PROJECT/project.pbxproj"
      - name: Compiler l'IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
