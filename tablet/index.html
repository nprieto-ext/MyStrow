<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MyStrow — Tablette</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00d4ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyStrow">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pad-gap:    clamp(4px, 0.9vmin, 12px);
      --bg:         #0d0d0d;
      --pad-off:    #1a1a1a;
      --pad-border: #252525;
      --accent:     #00d4ff;
      --fader-bg:   #1a1a1a;
      --fader-fill: rgba(0, 212, 255, 0.18);
      --fx-fill:    rgba(170,  80, 255, 0.22);
      --thumb-col:  #4a4a4a;
      --fx-thumb:   #aa44ff;
    }

    html, body { height: 100%; width: 100%; background: var(--bg); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent; touch-action: none; }

    #app { display: flex; flex-direction: column; height: 100%; padding: 6px; gap: 6px; }

    #header { display: flex; align-items: center; flex-shrink: 0; height: clamp(28px, 5vh, 46px); gap: 6px; }
    #logo { font-size: clamp(11px, 1.5vw, 16px); font-weight: 700; letter-spacing: 3px; color: #333; text-transform: uppercase; flex-shrink: 0; }
    #logo span { color: var(--accent); }

    #tabs { display: flex; gap: 4px; flex: 1; }
    .tab-btn { flex: 1; height: clamp(24px, 4.4vh, 42px); border: 1px solid #2a2a2a; border-radius: 5px; background: #111; color: #444;
      font-size: clamp(10px, 1.5vw, 15px); font-weight: 700; letter-spacing: 1px; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .tab-btn.active { background: #0a1820; color: var(--accent); border-color: var(--accent); }

    #conn-status { font-size: 9px; color: #333; letter-spacing: 1px; flex-shrink: 0; transition: color 0.3s; }
    #conn-status.ok  { color: var(--accent); }
    #conn-status.err { color: #ff4444; }

    .page { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; }
    .page.active { display: flex; }

    /* AKAI */
    #akai-pagenav { display: none; flex-shrink: 0; align-items: center; justify-content: center; gap: 10px; height: clamp(26px, 4vh, 40px); }
    #akai-pagenav.show { display: flex; }
    #akai-pagenav button { width: clamp(40px, 8vw, 66px); height: 100%; border: 1px solid #2a2a2a; border-radius: 6px; background: #111; color: #bbb; font-size: clamp(13px, 2.2vw, 19px); font-weight: 700; cursor: pointer; touch-action: manipulation; }
    #akai-pagenav button:active { background: #0a1820; color: var(--accent); border-color: var(--accent); }
    #pg-num { font-size: clamp(11px, 1.7vw, 16px); font-weight: 700; color: #ccc; letter-spacing: 1px; min-width: 44px; text-align: center; }
    #grid-area { display: flex; gap: 6px; flex: 1; min-height: 0; justify-content: flex-start; }
    #grid-col { display: flex; flex-direction: column; height: 100%; flex-shrink: 0; gap: 6px; }
    /* La grille reste carrée (aspect-ratio + hauteur pilotée) et sa largeur suit
       sa hauteur → la colonne s'ajuste et les faders restent alignés dessous.
       L'espace réservé en bas n'est plus un « 214px » figé : il vaut EXACTEMENT
       la hauteur fluide des faders + boutons + gaps → remplissage correct du 8"
       au 13". --faders-h / --ctrl-h sont réutilisés par les règles ci-dessous. */
    :root { --faders-h: clamp(120px, 22vh, 240px); --ctrl-h: clamp(30px, 5.5vh, 48px); }
    #grid { aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: var(--pad-gap); height: calc(100% - var(--faders-h) - var(--ctrl-h) - 12px); width: auto; max-width: 100%; }
    #akai-ctrl { flex-shrink: 0; height: var(--ctrl-h); display: flex; gap: 6px; align-items: center; }
    .akai-btn { flex: 1; height: 100%; border-radius: 6px; border: 1px solid #252525; background: #111;
      color: #555; font-size: clamp(10px, 1.5vw, 15px); font-weight: 700; letter-spacing: 1px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.1s, border-color 0.1s, color 0.1s; touch-action: manipulation; }
    .akai-btn:active { filter: brightness(1.3); transform: scale(0.96); }
    /* CLEAR : gris neutre — comme la page principale */
    #btn-akai-clear { background:#1e1e1e; border-color:#3a3a3a; color:#888; font-size: clamp(9px,1.4vw,13px); }
    #btn-akai-clear:active { background:#333; color:#fff; }
    /* REC mémoire : 🔴 rouge, état ACTIF bien visible (mode d'enregistrement) */
    #btn-akai-rec { background:#1e1e1e; border-color:#3a3a3a; color:#cc3333; }
    #btn-akai-rec.rec-active { background:#2a0505; border-color:#cc3333; color:#ff4444;
      box-shadow: 0 0 10px #cc333388; animation: rec-pulse 1s ease-in-out infinite; }
    @keyframes rec-pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .pad { background: var(--pad-off); border: 1px solid var(--pad-border); border-radius: 5px; cursor: pointer;
      transition: filter 80ms, transform 80ms, box-shadow 80ms; min-width: 0; min-height: 0; }
    .pad.lit { border-color: transparent; }
    .pad.press { transform: scale(0.88); filter: brightness(1.4); }
    #effects { display: flex; flex-direction: column; gap: var(--pad-gap); width: clamp(32px, 4.5vw, 60px); flex-shrink: 0; }
    .eff-btn { flex: 1; background: #0d1f0d; border: 1px solid #1a3a1a; border-radius: 5px; cursor: pointer; transition: background 100ms, box-shadow 100ms; }
    .eff-btn.on { background: #0a5a00; border-color: #33cc00; box-shadow: 0 0 8px #33cc0066; }
    .eff-btn.press { filter: brightness(1.5); }
    .vdiv { width: 1px; background: #222; flex-shrink: 0; align-self: stretch; }
    #faders-area { flex-shrink: 0; height: var(--faders-h); display: flex; gap: 4px; }
    .fader-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .fader-col.fx-speed { border-left: 1px solid #252525; padding-left: 4px; }
    .fader-label { font-size: clamp(8px, 1.1vw, 12px); color: #383838; letter-spacing: 1px; height: clamp(11px, 1.6vh, 16px); line-height: 1; user-select: none; }
    .fader-col.fx-speed .fader-label { color: #663388; }
    .fader-track { flex: 1; position: relative; width: 100%; background: var(--fader-bg); border: 1px solid #222; border-radius: 8px; cursor: pointer; overflow: hidden; touch-action: none; }
    .fader-col.fx-speed .fader-track { background: #0d0814; border-color: #1e1030; }
    .fader-fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--fader-fill); border-radius: 0 0 7px 7px; pointer-events: none; transition: height 60ms linear; }
    .fader-col.fx-speed .fader-fill { background: var(--fx-fill); }
    .fader-thumb { position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% + 6px); height: 18px; background: var(--thumb-col); border: 1px solid #666; border-radius: 5px; pointer-events: none; transition: top 60ms linear; box-shadow: 0 2px 4px #0008; }
    .fader-col.fx-speed .fader-thumb { background: var(--fx-thumb); border-color: #cc88ff; }
    .fader-track:active .fader-thumb, .fader-track.dragging .fader-thumb { transition: none; }
    .fader-track:active .fader-fill,  .fader-track.dragging .fader-fill  { transition: none; }
    .fader-val { font-size: clamp(8px, 1.1vw, 12px); color: #333; height: clamp(11px, 1.6vh, 16px); line-height: 1; user-select: none; }
    .fader-col.fx-speed .fader-val { color: #663388; }

    /* MEDIA */
    #media-page { gap: 8px; }
    #transport { display: flex; align-items: center; gap: 8px; flex-shrink: 0; height: clamp(52px, 9vh, 84px); }
    .tr-btn { flex-shrink: 0; width: clamp(52px, 9vh, 84px); height: clamp(52px, 9vh, 84px); border-radius: 10px; border: none; font-size: clamp(22px, 4vh, 34px); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: filter 0.1s, transform 0.08s; touch-action: manipulation; }
    .tr-btn:active { filter: brightness(1.35); transform: scale(0.93); }
    #btn-prev { background: #1a1a1a; color: #aaa; }
    #btn-play { background: #003344; color: var(--accent); border: 2px solid var(--accent); font-size: clamp(26px, 4.6vh, 40px); }
    #btn-play.playing { background: #001e2a; color: #ffaa00; border-color: #ffaa00; }
    #btn-next { background: #1a1a1a; color: #aaa; }
    #now-playing { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    #np-label { font-size: clamp(9px, 1.2vw, 13px); color: #333; letter-spacing: 1px; text-transform: uppercase; }
    #np-title { font-size: clamp(13px, 2vw, 20px); font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #np-title.idle { color: #333; }
    #seq-list { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #1e1e1e; border-radius: 8px; background: #0a0a0a; touch-action: pan-y; }
    #seq-list::-webkit-scrollbar { width: 4px; }
    #seq-list::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    .seq-item { display: flex; align-items: center; padding: clamp(7px, 1.4vh, 14px) clamp(10px, 1.5vw, 18px); gap: 8px; border-bottom: 1px solid #141414; cursor: pointer; transition: background 0.1s; touch-action: manipulation; }
    .seq-item:last-child { border-bottom: none; }
    .seq-item:active { background: #1a1a1a; }
    .seq-item.current { background: #0a1820; border-left: 3px solid var(--accent); padding-left: 7px; }
    .seq-item.current .seq-title { color: var(--accent); }
    .seq-item.pause { opacity: 0.5; }
    .seq-item.tempo { opacity: 0.5; }
    .seq-num  { font-size: clamp(9px, 1.2vw, 13px); color: #2e2e2e; width: clamp(18px, 2.4vw, 28px); flex-shrink: 0; text-align: right; }
    .seq-icon { font-size: clamp(13px, 1.8vw, 19px); flex-shrink: 0; }
    .seq-title { font-size: clamp(12px, 1.7vw, 18px); color: #888; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #carts-area { flex-shrink: 0; display: flex; gap: 6px; height: clamp(58px, 10vh, 92px); }
    .cart-btn { flex: 1; border-radius: 8px; border: 1px solid #222; background: #111; color: #555; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.08s; touch-action: manipulation; overflow: hidden; }
    .cart-btn:active { transform: scale(0.94); filter: brightness(1.25); }
    .cart-btn.playing { background: #0a2200; border-color: #44cc22; color: #44cc22; }
    .cart-btn.stopped { background: #220a00; border-color: #ff4400; color: #ff7744; }
    .cart-num  { font-size: clamp(8px, 1.1vw, 12px); color: inherit; opacity: 0.6; }
    .cart-icon { font-size: clamp(14px, 2.2vw, 22px); }
    .cart-title { font-size: clamp(8px, 1.1vw, 12px); color: inherit; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; padding: 0 2px; }

    /* SURFACE (exécuteurs) */
    #surface-page { overflow: auto; }
    #surface-grid { display: grid; gap: 6px; padding: 4px; grid-auto-rows: clamp(42px, 8vh, 70px); }
    .sfx-block { border: 1px solid #2a2a2a; border-radius: 8px; background: #141414; color: #eee;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: clamp(9px, 1.6vw, 13px); font-weight: 700; padding: 2px; cursor: pointer;
      touch-action: manipulation; overflow: hidden; line-height: 1.1; user-select: none;
      border-left: 4px solid #333; transition: filter .1s, transform .05s; }
    .sfx-block:active { transform: scale(0.96); filter: brightness(1.4); }
    .sfx-block.active { box-shadow: 0 0 0 2px var(--accent) inset; }
    .sfx-fader { flex-direction: column; gap: 4px; padding: 6px 2px; }
    .sfx-fader input[type=range] { writing-mode: vertical-lr; direction: rtl;
      width: 22px; flex: 1; accent-color: var(--accent); }
    .sfx-fader .sfx-fval { font-size: 10px; color: #aaa; }
    .sfx-clock { font-variant-numeric: tabular-nums; letter-spacing: 1px; color: #ccc; }

    /* SCENE */
    #scene-page { position: relative; }
    #stage-canvas { flex: 1; min-height: 0; width: 100%; border-radius: 8px; background: #080808; border: 1px solid #1a1a1a; display: block; }
    #scene-controls { flex-shrink: 0; display: flex; gap: 6px; align-items: center; height: clamp(36px, 6vh, 54px); }
    .scene-btn { height: clamp(30px, 5vh, 46px); padding: 0 clamp(14px, 2vw, 26px); border-radius: 6px; border: 1px solid #333; font-size: clamp(10px, 1.5vw, 14px); font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
    #btn-scene-clear { background: #1a0505; color: #cc3333; border-color: #441111; }
    #btn-scene-select { background: #050a1a; color: #3388cc; border-color: #112244; }

    /* Proj panel (bottom sheet) */
    #proj-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
    #proj-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #2a2a2a; border-radius: 12px 12px 0 0; padding: 16px; z-index: 101; transform: translateY(100%); transition: transform 0.22s ease; }
    #proj-panel.open { transform: translateY(0); }
    #proj-overlay.open { display: block; }
    #proj-panel-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    #proj-panel-group { font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 14px; }
    #proj-level-row, #proj-strobe-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #proj-pantilt-row { display: none; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    #proj-pantilt-row.show { display: flex; }
    #proj-pantilt-lbl { font-size: 10px; color: #666; letter-spacing: 1px; font-weight: 700; }
    #proj-pantilt-pad { width: 100%; height: 150px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; touch-action: none; }
    #proj-level-lbl, #proj-strobe-lbl { font-size: 9px; color: #555; width: 36px; flex-shrink: 0; letter-spacing: 1px; }
    #proj-level-slider { flex: 1; accent-color: var(--accent); }
    #proj-strobe-slider { flex: 1; accent-color: #ff8844; }
    #proj-level-val { font-size: 11px; color: var(--accent); font-weight: 700; width: 28px; text-align: right; }
    #proj-strobe-val { font-size: 11px; color: #ff8844; font-weight: 700; width: 28px; text-align: right; }
    #proj-colors { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .proj-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #333; cursor: pointer; flex-shrink: 0; transition: transform 0.1s, border-color 0.1s; }
    .proj-swatch:active { transform: scale(0.88); }
    .proj-swatch.active { border-color: #fff; box-shadow: 0 0 8px #fff8; }
    #proj-panel-btns { display: flex; gap: 8px; }
    #btn-proj-mute { flex: 1; height: 36px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #888; font-size: 11px; font-weight: 700; cursor: pointer; }
    #btn-proj-mute.muted { background: #1a0505; color: #ff5555; border-color: #441111; }
    #btn-proj-close { height: 36px; padding: 0 18px; border-radius: 8px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #555; font-size: 11px; cursor: pointer; }

    /* Rotation */
    #rotate-msg { display: none; position: fixed; inset: 0; background: #0d0d0d; color: #444; font-size: 14px; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 9999; letter-spacing: 1px; }
    #rotate-msg .icon { font-size: 48px; }
    @media (orientation: portrait) and (max-width: 900px) { #rotate-msg { display: flex; } }
  </style>
</head>
<body>

<div id="rotate-msg"><div class="icon">⟳</div><div>Tournez votre tablette en paysage</div></div>

<div id="app">
  <div id="header">
    <div id="logo">MY<span>STROW</span></div>
    <div id="tabs">
      <button class="tab-btn active" data-tab="akai-page">AKAI</button>
      <button class="tab-btn"       data-tab="media-page">MEDIA</button>
      <button class="tab-btn"       data-tab="scene-page">SCÈNE</button>
      <button class="tab-btn"       data-tab="surface-page">SURFACE</button>
    </div>
    <div id="conn-status">···</div>
  </div>

  <!-- AKAI -->
  <div id="akai-page" class="page active">
    <div id="akai-pagenav">
      <button id="pg-prev">◀</button>
      <span id="pg-num">1/1</span>
      <button id="pg-next">▶</button>
    </div>
    <div id="grid-area">
      <div id="grid-col">
        <div id="grid"></div>
        <div id="faders-area"></div>
        <div id="akai-ctrl">
          <button class="akai-btn" id="btn-akai-rec">🔴 REC</button>
          <button class="akai-btn" id="btn-akai-clear">CLEAR</button>
        </div>
      </div>
      <div class="vdiv"></div>
      <div id="effects"></div>
    </div>
  </div>

  <!-- MEDIA -->
  <div id="media-page" class="page">
    <div id="transport">
      <button class="tr-btn" id="btn-prev">⏮</button>
      <button class="tr-btn" id="btn-play">▶</button>
      <button class="tr-btn" id="btn-next">⏭</button>
      <div id="now-playing">
        <div id="np-label">EN COURS</div>
        <div id="np-title" class="idle">—</div>
      </div>
    </div>
    <div id="seq-list"></div>
    <div id="carts-area">
      <button class="cart-btn" data-idx="0"><span class="cart-num">C1</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="1"><span class="cart-num">C2</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="2"><span class="cart-num">C3</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="3"><span class="cart-num">C4</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
    </div>
  </div>

  <!-- SCENE -->
  <div id="scene-page" class="page">
    <canvas id="stage-canvas"></canvas>
    <div id="scene-controls">
      <button class="scene-btn" id="btn-scene-clear">CLEAR</button>
      <button class="scene-btn" id="btn-scene-select">SELECT ALL</button>
    </div>
  </div>

  <!-- SURFACE (exécuteurs) -->
  <div id="surface-page" class="page">
    <div id="surface-grid"></div>
  </div>
</div>

<!-- Proj panel -->
<div id="proj-overlay"></div>
<div id="proj-panel">
  <div id="proj-panel-name">—</div>
  <div id="proj-panel-group">—</div>
  <div id="proj-colors"></div>
  <div id="proj-level-row">
    <span id="proj-level-lbl">DIM</span>
    <input id="proj-level-slider" type="range" min="0" max="100" value="0">
    <span id="proj-level-val">0</span>
  </div>
  <div id="proj-strobe-row">
    <span id="proj-strobe-lbl">STROBE</span>
    <input id="proj-strobe-slider" type="range" min="0" max="100" value="0">
    <span id="proj-strobe-val">OFF</span>
  </div>
  <div id="proj-pantilt-row">
    <span id="proj-pantilt-lbl">POSITION</span>
    <canvas id="proj-pantilt-pad" width="220" height="150"></canvas>
  </div>
  <div id="proj-panel-btns">
    <button id="btn-proj-mute">MUTE</button>
    <button id="btn-proj-close">Fermer</button>
  </div>
</div>

<script>
'use strict';
const ROWS=8, COLS=8, N_FADERS=9, THUMB_H=18;
const gridEl=document.getElementById('grid');
const effectsEl=document.getElementById('effects');
const fadersEl=document.getElementById('faders-area');
const statusEl=document.getElementById('conn-status');
const seqListEl=document.getElementById('seq-list');
const npTitleEl=document.getElementById('np-title');
const btnPlay=document.getElementById('btn-play');
const cartBtns=[...document.querySelectorAll('.cart-btn')];
const stageCanvas=document.getElementById('stage-canvas');
const stageCtx=stageCanvas.getContext('2d');
const legendEl=document.getElementById('scene-legend');
const projOverlay=document.getElementById('proj-overlay');
const projPanel=document.getElementById('proj-panel');

const padEls={}, effEls={}, faderData=[], faderLbls=[];
let _projectors=[], _seqItems=[], _selectedProjIdx=-1;
let _selection=[];   // indices sélectionnés (multi). _selectedProjIdx = dernier tapé (affichage panneau)
function _selIdxs(){ return _selection.length ? _selection.slice() : (_selectedProjIdx>=0?[_selectedProjIdx]:[]); }
const btnClear=document.getElementById('btn-akai-clear');
const btnRec=document.getElementById('btn-akai-rec');

// Swatches couleurs (= PRESET_COLORS plan_de_feu.py)
const SWATCH_COLORS=['#ffffff','#ff0000','#ff8800','#ffdd00','#00ff00','#00dddd','#0000ff','#ff00ff'];
const projColorsEl=document.getElementById('proj-colors');
SWATCH_COLORS.forEach(hex=>{
  const s=document.createElement('div');

function applyPadColor(el,color,bright){
  const off=(!color||color==='#000000'||color==='#000'||bright===0);
  if(off){ el.style.background='var(--pad-off)'; el.style.borderColor='var(--pad-border)'; el.style.boxShadow='none'; el.classList.remove('lit'); }
  else { const dim=(bright<60); el.style.background=dim?blendHex(color,'#111111',0.65):color; el.style.borderColor='transparent'; el.style.boxShadow=dim?'none':`0 0 7px ${color}66`; el.classList.add('lit'); }
}
function blendHex(c1,c2,t){
  const p=s=>parseInt(s,16);
  const r1=p(c1.slice(1,3)),g1=p(c1.slice(3,5)),b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)),g2=p(c2.slice(3,5)),b2=p(c2.slice(5,7));
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

faderData.forEach(({track},idx)=>{
  let startY=null,startVal=null;
  function calcVal(y){ const range=Math.max(track.clientHeight-THUMB_H,1); return Math.min(100,Math.max(0,startVal+Math.round(((startY-y)/range)*100))); }
  function onMove(y){ const val=calcVal(y); setFaderUI(idx,val); sendEvent({type:'fader',idx,value:val}); }
  track.addEventListener('touchstart',e=>{
    e.preventDefault(); track.classList.add('dragging'); startY=e.touches[0].clientY; startVal=faderData[idx].value;
    function tm(ev){ev.preventDefault();onMove(ev.touches[0].clientY);}
    function te(){track.classList.remove('dragging');document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',te);}
    document.addEventListener('touchmove',tm,{passive:false}); document.addEventListener('touchend',te,{passive:false});
  },{passive:false});
  track.addEventListener('mousedown',e=>{
    track.classList.add('dragging'); startY=e.clientY; startVal=faderData[idx].value;
    function mm(ev){onMove(ev.clientY);}
    function mu(){track.classList.remove('dragging');document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);}
    document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  });
});

// ── Scène ─────────────────────────────────────────────────────────────────────
const GROUP_COLORS={'face':'#ff8844','contre':'#4488ff','douche1':'#44cc88','douche2':'#ffcc44','douche3':'#ff4488','lat':'#aa55ff','lyre':'#ff44cc','barre':'#44aaff','strobe':'#ffee44','fumee':'#88aaaa'};

function drawStage(projectors){
  const W=stageCanvas.width, H=stageCanvas.height;
  stageCtx.clearRect(0,0,W,H);
  stageCtx.fillStyle='#0a0a0a'; stageCtx.fillRect(0,0,W,H);
  if(!projectors.length){
    stageCtx.fillStyle='#222'; stageCtx.font='12px sans-serif'; stageCtx.textAlign='center';
    stageCtx.fillText('Aucun projecteur',W/2,H/2); return;
  }
  const R=Math.max(10,Math.min(W,H)*0.042);
  projectors.forEach((p,i)=>{
    const px=(p.x??0.5)*W, py=(p.y??0.5)*H;
    const color=p.color||'#000000';
    const isLit=p.level>0&&!p.muted&&color!=='#000000';
    const gcolor=GROUP_COLORS[p.group]||'#666';
    // Halo de sélection (multi-sélection tactile)
    if(_selection.indexOf(i)>=0){
      stageCtx.beginPath(); stageCtx.arc(px,py,R*1.7,0,Math.PI*2);
      stageCtx.strokeStyle='#00d4ff'; stageCtx.lineWidth=2.5;
      stageCtx.setLineDash([4,3]); stageCtx.stroke(); stageCtx.setLineDash([]);
    }
    if(isLit){
      const grad=stageCtx.createRadialGradient(px,py,R*0.3,px,py,R*3);
      grad.addColorStop(0,color+'99'); grad.addColorStop(1,color+'00');
      stageCtx.fillStyle=grad; stageCtx.beginPath(); stageCtx.arc(px,py,R*3,0,Math.PI*2); stageCtx.fill();
    }
    if(p.is_lyre){
      drawLyre(px,py,R,color,isLit,gcolor,p);
    }else{
      stageCtx.beginPath(); stageCtx.arc(px,py,R,0,Math.PI*2);
      stageCtx.fillStyle=isLit?color:'#111'; stageCtx.fill();
      stageCtx.strokeStyle=isLit?'#fff':gcolor; stageCtx.lineWidth=isLit?2:1;
      stageCtx.globalAlpha=isLit?1:0.45; stageCtx.stroke(); stageCtx.globalAlpha=1;
    }
    stageCtx.font=`bold ${Math.max(7,Math.round(R*0.52))}px sans-serif`;
    stageCtx.textAlign='center'; stageCtx.fillStyle=isLit?'#fff':'#2a2a2a';
    stageCtx.globalAlpha=isLit?0.9:0.6;
    stageCtx.fillText(p.name||p.group,px,py+R+Math.round(R*0.9));
    stageCtx.globalAlpha=1;
  });
}

// Dessine une lyre : socle arrondi (yoke) + tête ronde colorée + petit cône de
// faisceau orienté selon pan/tilt. Rendu épuré pour rester lisible en scène.
function drawLyre(px,py,R,color,isLit,gcolor,p){
  const pan=(p.pan??32768)/65535, tilt=(p.tilt??32768)/65535;
  // pan → orientation gauche/droite autour de la verticale ; tilt → inclinaison
  const ang=(pan-0.5)*Math.PI*1.4 - Math.PI/2;   // -90° = tout droit vers le haut
  // ── Cône de faisceau (uniquement si allumée) ──
  if(isLit){
    const beamLen=R*(1.0+tilt*1.4), spread=0.32;
    const ax=px+Math.cos(ang-spread)*beamLen, ay=py+Math.sin(ang-spread)*beamLen;
    const bx=px+Math.cos(ang+spread)*beamLen, by=py+Math.sin(ang+spread)*beamLen;
    const g=stageCtx.createRadialGradient(px,py,R*0.3,px,py,beamLen);
    g.addColorStop(0,color+'aa'); g.addColorStop(1,color+'00');
    stageCtx.fillStyle=g;
    stageCtx.beginPath(); stageCtx.moveTo(px,py); stageCtx.lineTo(ax,ay); stageCtx.lineTo(bx,by);
    stageCtx.closePath(); stageCtx.fill();
  }
  // ── Socle arrondi (yoke) ──
  const s=R*1.5, r2=R*0.34;
  stageCtx.beginPath();
  if(stageCtx.roundRect) stageCtx.roundRect(px-s/2,py-s/2,s,s,r2);
  else stageCtx.rect(px-s/2,py-s/2,s,s);
  stageCtx.fillStyle='#161616'; stageCtx.fill();
  stageCtx.strokeStyle=isLit?'#e8e8e8':gcolor; stageCtx.lineWidth=isLit?2:1.4;
  stageCtx.globalAlpha=isLit?1:0.6; stageCtx.stroke(); stageCtx.globalAlpha=1;
  // ── Tête ronde colorée ──
  stageCtx.beginPath(); stageCtx.arc(px,py,R*0.66,0,Math.PI*2);
  stageCtx.fillStyle=isLit?color:'#1e1e1e'; stageCtx.fill();
  stageCtx.strokeStyle=isLit?'#fff':gcolor; stageCtx.lineWidth=1.2;
  stageCtx.globalAlpha=isLit?0.95:0.5; stageCtx.stroke(); stageCtx.globalAlpha=1;
  // ── Repère de direction (petit point sur le bord, sens du faisceau) ──
  const dx=px+Math.cos(ang)*R*0.66, dy=py+Math.sin(ang)*R*0.66;
  stageCtx.beginPath(); stageCtx.arc(dx,dy,R*0.16,0,Math.PI*2);
  stageCtx.fillStyle=isLit?'#fff':gcolor; stageCtx.globalAlpha=isLit?0.9:0.6;
  stageCtx.fill(); stageCtx.globalAlpha=1;
}

// ── Scène — long press → panel projecteur ────────────────────────────────────
function projAtPoint(cx,cy){
  const W=stageCanvas.width, H=stageCanvas.height;
  const R=Math.max(10,Math.min(W,H)*0.042)*1.8;
  let best=-1, bestD=R*R;
  _projectors.forEach((p,i)=>{
    const dx=(p.x??0.5)*W-cx, dy=(p.y??0.5)*H-cy;
    const d2=dx*dx+dy*dy;
    if(d2<bestD){ bestD=d2; best=i; }
  });
  return best;
}

// Interaction scène :
//  • TAP sur un projecteur (peu de mouvement) = ajoute/retire de la sélection.
//  • GLISSER un rectangle (lasso) = sélectionne tous les projos à l'intérieur.
//  • TAP dans le vide = tout désélectionner.
let _tapStartX=0, _tapStartY=0, _tapStartT=0, _tapActive=false;
let _rbActive=false, _rbX=0, _rbY=0;   // rubber-band (rectangle de sélection)
function _localXY(clientX, clientY){
  const rect=stageCanvas.getBoundingClientRect();
  return [clientX-rect.left, clientY-rect.top];
}
function tapStart(clientX, clientY){
  [_tapStartX,_tapStartY]=_localXY(clientX,clientY);
  _tapStartT=Date.now(); _tapActive=true; _rbActive=false;
}
function tapMove(clientX, clientY){
  if(!_tapActive) return;
  [_rbX,_rbY]=_localXY(clientX,clientY);
  const moved=Math.hypot(_rbX-_tapStartX,_rbY-_tapStartY);
  if(moved>14) _rbActive=true;   // au-delà du seuil → mode rectangle
  if(_rbActive){
    drawStage(_projectors);
    // Dessiner le rectangle de sélection par-dessus
    const x=Math.min(_tapStartX,_rbX), y=Math.min(_tapStartY,_rbY);
    const w=Math.abs(_rbX-_tapStartX), h=Math.abs(_rbY-_tapStartY);
    stageCtx.fillStyle='rgba(0,212,255,0.12)';
    stageCtx.fillRect(x,y,w,h);
    stageCtx.strokeStyle='#00d4ff'; stageCtx.lineWidth=1.5;
    stageCtx.setLineDash([5,3]); stageCtx.strokeRect(x,y,w,h); stageCtx.setLineDash([]);
  }
}
function tapEnd(clientX, clientY){
  if(!_tapActive) return; _tapActive=false;
  if(_rbActive){
    // Fin du lasso : ajoute (union) tous les projos dans le rectangle.
    _rbActive=false;
    const W=stageCanvas.width, H=stageCanvas.height;
    const x0=Math.min(_tapStartX,_rbX), y0=Math.min(_tapStartY,_rbY);
    const x1=Math.max(_tapStartX,_rbX), y1=Math.max(_tapStartY,_rbY);
    _projectors.forEach((p,i)=>{
      const px=(p.x??0.5)*W, py=(p.y??0.5)*H;
      if(px>=x0&&px<=x1&&py>=y0&&py<=y1 && _selection.indexOf(i)<0) _selection.push(i);
    });
    _selectedProjIdx = _selection.length ? _selection[_selection.length-1] : -1;
    drawStage(_projectors);
    if(_selection.length) openProjPanel(_selectedProjIdx); else closeProjPanel();
    return;
  }
  const [x,y]=_localXY(clientX,clientY);
  const moved=Math.hypot(x-_tapStartX,y-_tapStartY);
  const dt=Date.now()-_tapStartT;
  if(moved<14 && dt<600){
    const idx=projAtPoint(_tapStartX,_tapStartY);
    if(idx>=0){
      const pos=_selection.indexOf(idx);
      if(pos>=0){ _selection.splice(pos,1); }
      else { _selection.push(idx); }
      _selectedProjIdx = _selection.length ? _selection[_selection.length-1] : -1;
      drawStage(_projectors);
      if(_selection.length) openProjPanel(_selectedProjIdx);
      else closeProjPanel();
    } else {
      _selection=[]; _selectedProjIdx=-1; drawStage(_projectors); closeProjPanel();
    }
  }
}
stageCanvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];tapStart(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];tapMove(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchend',e=>{e.preventDefault();const t=(e.changedTouches&&e.changedTouches[0])||{};tapEnd(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchcancel',()=>{_tapActive=false;_rbActive=false;});
stageCanvas.addEventListener('mousedown',e=>tapStart(e.clientX,e.clientY));
stageCanvas.addEventListener('mousemove',e=>{ if(_tapActive) tapMove(e.clientX,e.clientY); });
stageCanvas.addEventListener('mouseup',e=>tapEnd(e.clientX,e.clientY));

function openProjPanel(idx){
  _selectedProjIdx=idx;
  const p=_projectors[idx];
  const nSel=_selection.length;
  document.getElementById('proj-panel-name').textContent =
    nSel>1 ? (nSel+' sélectionnés') : (p.name||p.group);
  document.getElementById('proj-panel-group').textContent =
    nSel>1 ? '' : (p.group||'').toUpperCase();
  const slider=document.getElementById('proj-level-slider');
  slider.value=p.level||0;
  document.getElementById('proj-level-val').textContent=p.level||0;
  const strobe=p.strobe||0;
  document.getElementById('proj-strobe-slider').value=strobe;
  document.getElementById('proj-strobe-val').textContent=strobe>0?strobe+'%':'OFF';
  // Swatch active = couleur la plus proche de base_color
  const bc=(p.base_color||'#ffffff').toLowerCase();
  projColorsEl.querySelectorAll('.proj-swatch').forEach(s=>{
    s.classList.toggle('active', s.dataset.color===bc);
  });
  const muteBtn=document.getElementById('btn-proj-mute');
  muteBtn.textContent=p.muted?'UNMUTE':'MUTE';
  muteBtn.classList.toggle('muted',!!p.muted);
  // Pad Pan/Tilt : visible dès qu'au moins une lyre est sélectionnée.
  const anyLyre=_selIdxs().some(i=>_projectors[i] && _projectors[i].is_lyre);
  const ptRow=document.getElementById('proj-pantilt-row');
  ptRow.classList.toggle('show', anyLyre);
  if(anyLyre) drawPanTiltPad(p);
  projOverlay.classList.add('open'); projPanel.classList.add('open');
}

// ── Pad Pan/Tilt (lyres) ──────────────────────────────────────────────────────
const ptPad=document.getElementById('proj-pantilt-pad');
const ptCtx=ptPad.getContext('2d');
function drawPanTiltPad(p){
  const W=ptPad.width=ptPad.clientWidth||220, H=ptPad.height=150;
  ptCtx.clearRect(0,0,W,H);
  ptCtx.fillStyle='#0a0a0a'; ptCtx.fillRect(0,0,W,H);
  // Grille + croix centrale
  ptCtx.strokeStyle='#1e1e1e'; ptCtx.lineWidth=1;
  ptCtx.beginPath(); ptCtx.moveTo(W/2,0); ptCtx.lineTo(W/2,H); ptCtx.moveTo(0,H/2); ptCtx.lineTo(W,H/2); ptCtx.stroke();
  // Point courant : pan → x, tilt → y
  const pan=(p.pan??32768)/65535, tilt=(p.tilt??32768)/65535;
  const x=pan*W, y=tilt*H;
  const color=p.base_color||'#00d4ff';
  ptCtx.beginPath(); ptCtx.arc(x,y,10,0,Math.PI*2);
  ptCtx.fillStyle=color; ptCtx.fill();
  ptCtx.strokeStyle='#fff'; ptCtx.lineWidth=2; ptCtx.stroke();
}
function ptFromEvent(e){
  const r=ptPad.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  const x=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));
  const y=Math.max(0,Math.min(1,(t.clientY-r.top)/r.height));
  return {pan:x, tilt:y};
}
let _ptDragging=false, _ptLastSend=0;
function _ptApply(pan,tilt){
  const idxs=_selIdxs().filter(i=>_projectors[i] && _projectors[i].is_lyre);
  idxs.forEach(i=>{ _projectors[i].pan=Math.round(pan*65535); _projectors[i].tilt=Math.round(tilt*65535); });
  return idxs;
}
function ptMove(e){
  if(_ptDragging===false) return;
  e.preventDefault();
  const {pan,tilt}=ptFromEvent(e);
  const idxs=_ptApply(pan,tilt);
  if(!idxs.length) return;
  if(_projectors[_selectedProjIdx]) drawPanTiltPad(_projectors[_selectedProjIdx]);
  const now=Date.now();
  if(now-_ptLastSend>40){   // throttle ~25 Hz
    _ptLastSend=now;
    sendEvent({type:'proj_pantilt',idxs,pan,tilt});
  }
}
function ptEnd(e){
  if(!_ptDragging) return;
  _ptDragging=false;
  const {pan,tilt}=ptFromEvent(e);
  const idxs=_ptApply(pan,tilt);
  if(idxs.length) sendEvent({type:'proj_pantilt',idxs,pan,tilt});  // valeur finale exacte
}
ptPad.addEventListener('mousedown',e=>{_ptDragging=true; ptMove(e);});
ptPad.addEventListener('mousemove',ptMove);
window.addEventListener('mouseup',ptEnd);
ptPad.addEventListener('touchstart',e=>{_ptDragging=true; ptMove(e);},{passive:false});
ptPad.addEventListener('touchmove',ptMove,{passive:false});
ptPad.addEventListener('touchend',ptEnd);
function closeProjPanel(){
  projOverlay.classList.remove('open'); projPanel.classList.remove('open');
  _selectedProjIdx=-1; _selection=[]; drawStage(_projectors);
}

document.getElementById('proj-level-slider').addEventListener('input',e=>{
  const val=+e.target.value;
  document.getElementById('proj-level-val').textContent=val;
  const idxs=_selIdxs(); if(idxs.length) sendEvent({type:'proj_level',idxs,value:val});
});
document.getElementById('proj-strobe-slider').addEventListener('input',e=>{
  const val=+e.target.value;
  document.getElementById('proj-strobe-val').textContent=val>0?val+'%':'OFF';
  const idxs=_selIdxs();
  idxs.forEach(i=>{ if(_projectors[i]) _projectors[i].strobe=val; });
  if(idxs.length) sendEvent({type:'proj_strobe',idxs,value:val});
});
document.getElementById('btn-proj-mute').addEventListener('click',()=>{
  const idxs=_selIdxs(); if(!idxs.length) return;
  const p=_projectors[_selectedProjIdx]||_projectors[idxs[0]];
  const newMuted=!p.muted;
  idxs.forEach(i=>{ if(_projectors[i]) _projectors[i].muted=newMuted; });
  sendEvent({type:'proj_mute',idxs,muted:newMuted});
  const btn=document.getElementById('btn-proj-mute');
  btn.textContent=newMuted?'UNMUTE':'MUTE'; btn.classList.toggle('muted',newMuted);
});
document.getElementById('btn-proj-close').addEventListener('click',closeProjPanel);
projOverlay.addEventListener('click',closeProjPanel);

// ── Boutons AKAI (CLEAR / REC / PARAMS) ──────────────────────────────────────
btnClear.addEventListener('click',()=>sendEvent({type:'clear'}));
btnRec.addEventListener('click',()=>sendEvent({type:'rec_toggle'}));

function applyRecState(active){
  btnRec.classList.toggle('rec-active',active);
  btnRec.textContent=active?'⏺ REC ●':'⏺ REC';
}
function applyLayout(labels){
  labels.forEach((slot,i)=>{
    if(faderLbls[i]) faderLbls[i].textContent=slot.label||`G${i+1}`;
  });
}

// ── SURFACE (exécuteurs) ──────────────────────────────────────────────────────
const surfaceGrid=document.getElementById('surface-grid');
let _surfaceClocks=[];
function applySurface(data){
  data=data||{blocks:[],cols:0,rows:0};
  const cols=Math.max(1,data.cols||1), rows=Math.max(1,data.rows||1);
  surfaceGrid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  surfaceGrid.innerHTML=''; _surfaceClocks=[];
  (data.blocks||[]).forEach(b=>{
    const a=b.action||{}; const type=a.type||'';
    const el=document.createElement('div');
    el.className='sfx-block';
    el.style.gridColumn=`${(b.col||0)+1} / span ${b.span_c||1}`;
    el.style.gridRow=`${(b.row||0)+1} / span ${b.span_r||1}`;
    el.style.borderLeftColor=b.color||'#333';
    if(type==='color'){ el.style.background=b.color||'#141414';
      el.style.color=_textOn(b.color||'#141414'); }
    if(type==='fader'){
      el.classList.add('sfx-fader');
      const val=document.createElement('span'); val.className='sfx-fval'; val.textContent='0';
      const inp=document.createElement('input'); inp.type='range'; inp.min=0; inp.max=100; inp.value=0;
      inp.addEventListener('input',()=>{ val.textContent=inp.value;
        sendEvent({type:'ext_fader',action:a,value:+inp.value}); });
      const lbl=document.createElement('span'); lbl.textContent=b.label||''; lbl.style.fontSize='9px';
      el.appendChild(lbl); el.appendChild(inp); el.appendChild(val);
    } else if(type==='clock'){
      el.classList.add('sfx-clock'); el.textContent='--:--:--'; _surfaceClocks.push(el);
    } else {
      el.textContent=b.label||'';
      el.addEventListener('click',()=>{
        sendEvent({type:'ext_action',action:a});
        el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),180);
      });
    }
    surfaceGrid.appendChild(el);
  });
}
function _textOn(hex){
  const c=hex.replace('#',''); if(c.length<6) return '#fff';
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*0.299+g*0.587+b*0.114)>150?'#000':'#fff';
}
setInterval(()=>{ if(!_surfaceClocks.length) return;
  const now=new Date();
  const s=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  _surfaceClocks.forEach(el=>el.textContent=s);
},1000);

// ── SSE ───────────────────────────────────────────────────────────────────────
let _es=null,_reconnectDelay=1000;
function connectSSE(){
  if(_es){_es.close();_es=null;}
  statusEl.textContent='···'; statusEl.className='';
  _es=new EventSource('/stream');
  _es.onopen=()=>{ statusEl.textContent='✓'; statusEl.className='ok'; _reconnectDelay=1000; };
  _es.onerror=()=>{ statusEl.textContent='⚠'; statusEl.className='err'; _es.close(); _es=null; setTimeout(connectSSE,_reconnectDelay); _reconnectDelay=Math.min(_reconnectDelay*2,10000); };
  _es.onmessage=e=>{
    let msg; try{msg=JSON.parse(e.data);}catch{return;}
    const t=msg.type;
    if(t==='state'){
      const d=msg.data||{};
      Object.entries(d.pads||{}).forEach(([k,v])=>{const el=padEls[k];if(el)applyPadColor(el,v.color,v.bright);});
      Object.entries(d.faders||{}).forEach(([k,v])=>setFaderUI(+k,v));
      Object.entries(d.effects||{}).forEach(([k,v])=>{const el=effEls[+k];if(el)el.classList.toggle('on',v);});
      if(d.seq){buildSeqList(d.seq.items||[],d.seq.current_row??-1);updateSeqRow(d.seq.current_row??-1,d.seq.playing??false);}
      if(d.carts) d.carts.forEach((c,i)=>updateCart(i,c.title,c.state));
      if(d.projectors) applyProjectors(d.projectors);
      if(d.layout&&d.layout.length) applyLayout(d.layout);
      if(d.bank_pages) applyBankPages(d.bank_pages.count,d.bank_pages.index);
      if(d.rec_active!==undefined) applyRecState(d.rec_active);
      if(d.surface) applySurface(d.surface);
      requestAnimationFrame(refreshFaders);
    } else if(t==='surface'){applySurface(msg.data);}
    else if(t==='pad'){const el=padEls[`${msg.row}_${msg.col}`];if(el)applyPadColor(el,msg.color,msg.bright);}
    else if(t==='fader'){setFaderUI(msg.idx,msg.value);}
    else if(t==='effect'){const el=effEls[msg.row];if(el)el.classList.toggle('on',msg.active);}
    else if(t==='seq'){buildSeqList(msg.items||[],msg.current_row??-1);updateSeqRow(msg.current_row??-1,msg.playing??false);}
    else if(t==='seq_row'){updateSeqRow(msg.current_row??-1,msg.playing??false);}
    else if(t==='cart'){updateCart(msg.idx,msg.title,msg.state);}
    else if(t==='projectors'){applyProjectors(msg.data);}
    else if(t==='proj_colors'){applyProjColors(msg.data);}
    else if(t==='layout'){applyLayout(msg.labels||[]);}
    else if(t==='bank_pages'){applyBankPages(msg.count,msg.index);}
    else if(t==='rec_state'){applyRecState(msg.active);}
  };
}
connectSSE();
requestAnimationFrame(()=>setTimeout(refreshFaders,80));

// ── Service Worker (PWA) ──────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
