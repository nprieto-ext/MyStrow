<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MyStrow — Tablette</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080807">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyStrow">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    /* Polices du site, servies en local par tablet_server.py (/fonts/…) :
       le réseau lumière n'a souvent pas Internet. Repli système si absentes. */
    @font-face { font-family: 'Bebas Neue'; font-weight: 400; font-display: swap; src: url('/fonts/bebas-neue.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('/fonts/barlow-condensed-600.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('/fonts/barlow-condensed-700.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Charte mystrow.fr : noir chaud, jaune #E2CE16, Bebas Neue (logo, titres)
       + Barlow Condensed (libellés). --pad-off / --pad-border sont lus par le JS. */
    :root {
      --bg:  #080807; --bg2: #0e0d09; --bg3: #141310; --bg4: #1b1a15;
      --accent: #E2CE16;
      --accent-dim: rgba(226, 206, 22, 0.10);
      --accent-border: rgba(226, 206, 22, 0.32);
      --border: rgba(226, 206, 22, 0.14);
      --line: rgba(255, 255, 255, 0.07);
      --line2: rgba(255, 255, 255, 0.12);
      --text: #f4f1e8; --muted: #7a7570; --muted2: #4a4640;
      --green: #22c55e; --red: #ef4444; --violet: #a78bfa; --orange: #f97316;
      --pad-gap: clamp(4px, 0.9vmin, 12px);
      --pad-off: #141310;
      --pad-border: rgba(255, 255, 255, 0.06);
      --f-title: 'Bebas Neue', Oswald, Impact, 'Arial Narrow', sans-serif;
      --f-label: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', -apple-system, sans-serif;
      --panel: linear-gradient(180deg, #12110d 0%, #0b0a08 100%);
    }

    html { height: 100%; width: 100%; background: var(--bg); }
    body { height: 100%; width: 100%; overflow: hidden; color: var(--text);
      background:
        radial-gradient(120% 70% at 12% -25%, rgba(226, 206, 22, 0.09), transparent 60%),
        radial-gradient(70% 60% at 110% 125%, rgba(226, 206, 22, 0.05), transparent 60%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; touch-action: none; }
    button { font-family: var(--f-label); }

    #app { display: flex; flex-direction: column; height: 100%; gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }

    /* ── En-tête ── */
    #header { display: flex; align-items: center; flex-shrink: 0; height: clamp(34px, 6vh, 52px); gap: clamp(8px, 1.2vw, 14px); }
    #logo { font-family: var(--f-title); font-size: clamp(22px, 3vw, 32px); letter-spacing: 1px; color: var(--text); line-height: 1; flex-shrink: 0; padding-top: 3px; }
    #logo span { color: var(--accent); }

    #tabs { display: flex; gap: 3px; flex: 1; height: 100%; padding: 3px; background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; }
    .tab-btn { flex: 1; height: 100%; border: none; border-radius: 7px; background: transparent; color: var(--muted);
      font-size: clamp(12px, 1.7vw, 17px); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s; touch-action: manipulation; }
    .tab-btn:active { color: var(--text); }
    .tab-btn.active { background: var(--accent); color: #0c0b00; box-shadow: 0 0 18px rgba(226, 206, 22, 0.25); }

    /* Le JS écrit « ··· / ✓ / ⚠ » : on masque ce texte et on affiche une LED + un libellé. */
    #conn-status { display: flex; align-items: center; gap: 7px; flex-shrink: 0; height: 100%; padding: 0 clamp(9px, 1.2vw, 13px);
      background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; font-size: 0; color: transparent; }
    #conn-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted2); }
    #conn-status::after { content: 'CONNEXION…'; font-family: var(--f-label); font-weight: 700; font-size: clamp(11px, 1.3vw, 14px); letter-spacing: 1.2px; color: var(--muted); }
    #conn-status.ok::before  { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.9); animation: led-pulse 1.8s ease-in-out infinite; }
    #conn-status.ok::after   { content: 'EN LIGNE'; color: #9fdcb4; }
    #conn-status.err::before { background: var(--red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.8); }
    #conn-status.err::after  { content: 'HORS LIGNE'; color: #f19999; }
    @keyframes led-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @media (max-width: 860px) { #conn-status::after { display: none; } }
    #conn-status { cursor: pointer; touch-action: manipulation; }
    #conn-status:focus-visible, #btn-fullscreen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Fenêtre « où en est la connexion » (appui sur le voyant) */
    #conn-pop { display: none; position: fixed; z-index: 9500; right: max(10px, env(safe-area-inset-right));
      top: calc(max(8px, env(safe-area-inset-top)) + clamp(34px, 6vh, 52px) + 8px); width: min(340px, calc(100vw - 20px));
      padding: 14px 16px 16px; background: rgba(14, 13, 9, 0.98); border: 1px solid var(--line2); border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75); color: var(--text); }
    #conn-pop.show { display: block; }
    .cp-head { display: flex; align-items: center; gap: 10px; }
    .cp-led { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--accent); animation: led-pulse 1s ease-in-out infinite; }
    #conn-pop.ok  .cp-led { background: var(--green); box-shadow: 0 0 10px rgba(34, 197, 94, 0.9); animation: none; }
    #conn-pop.err .cp-led { background: var(--red); box-shadow: 0 0 10px rgba(239, 68, 68, 0.8); animation: none; }
    #cp-state { font-family: var(--f-title); font-size: 26px; line-height: 1; letter-spacing: 0.5px; padding-top: 3px; }
    #cp-desc { margin: 8px 0 12px; font-size: 13px; line-height: 1.45; color: #cfcabd; }
    .cp-rows { margin: 0 0 14px; }
    .cp-rows div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
    .cp-rows div[hidden] { display: none; }   /* sinon le display:flex ci-dessus l'emporte sur [hidden] */
    .cp-rows dt { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .cp-rows dd { margin: 0; font-family: var(--f-label); font-weight: 600; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }
    #cp-retry { width: 100%; height: 42px; border: none; border-radius: 10px; background: var(--accent); color: #0c0b00; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
    #conn-pop.ok #cp-retry { background: var(--bg3); color: var(--text); border: 1px solid var(--line2); }
    #cp-retry:active { filter: brightness(1.2); transform: scale(0.98); }

    /* Appairage : plein écran tant que la tablette n'a pas de jeton accepté par le PC */
    #pair-screen { display: none; position: fixed; inset: 0; z-index: 9800; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(90% 60% at 50% 0%, rgba(226, 206, 22, 0.10), transparent 60%), rgba(8, 8, 7, 0.97); }
    #pair-screen.show { display: flex; }
    .pair-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 26px 24px; text-align: center;
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7); }
    .pair-logo { font-family: var(--f-title); font-size: 28px; line-height: 1; letter-spacing: 1px; color: var(--text); }
    .pair-logo span { color: var(--accent); }
    #pair-title { font-family: var(--f-title); font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: 0.5px; color: var(--text); }
    #pair-desc { font-size: 14px; line-height: 1.5; color: #cfcabd; }
    #pair-desc b { color: var(--text); }
    #pair-code { width: 100%; height: 66px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); color: var(--accent);
      font-family: var(--f-title); font-size: 42px; letter-spacing: 12px; text-align: center; padding-left: 12px; outline: none; }
    #pair-code::placeholder { color: var(--muted2); }
    #pair-code:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px rgba(226, 206, 22, 0.15); }
    #pair-err { min-height: 1.4em; font-size: 13px; line-height: 1.4; color: #f87171; }
    #pair-btn { height: 52px; border: none; border-radius: 12px; background: var(--accent); color: #0c0b00; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; touch-action: manipulation; }
    #pair-btn:disabled { opacity: 0.5; cursor: default; }
    /* App des stores uniquement (masqué dans le navigateur) */
    .change-pc { width: 100%; height: 42px; border: 1px solid var(--line2); border-radius: 10px; background: transparent; color: var(--muted);
      font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
    #cp-change-pc { margin-top: 8px; }
    .change-pc:active { color: var(--text); border-color: var(--accent-border); }

    /* Plein écran : la page ouverte depuis le QR code reste dans le navigateur
       (le "display: fullscreen" du manifest ne vaut que pour l'app installée). */
    #btn-fullscreen { flex-shrink: 0; width: clamp(38px, 5.5vw, 52px); height: 100%; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg3); color: var(--muted); font-size: clamp(17px, 2.4vw, 24px); line-height: 1; cursor: pointer; touch-action: manipulation;
      transition: color 0.15s, border-color 0.15s, background 0.15s; }
    #btn-fullscreen:active, #btn-fullscreen.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
    #fs-hint { display: none; position: fixed; left: 50%; top: 68px; transform: translateX(-50%); max-width: 90vw; z-index: 9000;
      background: rgba(14, 13, 9, 0.97); border: 1px solid var(--accent-border); border-radius: 12px; padding: 12px 18px; color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7); font-size: clamp(13px, 1.6vw, 16px); text-align: center; line-height: 1.5; }
    #fs-hint b { color: var(--accent); }
    #fs-hint.show { display: block; }

    .page { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
    .page.active { display: flex; }

    /* ── AKAI : un « boîtier » comme la maquette du site ── */
    #akai-page { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: clamp(8px, 1.2vmin, 14px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(226, 206, 22, 0.06); }
    /* Pages de layout : carte flottante en haut à droite, hors du flux → la
       grille reste centrée dans le boîtier et récupère la hauteur de l'ancienne rangée. */
    #akai-page { position: relative; }
    #akai-pagenav { display: none; position: absolute; z-index: 2; top: clamp(8px, 1.2vmin, 14px); right: clamp(8px, 1.2vmin, 14px);
      flex-direction: column; gap: 6px; width: clamp(96px, 11vw, 132px); padding: 8px;
      background: var(--bg3); border: 1px solid var(--line); border-radius: 12px; }
    #akai-pagenav.show { display: flex; }
    #pg-label { font-family: var(--f-label); font-weight: 700; font-size: 11px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: center; }
    #pg-num { font-family: var(--f-title); font-size: clamp(26px, 3.2vw, 36px); line-height: 1; letter-spacing: 1px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
    #pg-num b { font-weight: 400; color: var(--accent); }
    #pg-btns { display: flex; gap: 6px; }
    #akai-pagenav button { flex: 1; height: clamp(34px, 5.5vh, 46px); border: 1px solid var(--line2); border-radius: 8px; background: var(--bg2); color: var(--text); font-size: clamp(13px, 2vw, 18px); font-weight: 700; cursor: pointer; touch-action: manipulation; }
    #akai-pagenav button:active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
    #grid-area { display: flex; gap: clamp(6px, 1vw, 12px); flex: 1; min-height: 0; justify-content: center; }
    #grid-col { display: flex; flex-direction: column; height: 100%; flex-shrink: 0; gap: 6px; }
    /* Colonne de droite : boutons scène (alignés sur la grille) + REC/CLEAR
       (alignés sur les faders). Largeur fluide, comme des touches d'APC. */
    #akai-right { display: flex; flex-direction: column; height: 100%; flex-shrink: 0; gap: 6px; width: clamp(46px, 6.5vw, 82px); }
    /* La grille reste carrée (aspect-ratio + hauteur pilotée) et sa largeur suit
       sa hauteur → la colonne s'ajuste et les faders restent alignés dessous.
       L'espace réservé en bas vaut EXACTEMENT la hauteur fluide des faders + gap
       → remplissage correct du 8" au 13". --faders-h est réutilisé plus bas. */
    :root { --faders-h: clamp(120px, 22vh, 240px); }
    #grid { aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: var(--pad-gap); height: calc(100% - var(--faders-h) - 6px); width: auto; max-width: 100%; }
    /* REC/CLEAR : empilés à droite, alignés en hauteur sur les 9 faders. */
    #akai-ctrl { flex-shrink: 0; height: var(--faders-h); display: flex; flex-direction: column; gap: 6px; }
    .akai-btn { flex: 1; width: 100%; min-height: 0; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg3);
      color: var(--text); font-size: clamp(11px, 1.5vw, 15px); font-weight: 700; letter-spacing: 1.2px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
      transition: background 0.1s, border-color 0.1s, color 0.1s; touch-action: manipulation; }
    .akai-btn:active { filter: brightness(1.3); transform: scale(0.96); }
    #btn-akai-clear { color: var(--muted); }
    #btn-akai-clear:active { background: var(--bg4); color: var(--text); }
    /* REC mémoire : état ACTIF bien visible (mode d'enregistrement) */
    #btn-akai-rec { background: rgba(239, 68, 68, 0.06); border-color: rgba(239, 68, 68, 0.35); color: #f87171; }
    #btn-akai-rec.rec-active { background: #3a0808; border-color: var(--red); color: #fff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.55); animation: rec-pulse 1s ease-in-out infinite; }
    @keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    .pad { position: relative; overflow: hidden; background: var(--pad-off); border: 1px solid var(--pad-border); border-radius: clamp(4px, 0.7vmin, 7px);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6); cursor: pointer;
      transition: filter 80ms, transform 80ms, box-shadow 80ms; min-width: 0; min-height: 0; }
    .pad.lit { border-color: transparent; }
    /* Reflet de pad allumé (le fond est posé en inline par le JS) */
    .pad.lit::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0) 55%); }
    .pad.lit:not(.full)::after { opacity: 0.35; }
    .pad.press { transform: scale(0.88); filter: brightness(1.4); }

    #effects { display: flex; flex-direction: column; gap: var(--pad-gap); width: 100%; flex: 1; min-height: 0; }
    .eff-btn { flex: 1; background: #0d2e12; border: 1px solid #1a5e26; border-radius: clamp(4px, 0.7vmin, 7px); cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); transition: background 100ms, box-shadow 100ms, border-color 100ms; }
    .eff-btn.on { background: var(--green); border-color: #4ade80; box-shadow: 0 0 12px rgba(34, 197, 94, 0.75), 0 0 3px #4ade80; }
    .eff-btn.press { filter: brightness(1.5); }
    .vdiv { width: 1px; flex-shrink: 0; align-self: stretch; background: linear-gradient(to bottom, transparent, rgba(226, 206, 22, 0.25), transparent); }

    /* Faders : fente sombre + remplissage jaune lumineux + curseur à repère,
       comme la maquette AKAI du site. Hauteur du curseur = THUMB_H (18 px) du JS. */
    #faders-area { flex-shrink: 0; height: var(--faders-h); display: flex; gap: 4px; }
    .fader-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .fader-col.fx-speed { border-left: 1px solid var(--border); padding-left: 4px; }
    .fader-label { font-family: var(--f-label); font-weight: 700; font-size: clamp(10px, 1.3vw, 14px); color: var(--muted); letter-spacing: 1px; height: clamp(12px, 1.8vh, 17px); line-height: 1; user-select: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fader-col.fx-speed .fader-label { color: var(--violet); }
    .fader-track { flex: 1; position: relative; width: 100%; cursor: pointer; touch-action: none; border-radius: 8px;
      background:
        linear-gradient(to right, transparent calc(50% - 5px), rgba(255, 255, 255, 0.10) calc(50% - 5px), rgba(255, 255, 255, 0.10) calc(50% - 4px),
                        #040403 calc(50% - 4px), #040403 calc(50% + 4px),
                        rgba(255, 255, 255, 0.10) calc(50% + 4px), rgba(255, 255, 255, 0.10) calc(50% + 5px), transparent calc(50% + 5px)),
        repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 0, rgba(255, 255, 255, 0.07) 1px, transparent 1px, transparent 10%);
      background-size: 100% 100%, 64% calc(100% - 18px);
      background-position: center, center;
      background-repeat: no-repeat, no-repeat; }
    .fader-fill { position: absolute; bottom: 0; left: calc(50% - 4px); width: 8px; border-radius: 4px; pointer-events: none; transition: height 60ms linear;
      background: linear-gradient(to top, rgba(226, 206, 22, 0.45), var(--accent)); box-shadow: 0 0 10px rgba(226, 206, 22, 0.5); }
    .fader-col.fx-speed .fader-fill { background: linear-gradient(to top, rgba(167, 139, 250, 0.45), var(--violet)); box-shadow: 0 0 10px rgba(167, 139, 250, 0.5); }
    .fader-thumb { position: absolute; left: 50%; transform: translateX(-50%); width: min(92%, 64px); height: 18px; border-radius: 4px; pointer-events: none; transition: top 60ms linear;
      background: linear-gradient(180deg, #4d4a42 0%, #2b2924 46%, #1b1a16 54%, #2f2d27 100%);
      border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.8); }
    .fader-thumb::after { content: ''; position: absolute; left: 14%; right: 14%; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px;
      background: var(--accent); box-shadow: 0 0 6px rgba(226, 206, 22, 0.9); }
    .fader-col.fx-speed .fader-thumb::after { background: var(--violet); box-shadow: 0 0 6px rgba(167, 139, 250, 0.9); }
    .fader-track:active .fader-thumb, .fader-track.dragging .fader-thumb { transition: none; }
    .fader-track:active .fader-fill,  .fader-track.dragging .fader-fill  { transition: none; }
    .fader-val { font-family: var(--f-label); font-weight: 600; font-size: clamp(10px, 1.2vw, 13px); color: rgba(226, 206, 22, 0.75); font-variant-numeric: tabular-nums; height: clamp(12px, 1.8vh, 17px); line-height: 1; user-select: none; }
    .fader-col.fx-speed .fader-val { color: var(--violet); }

    /* ── MEDIA ── */
    #media-page { gap: 10px; }
    #transport { display: flex; align-items: center; gap: 10px; flex-shrink: 0; height: clamp(62px, 11vh, 98px);
      padding: 0 clamp(12px, 1.6vw, 20px) 0 clamp(8px, 1vw, 12px); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
    .tr-btn { flex-shrink: 0; width: clamp(46px, 8.4vh, 76px); height: clamp(46px, 8.4vh, 76px); border-radius: 12px; border: 1px solid var(--line2);
      background: var(--bg3); color: var(--text); font-size: clamp(20px, 3.6vh, 30px); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: filter 0.1s, transform 0.08s, background 0.15s, box-shadow 0.15s; touch-action: manipulation; }
    .tr-btn:active { filter: brightness(1.35); transform: scale(0.93); }
    #btn-play { background: var(--accent); color: #0c0b00; border: 2px solid var(--accent); font-size: clamp(24px, 4.4vh, 38px); box-shadow: 0 0 24px rgba(226, 206, 22, 0.28); }
    #btn-play.playing { background: var(--accent-dim); color: var(--accent); box-shadow: 0 0 22px rgba(226, 206, 22, 0.35), inset 0 0 18px rgba(226, 206, 22, 0.15); }
    #now-playing { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-left: 6px; }
    #np-label { font-family: var(--f-label); font-weight: 700; font-size: clamp(11px, 1.3vw, 14px); color: var(--accent); letter-spacing: 2.5px; text-transform: uppercase; }
    #np-title { font-family: var(--f-title); font-size: clamp(22px, 3.4vw, 40px); letter-spacing: 0.5px; line-height: 1.05; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #np-title.idle { color: var(--muted2); }
    #seq-list { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: rgba(14, 13, 9, 0.85); touch-action: pan-y; }
    #seq-list::-webkit-scrollbar { width: 5px; }
    #seq-list::-webkit-scrollbar-thumb { background: rgba(226, 206, 22, 0.25); border-radius: 3px; }
    .seq-item { display: flex; align-items: center; padding: clamp(8px, 1.5vh, 15px) clamp(10px, 1.5vw, 18px); gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; transition: background 0.1s; touch-action: manipulation; }
    .seq-item:last-child { border-bottom: none; }
    .seq-item:active { background: var(--bg4); }
    .seq-item.current { background: linear-gradient(90deg, rgba(226, 206, 22, 0.15), rgba(226, 206, 22, 0.02) 70%); border-left: 3px solid var(--accent); padding-left: calc(clamp(10px, 1.5vw, 18px) - 3px); }
    .seq-item.current .seq-title { color: var(--accent); }
    .seq-item.pause { opacity: 0.5; }
    .seq-item.tempo { opacity: 0.5; }
    .seq-num  { font-family: var(--f-label); font-weight: 600; font-size: clamp(11px, 1.3vw, 14px); color: var(--muted2); width: clamp(18px, 2.4vw, 28px); flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .seq-icon { font-size: clamp(13px, 1.8vw, 19px); flex-shrink: 0; }
    .seq-title { font-family: var(--f-label); font-weight: 600; font-size: clamp(14px, 1.9vw, 20px); letter-spacing: 0.3px; color: #cfcabd; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seq-item.current .seq-dur, .seq-item.current .seq-vol { color: var(--text); }
    .seq-dur { font-family: var(--f-label); font-weight: 600; font-size: clamp(12px, 1.4vw, 15px); color: var(--muted); font-variant-numeric: tabular-nums; width: clamp(42px, 5.5vw, 70px); text-align: right; flex-shrink: 0; }
    .seq-vol { font-family: var(--f-label); font-weight: 600; font-size: clamp(11px, 1.3vw, 14px); color: #6fbf8a; font-variant-numeric: tabular-nums; width: clamp(28px, 3.6vw, 48px); text-align: right; flex-shrink: 0; }
    .seq-badge { font-family: var(--f-label); font-size: clamp(10px, 1.2vw, 13px); font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; border-radius: 999px; padding: 3px 6px; flex-shrink: 0; width: clamp(54px, 6.8vw, 88px); text-align: center; border: 1px solid transparent; box-sizing: border-box; }
    .seq-badge.m-manuel { background: rgba(255, 255, 255, 0.04); border-color: var(--line2); color: var(--muted); }
    .seq-badge.m-ia     { background: rgba(226, 206, 22, 0.10); border-color: rgba(226, 206, 22, 0.40); color: var(--accent); }
    .seq-badge.m-seq    { background: rgba(239, 68, 68, 0.10); border-color: rgba(239, 68, 68, 0.40); color: #f87171; }
    .seq-badge.m-prg    { background: rgba(34, 197, 94, 0.10); border-color: rgba(34, 197, 94, 0.40); color: #4ade80; }
    #carts-area { flex-shrink: 0; display: flex; gap: 8px; height: clamp(62px, 11vh, 96px); }
    .cart-btn { flex: 1; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, #17160f, #0e0d09); color: var(--muted);
      font-size: 10px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.08s, box-shadow 0.12s; touch-action: manipulation; overflow: hidden; }
    .cart-btn:active { transform: scale(0.94); filter: brightness(1.25); }
    .cart-btn.playing { background: linear-gradient(180deg, rgba(34, 197, 94, 0.22), rgba(34, 197, 94, 0.06)); border-color: var(--green); color: #86efac; box-shadow: 0 0 18px rgba(34, 197, 94, 0.25); }
    .cart-btn.stopped { background: linear-gradient(180deg, rgba(249, 115, 22, 0.20), rgba(249, 115, 22, 0.05)); border-color: var(--orange); color: #fdba74; }
    .cart-num  { font-size: clamp(10px, 1.2vw, 13px); letter-spacing: 1px; color: inherit; opacity: 0.7; }
    .cart-icon { font-size: clamp(14px, 2.2vw, 22px); }
    .cart-title { font-size: clamp(10px, 1.3vw, 14px); font-weight: 600; color: inherit; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; padding: 0 4px; }

    /* ── SURFACE (exécuteurs) ── */
    #surface-page { overflow: auto; }
    #surface-grid { display: grid; gap: 8px; padding: 4px; grid-auto-rows: clamp(44px, 8vh, 72px); }
    .sfx-block { border: 1px solid var(--line2); border-radius: 10px; background: var(--bg3); color: var(--text);
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-family: var(--f-label); font-size: clamp(11px, 1.7vw, 15px); font-weight: 700; letter-spacing: 0.5px; padding: 2px; cursor: pointer;
      touch-action: manipulation; overflow: hidden; line-height: 1.1; user-select: none;
      border-left: 4px solid #333; transition: filter .1s, transform .05s; }
    .sfx-block:active { transform: scale(0.96); filter: brightness(1.4); }
    .sfx-block.active { box-shadow: 0 0 0 2px var(--accent) inset, 0 0 16px rgba(226, 206, 22, 0.3); }
    .sfx-fader { flex-direction: column; gap: 4px; padding: 6px 2px; }
    .sfx-fader input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 22px; flex: 1; accent-color: var(--accent); }
    .sfx-fader .sfx-fval { font-size: 11px; color: var(--muted); }
    .sfx-clock { font-family: var(--f-title); font-weight: 400; font-size: clamp(18px, 2.6vw, 28px); font-variant-numeric: tabular-nums; letter-spacing: 1px; color: var(--text); }

    /* ── SCÈNE ── */
    #scene-page { position: relative; }
    #stage-canvas { flex: 1; min-height: 0; width: 100%; border-radius: 14px; background: #0b0a08; border: 1px solid var(--border); display: block; }
    #scene-controls { flex-shrink: 0; display: flex; gap: 8px; align-items: center; height: clamp(38px, 6.2vh, 56px); }
    .scene-btn { height: clamp(34px, 5.6vh, 50px); padding: 0 clamp(16px, 2.2vw, 28px); border-radius: 10px; border: 1px solid var(--line2); background: var(--bg3); color: var(--text);
      font-size: clamp(12px, 1.6vw, 16px); font-weight: 700; letter-spacing: 1.5px; cursor: pointer; touch-action: manipulation; }
    #btn-scene-clear  { background: rgba(239, 68, 68, 0.06); color: #f87171; border-color: rgba(239, 68, 68, 0.35); }
    #btn-scene-select { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
    .scene-spacer { flex: 1; }
    #btn-scene-names { color: var(--muted); }
    #btn-scene-names[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
    #scene-zoom { display: flex; height: clamp(34px, 5.6vh, 50px); background: var(--bg3); border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
    #scene-zoom .scene-btn { height: 100%; border: none; border-radius: 0; background: transparent; padding: 0 clamp(14px, 2vw, 22px); }
    #scene-zoom .zoom-btn { font-size: clamp(20px, 2.6vw, 26px); line-height: 1; }
    #scene-zoom #btn-zoom-reset { min-width: clamp(72px, 8vw, 92px); padding: 0 8px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    #scene-zoom .scene-btn:active { background: var(--accent-dim); color: var(--accent); }

    /* ── Panneau projecteur (bottom sheet) ── */
    #proj-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 100; }
    #proj-panel { position: fixed; bottom: 0; left: 0; right: 0; z-index: 101; transform: translateY(100%); transition: transform 0.22s ease;
      background: linear-gradient(180deg, #14130e, #0b0a08); border-top: 1px solid var(--accent-border); border-radius: 18px 18px 0 0;
      padding: 22px clamp(16px, 3vw, 32px) max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.7); }
    #proj-panel::before { content: ''; position: absolute; top: 8px; left: 50%; width: 44px; height: 4px; margin-left: -22px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); }
    #proj-panel.open { transform: translateY(0); }
    #proj-overlay.open { display: block; }
    #proj-panel-name { font-family: var(--f-title); font-size: clamp(24px, 3vw, 32px); letter-spacing: 0.5px; line-height: 1; color: var(--text); margin-bottom: 3px; }
    #proj-panel-group { font-family: var(--f-label); font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
    #proj-level-row, #proj-strobe-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    #proj-pantilt-row { display: none; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    #proj-pantilt-row.show { display: flex; }
    #proj-wheel-row, #proj-gobo-row { display: none; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    #proj-wheel-row.show, #proj-gobo-row.show { display: flex; }
    .proj-row-lbl, #proj-pantilt-lbl { font-family: var(--f-label); font-size: 12px; color: var(--muted); letter-spacing: 1.5px; font-weight: 700; }
    #proj-wheel-slots, #proj-gobo-slots { display: flex; flex-wrap: wrap; gap: 8px; }
    .wheel-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.14); cursor: pointer; flex-shrink: 0; transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s; }
    .wheel-swatch:active { transform: scale(0.88); }
    .wheel-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(226, 206, 22, 0.5); }
    .gobo-btn { min-width: 40px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg3); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .gobo-btn:active { transform: scale(0.94); }
    .gobo-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
    #proj-pantilt-pad { width: 100%; height: 150px; background: #0b0a08; border: 1px solid var(--border); border-radius: 10px; touch-action: none; }
    #proj-level-lbl, #proj-strobe-lbl { font-family: var(--f-label); font-weight: 700; font-size: 12px; color: var(--muted); width: 52px; flex-shrink: 0; letter-spacing: 1.5px; }
    #proj-level-slider  { flex: 1; accent-color: var(--accent); }
    #proj-strobe-slider { flex: 1; accent-color: var(--orange); }
    #proj-level-val  { font-family: var(--f-label); font-size: 15px; color: var(--accent); font-weight: 700; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
    #proj-strobe-val { font-family: var(--f-label); font-size: 15px; color: var(--orange); font-weight: 700; width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
    #proj-colors { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .proj-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.14); cursor: pointer; flex-shrink: 0; transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s; }
    .proj-swatch:active { transform: scale(0.88); }
    .proj-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(226, 206, 22, 0.5); }
    #proj-panel-btns { display: flex; gap: 10px; }
    #btn-proj-mute { flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg3); color: var(--text); font-size: 14px; font-weight: 700; letter-spacing: 1.5px; cursor: pointer; }
    #btn-proj-mute.muted { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.45); }
    #btn-proj-close { height: 44px; padding: 0 24px; border-radius: 10px; border: none; background: var(--accent); color: #0c0b00; font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }

    /* ── Portrait ──────────────────────────────────────────────────────────
       Même page, mise en page recalculée. En vertical c'est la LARGEUR qui
       limite la grille AKAI : --grid-side = le plus petit des deux côtés
       disponibles (reste de largeur / reste de hauteur de l'écran), sans JS.
       Les soustractions reprennent les paddings, bordures et gaps ci-dessus. */
    @media (orientation: portrait) {
      #akai-page {
        --vh: 100vh;
        --right-w: clamp(52px, 8.5vw, 76px);
        --ak-pad: clamp(8px, 1.2vmin, 14px);
        --ak-gap: clamp(6px, 1vw, 12px);
        --pgnav-h: 52px;                     /* rangée PAGE (44) + gap de page (8) */
        --grid-w: calc(100vw - 2 * max(10px, env(safe-area-inset-left)) - 2px - 2 * var(--ak-pad)
                       - 2 * var(--ak-gap) - 1px - var(--right-w) - 4px);
        --grid-h: calc(var(--vh) - max(8px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom))
                       - clamp(34px, 6vh, 52px) - 8px - 2px - 2 * var(--ak-pad)
                       - var(--pgnav-h) - var(--faders-h) - 6px - 4px);
        --grid-side: min(var(--grid-w), var(--grid-h));
      }
      #akai-page:has(#akai-pagenav:not(.show)) { --pgnav-h: 0px; }
      #akai-pagenav { position: static; flex-direction: row; align-items: center; justify-content: center; align-self: center;
        width: auto; height: 44px; padding: 4px 5px 4px 14px; gap: 10px; flex-shrink: 0; }
      #pg-label { font-size: 12px; }
      #pg-num { font-size: 28px; min-width: 64px; }
      #akai-pagenav button { flex: none; width: 60px; height: 34px; }
      #grid-area { align-items: center; }
      #grid-col { height: auto; }
      #grid { width: var(--grid-side); height: var(--grid-side); aspect-ratio: auto; max-width: none; }
      #akai-right { height: auto; width: var(--right-w); }
      #effects { flex: none; height: var(--grid-side); }

      #carts-area { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: clamp(56px, 7vh, 84px); height: auto; }
      #scene-controls { flex-wrap: wrap; height: auto; row-gap: 8px; }
    }
    /* Barres d'outils des navigateurs mobiles : 100vh déborde, 100dvh non. */
    @supports (height: 100dvh) { @media (orientation: portrait) { #akai-page { --vh: 100dvh; } } }
    @media (orientation: portrait) and (max-width: 560px) {
      #logo { display: none; }
      .tab-btn { font-size: 12px; letter-spacing: 0.5px; }
      .seq-vol { display: none; }
    }
  </style>
</head>
<body>


<div id="app">
  <div id="header">
    <div id="logo">MY<span>STROW</span></div>
    <div id="tabs">
      <button class="tab-btn active" data-tab="akai-page">AKAI</button>
      <button class="tab-btn"       data-tab="media-page">MEDIA</button>
      <button class="tab-btn"       data-tab="scene-page">SCÈNE</button>
      <button class="tab-btn"       data-tab="surface-page">SURFACE</button>
    </div>
    <button id="conn-status" type="button" aria-haspopup="dialog" aria-controls="conn-pop" title="État de la connexion">···</button>
    <button id="btn-fullscreen" title="Plein écran">⛶</button>
  </div>
  <div id="fs-hint"></div>
  <div id="conn-pop" role="dialog" aria-label="État de la connexion">
    <div class="cp-head"><span class="cp-led"></span><b id="cp-state">Connexion…</b></div>
    <p id="cp-desc"></p>
    <dl class="cp-rows">
      <div><dt>Adresse</dt><dd id="cp-host">—</dd></div>
      <div id="cp-row-since"><dt id="cp-since-lbl">Connectée</dt><dd id="cp-since">—</dd></div>
      <div id="cp-row-last"><dt>Dernière info reçue</dt><dd id="cp-last">—</dd></div>
      <div id="cp-row-tries"><dt>Tentative</dt><dd id="cp-tries">—</dd></div>
    </dl>
    <button id="cp-retry" type="button">Reconnecter maintenant</button>
    <button class="change-pc" id="cp-change-pc" type="button" hidden>Changer de PC</button>
  </div>
  <div id="pair-screen" role="dialog" aria-labelledby="pair-title">
    <form class="pair-card" id="pair-form" autocomplete="off">
      <div class="pair-logo">MY<span>STROW</span></div>
      <h1 id="pair-title">Appairer cette tablette</h1>
      <p id="pair-desc">Sur le PC, ouvrez <b>Entrée externe</b> et saisissez le code à 6 chiffres affiché sous le QR code.</p>
      <input id="pair-code" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" placeholder="000000" aria-label="Code d'appairage">
      <div id="pair-err" role="alert"></div>
      <button id="pair-btn" type="submit">APPAIRER</button>
      <button class="change-pc" id="pair-change-pc" type="button" hidden>Changer de PC</button>
    </form>
  </div>

  <!-- AKAI -->
  <div id="akai-page" class="page active">
    <div id="akai-pagenav">
      <span id="pg-label">Page</span>
      <span id="pg-num">1/1</span>
      <div id="pg-btns">
        <button id="pg-prev" aria-label="Page précédente">◀</button>
        <button id="pg-next" aria-label="Page suivante">▶</button>
      </div>
    </div>
    <div id="grid-area">
      <div id="grid-col">
        <div id="grid"></div>
        <div id="faders-area"></div>
      </div>
      <div class="vdiv"></div>
      <div id="akai-right">
        <div id="effects"></div>
        <div id="akai-ctrl">
          <button class="akai-btn" id="btn-akai-rec">🔴 REC</button>
          <button class="akai-btn" id="btn-akai-clear">CLEAR</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MEDIA -->
  <div id="media-page" class="page">
    <div id="transport">
      <button class="tr-btn" id="btn-prev">⏮</button>
      <button class="tr-btn" id="btn-play">▶</button>
      <button class="tr-btn" id="btn-next">⏭</button>
      <div id="now-playing">
        <div id="np-label">EN COURS</div>
        <div id="np-title" class="idle">—</div>
      </div>
    </div>
    <div id="seq-list"></div>
    <div id="carts-area">
      <button class="cart-btn" data-idx="0"><span class="cart-num">C1</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="1"><span class="cart-num">C2</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="2"><span class="cart-num">C3</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
      <button class="cart-btn" data-idx="3"><span class="cart-num">C4</span><span class="cart-icon">🎵</span><span class="cart-title">—</span></button>
    </div>
  </div>

  <!-- SCENE -->
  <div id="scene-page" class="page">
    <canvas id="stage-canvas"></canvas>
    <div id="scene-controls">
      <button class="scene-btn" id="btn-scene-clear">CLEAR</button>
      <button class="scene-btn" id="btn-scene-select">SELECT ALL</button>
      <div class="scene-spacer"></div>
      <button class="scene-btn" id="btn-scene-names" type="button" aria-pressed="true">NOMS</button>
      <div id="scene-zoom" role="group" aria-label="Zoom du plan">
        <button class="scene-btn zoom-btn" id="btn-zoom-out" type="button" aria-label="Dézoomer">−</button>
        <button class="scene-btn" id="btn-zoom-reset" type="button" title="Revenir à 100 %"><span id="scene-zoom-val">100 %</span></button>
        <button class="scene-btn zoom-btn" id="btn-zoom-in" type="button" aria-label="Zoomer">+</button>
      </div>
    </div>
  </div>

  <!-- SURFACE (exécuteurs) -->
  <div id="surface-page" class="page">
    <div id="surface-grid"></div>
  </div>
</div>

<!-- Proj panel -->
<div id="proj-overlay"></div>
<div id="proj-panel">
  <div id="proj-panel-name">—</div>
  <div id="proj-panel-group">—</div>
  <div id="proj-colors"></div>
  <div id="proj-level-row">
    <span id="proj-level-lbl">DIM</span>
    <input id="proj-level-slider" type="range" min="0" max="100" value="0">
    <span id="proj-level-val">0</span>
  </div>
  <div id="proj-strobe-row">
    <span id="proj-strobe-lbl">STROBE</span>
    <input id="proj-strobe-slider" type="range" min="0" max="100" value="0">
    <span id="proj-strobe-val">OFF</span>
  </div>
  <div id="proj-pantilt-row">
    <span id="proj-pantilt-lbl">POSITION</span>
    <canvas id="proj-pantilt-pad" width="220" height="150"></canvas>
  </div>
  <div id="proj-wheel-row">
    <span class="proj-row-lbl">ROUE COULEUR</span>
    <div id="proj-wheel-slots"></div>
  </div>
  <div id="proj-gobo-row">
    <span class="proj-row-lbl">GOBO</span>
    <div id="proj-gobo-slots"></div>
  </div>
  <div id="proj-panel-btns">
    <button id="btn-proj-mute">MUTE</button>
    <button id="btn-proj-close">Fermer</button>
  </div>
</div>

<script>
'use strict';
const ROWS=8, COLS=8, N_FADERS=9, THUMB_H=18;
const gridEl=document.getElementById('grid');
const effectsEl=document.getElementById('effects');
const fadersEl=document.getElementById('faders-area');
const statusEl=document.getElementById('conn-status');
const seqListEl=document.getElementById('seq-list');
const npTitleEl=document.getElementById('np-title');
const btnPlay=document.getElementById('btn-play');
const cartBtns=[...document.querySelectorAll('.cart-btn')];
const stageCanvas=document.getElementById('stage-canvas');
const stageCtx=stageCanvas.getContext('2d');
const legendEl=document.getElementById('scene-legend');
const projOverlay=document.getElementById('proj-overlay');
const projPanel=document.getElementById('proj-panel');

const padEls={}, effEls={}, faderData=[], faderLbls=[];
let _projectors=[], _seqItems=[], _selectedProjIdx=-1;
let _selection=[];   // indices sélectionnés (multi). _selectedProjIdx = dernier tapé (affichage panneau)
function _selIdxs(){ return _selection.length ? _selection.slice() : (_selectedProjIdx>=0?[_selectedProjIdx]:[]); }
const btnClear=document.getElementById('btn-akai-clear');
const btnRec=document.getElementById('btn-akai-rec');

// Swatches couleurs (= PRESET_COLORS plan_de_feu.py)
const SWATCH_COLORS=['#ffffff','#ff0000','#ff8800','#ffdd00','#00ff00','#00dddd','#0000ff','#ff00ff'];
const projColorsEl=document.getElementById('proj-colors');
SWATCH_COLORS.forEach(hex=>{
  const s=document.createElement('div');
  s.className='proj-swatch'; s.style.background=hex; s.dataset.color=hex;
  s.addEventListener('click',()=>{
    const idxs=_selIdxs(); if(!idxs.length) return;
    projColorsEl.querySelectorAll('.proj-swatch').forEach(x=>x.classList.remove('active'));
    s.classList.add('active');
    idxs.forEach(i=>{ if(_projectors[i]) _projectors[i].base_color=hex; });
    sendEvent({type:'proj_color',idxs,color:hex});
  });
  projColorsEl.appendChild(s);
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    setTimeout(refreshFaders,30);
    if(btn.dataset.tab==='scene-page') setTimeout(resizeCanvas,50);
  });
});

// ── Plein écran ──────────────────────────────────────────────────────────────
// Fullscreen API (préfixée webkit sur iPad / anciens Android). iPhone : pas
// d'API sur les éléments → on explique l'ajout à l'écran d'accueil, qui ouvre
// la PWA en plein écran via le manifest.
(function(){
  const btn=document.getElementById('btn-fullscreen');
  const hint=document.getElementById('fs-hint');
  const root=document.documentElement;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
  const canFs=!!(root.requestFullscreen||root.webkitRequestFullscreen);
  const standalone=(window.matchMedia&&matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)||navigator.standalone===true;
  // Déjà lancée depuis l'écran d'accueil, ou dans l'app des stores (plein écran natif).
  if(standalone||window.MYSTROW_APP){ btn.style.display='none'; return; }
  let hintTimer=null;
  function showHint(html){
    hint.innerHTML=html; hint.classList.add('show');
    clearTimeout(hintTimer); hintTimer=setTimeout(()=>hint.classList.remove('show'),7000);
  }
  hint.addEventListener('click',()=>hint.classList.remove('show'));
  function onChange(){
    const on=!!fsEl();
    btn.classList.toggle('on',on);
    btn.title=on?'Quitter le plein écran':'Plein écran';
    setTimeout(()=>{ if(typeof refreshFaders==='function') refreshFaders();
                     if(typeof resizeCanvas==='function') resizeCanvas(); },120);
  }
  document.addEventListener('fullscreenchange',onChange);
  document.addEventListener('webkitfullscreenchange',onChange);
  btn.addEventListener('click',()=>{
    if(!canFs){
      showHint('Plein écran non disponible dans ce navigateur.<br>'+
               'Touchez <b>Partager</b> puis <b>« Sur l\'écran d\'accueil »</b>,<br>'+
               'et ouvrez MyStrow depuis l\'icône : il s\'affichera en plein écran.');
      return;
    }
    try{
      if(fsEl()){
        (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      }else{
        const p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root,{navigationUI:'hide'});
        // Pas de verrou d'orientation : la page fonctionne en paysage ET en portrait.
        if(p&&p.catch) p.catch(()=>showHint('Le navigateur a refusé le plein écran.<br>Menu du navigateur → <b>« Ajouter à l\'écran d\'accueil »</b>.'));
      }
    }catch(e){
      showHint('Le navigateur a refusé le plein écran.<br>Menu du navigateur → <b>« Ajouter à l\'écran d\'accueil »</b>.');
    }
  });
})();

// ── Grille 8×8 ───────────────────────────────────────────────────────────────
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
  const d=document.createElement('div');
  d.className='pad'; d.dataset.r=r; d.dataset.c=c;
  padEls[`${r}_${c}`]=d; gridEl.appendChild(d);
}

// ── Effets ───────────────────────────────────────────────────────────────────
for(let r=0;r<ROWS;r++){
  const d=document.createElement('div');
  d.className='eff-btn'; d.dataset.r=r;
  effEls[r]=d; effectsEl.appendChild(d);
}

// ── Faders ───────────────────────────────────────────────────────────────────
for(let i=0;i<N_FADERS;i++){
  const isMaster=(i===N_FADERS-1);
  const col=document.createElement('div'); col.className='fader-col'+(isMaster?' fx-speed':'');
  const lbl=document.createElement('div'); lbl.className='fader-label'; lbl.textContent=isMaster?'VIT':`G${i+1}`;
  if(!isMaster) faderLbls[i]=lbl;
  const track=document.createElement('div'); track.className='fader-track'; track.dataset.idx=i;
  const fill=document.createElement('div'); fill.className='fader-fill';
  const thumb=document.createElement('div'); thumb.className='fader-thumb';
  track.appendChild(fill); track.appendChild(thumb);
  const valLbl=document.createElement('div'); valLbl.className='fader-val'; valLbl.textContent='50';
  col.appendChild(lbl); col.appendChild(track); col.appendChild(valLbl);
  fadersEl.appendChild(col);
  faderData[i]={track,fill,thumb,valLbl,value:50};
}

// ── Couleur pads ─────────────────────────────────────────────────────────────
function applyPadColor(el,color,bright){
  const off=(!color||color==='#000000'||color==='#000'||bright===0);
  if(off){ el.style.background='var(--pad-off)'; el.style.borderColor='var(--pad-border)'; el.style.boxShadow=''; el.classList.remove('lit','full'); }
  else {
    // Luminosité AKAI 0-100 rendue en PROPORTION (plus de seuil à 60) : le
    // réglage « actif / inactif » de l'app se voit tel quel (100 = pleine
    // couleur + halo, 20 = inactif par défaut = couleur assombrie).
    const b=Math.max(0,Math.min(100,bright??100));
    const full=(b>=90);
    el.style.background=full?color:blendHex(color,'#141310',0.72*(1-b/100));
    el.style.borderColor='transparent';
    el.style.boxShadow=full?`0 0 12px ${color}88, 0 0 2px ${color}`:'';
    el.classList.add('lit'); el.classList.toggle('full',full);
  }
}
function blendHex(c1,c2,t){
  const p=s=>parseInt(s,16);
  const r1=p(c1.slice(1,3)),g1=p(c1.slice(3,5)),b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)),g2=p(c2.slice(3,5)),b2=p(c2.slice(5,7));
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

// ── Fader UI ─────────────────────────────────────────────────────────────────
function setFaderUI(idx,value){
  const fd=faderData[idx]; if(!fd) return;
  fd.value=value;
  const range=Math.max(fd.track.clientHeight-THUMB_H,1);
  fd.thumb.style.top=`${range-Math.round((value/100)*range)}px`;
  fd.fill.style.height=`${value}%`;
  fd.valLbl.textContent=value;
}
function refreshFaders(){ faderData.forEach(({value},i)=>setFaderUI(i,value)); }
window.addEventListener('resize',()=>{ resizeCanvas(); refreshFaders(); });
// Rotation : sur certains iPad/Android les dimensions ne sont à jour qu'après
// l'évènement → second passage différé.
window.addEventListener('orientationchange',()=>setTimeout(()=>{ resizeCanvas(); refreshFaders(); },300));

// ── sendEvent ─────────────────────────────────────────────────────────────────
function sendEvent(data){
  // Mode démo de l'app : un état local remplace le PC.
  if(window.MYSTROW_SEND){ window.MYSTROW_SEND(data); return; }
  fetch(API_BASE+'/api/event',{method:'POST',headers:_authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(data)})
    .then(r=>{ if(r.status===401) _checkAuthAfterError(); }).catch(()=>{});
}

// ── Navigateur de pages de layout (◀ x/n ▶) ──────────────────────
const pagenavEl=document.getElementById('akai-pagenav');
const pgNumEl=document.getElementById('pg-num');
document.getElementById('pg-prev').addEventListener('click',()=>sendEvent({type:'bankpage',action:'prev'}));
document.getElementById('pg-next').addEventListener('click',()=>sendEvent({type:'bankpage',action:'next'}));
function applyBankPages(count,index){
  count=count||1; index=index||0;
  pgNumEl.innerHTML='<b>'+(+index+1)+'</b>/'+(+count);
  pagenavEl.classList.toggle('show',count>1);
}

// ── Events pads ──────────────────────────────────────────────────────────────
function padPress(el){ el.classList.add('press'); sendEvent({type:'pad',row:+el.dataset.r,col:+el.dataset.c}); }
function padRelease(el){ el.classList.remove('press'); }
Object.values(padEls).forEach(el=>{
  el.addEventListener('touchstart',e=>{e.preventDefault();padPress(el);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();padRelease(el);},{passive:false});
  el.addEventListener('mousedown',()=>padPress(el));
  el.addEventListener('mouseup',()=>padRelease(el));
});

// ── Events effets ────────────────────────────────────────────────────────────
Object.values(effEls).forEach(el=>{
  function press(){ el.classList.add('press'); sendEvent({type:'effect',row:+el.dataset.r}); }
  function release(){ el.classList.remove('press'); }
  el.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
  el.addEventListener('mousedown',press); el.addEventListener('mouseup',release);
});

// ── Fader drag ───────────────────────────────────────────────────────────────
faderData.forEach(({track},idx)=>{
  let startY=null,startVal=null;
  function calcVal(y){ const range=Math.max(track.clientHeight-THUMB_H,1); return Math.min(100,Math.max(0,startVal+Math.round(((startY-y)/range)*100))); }
  function onMove(y){ const val=calcVal(y); setFaderUI(idx,val); sendEvent({type:'fader',idx,value:val}); }
  track.addEventListener('touchstart',e=>{
    e.preventDefault(); track.classList.add('dragging'); startY=e.touches[0].clientY; startVal=faderData[idx].value;
    function tm(ev){ev.preventDefault();onMove(ev.touches[0].clientY);}
    function te(){track.classList.remove('dragging');document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',te);}
    document.addEventListener('touchmove',tm,{passive:false}); document.addEventListener('touchend',te,{passive:false});
  },{passive:false});
  track.addEventListener('mousedown',e=>{
    track.classList.add('dragging'); startY=e.clientY; startVal=faderData[idx].value;
    function mm(ev){onMove(ev.clientY);}
    function mu(){track.classList.remove('dragging');document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);}
    document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  });
});

// ── Transport ────────────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click',()=>sendEvent({type:'transport',action:'prev'}));
document.getElementById('btn-next').addEventListener('click',()=>sendEvent({type:'transport',action:'next'}));
btnPlay.addEventListener('click',()=>sendEvent({type:'transport',action:'play_pause'}));

// ── Cartouches ───────────────────────────────────────────────────────────────
cartBtns.forEach(btn=>btn.addEventListener('click',()=>sendEvent({type:'cartouche',idx:+btn.dataset.idx})));

// ── Séquenceur ───────────────────────────────────────────────────────────────
// Mode DMX → badge (label + classe couleur), miroir de sequencer._SS_BTN.
function dmxBadge(mode){
  switch(mode){
    case 'IA Lumiere':   return {label:'IA',    cls:'m-ia'};
    case 'Play Lumiere': return {label:'▶ Seq', cls:'m-seq'};
    case 'Programme':    return {label:'PRG',   cls:'m-prg'};
    case 'Manuel':       return {label:'Manuel',cls:'m-manuel'};
    default:             return null;
  }
}
function buildSeqList(items,currentRow){
  _seqItems=items; seqListEl.innerHTML='';
  items.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='seq-item'+(i===currentRow?' current':'')+(item.type==='pause'?' pause':'')+(item.type==='tempo'?' tempo':'');
    div.dataset.row=i;
    const icon=item.type==='pause'?'⏸':item.type==='tempo'?'⏱':'🎵';
    const dur=(item.dur&&item.dur!=='--:--')?item.dur:'';
    const vol=(item.vol&&item.vol!=='--')?item.vol:'';
    const b=(item.type==='media')?dmxBadge(item.dmx):null;
    const badge=b?`<span class="seq-badge ${b.cls}">${escHtml(b.label)}</span>`
                 :`<span class="seq-badge" style="visibility:hidden"></span>`;
    div.innerHTML=`<span class="seq-num">${i+1}</span>`+
                  `<span class="seq-icon">${icon}</span>`+
                  `<span class="seq-title">${escHtml(item.title||'—')}</span>`+
                  `<span class="seq-dur">${escHtml(dur)}</span>`+
                  `<span class="seq-vol">${escHtml(vol)}</span>`+
                  badge;
    div.addEventListener('click',()=>sendEvent({type:'seq_row',row:i}));
    seqListEl.appendChild(div);
  });
  scrollToRow(currentRow);
}
function updateSeqRow(row,playing){
  seqListEl.querySelectorAll('.seq-item').forEach((el,i)=>el.classList.toggle('current',i===row));
  scrollToRow(row);
  if(row>=0&&_seqItems[row]){ npTitleEl.textContent=_seqItems[row].title||'—'; npTitleEl.classList.remove('idle'); }
  else { npTitleEl.textContent='—'; npTitleEl.classList.add('idle'); }
  btnPlay.textContent=playing?'⏸':'▶'; btnPlay.classList.toggle('playing',playing);
}
function scrollToRow(row){ const el=seqListEl.querySelector(`.seq-item:nth-child(${row+1})`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Cartouches UI ────────────────────────────────────────────────────────────
function updateCart(idx,title,state){
  const btn=cartBtns[idx]; if(!btn) return;
  btn.classList.remove('playing','stopped');
  if(state===1) btn.classList.add('playing');
  if(state===2) btn.classList.add('stopped');
  btn.querySelector('.cart-title').textContent=title||'—';
}

// ── Scène ─────────────────────────────────────────────────────────────────────
const GROUP_COLORS={'face':'#ff8844','contre':'#4488ff','douche1':'#44cc88','douche2':'#ffcc44','douche3':'#ff4488','lat':'#aa55ff','lyre':'#ff44cc','barre':'#44aaff','strobe':'#ffee44','fumee':'#88aaaa'};

// Zoom du plan (centré) + affichage des noms — mémorisés sur CETTE tablette.
const STAGE_ZOOM_MIN=0.4, STAGE_ZOOM_MAX=1.6;
let _stageZoom=1, _stageNames=true;
try{ const s=JSON.parse(localStorage.getItem('mystrow.stage')||'{}');
  if(typeof s.zoom==='number') _stageZoom=Math.max(STAGE_ZOOM_MIN,Math.min(STAGE_ZOOM_MAX,s.zoom));
  if(typeof s.names==='boolean') _stageNames=s.names; }catch(e){}
// Repère du plan : en paysage = tout le canvas. En portrait, le plan (pensé
// large) garde des proportions d'écran large et se centre verticalement au
// lieu d'être étiré en hauteur (positions x/y des projecteurs déformées).
const STAGE_MIN_ASPECT=1.6;
function _stageWorld(){
  const cw=stageCanvas.width, ch=stageCanvas.height;
  if(ch>0 && cw/ch<STAGE_MIN_ASPECT*0.85){
    const h=Math.round(Math.min(ch,cw/STAGE_MIN_ASPECT));
    return {W:cw,H:h,ox:0,oy:(ch-h)/2};
  }
  return {W:cw,H:ch,ox:0,oy:0};
}
// Translation écran du repère : recadrage portrait puis zoom centré sur le canvas.
function _stageOffset(){
  const w=_stageWorld(), z=_stageZoom;
  return [(1-z)*stageCanvas.width/2+z*w.ox,(1-z)*stageCanvas.height/2+z*w.oy];
}
// Coordonnées écran (canvas) → coordonnées du plan à zoom 100 %.
function _toWorld(x,y){ const [ox,oy]=_stageOffset(); return [(x-ox)/_stageZoom,(y-oy)/_stageZoom]; }

function drawStage(projectors){
  const CW=stageCanvas.width, CH=stageCanvas.height;
  stageCtx.clearRect(0,0,CW,CH);
  stageCtx.fillStyle='#0b0a08'; stageCtx.fillRect(0,0,CW,CH);
  if(!projectors.length){
    stageCtx.fillStyle='#4a4640'; stageCtx.font="600 16px 'Barlow Condensed', sans-serif"; stageCtx.textAlign='center';
    stageCtx.fillText('Aucun projecteur',CW/2,CH/2); return;
  }
  const world=_stageWorld(), W=world.W, H=world.H;
  const R=Math.max(10,Math.min(W,H)*0.042);
  const [ox,oy]=_stageOffset();
  stageCtx.save();
  stageCtx.setTransform(_stageZoom,0,0,_stageZoom,ox,oy);
  if(_stageZoom<0.999||world.oy>0){
    // Dézoomé ou plan recadré (portrait) : contour du plateau pour garder ses repères.
    stageCtx.strokeStyle='rgba(226,206,22,0.20)'; stageCtx.lineWidth=1/_stageZoom;
    stageCtx.setLineDash([6/_stageZoom,5/_stageZoom]); stageCtx.strokeRect(0,0,W,H); stageCtx.setLineDash([]);
  }
  projectors.forEach((p,i)=>{
    const px=(p.x??0.5)*W, py=(p.y??0.5)*H;
    const color=p.color||'#000000';
    // « lit » est calculé côté desktop, overrides HTP compris (mémoire lumière
    // au fader, aperçu d'effet) : p.level ne reflète que le niveau propre du
    // projecteur et reste à 0 pendant qu'une mémoire l'allume. Repli sur
    // l'ancien test pour un desktop plus ancien qui n'enverrait pas le champ.
    const isLit=(p.lit!==undefined)?!!p.lit
                                   :(p.level>0&&!p.muted&&color!=='#000000');
    const gcolor=GROUP_COLORS[p.group]||'#666';
    // Halo de sélection (multi-sélection tactile)
    if(_selection.indexOf(i)>=0){
      stageCtx.beginPath(); stageCtx.arc(px,py,R*1.7,0,Math.PI*2);
      stageCtx.strokeStyle='#E2CE16'; stageCtx.lineWidth=2.5;
      stageCtx.setLineDash([4,3]); stageCtx.stroke(); stageCtx.setLineDash([]);
    }
    if(isLit){
      const grad=stageCtx.createRadialGradient(px,py,R*0.3,px,py,R*3);
      grad.addColorStop(0,color+'99'); grad.addColorStop(1,color+'00');
      stageCtx.fillStyle=grad; stageCtx.beginPath(); stageCtx.arc(px,py,R*3,0,Math.PI*2); stageCtx.fill();
    }
    const _ft=p.ftype||'';
    if(p.is_lyre||_ft==='Moving Head'||_ft==='Lyre'){
      drawLyre(px,py,R,color,isLit,gcolor,p);
    }else if(_ft==='Barre LED'){
      drawBarre(px,py,R,color,isLit,gcolor);
    }else if(_ft==='Stroboscope'){
      drawStrobe(px,py,R,color,isLit,gcolor);
    }else{
      stageCtx.beginPath(); stageCtx.arc(px,py,R,0,Math.PI*2);
      stageCtx.fillStyle=isLit?color:'#111'; stageCtx.fill();
      stageCtx.strokeStyle=isLit?'#fff':gcolor; stageCtx.lineWidth=isLit?2:1;
      stageCtx.globalAlpha=isLit?1:0.45; stageCtx.stroke(); stageCtx.globalAlpha=1;
    }
    // Noms : tous (bouton NOMS) ou seulement ceux des projecteurs sélectionnés.
    if(_stageNames||_selection.indexOf(i)>=0){
      stageCtx.font=`700 ${Math.round(Math.max(10/_stageZoom,R*0.62))}px 'Barlow Condensed', sans-serif`;
      stageCtx.textAlign='center'; stageCtx.fillStyle=isLit?'#f4f1e8':'#6a655c';
      stageCtx.globalAlpha=isLit?0.9:0.6;
      stageCtx.fillText(p.name||p.group,px,py+R+Math.round(R*0.9));
      stageCtx.globalAlpha=1;
    }
  });
  stageCtx.restore();
}

// ── Helpers de dessin (parité avec plan_de_feu.py) ────────────────────────────
function hexToRgb(hex){ hex=(hex||'#000000').replace('#',''); if(hex.length<6) hex='000000';
  return parseInt(hex.slice(0,2),16)+','+parseInt(hex.slice(2,4),16)+','+parseInt(hex.slice(4,6),16); }
function shade(hex,f){ const p=hexToRgb(hex).split(',').map(Number);
  const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return `rgb(${c(p[0])},${c(p[1])},${c(p[2])})`; }
function roundRectPath(x,y,w,h,rad){ rad=Math.min(rad,w/2,h/2);
  stageCtx.beginPath();
  if(stageCtx.roundRect){ stageCtx.roundRect(x,y,w,h,rad); }
  else { stageCtx.moveTo(x+rad,y); stageCtx.arcTo(x+w,y,x+w,y+h,rad); stageCtx.arcTo(x+w,y+h,x,y+h,rad);
    stageCtx.arcTo(x,y+h,x,y,rad); stageCtx.arcTo(x,y,x+w,y,rad); stageCtx.closePath(); } }

// Barre LED : boîtier arrondi horizontal + segments internes (cf. plan_de_feu).
function drawBarre(px,py,R,color,isLit,gcolor){
  const hw=R*1.23, hh=Math.max(3,R*0.38);
  stageCtx.fillStyle=isLit?color:'#141414';
  stageCtx.strokeStyle=isLit?'#fff':gcolor; stageCtx.lineWidth=isLit?1.6:1;
  stageCtx.globalAlpha=isLit?1:0.6;
  roundRectPath(px-hw,py-hh,hw*2,hh*2,3); stageCtx.fill(); stageCtx.stroke();
  stageCtx.globalAlpha=1;
  if(isLit){
    stageCtx.strokeStyle='rgba(0,0,0,0.35)'; stageCtx.lineWidth=1;
    const step=hw*2/4;
    for(let s=1;s<4;s++){ const sx=px-hw+s*step;
      stageCtx.beginPath(); stageCtx.moveTo(sx,py-hh+1); stageCtx.lineTo(sx,py+hh-1); stageCtx.stroke(); }
  }
}

// Stroboscope : boîtier métal sombre + panneau de flash rayonnant (cf. plan_de_feu).
function drawStrobe(px,py,R,color,isLit,gcolor){
  const sw=R*1.18, sh=R*0.62, m=2;
  stageCtx.fillStyle='#26262f';
  stageCtx.strokeStyle=isLit?'#fff':gcolor; stageCtx.lineWidth=isLit?1.6:1;
  roundRectPath(px-sw,py-sh,sw*2,sh*2,3); stageCtx.fill(); stageCtx.stroke();
  if(isLit){
    const rgb=hexToRgb(color);
    const g=stageCtx.createRadialGradient(px,py,R*0.2,px,py,sw);
    g.addColorStop(0,`rgba(${rgb},0.9)`); g.addColorStop(0.7,`rgba(${rgb},0.47)`); g.addColorStop(1,`rgba(${rgb},0.12)`);
    stageCtx.fillStyle=g;
  } else stageCtx.fillStyle='#1a1a22';
  stageCtx.strokeStyle='rgba(55,55,68,1)'; stageCtx.lineWidth=1;
  roundRectPath(px-sw+m,py-sh+m,sw*2-m*2,sh*2-m*2,2); stageCtx.fill(); stageCtx.stroke();
}

// Lyre / Moving Head : faisceau orienté (Pan→X, Tilt→profondeur, vers le bas)
// + corps de lyre (barre truss, 2 bras, tête ronde). Modèle identique à
// plan_de_feu._draw_fixture : le cône pointe vers +y (la scène) et pivote de
// pan_angle = atan2(sin(pan), sin(tilt)) — c'est ce qui corrigeait le faisceau
// « à l'envers » de l'ancien rendu tablette.
function drawLyre(px,py,R,color,isLit,gcolor,p){
  const r=R;
  const panRad =((p.pan ??32768)-32768)/32768*Math.PI;
  const tiltRad=((p.tilt??32768)-32768)/32768*Math.PI*0.75;
  const fdx=Math.sin(panRad), fdy=Math.sin(tiltRad);
  const defl=Math.hypot(fdx,fdy);                         // 0..√2
  const panAngle=defl>0.001?Math.atan2(fdx,fdy+0.015):0;  // radians
  const beamLen=r*2+defl/Math.SQRT2*r*6;
  const beamHw =r*0.5+defl/Math.SQRT2*r*2;
  const rgb=hexToRgb(color);

  // ── Cône de faisceau (uniquement allumée), pivoté autour de la source ──
  if(isLit){
    stageCtx.save();
    stageCtx.translate(px,py);
    stageCtx.rotate(panAngle);
    // Halo extérieur large et doux
    let g=stageCtx.createLinearGradient(0,r,0,beamLen);
    g.addColorStop(0,`rgba(${rgb},0.39)`); g.addColorStop(1,`rgba(${rgb},0)`);
    stageCtx.fillStyle=g;
    stageCtx.beginPath();
    stageCtx.moveTo(-beamHw,r); stageCtx.lineTo(beamHw,r);
    stageCtx.lineTo(beamHw*2.2,beamLen); stageCtx.lineTo(-beamHw*2.2,beamLen);
    stageCtx.closePath(); stageCtx.fill();
    // Cône principal
    g=stageCtx.createLinearGradient(0,r,0,beamLen);
    g.addColorStop(0,`rgba(${rgb},0.76)`); g.addColorStop(0.65,`rgba(${rgb},0.15)`); g.addColorStop(1,`rgba(${rgb},0)`);
    stageCtx.fillStyle=g;
    stageCtx.beginPath();
    stageCtx.moveTo(-r/2,r); stageCtx.lineTo(r/2,r);
    stageCtx.lineTo(beamHw,beamLen); stageCtx.lineTo(-beamHw,beamLen);
    stageCtx.closePath(); stageCtx.fill();
    // Impact au sol
    stageCtx.fillStyle=`rgba(${rgb},0.37)`;
    stageCtx.beginPath(); stageCtx.ellipse(0,beamLen,beamHw,Math.max(2,beamHw/3),0,0,Math.PI*2); stageCtx.fill();
    stageCtx.restore();
  }

  // ── Corps de lyre (non pivoté) ──
  const lr=r*1.4;
  const yokeTopHw=lr*0.88, yokeBotHw=lr*0.54;
  const barT=Math.max(3,lr*0.26);
  const armTtop=Math.max(3,lr*0.26), armTbot=Math.max(2,lr*0.20);
  const armBotY=py+lr*0.08;
  const headR=lr*0.46, headCy=armBotY;
  const strokeCol=isLit?'#e8e8e8':gcolor;
  stageCtx.lineWidth=isLit?1.6:1.1; stageCtx.globalAlpha=isLit?1:0.7;

  // Barre de fixation (truss)
  stageCtx.fillStyle=shade(gcolor,isLit?1.35:0.9); stageCtx.strokeStyle=strokeCol;
  roundRectPath(px-yokeTopHw,py-lr,yokeTopHw*2,barT,barT/2); stageCtx.fill(); stageCtx.stroke();

  // Bras gauche + droit (trapèzes)
  stageCtx.fillStyle=shade(gcolor,0.9);
  stageCtx.beginPath();
  stageCtx.moveTo(px-yokeTopHw,py-lr+barT); stageCtx.lineTo(px-yokeTopHw+armTtop,py-lr+barT);
  stageCtx.lineTo(px-yokeBotHw+armTbot,armBotY); stageCtx.lineTo(px-yokeBotHw,armBotY);
  stageCtx.closePath(); stageCtx.fill(); stageCtx.stroke();
  stageCtx.beginPath();
  stageCtx.moveTo(px+yokeTopHw-armTtop,py-lr+barT); stageCtx.lineTo(px+yokeTopHw,py-lr+barT);
  stageCtx.lineTo(px+yokeBotHw,armBotY); stageCtx.lineTo(px+yokeBotHw-armTbot,armBotY);
  stageCtx.closePath(); stageCtx.fill(); stageCtx.stroke();
  stageCtx.globalAlpha=1;

  // Tête ronde
  if(isLit){
    const hg=stageCtx.createRadialGradient(px-headR*0.28,headCy-headR*0.28,headR*0.2,px,headCy,headR*1.4);
    hg.addColorStop(0,shade(color,1.55)); hg.addColorStop(0.55,color); hg.addColorStop(1,shade(color,0.6));
    stageCtx.fillStyle=hg;
  } else stageCtx.fillStyle='#1e1e1e';
  stageCtx.strokeStyle=strokeCol; stageCtx.lineWidth=1.2;
  stageCtx.beginPath(); stageCtx.arc(px,headCy,headR,0,Math.PI*2); stageCtx.fill(); stageCtx.stroke();
  // Lentille sombre + reflet
  stageCtx.fillStyle=isLit?shade(color,0.5):'#111';
  stageCtx.beginPath(); stageCtx.arc(px,headCy,headR*0.5,0,Math.PI*2); stageCtx.fill();
  if(isLit){ stageCtx.fillStyle='rgba(255,255,255,0.82)';
    stageCtx.beginPath(); stageCtx.arc(px-headR*0.18,headCy-headR*0.18,Math.max(1,headR*0.18),0,Math.PI*2); stageCtx.fill(); }
}

  zoomValEl.textContent=Math.round(_stageZoom*100)+' %';
