// ── Scène — long press → panel projecteur ────────────────────────────────────
function projAtPoint(cx,cy){
  const {W,H}=_stageWorld();
  [cx,cy]=_toWorld(cx,cy);
  // Zone de toucher : jamais moins de 22 px À L'ÉCRAN, même dézoomé.
  const R=Math.max(Math.max(10,Math.min(W,H)*0.042)*1.8, 22/_stageZoom);
  let best=-1, bestD=R*R;
  _projectors.forEach((p,i)=>{
    const dx=(p.x??0.5)*W-cx, dy=(p.y??0.5)*H-cy;
    const d2=dx*dx+dy*dy;
    if(d2<bestD){ bestD=d2; best=i; }
  });
  return best;
}

// Interaction scène :
//  • TAP sur un projecteur (peu de mouvement) = ajoute/retire de la sélection.
//  • GLISSER un rectangle (lasso) = sélectionne tous les projos à l'intérieur.
//  • TAP dans le vide = tout désélectionner.
let _tapStartX=0, _tapStartY=0, _tapStartT=0, _tapActive=false;
let _rbActive=false, _rbX=0, _rbY=0;   // rubber-band (rectangle de sélection)
function _localXY(clientX, clientY){
  const rect=stageCanvas.getBoundingClientRect();
  return [clientX-rect.left, clientY-rect.top];
}
function tapStart(clientX, clientY){
  [_tapStartX,_tapStartY]=_localXY(clientX,clientY);
  _tapStartT=Date.now(); _tapActive=true; _rbActive=false;
}
function tapMove(clientX, clientY){
  if(!_tapActive) return;
  [_rbX,_rbY]=_localXY(clientX,clientY);
  const moved=Math.hypot(_rbX-_tapStartX,_rbY-_tapStartY);
  if(moved>14) _rbActive=true;   // au-delà du seuil → mode rectangle
  if(_rbActive){
    drawStage(_projectors);
    // Dessiner le rectangle de sélection par-dessus
    const x=Math.min(_tapStartX,_rbX), y=Math.min(_tapStartY,_rbY);
    const w=Math.abs(_rbX-_tapStartX), h=Math.abs(_rbY-_tapStartY);
    stageCtx.fillStyle='rgba(226,206,22,0.12)';
    stageCtx.fillRect(x,y,w,h);
    stageCtx.strokeStyle='#E2CE16'; stageCtx.lineWidth=1.5;
    stageCtx.setLineDash([5,3]); stageCtx.strokeRect(x,y,w,h); stageCtx.setLineDash([]);
  }
}
function tapEnd(clientX, clientY){
  if(!_tapActive) return; _tapActive=false;
  if(_rbActive){
    // Fin du lasso : ajoute (union) tous les projos dans le rectangle.
    _rbActive=false;
    const {W,H}=_stageWorld();
    // Rectangle tracé à l'écran → converti dans le repère du plan (zoom).
    const [ax,ay]=_toWorld(_tapStartX,_tapStartY), [bx,by]=_toWorld(_rbX,_rbY);
    const x0=Math.min(ax,bx), y0=Math.min(ay,by);
    const x1=Math.max(ax,bx), y1=Math.max(ay,by);
    _projectors.forEach((p,i)=>{
      const px=(p.x??0.5)*W, py=(p.y??0.5)*H;
      if(px>=x0&&px<=x1&&py>=y0&&py<=y1 && _selection.indexOf(i)<0) _selection.push(i);
    });
    _selectedProjIdx = _selection.length ? _selection[_selection.length-1] : -1;
    drawStage(_projectors);
    if(_selection.length) openProjPanel(_selectedProjIdx); else closeProjPanel();
    return;
  }
  const [x,y]=_localXY(clientX,clientY);
  const moved=Math.hypot(x-_tapStartX,y-_tapStartY);
  const dt=Date.now()-_tapStartT;
  if(moved<14 && dt<600){
    const idx=projAtPoint(_tapStartX,_tapStartY);
    if(idx>=0){
      const pos=_selection.indexOf(idx);
      if(pos>=0){ _selection.splice(pos,1); }
      else { _selection.push(idx); }
      _selectedProjIdx = _selection.length ? _selection[_selection.length-1] : -1;
      drawStage(_projectors);
      if(_selection.length) openProjPanel(_selectedProjIdx);
      else closeProjPanel();
    } else {
      _selection=[]; _selectedProjIdx=-1; drawStage(_projectors); closeProjPanel();
    }
  }
}
// Pincer à deux doigts = zoom. Le geste annule le tap / lasso en cours et
// rien n'est sélectionné tant qu'un doigt reste posé.
let _pinch=null;
function _touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1; }
stageCanvas.addEventListener('touchstart',e=>{e.preventDefault();
  if(e.touches.length>=2){ _pinch={d0:_touchDist(e.touches),z0:_stageZoom}; _tapActive=false; _rbActive=false; drawStage(_projectors); return; }
  if(_pinch) return;
  const t=e.touches[0];tapStart(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchmove',e=>{e.preventDefault();
  if(_pinch){ if(e.touches.length>=2) setStageZoom(_pinch.z0*_touchDist(e.touches)/_pinch.d0); return; }
  const t=e.touches[0];tapMove(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchend',e=>{e.preventDefault();
  if(_pinch){ if(e.touches.length===0) _pinch=null; return; }
  const t=(e.changedTouches&&e.changedTouches[0])||{};tapEnd(t.clientX,t.clientY);},{passive:false});
stageCanvas.addEventListener('touchcancel',()=>{_tapActive=false;_rbActive=false;_pinch=null;});
stageCanvas.addEventListener('mousedown',e=>tapStart(e.clientX,e.clientY));
stageCanvas.addEventListener('mousemove',e=>{ if(_tapActive) tapMove(e.clientX,e.clientY); });
stageCanvas.addEventListener('mouseup',e=>tapEnd(e.clientX,e.clientY));

function openProjPanel(idx){
  _selectedProjIdx=idx;
  const p=_projectors[idx];
  const nSel=_selection.length;
  document.getElementById('proj-panel-name').textContent =
    nSel>1 ? (nSel+' sélectionnés') : (p.name||p.group);
  document.getElementById('proj-panel-group').textContent =
    nSel>1 ? '' : (p.group||'').toUpperCase();
  const slider=document.getElementById('proj-level-slider');
  slider.value=p.level||0;
  document.getElementById('proj-level-val').textContent=p.level||0;
  const strobe=p.strobe||0;
  document.getElementById('proj-strobe-slider').value=strobe;
  document.getElementById('proj-strobe-val').textContent=strobe>0?strobe+'%':'OFF';
  // Swatch active = couleur la plus proche de base_color
  const bc=(p.base_color||'#ffffff').toLowerCase();
  projColorsEl.querySelectorAll('.proj-swatch').forEach(s=>{
    s.classList.toggle('active', s.dataset.color===bc);
  });
  const muteBtn=document.getElementById('btn-proj-mute');
  muteBtn.textContent=p.muted?'UNMUTE':'MUTE';
  muteBtn.classList.toggle('muted',!!p.muted);
  // Pad Pan/Tilt : visible dès qu'au moins une lyre est sélectionnée.
  const anyLyre=_selIdxs().some(i=>_projectors[i] && _projectors[i].is_lyre);
  const ptRow=document.getElementById('proj-pantilt-row');
  ptRow.classList.toggle('show', anyLyre);
  if(anyLyre) drawPanTiltPad(p);
  buildWheelRow(); buildGoboRow();
  projOverlay.classList.add('open'); projPanel.classList.add('open');
}

// ── Roue de couleurs & Gobo (lyres qui en ont) ────────────────────────────────
function _closestSlotDmx(slots,val){
  const passed=slots.filter(s=>s.dmx<=val);
  if(passed.length) return passed.reduce((a,b)=>b.dmx>a.dmx?b:a).dmx;
  return slots.length?slots.reduce((a,b)=>b.dmx<a.dmx?b:a).dmx:0;
}
function buildWheelRow(){
  const row=document.getElementById('proj-wheel-row');
  const cont=document.getElementById('proj-wheel-slots');
  const ref=_selIdxs().map(i=>_projectors[i]).find(q=>q&&q.has_wheel&&(q.wheel_slots||[]).length);
  if(!ref){ row.classList.remove('show'); return; }
  row.classList.add('show'); cont.innerHTML='';
  const activeDmx=_closestSlotDmx(ref.wheel_slots, ref.color_wheel||0);
  ref.wheel_slots.forEach(s=>{
    const el=document.createElement('div');
    el.className='wheel-swatch'+(s.dmx===activeDmx?' active':'');
    el.style.background=s.color||'#fff';
    el.title=(s.name||'')+' (DMX '+s.dmx+')';
    el.addEventListener('click',()=>{
      const idxs=_selIdxs().filter(i=>_projectors[i]&&_projectors[i].has_wheel);
      idxs.forEach(i=>{_projectors[i].color_wheel=s.dmx; if(s.color)_projectors[i].base_color=s.color;});
      cont.querySelectorAll('.wheel-swatch').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      if(idxs.length) sendEvent({type:'proj_colorwheel',idxs,value:s.dmx});
      drawStage(_projectors);
    });
    cont.appendChild(el);
  });
}
function buildGoboRow(){
  const row=document.getElementById('proj-gobo-row');
  const cont=document.getElementById('proj-gobo-slots');
  const ref=_selIdxs().map(i=>_projectors[i]).find(q=>q&&q.has_gobo&&(q.gobo_slots||[]).length);
  if(!ref){ row.classList.remove('show'); return; }
  row.classList.add('show'); cont.innerHTML='';
  const activeDmx=_closestSlotDmx(ref.gobo_slots, ref.gobo||0);
  ref.gobo_slots.forEach(s=>{
    const el=document.createElement('button');
    el.className='gobo-btn'+(s.dmx===activeDmx?' active':'');
    el.textContent=s.label||('DMX '+s.dmx);
    el.addEventListener('click',()=>{
      const idxs=_selIdxs().filter(i=>_projectors[i]&&_projectors[i].has_gobo);
      idxs.forEach(i=>{_projectors[i].gobo=s.dmx;});
      cont.querySelectorAll('.gobo-btn').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      if(idxs.length) sendEvent({type:'proj_gobo',idxs,value:s.dmx});
    });
    cont.appendChild(el);
  });
}

// ── Pad Pan/Tilt (lyres) ──────────────────────────────────────────────────────
const ptPad=document.getElementById('proj-pantilt-pad');
const ptCtx=ptPad.getContext('2d');
function drawPanTiltPad(p){
  const W=ptPad.width=ptPad.clientWidth||220, H=ptPad.height=150;
  ptCtx.clearRect(0,0,W,H);
  ptCtx.fillStyle='#0b0a08'; ptCtx.fillRect(0,0,W,H);
  // Grille + croix centrale
  ptCtx.strokeStyle='rgba(226,206,22,0.14)'; ptCtx.lineWidth=1;
  ptCtx.beginPath(); ptCtx.moveTo(W/2,0); ptCtx.lineTo(W/2,H); ptCtx.moveTo(0,H/2); ptCtx.lineTo(W,H/2); ptCtx.stroke();
  // Point courant : pan → x, tilt → y
  const pan=(p.pan??32768)/65535, tilt=(p.tilt??32768)/65535;
  const x=pan*W, y=tilt*H;
  const color=p.base_color||'#E2CE16';
  ptCtx.beginPath(); ptCtx.arc(x,y,10,0,Math.PI*2);
  ptCtx.fillStyle=color; ptCtx.fill();
  ptCtx.strokeStyle='#fff'; ptCtx.lineWidth=2; ptCtx.stroke();
}
function ptFromEvent(e){
  const r=ptPad.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  const x=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));
  const y=Math.max(0,Math.min(1,(t.clientY-r.top)/r.height));
  return {pan:x, tilt:y};
}
let _ptDragging=false, _ptLastSend=0;
function _ptApply(pan,tilt){
  const idxs=_selIdxs().filter(i=>_projectors[i] && _projectors[i].is_lyre);
  idxs.forEach(i=>{ _projectors[i].pan=Math.round(pan*65535); _projectors[i].tilt=Math.round(tilt*65535); });
  return idxs;
}
function ptMove(e){
  if(_ptDragging===false) return;
  e.preventDefault();
  const {pan,tilt}=ptFromEvent(e);
  const idxs=_ptApply(pan,tilt);
  if(!idxs.length) return;
  if(_projectors[_selectedProjIdx]) drawPanTiltPad(_projectors[_selectedProjIdx]);
  const now=Date.now();
  if(now-_ptLastSend>40){   // throttle ~25 Hz
    _ptLastSend=now;
    sendEvent({type:'proj_pantilt',idxs,pan,tilt});
  }
}
function ptEnd(e){
  if(!_ptDragging) return;
  _ptDragging=false;
  const {pan,tilt}=ptFromEvent(e);
  const idxs=_ptApply(pan,tilt);
  if(idxs.length) sendEvent({type:'proj_pantilt',idxs,pan,tilt});  // valeur finale exacte
}
ptPad.addEventListener('mousedown',e=>{_ptDragging=true; ptMove(e);});
ptPad.addEventListener('mousemove',ptMove);
window.addEventListener('mouseup',ptEnd);
ptPad.addEventListener('touchstart',e=>{_ptDragging=true; ptMove(e);},{passive:false});
ptPad.addEventListener('touchmove',ptMove,{passive:false});
ptPad.addEventListener('touchend',ptEnd);
function closeProjPanel(){
  projOverlay.classList.remove('open'); projPanel.classList.remove('open');
  _selectedProjIdx=-1; _selection=[]; drawStage(_projectors);
}

document.getElementById('proj-level-slider').addEventListener('input',e=>{
  const val=+e.target.value;
  document.getElementById('proj-level-val').textContent=val;
  const idxs=_selIdxs(); if(idxs.length) sendEvent({type:'proj_level',idxs,value:val});
});
document.getElementById('proj-strobe-slider').addEventListener('input',e=>{
  const val=+e.target.value;
  document.getElementById('proj-strobe-val').textContent=val>0?val+'%':'OFF';
  const idxs=_selIdxs();
  idxs.forEach(i=>{ if(_projectors[i]) _projectors[i].strobe=val; });
  if(idxs.length) sendEvent({type:'proj_strobe',idxs,value:val});
});
document.getElementById('btn-proj-mute').addEventListener('click',()=>{
  const idxs=_selIdxs(); if(!idxs.length) return;
  const p=_projectors[_selectedProjIdx]||_projectors[idxs[0]];
  const newMuted=!p.muted;
  idxs.forEach(i=>{ if(_projectors[i]) _projectors[i].muted=newMuted; });
  sendEvent({type:'proj_mute',idxs,muted:newMuted});
  const btn=document.getElementById('btn-proj-mute');
  btn.textContent=newMuted?'UNMUTE':'MUTE'; btn.classList.toggle('muted',newMuted);
});
document.getElementById('btn-proj-close').addEventListener('click',closeProjPanel);
projOverlay.addEventListener('click',closeProjPanel);

// ── Boutons AKAI (CLEAR / REC / PARAMS) ──────────────────────────────────────
btnClear.addEventListener('click',()=>sendEvent({type:'clear'}));
btnRec.addEventListener('click',()=>sendEvent({type:'rec_toggle'}));

function applyRecState(active){
  btnRec.classList.toggle('rec-active',active);
  btnRec.textContent=active?'⏺ REC':'🔴 REC';
}
function applyLayout(labels){
  labels.forEach((slot,i)=>{
    if(faderLbls[i]) faderLbls[i].textContent=slot.label||`G${i+1}`;
  });
}

// ── SURFACE (exécuteurs) ──────────────────────────────────────────────────────
const surfaceGrid=document.getElementById('surface-grid');
let _surfaceClocks=[];
function applySurface(data){
  data=data||{blocks:[],cols:0,rows:0};
  const cols=Math.max(1,data.cols||1), rows=Math.max(1,data.rows||1);
  surfaceGrid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  surfaceGrid.innerHTML=''; _surfaceClocks=[];
  (data.blocks||[]).forEach(b=>{
    const a=b.action||{}; const type=a.type||'';
    const el=document.createElement('div');
    el.className='sfx-block';
    el.style.gridColumn=`${(b.col||0)+1} / span ${b.span_c||1}`;
    el.style.gridRow=`${(b.row||0)+1} / span ${b.span_r||1}`;
    el.style.borderLeftColor=b.color||'#333';
    if(type==='color'){ el.style.background=b.color||'#141414';
      el.style.color=_textOn(b.color||'#141414'); }
    if(type==='fader'){
      el.classList.add('sfx-fader');
      const val=document.createElement('span'); val.className='sfx-fval'; val.textContent='0';
      const inp=document.createElement('input'); inp.type='range'; inp.min=0; inp.max=100; inp.value=0;
      inp.addEventListener('input',()=>{ val.textContent=inp.value;
        sendEvent({type:'ext_fader',action:a,value:+inp.value}); });
      const lbl=document.createElement('span'); lbl.textContent=b.label||''; lbl.style.fontSize='9px';
      el.appendChild(lbl); el.appendChild(inp); el.appendChild(val);
    } else if(type==='clock'){
      el.classList.add('sfx-clock'); el.textContent='--:--:--'; _surfaceClocks.push(el);
    } else {
      el.textContent=b.label||'';
      el.addEventListener('click',()=>{
        sendEvent({type:'ext_action',action:a});
        el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),180);
      });
    }
    surfaceGrid.appendChild(el);
  });
}
function _textOn(hex){
  const c=hex.replace('#',''); if(c.length<6) return '#fff';
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*0.299+g*0.587+b*0.114)>150?'#000':'#fff';
}
setInterval(()=>{ if(!_surfaceClocks.length) return;
  const now=new Date();
  const s=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  _surfaceClocks.forEach(el=>el.textContent=s);
},1000);

// ── Fenêtre « état de la connexion » ─────────────────────────────────────────
// state : 'connecting' | 'ok' | 'err'. since = ouverture du flux ; lastMsg =
// dernier message reçu du PC ; tries = tentatives depuis la dernière réussite.
const _conn={state:'connecting',since:0,lastMsg:0,tries:0,retryAt:0,timer:null,downSince:0};
const connPop=document.getElementById('conn-pop');
function _fmtAgo(ms){
  const s=Math.max(0,Math.round(ms/1000));
  if(s<3) return "à l'instant";
  if(s<60) return 'il y a '+s+' s';
  const m=Math.floor(s/60); if(m<60) return 'il y a '+m+' min';
  return 'il y a '+Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
}
function _fmtFor(ms){
  const s=Math.max(0,Math.round(ms/1000));
  if(s<60) return s+' s';
  const m=Math.floor(s/60); if(m<60) return m+' min';
  return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
}
function renderConnPop(){
  if(!connPop.classList.contains('show')) return;
  const now=Date.now(), st=_conn.state;
  connPop.classList.remove('ok','err','connecting'); connPop.classList.add(st);
  const $=id=>document.getElementById(id);
  $('cp-host').textContent=location.host||'—';
  if(st==='ok'){
    $('cp-state').textContent='Connectée à MyStrow';
    $('cp-desc').textContent='Les pads, les faders et la playlist se mettent à jour en direct.';
    $('cp-since-lbl').textContent='Connectée depuis';
    $('cp-since').textContent=_fmtFor(now-_conn.since);
    $('cp-last').textContent=_conn.lastMsg?_fmtAgo(now-_conn.lastMsg):'aucune pour l’instant';
    $('cp-row-last').hidden=false; $('cp-row-tries').hidden=true;
    $('cp-retry').textContent='Relancer la connexion';
  }else if(st==='connecting'){
    $('cp-state').textContent='Connexion en cours…';
    $('cp-desc').textContent='La tablette contacte MyStrow sur le PC.';
    $('cp-since-lbl').textContent='Hors ligne depuis';
    $('cp-since').textContent=_conn.downSince?_fmtFor(now-_conn.downSince):'—';
    $('cp-row-since').hidden=!_conn.downSince;
    $('cp-row-last').hidden=true; $('cp-row-tries').hidden=false;
    $('cp-tries').textContent='n° '+Math.max(1,_conn.tries);
    $('cp-retry').textContent='Réessayer maintenant';
  }else{
    $('cp-state').textContent='Hors ligne';
    $('cp-desc').textContent=(navigator.onLine===false)
      ? 'Le Wi-Fi de la tablette est coupé. Reconnectez-la au même réseau que le PC.'
      : 'MyStrow ne répond pas. Vérifiez que l’application est ouverte sur le PC, que la tablette est sur le même Wi-Fi et que le PC n’est pas en veille.';
    $('cp-since-lbl').textContent='Hors ligne depuis';
    $('cp-since').textContent=_conn.downSince?_fmtFor(now-_conn.downSince):'—';
    $('cp-row-since').hidden=false;
    $('cp-row-last').hidden=!_conn.lastMsg;
    $('cp-last').textContent=_conn.lastMsg?_fmtAgo(now-_conn.lastMsg):'—';
    $('cp-row-tries').hidden=false;
    const wait=Math.max(0,Math.ceil((_conn.retryAt-now)/1000));
    $('cp-tries').textContent='n° '+Math.max(1,_conn.tries)+(_conn.retryAt?(' · nouvel essai dans '+wait+' s'):'');
    $('cp-retry').textContent='Réessayer maintenant';
  }
  if(st==='ok') $('cp-row-since').hidden=false;
}
statusEl.addEventListener('click',e=>{
  e.stopPropagation();
  connPop.classList.toggle('show');
  renderConnPop();
});
document.getElementById('cp-retry').addEventListener('click',()=>{ _reconnectDelay=1000; connectSSE(); });
document.addEventListener('pointerdown',e=>{
  if(connPop.classList.contains('show') && !connPop.contains(e.target) && e.target!==statusEl) connPop.classList.remove('show');
});
setInterval(renderConnPop,1000);

// ── Appairage ────────────────────────────────────────────────────────────────
// Le PC n'accepte le flux et les actions que d'un appareil appairé : code à
// 6 chiffres (inclus dans le QR : ?pair=123456) échangé une fois contre un
// jeton gardé ici. API_BASE vide = même origine (page servie par le PC) ; l'app
// des stores définit window.MYSTROW_API_BASE avant de charger ce script.
const API_BASE=(window.MYSTROW_API_BASE||'').replace(/\/$/,'');
let _token='';
try{ _token=localStorage.getItem('mystrow.token')||''; }catch(e){}
function _authHeaders(h){ h=h||{}; if(_token) h['Authorization']='Bearer '+_token; return h; }
function _setToken(t){ _token=t||''; try{ if(_token) localStorage.setItem('mystrow.token',_token); else localStorage.removeItem('mystrow.token'); }catch(e){} }
function _deviceName(){
  const ua=navigator.userAgent||'';
  if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)) return 'iPad';
  if(/Android/.test(ua)) return 'Tablette Android';
  if(/iPhone/.test(ua)) return 'iPhone';
  return 'Navigateur';
}
const pairScreen=document.getElementById('pair-screen');
const pairInput=document.getElementById('pair-code');
const pairErr=document.getElementById('pair-err');
const pairBtn=document.getElementById('pair-btn');
function showPairing(msg){
  clearTimeout(_conn.timer); _conn.timer=null; _conn.retryAt=0;
  if(_es){ _es.onerror=null; _es.close(); _es=null; }
  statusEl.textContent='⚠'; statusEl.className='err';
  pairErr.textContent=msg||'';
  pairScreen.classList.add('show');
  setTimeout(()=>{ try{ pairInput.focus(); }catch(e){} },50);
}
async function pairWith(code){
  const r=await fetch(API_BASE+'/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:String(code||'').replace(/\D/g,''),name:_deviceName()})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.token){ _setToken(j.token); return {ok:true}; }
  if(j.error==='locked') return {ok:false,msg:'Trop d’essais. Réessayez dans '+(j.retry_in||30)+' s.'};
  return {ok:false,msg:'Code incorrect. Vérifiez le code affiché sur le PC.'};
}
document.getElementById('pair-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const code=pairInput.value.replace(/\D/g,'');
  if(code.length!==6){ pairErr.textContent='Le code comporte 6 chiffres.'; return; }
  pairBtn.disabled=true; pairErr.textContent='';
  try{
    const res=await pairWith(code);
    if(res.ok){ pairScreen.classList.remove('show'); pairInput.value=''; _reconnectDelay=1000; connectSSE(); }
    else pairErr.textContent=res.msg;
  }catch(err){
    pairErr.textContent='MyStrow ne répond pas. Vérifiez que l’application est ouverte et que la tablette est sur le même Wi-Fi que le PC.';
  }
  pairBtn.disabled=false;
});
// Après une coupure du flux : jeton refusé (401) → écran d'appairage au lieu de
// réessayer sans fin. Tout autre échec (404, réseau) = simple coupure.
async function _checkAuthAfterError(){
  try{
    const r=await fetch(API_BASE+'/api/session',{headers:_authHeaders(),cache:'no-store'});
    if(r.status!==401) return;
    if(_token){ _setToken(''); showPairing('Cette tablette n’est plus appairée. Saisissez le nouveau code affiché sur le PC.'); }
    else showPairing();
  }catch(e){}
}
async function _bootConnection(){
  if(window.MYSTROW_DEMO||window.MYSTROW_SOLO) return;   // app sans PC : démo (demo.js) ou mode autonome (standalone.js)
  const q=new URLSearchParams(location.search);
  const code=q.get('pair');
  if(code){
    q.delete('pair');
    try{ history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():'')+location.hash); }catch(e){}
    // Déjà appairée (QR rescanné) : on garde le jeton au lieu d'en créer un autre.
    let valid=false;
    if(_token){ try{ valid=(await fetch(API_BASE+'/api/session',{headers:_authHeaders(),cache:'no-store'})).ok; }catch(e){} }
    if(!valid){
      try{ const res=await pairWith(code); if(!res.ok){ showPairing(res.msg); return; } }
      catch(e){}
    }
  }
  connectSSE();
}

// ── SSE ───────────────────────────────────────────────────────────────────────
let _es=null,_reconnectDelay=1000;
function connectSSE(){
  if(_es){_es.close();_es=null;}
  clearTimeout(_conn.timer); _conn.timer=null; _conn.retryAt=0;
  _conn.state='connecting'; _conn.tries++;
  statusEl.textContent='···'; statusEl.className='';
  renderConnPop();
  // EventSource ne sait pas envoyer d'en-tête : le jeton passe dans l'URL.
  _es=new EventSource(API_BASE+'/stream'+(_token?('?t='+encodeURIComponent(_token)):''));
  _es.onopen=()=>{ statusEl.textContent='✓'; statusEl.className='ok'; _reconnectDelay=1000;
    _conn.state='ok'; _conn.since=Date.now(); _conn.tries=0; _conn.downSince=0; renderConnPop(); };
  _es.onerror=()=>{ statusEl.textContent='⚠'; statusEl.className='err'; _es.close(); _es=null;
    if(_conn.state==='ok'||!_conn.downSince) _conn.downSince=Date.now();
    _conn.state='err'; _conn.retryAt=Date.now()+_reconnectDelay;
    _conn.timer=setTimeout(connectSSE,_reconnectDelay); _reconnectDelay=Math.min(_reconnectDelay*2,10000);
    renderConnPop(); _checkAuthAfterError(); };
  _es.onmessage=e=>{
    _conn.lastMsg=Date.now();
    let msg; try{msg=JSON.parse(e.data);}catch{return;}
    _handleMsg(msg);
  };
}
// Applique un message du PC (flux SSE, ou état simulé du mode démo de l'app).
function _handleMsg(msg){
  {
    const t=msg.type;
    if(t==='state'){
      const d=msg.data||{};
      Object.entries(d.pads||{}).forEach(([k,v])=>{const el=padEls[k];if(el)applyPadColor(el,v.color,v.bright);});
      Object.entries(d.faders||{}).forEach(([k,v])=>setFaderUI(+k,v));
      Object.entries(d.effects||{}).forEach(([k,v])=>{const el=effEls[+k];if(el)el.classList.toggle('on',v);});
      if(d.seq){buildSeqList(d.seq.items||[],d.seq.current_row??-1);updateSeqRow(d.seq.current_row??-1,d.seq.playing??false);}
      if(d.carts) d.carts.forEach((c,i)=>updateCart(i,c.title,c.state));
      if(d.projectors) applyProjectors(d.projectors);
      if(d.layout&&d.layout.length) applyLayout(d.layout);
      if(d.bank_pages) applyBankPages(d.bank_pages.count,d.bank_pages.index);
      if(d.rec_active!==undefined) applyRecState(d.rec_active);
      if(d.surface) applySurface(d.surface);
      requestAnimationFrame(refreshFaders);
    } else if(t==='surface'){applySurface(msg.data);}
    else if(t==='pad'){const el=padEls[`${msg.row}_${msg.col}`];if(el)applyPadColor(el,msg.color,msg.bright);}
    else if(t==='fader'){setFaderUI(msg.idx,msg.value);}
    else if(t==='effect'){const el=effEls[msg.row];if(el)el.classList.toggle('on',msg.active);}
    else if(t==='seq'){buildSeqList(msg.items||[],msg.current_row??-1);updateSeqRow(msg.current_row??-1,msg.playing??false);}
    else if(t==='seq_row'){updateSeqRow(msg.current_row??-1,msg.playing??false);}
    else if(t==='cart'){updateCart(msg.idx,msg.title,msg.state);}
    else if(t==='projectors'){applyProjectors(msg.data);}
    else if(t==='proj_colors'){applyProjColors(msg.data);}
    else if(t==='layout'){applyLayout(msg.labels||[]);}
    else if(t==='bank_pages'){applyBankPages(msg.count,msg.index);}
    else if(t==='rec_state'){applyRecState(msg.active);}
  }
}
_bootConnection();
requestAnimationFrame(()=>setTimeout(refreshFaders,80));

// ── Service Worker (PWA) ──────────────────────────────────────────────────────
// ── App des stores (Capacitor) ───────────────────────────────────────────────
if(window.MYSTROW_APP){
  ['cp-change-pc','pair-change-pc'].forEach(id=>{
    const b=document.getElementById(id); b.hidden=false;
    b.addEventListener('click',()=>{ location.href='index.html?choose=1'; });
  });
  // Écran toujours allumé pendant le show (module natif KeepAwake).
  try{ const ka=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.KeepAwake; if(ka) ka.keepAwake().catch(()=>{}); }catch(e){}
}

if ('serviceWorker' in navigator && !window.MYSTROW_APP) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
